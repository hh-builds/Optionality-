<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Financial Optionality — Model your path to financial independence</title>
<!-- PWA: installable + offline. Files (manifest, sw.js, icons) live at the repo root. -->
<meta name="theme-color" content="#2a78d6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Optionality" />
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/prop-types.min.js"></script>
<script src="vendor/Recharts.js"></script>
<style>
:root{
  --surface-1:#fcfcfb; --surface-2:#ffffff; --page:#f4f4f1;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
  --series-pension:#2a78d6; --series-isa:#1baf7a; --series-gia:#eb6834;
  --series-cash:#eda100; --series-home:#4a3aa7; --series-red:#e34948;
  --good:#0ca30c; --warning:#e8930c; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300;
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,0.10);
  --shadow:0 1px 2px rgba(11,11,11,0.05),0 4px 16px rgba(11,11,11,0.04);
  --phase-accum:rgba(42,120,214,0.08);
  --phase-bridge:rgba(232,147,12,0.10);
  --phase-ret:rgba(27,175,122,0.10);
}
html[data-theme="dark"]{
  --surface-1:#1a1a19; --surface-2:#212120; --page:#0d0d0d;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
  --series-pension:#3987e5; --series-isa:#199e70; --series-gia:#d95926;
  --series-cash:#c98500; --series-home:#9085e9; --series-red:#e66767;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#0ca30c;
  --accent:#3987e5; --accent-soft:rgba(57,135,229,0.14);
  --shadow:0 1px 2px rgba(0,0,0,0.4),0 4px 16px rgba(0,0,0,0.35);
  --phase-accum:rgba(57,135,229,0.12);
  --phase-bridge:rgba(250,178,25,0.12);
  --phase-ret:rgba(25,158,112,0.14);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1340px;margin:0 auto;padding:18px 20px 70px}
/* two-column app layout: inputs sidebar (left / on top when narrow) + results main */
.layout{display:flex;gap:22px;align-items:flex-start}
.main{flex:1 1 0;min-width:0}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em}
.muted{color:var(--muted)}
.sec{color:var(--text-secondary)}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  position:sticky;top:0;z-index:50;background:var(--page);padding:11px 0 11px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
.brand h1{font-size:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-primary);
  padding:7px 13px;border-radius:9px;font-size:13px;cursor:pointer;font-weight:500;transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.subtle{background:transparent;border-color:transparent;color:var(--muted);padding:6px 9px;font-size:12px;font-weight:600}
.btn.subtle:hover{border-color:var(--border);color:var(--text-primary)}


.panel{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;
  padding:18px;box-shadow:var(--shadow)}
.panel > h2{font-size:15px;margin-bottom:4px}
.panel .desc{font-size:13px;color:var(--muted);margin-bottom:14px}


.icon-btn{background:none;border:1px solid var(--border);border-radius:7px;cursor:pointer;color:var(--muted);
  width:30px;height:30px;font-size:15px;line-height:1}
.icon-btn:hover{color:var(--critical);border-color:var(--critical)}
.add-link{background:none;border:1px dashed var(--border);border-radius:8px;color:var(--accent);
  padding:8px;width:100%;cursor:pointer;font-size:13px;font-weight:500;margin-top:6px}






.cmp-rec{font-size:13.5px;color:var(--text-secondary);line-height:1.55;margin-top:12px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
.cmp-rec b{color:var(--text-primary)}


/* table */
.tablewrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}
th{background:var(--surface-2);color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;
  letter-spacing:.02em;position:sticky;top:0;text-align:right;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface-1)}
th:first-child{z-index:2}
td{border-bottom:1px solid var(--grid)}
tr.accumulation td:first-child{box-shadow:inset 3px 0 var(--series-pension)}
tr.bridge td:first-child{box-shadow:inset 3px 0 var(--warning)}
tr.retirement td:first-child{box-shadow:inset 3px 0 var(--series-isa)}
tr.bridge{background:var(--phase-bridge)}
tr.retirement{background:var(--phase-ret)}
.legend-row{display:flex;gap:16px;margin:10px 0;font-size:12px;flex-wrap:wrap}
.legend-row span{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary)}
.legend-row .sw{width:11px;height:11px;border-radius:3px}
.notecell{color:var(--muted);font-size:11px;max-width:180px;white-space:normal;text-align:left}

/* chart */
.chart-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;gap:8px}
.terms-tag{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);
  background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:999px;white-space:nowrap}
/* table group header (Pension | ISA-GIA) */
tr.grouprow th{background:var(--surface-2);border-bottom:1px solid var(--border);padding:5px 10px}
tr.grouprow th.grp{text-align:center;font-size:11px;letter-spacing:.04em}
tr.grouprow th.grp-p{color:var(--series-pension)}
tr.grouprow th.grp-a{color:var(--series-isa)}
th.grp-p, td:nth-child(2){border-left:2px solid var(--border)}
td:nth-child(7){border-left:2px solid var(--border)}
tr.grouprow th.grp-a{border-left:2px solid var(--border)}
.tooltip{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;
  box-shadow:var(--shadow);font-size:12px}
.tooltip .t-age{font-weight:600;margin-bottom:5px}
.tooltip .t-row{display:flex;justify-content:space-between;gap:14px}
.tooltip .t-row .nm{display:flex;align-items:center;gap:6px;color:var(--text-secondary)}
.tooltip .t-row .sw{width:9px;height:9px;border-radius:2px}
.tooltip .t-row .amt{font-weight:600;font-variant-numeric:tabular-nums}

.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  font-weight:700;margin:26px 2px 12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;height:1px;background:var(--border)}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
.assumptions{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;margin-top:8px;line-height:1.7}

/* =====================================================================
   ISA / GIA BRIDGE PLANNER  ("Accessible Wealth")
   ===================================================================== */
.bridge-planner{background:linear-gradient(180deg,var(--accent-soft),transparent);
  border:1px solid var(--border);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px}
.bp-topline{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.bp-q{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bp-title{font-size:19px;font-weight:650;letter-spacing:-0.01em;margin:3px 0 2px}
.bp-title .bp-star{color:var(--warning)}
.bp-terms{display:flex;gap:6px;align-items:center}
/* headline result */
.bp-headline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:14px 0 4px}
.bp-headline .bp-big{font-size:46px;font-weight:650;letter-spacing:-0.03em;line-height:1.02}
.bp-headline .bp-big.reached{color:var(--good-text)}
.bp-headline .bp-big.missed{color:var(--critical)}
.bp-headline .bp-cap{font-size:14px;color:var(--text-secondary);max-width:420px}
.bp-scen-chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.bp-chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  border:1px solid var(--border);border-radius:999px;padding:4px 11px;background:var(--surface-2);cursor:pointer;transition:.12s}
.bp-chip .cd{width:9px;height:9px;border-radius:50%}
.bp-chip.off{opacity:.5}
.bp-chip:hover{border-color:var(--accent)}
.bp-chip .cage{color:var(--muted);font-weight:700}
/* result tiles */
.bp-results{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0 4px}
.bp-tile{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px 13px}
.bp-tile .bt-k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;font-weight:600;line-height:1.25}
.bp-tile .bt-v{font-size:18px;font-weight:650;margin-top:5px;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.bp-tile .bt-v.pos{color:var(--good-text)} .bp-tile .bt-v.neg{color:var(--critical)}
/* chart block */
.bp-chart{margin-top:8px;background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:14px 14px 8px}
/* sub-headings inside the planner */
.bp-sub{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;
  margin:20px 2px 10px;display:flex;align-items:center;gap:8px}
.bp-sub::after{content:"";flex:1;height:1px;background:var(--border)}
/* compact assumptions grid */
.bp-assump{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bp-fld{display:flex;flex-direction:column;gap:4px}
.bp-fld label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;font-weight:600}
.bp-inwrap{position:relative;display:flex;align-items:center}
.bp-inwrap>span.pfx{position:absolute;left:9px;color:var(--muted);font-size:13px;pointer-events:none}
.bp-inwrap>span.sfx{position:absolute;right:9px;color:var(--muted);font-size:13px;pointer-events:none}
.bp-inwrap input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);
  color:var(--text-primary);font-size:14px;font-weight:600;font-family:inherit;font-variant-numeric:tabular-nums}
.bp-inwrap input:focus{outline:none;border-color:var(--accent)}
.bp-inwrap.money input{padding-left:19px} .bp-inwrap.pct input{padding-right:22px}
/* phase editor */
.bp-phases{display:flex;flex-direction:column;gap:8px}
.bp-phase-head,.bp-phase{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:10px;align-items:center}
.bp-phase-head span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700;padding-left:2px}
.bp-phase input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);
  color:var(--text-primary);font-size:14px;font-weight:600;font-family:inherit;font-variant-numeric:tabular-nums}
.bp-phase input:focus{outline:none;border-color:var(--accent)}
.bp-phase .bp-inwrap.money input{padding-left:19px}
/* segmented toggles */
.bp-toggles{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.bp-tgroup{display:flex;flex-direction:column;gap:5px}
.bp-tgroup>.tl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;font-weight:600}
.bp-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.bp-seg button{background:none;border:none;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--text-secondary);font-family:inherit;font-weight:600}
.bp-seg button.on{background:var(--accent);color:#fff}
.bp-seg button+button{border-left:1px solid var(--border)}
/* scenario editor cards */
.bp-scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bp-scard{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px 14px}
.bp-scard.base{border-color:var(--accent)}
.bp-scard-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.bp-scard-head .sn{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700}
.bp-scard-head .sn .cd{width:11px;height:11px;border-radius:50%}
.bp-scard-sub{font-size:11.5px;color:var(--muted);margin:-4px 0 9px;font-variant-numeric:tabular-nums}
.bp-scard.base .bp-scard-sub{color:var(--text-primary);font-weight:600}
.bp-scard .bp-fld{margin-bottom:9px}
.bp-scard .cross-line{font-size:12px;color:var(--muted);margin-top:2px}
.bp-scard .cross-line b{color:var(--text-primary);font-weight:650}
.bp-scen-toggle{font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;background:none;border:none;font-family:inherit}
/* colour-coded table indicators */
tr.bp-below td:first-child{box-shadow:inset 3px 0 var(--critical)}
tr.bp-amber td:first-child{box-shadow:inset 3px 0 var(--warning)}
tr.bp-green td:first-child{box-shadow:inset 3px 0 var(--good)}
tr.bp-green{background:var(--phase-ret)}
tr.bp-amber{background:var(--phase-bridge)}
.bp-status{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.02em}
.bp-status.below{color:var(--critical)} .bp-status.amber{color:var(--warning)} .bp-status.green{color:var(--good-text)}
html[data-theme="dark"] .bp-status.amber{color:var(--warning)} html[data-theme="dark"] .bp-status.green{color:var(--good)}
.bp-cross-row td{border-top:2px solid var(--accent)!important}
.bp-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
@media (max-width:960px){
  .bp-results{grid-template-columns:repeat(2,1fr)}
  .bp-assump{grid-template-columns:repeat(2,1fr)}
  .bp-scenarios{grid-template-columns:1fr}
}
@media (max-width:560px){
  .bp-results{grid-template-columns:1fr}
  .bp-assump{grid-template-columns:1fr}
  .bp-phase-head,.bp-phase{grid-template-columns:1fr 1fr 1.2fr auto}
  .bridge-planner{padding:18px 15px}
}

/* =====================================================================
   MOBILE / ADAPTIVE — thumb-friendly targets, readable tables, tighter chrome
   ===================================================================== */
/* Mid widths (562–820px, e.g. tablets / large phones landscape): keep the
   tables as tables but pin the first (Age) column and add a scroll-shadow so
   it's clear there's more to swipe. Below 561px they become cards instead. */
@media (min-width:561px) and (max-width:820px){
  .tablewrap{
    -webkit-overflow-scrolling:touch;
    background:
      linear-gradient(to right, var(--surface-1) 30%, rgba(0,0,0,0)) left center / 22px 100% no-repeat local,
      linear-gradient(to left, var(--surface-1) 30%, rgba(0,0,0,0)) right center / 22px 100% no-repeat local,
      radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.14), rgba(0,0,0,0)) right center / 11px 100% no-repeat scroll;
  }
  .tablewrap table{font-size:12px}
  .tablewrap th,.tablewrap td{padding-left:8px;padding-right:8px;white-space:nowrap}
  .tablewrap thead th:first-child,
  .tablewrap tbody td:first-child{position:sticky;left:0;z-index:2;
    background:var(--surface-1);box-shadow:1px 0 0 var(--border)}
  .tablewrap tr.bp-green td:first-child{background:var(--phase-ret)}
  .tablewrap tr.bp-amber td:first-child{background:var(--phase-bridge)}
}
@media (max-width:560px){
  /* iOS zooms any focused input under 16px — bump font, and give comfy targets */
  .bp-inwrap input,.bp-phase input{font-size:16px;min-height:42px}
  /* bigger tap targets on the segmented toggles and toolbar buttons */
  .bp-seg button{padding:11px 14px;min-height:44px;font-size:13px}
  .btn{padding:10px 13px;min-height:42px}
  .bp-seg{flex-wrap:wrap}
  /* reclaim horizontal space so content isn't pinched */
  .wrap{padding:14px 12px 60px}
  .bridge-planner{padding:16px 13px}
  .bp-headline .bp-big{font-size:38px}
  .bp-title{font-size:17px}
  /* segmented toggle groups stack rather than overflow */
  .bp-toggles{gap:14px}
  .bp-tgroup{width:100%}
  .bp-seg{width:100%}
  .bp-seg button{flex:1 1 0}
  /* result tiles: 2-up rather than one-per-row, so the summary is scannable */
  .bp-results{grid-template-columns:1fr 1fr}
  .bp-tile .bt-v{font-size:16px}

  /* ---- Year-by-year tables become STACKED CARDS (one row = one card) ----
     Pure CSS, driven by data-label on each <td>; the <table> markup and the
     desktop rendering are unchanged. */
  .tablewrap.cards{border:none;background:none;overflow:visible;max-height:none!important}
  .tablewrap.cards table,
  .tablewrap.cards tbody,
  .tablewrap.cards tr,
  .tablewrap.cards td{display:block;width:auto}
  .tablewrap.cards thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .tablewrap.cards tr{border:1px solid var(--border);border-left-width:3px;border-radius:12px;
    background:var(--surface-1);padding:6px 13px 8px;margin-bottom:11px;box-shadow:var(--shadow)}
  .tablewrap.cards td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    padding:6px 0;border:none;white-space:normal;text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums}
  .tablewrap.cards td::before{content:attr(data-label);color:var(--muted);font-size:11px;
    text-transform:uppercase;letter-spacing:.02em;font-weight:600;text-align:left;flex:0 0 auto;
    max-width:56%;line-height:1.3}
  .tablewrap.cards td:empty{display:none}
  /* the Age cell is the card header */
  .tablewrap.cards td:first-child{border-bottom:1px solid var(--border);margin-bottom:3px;
    padding:2px 0 8px;font-weight:700;font-size:16px}
  .tablewrap.cards td:first-child::before{align-self:center}
  /* status colour → the card's left border (mirrors the desktop row tint) */
  .tablewrap.cards tr.bp-green{border-left-color:var(--good)}
  .tablewrap.cards tr.bp-amber{border-left-color:var(--warning)}
  .tablewrap.cards tr.bp-below{border-left-color:var(--critical)}
  .tablewrap.cards tr.bp-cross-row{border-color:var(--accent);border-left-color:var(--accent)}
  /* combined table has no bp-* status classes — give it a neutral accent edge */
  .tablewrap.cards tr:not([class]){border-left-color:var(--baseline)}
}

@media print{
  .toolbar,.add-link,.icon-btn,input[type=range]{display:none!important}
  body{background:#fff} .panel{box-shadow:none;border:1px solid #ddd}
  .wrap{max-width:100%}
}

/* --- collapsible planner sections (obvious expander bar) --- */
details.bp-collapse{margin:10px 0;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);overflow:hidden}
details.bp-collapse[open]{border-color:var(--baseline)}
summary.bp-summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;padding:11px 13px;margin:0;color:var(--text)}
summary.bp-summary::-webkit-details-marker{display:none}
summary.bp-summary::before{content:"▸";flex:0 0 auto;font-size:12px;color:var(--accent);transition:transform .15s ease}
details.bp-collapse[open]>summary.bp-summary::before{transform:rotate(90deg)}
summary.bp-summary::after{content:"Show ›";flex:0 0 auto;margin-left:auto;background:none;height:auto;font-size:11px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--accent);white-space:nowrap}
details.bp-collapse[open]>summary.bp-summary::after{content:"Hide ‹"}
summary.bp-summary:hover{background:var(--surface-1)}
details.bp-collapse[open]>summary.bp-summary{border-bottom:1px solid var(--border)}
/* --- per-phase year/total readout --- */
.bp-phase-sum{font-size:11.5px;color:var(--muted);margin:-2px 0 4px 2px;line-height:1.45}
.bp-phase-sum b{color:var(--text);font-weight:600}
/* --- market-growth column --- */

/* --- real/nominal basis banner + tile sub-note --- */

.bp-basis.nom{border-color:var(--accent)}
.bp-basis b{color:var(--text);font-weight:600}
.bt-sub{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3}

.bp-worked{font-size:12px;color:var(--muted);background:var(--surface-2);border-left:3px solid var(--accent);border-radius:6px;padding:7px 11px;margin:0 0 12px;line-height:1.5}
.bp-worked b{color:var(--text)}

/* --- executive summary + bridge verdict --- */
.exec-sum{margin-bottom:16px}
.es-head{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px}

.es-foot{font-size:11.5px;color:var(--muted);margin-top:9px}
