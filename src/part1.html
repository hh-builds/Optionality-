<!-- PWA install. Chromium fires beforeinstallprompt long before React has mounted,
     and only once, so it has to be captured here or the chance is lost. iOS Safari
     never fires it at all — there the app offers written Add to Home Screen steps. -->
<script>
(function(){
  window.__ffInstall = { deferred: null, installed: false };
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    window.__ffInstall.deferred = e;
    try { window.dispatchEvent(new CustomEvent('ff:installable')); } catch(err){}
  });
  window.addEventListener('appinstalled', function(){
    window.__ffInstall.deferred = null;
    window.__ffInstall.installed = true;
    // Chromium only — iOS never fires this, so app_launch below is the real signal there.
    try { window.OptTrack && window.OptTrack.track('app_installed'); } catch(err){}
    try { window.dispatchEvent(new CustomEvent('ff:installed')); } catch(err){}
  });
})();
</script>
<!-- READ-ONLY PLAN PREVIEW (admin support / debugging).
     admin.html can open this page with #ff-preview=<base64 of a saved plan blob>.
     When that is present the app renders THAT plan instead of whatever is in this
     browser, without touching it: every optionality.* localStorage read and write
     is redirected to an in-memory copy, cloud sync is switched off, and nothing is
     tracked. Nothing is written anywhere, so the viewer's own plan is untouched and
     the viewed user's row cannot be modified.
     This runs FIRST — before OptCloud patches setItem and before React reads any
     initial state — because both would otherwise see the real browser's data. -->
<script>
(function(){
  window.__FF_PREVIEW__ = null;
  var m = /(?:^|[#&])ff-preview=([^&]*)/.exec(location.hash || '');
  if (!m || !m[1]) return;

  var blob = null;
  try {
    var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var json = (typeof TextDecoder !== 'undefined')
      ? new TextDecoder('utf-8').decode(bytes)
      : decodeURIComponent(escape(bin));
    blob = JSON.parse(json);
  } catch (e) { blob = null; }
  if (!blob || typeof blob !== 'object') return;

  // Drop it out of the address bar and the history entry straight away — someone
  // else's figures should not sit in a URL that can be copied or shared by accident.
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}

  var PREFIX = 'optionality.';
  var mem = {};
  for (var k in blob){
    if (Object.prototype.hasOwnProperty.call(blob, k) && k.indexOf(PREFIX) === 0)
      mem[k] = String(blob[k]);
  }

  var realGet    = localStorage.getItem.bind(localStorage);
  var realSet    = localStorage.setItem.bind(localStorage);
  var realRemove = localStorage.removeItem.bind(localStorage);
  var isPlanKey  = function(k){ return String(k).indexOf(PREFIX) === 0; };

  localStorage.getItem = function(k){
    if (isPlanKey(k)) return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
    return realGet(k);
  };
  // Swallowed on purpose. The app rewrites these keys constantly (migrations, every
  // edit), and in preview none of it may reach the disk.
  localStorage.setItem = function(k, v){
    if (isPlanKey(k)) { mem[k] = String(v); return; }
    return realSet(k, v);
  };
  localStorage.removeItem = function(k){
    if (isPlanKey(k)) { delete mem[k]; return; }
    return realRemove(k);
  };

  window.__FF_PREVIEW__ = { label: blob.__label || 'a saved plan', keys: Object.keys(mem).length };
  try { document.title = 'Preview — Future Funded'; } catch (e) {}

  function banner(){
    if (!document.body || document.getElementById('ff-preview-bar')) return;
    var d = document.createElement('div');
    d.id = 'ff-preview-bar';
    d.setAttribute('role', 'status');
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;'
      + 'background:#7a4a12;color:#fff;font:600 13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;'
      + 'padding:10px 14px calc(10px + env(safe-area-inset-bottom, 0px));'
      + 'display:flex;gap:12px;align-items:center;justify-content:center;'
      + 'flex-wrap:wrap;text-align:center;box-shadow:0 -2px 12px rgba(0,0,0,.25)';
    d.innerHTML = 'Preview — you are looking at ' + String(window.__FF_PREVIEW__.label)
      .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; })
      + '. Nothing you do here is saved, synced or recorded.'
      + ' <a href="admin.html" style="color:#fff;text-decoration:underline">Back to admin</a>';
    document.body.appendChild(d);
    document.body.style.paddingBottom = '64px';
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', banner);
  else banner();
})();
</script>

<!-- Supabase: OPTIONAL accounts so a signed-in user's projections sync across devices.
     The publishable key below is safe to ship in client code — Row Level Security on the
     'projections' table (each row locked to its owner) is what actually protects the data. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var SUPABASE_URL = 'https://tvlnfhghextzsmizkuce.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_5gOqH6o9-cmDFWRTyLWtNA_414o6Wco';
  var PREFIX = 'optionality.';

  // Which localStorage keys belong to A PLAN, as opposed to to the person.
  // Theme, today's-money-vs-nominal and having read the disclaimer are facts
  // about the user and must NOT change when they flick between plans — they
  // still sync, they just travel in the projections row rather than in a plan.
  var PLAN_KEYS = ['optionality.inputs','optionality.bridge',
                   'optionality.coast','optionality.mortgage'];
  var MAX_PLANS = 5;

  var Cloud = { user:null, status:'idle', ready:false, available:false,
                // multiple saved plans (migration 012). `plansAvailable` stays
                // false until the table has actually answered, so a client
                // deployed ahead of the migration simply stays single-plan.
                plansAvailable:false, plans:[], activePlanId:null, maxPlans:MAX_PLANS,
                planKeys:PLAN_KEYS,
                getUser:function(){ return this.user; } };
  window.OptCloud = Cloud;

  function emit(name, detail){ try{ window.dispatchEvent(new CustomEvent(name,{detail:detail})); }catch(e){} }
  function setStatus(s){ Cloud.status = s; emit('optcloud:status', s); }
  function setUser(u){ Cloud.user = u; emit('optcloud:auth', u); }

  // Previewing someone else's saved plan: no session, no sync, no sign-in button.
  // Without this the admin's own account would sync the previewed plan into their row.
  if (window.__FF_PREVIEW__){ Cloud.ready = true; return; }

  // If the library didn't load (offline / blocked), degrade gracefully: the app
  // keeps working purely on localStorage and the Sign-in button hides itself.
  if (!window.supabase || !window.supabase.createClient){ Cloud.ready = true; return; }
  Cloud.available = true;

  var supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
  });
  Cloud.client = supa;

  function redirectUrl(){ return location.origin + location.pathname; }

  // ---- snapshot helpers over the optionality.* localStorage keys ----
  var rawSet = localStorage.setItem.bind(localStorage);
  var rawRemove = localStorage.removeItem.bind(localStorage);
  function snapshot(){
    var o = {};
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (k && k.indexOf(PREFIX)===0) o[k] = localStorage.getItem(k);
    }
    return o;
  }
  function canon(obj){
    var keys = Object.keys(obj).sort(), out = {};
    for (var i=0;i<keys.length;i++) out[keys[i]] = obj[keys[i]];
    return JSON.stringify(out);
  }
  function applySnapshot(data){
    var cur = snapshot();
    for (var k in cur){ if (!(k in data)) rawRemove(k); }
    for (var j in data){ rawSet(j, data[j]); }
  }
  // Just the figures, for a row in `plans`.
  function planSnapshot(){
    var o = {}, v;
    for (var i=0;i<PLAN_KEYS.length;i++){
      v = localStorage.getItem(PLAN_KEYS[i]);
      if (v != null) o[PLAN_KEYS[i]] = v;
    }
    return o;
  }
  // Swap the open plan's figures for another's. Writes with the UNPATCHED
  // setter — the caller decides when to push, so switching doesn't fire four
  // debounced uploads on the way past. Preferences are untouched by design.
  function applyPlanSnapshot(data){
    data = data || {};
    for (var i=0;i<PLAN_KEYS.length;i++){
      var k = PLAN_KEYS[i];
      if (Object.prototype.hasOwnProperty.call(data, k)) rawSet(k, String(data[k]));
      else rawRemove(k);
    }
  }

  // ---- save (debounced) ----
  var saveTimer = null;
  // Two writes, one snapshot, so they cannot disagree:
  //   * projections — the whole blob, exactly as it always was. Still what the
  //     login sync pulls and what every admin function reports on, which is why
  //     none of them had to change for this feature.
  //   * plans — the same figures, in the row for whichever plan is open.
  // If the plans table isn't there (migration 012 not run), only the first
  // happens and the app is single-plan, silently.
  function saveNow(){
    if (!Cloud.user) return Promise.resolve();
    setStatus('saving');
    var snap = snapshot(), jobs = [];
    jobs.push(supa.from('projections').upsert({
      user_id: Cloud.user.id, data: snap, updated_at: new Date().toISOString()
    }));
    if (Cloud.plansAvailable && Cloud.activePlanId){
      var only = {};
      for (var i=0;i<PLAN_KEYS.length;i++)
        if (Object.prototype.hasOwnProperty.call(snap, PLAN_KEYS[i]))
          only[PLAN_KEYS[i]] = snap[PLAN_KEYS[i]];
      jobs.push(supa.from('plans').update({ data: only }).eq('id', Cloud.activePlanId));
    }
    return Promise.all(jobs).then(function(res){
      var bad = res.filter(function(r){ return r && r.error; });
      setStatus(bad.length ? 'error' : 'saved');
      if (bad.length) console.warn('[OptCloud] save failed', bad[0].error);
    });
  }
  function scheduleSave(){
    if (!Cloud.user) return;
    setStatus('saving');
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ saveTimer = null; saveNow(); }, 1200);
  }
  // Patch setItem so any change to the app's inputs syncs up when signed in.
  localStorage.setItem = function(k,v){
    rawSet(k,v);
    if (Cloud.user && String(k).indexOf(PREFIX)===0) scheduleSave();
  };

  // ---- pull on login: cloud wins if it has data, else seed cloud from local ----
  var syncedFor = null;
  function syncFromCloud(){
    if (!Cloud.user || Cloud.recovery) return;
    var uid = Cloud.user.id;
    if (syncedFor === uid) return;
    syncedFor = uid;
    supa.from('projections').select('data').eq('user_id', uid).maybeSingle().then(function(res){
      if (res.error){ console.warn('[OptCloud] pull failed', res.error); syncedFor = null; return; }
      var row = res.data;
      if (row && row.data && Object.keys(row.data).length){
        if (canon(row.data) !== canon(snapshot())){
          // Cloud differs from the browser. Pull it in with a reload — but guard against an
          // infinite loop: on load the app runs one-time input migrations that rewrite
          // localStorage, so a pre-migration cloud copy would never match and we'd reload
          // forever. Reload at most once per session; if it STILL differs straight after
          // (the only delta is the migration), push the already-migrated local state UP so
          // the cloud converges, instead of looping.
          var GUARD = 'optionality._syncPulled';
          var pulled = null; try { pulled = sessionStorage.getItem(GUARD); } catch(e){}
          if (pulled){ try { sessionStorage.removeItem(GUARD); } catch(e){} ensurePlans().then(saveNow); return; }
          try { sessionStorage.setItem(GUARD, '1'); } catch(e){}
          applySnapshot(row.data); location.reload(); return;
        }
        try { sessionStorage.removeItem('optionality._syncPulled'); } catch(e){}
        setStatus('saved');
        ensurePlans();
      } else {
        // brand-new account: seed it with whatever's in the browser now, and
        // give it the one plan that everything else assumes exists
        ensurePlans().then(saveNow);
      }
    });
  }

  /* ---- multiple saved plans (migration 012) --------------------------------
     A plan is a complete version of somebody's forecast, kept under a name they
     chose. The name is a LABEL and nothing else: nothing here or in the engine
     behaves differently because a plan is called "Pay rise".

     `plans` is the library; `projections` still holds whichever plan is open.
     That is what keeps the admin, the read-only preview and the login sync
     working with no change at all — and it means this whole feature can be
     deployed before or after the migration without either one breaking.

     Two events go out:
       optcloud:plans      the list or the open plan changed — redraw the picker
       optcloud:planapply  the localStorage figures have been REPLACED; whoever
                           is holding React state needs to re-read them
     ------------------------------------------------------------------------ */
  function markActive(id){
    Cloud.activePlanId = id;
    Cloud.plans = Cloud.plans.map(function(p){
      return { id:p.id, name:p.name, is_active: p.id === id };
    });
  }
  function emitPlans(){ emit('optcloud:plans', Cloud.plans); }

  // Anything other than a normal result means "no plans table here" — a missing
  // relation, or PostgREST not knowing about it yet. Treated the same way in
  // every case: stay single-plan and say nothing. A half-working picker would
  // be far worse than none.
  function planTableMissing(err){
    if (!err) return false;
    var c = String(err.code || ''), m = String(err.message || '');
    return c === '42P01' || c === 'PGRST205' || c === 'PGRST202'
        || /does not exist|schema cache|relation .* plans/i.test(m);
  }

  function loadPlans(){
    if (!Cloud.user) return Promise.resolve([]);
    return supa.from('plans').select('id,name,is_active')
      .order('sort_order', { ascending:true }).order('created_at', { ascending:true })
      .then(function(res){
        if (res.error){
          if (planTableMissing(res.error)) { Cloud.plansAvailable = false; Cloud.plans = []; }
          else console.warn('[OptCloud] plans load failed', res.error);
          emitPlans();
          return [];
        }
        Cloud.plansAvailable = true;
        Cloud.plans = (res.data || []).map(function(p){
          return { id:p.id, name:p.name, is_active: !!p.is_active };
        });
        var open = Cloud.plans.filter(function(p){ return p.is_active; })[0] || Cloud.plans[0] || null;
        Cloud.activePlanId = open ? open.id : null;
        if (open) markActive(open.id);
        emitPlans();
        return Cloud.plans;
      });
  }

  // Called once a session has settled. A signed-in account always ends up with
  // at least one plan: an account that predates 012 was given "My plan" by the
  // backfill, and one created since gets it here, seeded from whatever is in
  // the browser at that moment.
  function ensurePlans(){
    if (!Cloud.user) return Promise.resolve();
    return loadPlans().then(function(list){
      if (!Cloud.plansAvailable || list.length) return;
      return supa.rpc('plan_create', { p_name:'My plan', p_data: planSnapshot() })
        .then(function(res){
          if (res.error){
            if (planTableMissing(res.error)) Cloud.plansAvailable = false;
            else console.warn('[OptCloud] first plan failed', res.error);
            return;
          }
          return loadPlans();
        });
    });
  }

  Cloud.loadPlans = loadPlans;

  // Make a plan and open it. `data` null = duplicate what is on screen now;
  // {} = start from scratch.
  Cloud.createPlan = function(name, data){
    var dup = data == null;
    var payload = dup ? planSnapshot() : (data || {});
    return saveNow()                       // don't lose the open plan's last keystroke
      .then(function(){ return supa.rpc('plan_create', { p_name:String(name||'').trim(), p_data:payload }); })
      .then(function(res){
        if (res.error) throw res.error;
        var row = res.data;
        var id = row && (row.id || (row[0] && row[0].id));
        // Starting from scratch means the page has to empty itself. Duplicating
        // means it already shows the right figures, so nothing is applied and
        // there is no flicker.
        if (!dup) { applyPlanSnapshot(payload); emit('optcloud:planapply', id); }
        markActive(id);
        return loadPlans().then(function(){ return saveNow(); }).then(function(){ return id; });
      });
  };

  Cloud.renamePlan = function(id, name){
    return supa.from('plans').update({ name:String(name||'').trim() }).eq('id', id)
      .then(function(res){ if (res.error) throw res.error; return loadPlans(); });
  };

  Cloud.switchPlan = function(id){
    if (id === Cloud.activePlanId) return Promise.resolve(id);
    return saveNow()
      .then(function(){ return supa.from('plans').select('data').eq('id', id).maybeSingle(); })
      .then(function(res){
        if (res.error) throw res.error;
        applyPlanSnapshot(res.data ? res.data.data : {});
        emit('optcloud:planapply', id);
        markActive(id);
        emitPlans();
        return supa.rpc('plan_set_active', { p_id: id });
      })
      .then(function(res){
        if (res && res.error) throw res.error;
        return saveNow().then(function(){ return id; });   // projections follows the open plan
      });
  };

  // Returns the id of the plan that is open afterwards — the same one, unless
  // the deleted plan was the open one.
  Cloud.deletePlan = function(id){
    var wasOpen = id === Cloud.activePlanId;
    return supa.rpc('plan_delete', { p_id: id }).then(function(res){
      if (res.error) throw res.error;
      var nxt = res.data;
      if (!wasOpen) { return loadPlans().then(function(){ return Cloud.activePlanId; }); }
      return supa.from('plans').select('data').eq('id', nxt).maybeSingle().then(function(r2){
        if (r2.error) throw r2.error;
        applyPlanSnapshot(r2.data ? r2.data.data : {});
        emit('optcloud:planapply', nxt);
        markActive(nxt);
        return loadPlans().then(function(){ return saveNow(); }).then(function(){ return nxt; });
      });
    });
  };

  // ---- auth methods (resolve to { data, error }) ----
  Cloud.recovery = false;
  Cloud.signInWithPassword = function(email,pw){ return supa.auth.signInWithPassword({ email:email, password:pw }); };
  Cloud.signUpWithPassword = function(email,pw){ return supa.auth.signUp({ email:email, password:pw, options:{ emailRedirectTo:redirectUrl() } }); };
  Cloud.signInWithMagicLink = function(email){ return supa.auth.signInWithOtp({ email:email, options:{ emailRedirectTo:redirectUrl(), shouldCreateUser:true } }); };
  Cloud.resetPassword = function(email){ return supa.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl() }); };
  Cloud.updateUser = function(attrs){ return supa.auth.updateUser(attrs); };
  // Signing out leaves the figures in the browser, as it always has — but the
  // library goes with the session, so the picker disappears and what stays on
  // screen is simply "your plan" again.
  Cloud.signOut = function(){ return supa.auth.signOut().then(function(r){
    setUser(null); syncedFor = null; setStatus('idle');
    Cloud.plans = []; Cloud.activePlanId = null; Cloud.plansAvailable = false;
    emitPlans();
    return r; }); };

  supa.auth.onAuthStateChange(function(event, session){
    var u = session && session.user ? session.user : null;
    setUser(u);
    // Arriving from a "reset password" email: don't sync/reload — show the set-password prompt.
    if (event === 'PASSWORD_RECOVERY'){ Cloud.recovery = true; emit('optcloud:recovery', true); return; }
    if (u && !Cloud.recovery) syncFromCloud();
  });

  supa.auth.getSession().then(function(res){
    var u = res.data && res.data.session ? res.data.session.user : null;
    if (u){ setUser(u); if (!Cloud.recovery) syncFromCloud(); }
    Cloud.ready = true; emit('optcloud:ready', true);
  });
})();
</script>
<!-- First-party product analytics. Writes to our own Supabase `events` table —
     no third party, no ad tech, no cross-site anything. What goes in a row:
     an anonymous device id, a session id, the event name, whether the device is
     a phone/tablet/desktop, and (only when signed in) the user id. No URLs, no
     referrers, no figures — the single numeric prop we ever send is the
     resulting optionality age, so the medians in the admin can be computed.
     Every write is insert-only; nothing here can read anything back. -->
<script>
(function(){
  var URL_  = 'https://tvlnfhghextzsmizkuce.supabase.co';
  var KEY   = 'sb_publishable_5gOqH6o9-cmDFWRTyLWtNA_414o6Wco';
  var SESSION_GAP_MS = 30 * 60 * 1000;   // 30 min idle ends a session
  var RETURN_GAP_MS  = 24 * 60 * 60 * 1000;

  // Deliberately NOT under the "optionality." prefix: OptCloud syncs every
  // optionality.* key to the user's cloud row, which would copy this device's
  // id onto their other devices and make the device counts meaningless.
  var K = { did:'ff.did', sid:'ff.sid', seen:'ff.seen', last:'ff.last_visit' };

  var T = { ready:false, enabled:false, track:function(){}, once:function(){}, flush:function(){} };
  window.OptTrack = T;

  function ls(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function ss(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  // Global Privacy Control is a real, legally recognised opt-out signal — honour it.
  if (navigator.globalPrivacyControl === true) return;
  // Previewing someone else's plan from the admin page is not a visit by anybody —
  // recording it would put the viewer's activity on the viewed person's device counts.
  if (window.__FF_PREVIEW__) return;
  if (!window.fetch || !window.crypto) return;

  function uuid(){
    if (crypto.randomUUID) return crypto.randomUUID();
    var b = crypto.getRandomValues(new Uint8Array(16));

  var deviceId = ls(K.did);
  if (!deviceId){ deviceId = uuid(); ss(K.did, deviceId); }

  // session = uuid + last-touch timestamp, rolled over after 30 idle minutes

  // turned into a country inside our own database.

    // Attribute at SEND time, not at queue time. getSession() is async, so the
    // very first events of a page load (notably `visit`) were queued before the
    // signed-in user was known and went up as anonymous — which made a signed-in
    // user who simply opened the app look like they had never used it.

          'apikey': KEY,

          'Prefer': 'return=minimal'

        body: JSON.stringify(rows)
      }).catch(function(){});   // analytics must never break the app
    } catch(e){}
  }

  function flush(keepalive){
    if (timer){ clearTimeout(timer); timer = null; }
    var rows = queue; queue = [];
    post(rows, keepalive);
  }

  function track(name, props){
    if (!name) return;
    touchSession();
    queue.push({
      device_id: deviceId,
      session_id: sess.id,
      user_id: null,            // set in post(); RLS rejects anything but your own id
      name: name,
      device_kind: deviceKind(),
      props: props || {}

    if (queue.length >= 10) { flush(false); return; }
    if (!timer) timer = setTimeout(function(){ flush(false); }, 1500);

  // scope: 'device' (once ever on this browser) | 'session' (once per session)
  // Device-scope entries store the session that fired them, so callers can tell
  // "already done, in an earlier visit" from "just done, a moment ago".

  T.once = once;

  T.marked = marked;

  });
  window.addEventListener('pagehide', function(){ flush(true); });

  // ---- the entry events, fired here so they don't depend on React mounting ----
  if (freshSession){

    // ONLY evidence anyone ever installed it — Safari fires no install events.
    var standalone = false;
    try {

                   || navigator.standalone === true;
    } catch(e){}
    if (standalone) track('app_launch');
  }
})();

  --surface-1:#17181b; --surface-2:#1e2024; --page:#0e0f11;

.toolbar.open > .btn + .btn{border-top:1px solid var(--border);border-radius:0}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-primary);
  padding:7px 13px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:500;transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:.9;color:#fff}
/* the Admin menu item is a real link, so it needs the button's box explicitly */
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.btn.subtle{background:transparent;border-color:transparent;color:var(--muted);padding:6px 9px;font-size:12px;font-weight:600}
.btn.subtle:hover{border-color:var(--border);color:var(--text-primary)}
/* ---- accounts / auth ---- */
/* ⚠️ `align-items:flex-start` + `margin:auto` on the panel, NOT
   `align-items:center`. A centred flex item that outgrows its container
   overflows in BOTH directions, and the half above the top edge cannot be
   scrolled to — the classic unreachable-modal-header bug. `margin:auto`
   centres it while there is room and lets it scroll from the top when there
   isn't. `overscroll-behavior:contain` stops a drag inside the panel scrolling
   the page underneath it on iOS.

   ⚠️ The padding clears the SAFE AREA, not a flat 16px: installed on a phone
   the app runs viewport-fit=cover, so the page starts at physical y=0 and
   16px puts the panel's top edge under the Dynamic Island. */
.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;
  display:flex;align-items:flex-start;justify-content:center;
  overflow-y:auto;overscroll-behavior:contain;
  padding:max(16px, env(safe-area-inset-top,0px))  max(16px, env(safe-area-inset-right,0px))
          max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.auth-modal{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lift);width:100%;max-width:380px;padding:22px 20px;position:relative;margin:auto;
  /* on a short phone these panels can outgrow the viewport — scroll rather than clip */
  max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.auth-x{position:absolute;top:8px;right:11px;background:none;border:none;color:var(--muted);font-size:23px;line-height:1;cursor:pointer;padding:2px 6px}
.auth-x:hover{color:var(--text-primary)}
.auth-title{font-size:17px;margin:0 0 6px}
.auth-sub{font-size:13px;color:var(--text-secondary);margin:0 0 14px;line-height:1.45}
.auth-seg{display:flex;gap:6px;background:var(--page);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:12px}
.auth-seg button{flex:1;border:none;background:none;color:var(--text-secondary);padding:8px 6px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}
.auth-seg button.on{background:var(--surface-2);color:var(--accent);box-shadow:var(--shadow)}
.auth-input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-1);color:var(--text-primary);font-size:16px;margin-bottom:10px}
.auth-input:focus{outline:none;border-color:var(--accent)}
.auth-go{display:flex;width:100%;justify-content:center;margin-top:2px;padding:11px}
.auth-msg{font-size:13px;border-radius:10px;padding:9px 11px;margin-bottom:10px;line-height:1.4}
.auth-msg.ok{background:var(--accent-soft);color:var(--accent)}
.auth-msg.err{background:rgba(208,59,59,.12);color:var(--critical)}
.auth-link{display:block;width:100%;text-align:center;background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;margin-top:12px;font-weight:600}
.acc-sec{margin-bottom:12px}
.acc-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.acc-row{display:flex;gap:8px;align-items:stretch}
.acc-row .auth-input{margin-bottom:0;flex:1;min-width:0}
.acc-row .btn{white-space:nowrap}
.acc-signout{display:flex;width:100%;justify-content:center;margin-top:6px}
.acc-divider{height:1px;background:var(--border);margin:4px 0 14px}
/* ---- install-as-an-app instructions ---- */
.inst-steps{margin:0;padding-left:20px;font-size:14px;line-height:1.65;color:var(--text-secondary)}
.inst-steps li{margin-bottom:7px}
.inst-steps b{color:var(--text-primary);font-weight:650}
.inst-key{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  padding:0 5px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);
  color:var(--text-primary);font-size:13px;font-weight:650;line-height:1;vertical-align:-5px}
.inst-note{font-size:12px;color:var(--muted);line-height:1.55;margin:12px 0 0}
/* password field with a Show/Hide reveal toggle */
.pw-wrap{position:relative;display:block}
.pw-wrap .auth-input{padding-right:64px}
.acc-row .pw-wrap{flex:1;min-width:0}
.pw-eye{position:absolute;right:6px;top:11px;background:none;border:none;color:var(--accent);
  font-size:13px;font-weight:600;cursor:pointer;padding:6px 8px;font-family:inherit;border-radius:7px;line-height:1}
.pw-eye:hover{background:var(--accent-soft)}
.acc-row .pw-eye{top:50%;transform:translateY(-50%)}


.panel{background:var(--surface-1);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.panel > h2{font-size:var(--fs-h);margin-bottom:4px;letter-spacing:-0.01em}
.panel .desc{font-size:var(--fs-help);color:var(--muted);margin-bottom:16px;line-height:1.55}


.icon-btn{background:none;border:1px solid var(--border);border-radius:7px;cursor:pointer;color:var(--muted);
  width:30px;height:30px;font-size:15px;line-height:1}
.icon-btn:hover{color:var(--critical);border-color:var(--critical)}
.add-link{background:none;border:1px dashed var(--border);border-radius:10px;color:var(--accent);
  padding:11px 8px;min-height:44px;width:100%;cursor:pointer;font-size:var(--fs-label);font-weight:600;margin-top:6px}
.add-link:hover{border-color:var(--accent);background:var(--accent-soft)}








/* table */
.tablewrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);background:var(--surface-1)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}
th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:11.5px;
  letter-spacing:0;position:sticky;top:0;text-align:right;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface-1)}
th:first-child{z-index:2}
td{border-bottom:1px solid var(--grid)}
tr.accumulation td:first-child{box-shadow:inset 3px 0 var(--series-pension)}
tr.bridge td:first-child{box-shadow:inset 3px 0 var(--warning)}
tr.retirement td:first-child{box-shadow:inset 3px 0 var(--series-isa)}
tr.bridge{background:var(--phase-bridge)}
tr.retirement{background:var(--phase-ret)}
.legend-row{display:flex;gap:10px 16px;margin:12px 0 2px;font-size:var(--fs-label);flex-wrap:wrap}
.legend-row span{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary)}
.legend-row .sw{width:11px;height:11px;border-radius:3px}
.notecell{color:var(--muted);font-size:11px;max-width:180px;white-space:normal;text-align:left}

/* chart */
.chart-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;gap:8px}
.terms-tag{font-size:var(--fs-help);font-weight:600;color:var(--muted);
  background:var(--surface-2);border:none;padding:3px 10px;border-radius:999px;white-space:nowrap}
/* table group header (Pension | ISA-GIA) */
tr.grouprow th{background:var(--surface-2);border-bottom:1px solid var(--border);padding:5px 10px}
tr.grouprow th.grp{text-align:center;font-size:11px;letter-spacing:.04em}
tr.grouprow th.grp-p{color:var(--series-pension)}
tr.grouprow th.grp-a{color:var(--series-isa)}
th.grp-p, td:nth-child(2){border-left:2px solid var(--border)}
td:nth-child(7){border-left:2px solid var(--border)}
tr.grouprow th.grp-a{border-left:2px solid var(--border)}
.tooltip{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;
  box-shadow:var(--shadow);font-size:12px}
.tooltip .t-age{font-weight:600;margin-bottom:5px}
.tooltip .t-row{display:flex;justify-content:space-between;gap:14px}
.tooltip .t-row .nm{display:flex;align-items:center;gap:6px;color:var(--text-secondary)}
.tooltip .t-row .sw{width:9px;height:9px;border-radius:3px}
.tooltip .t-row .amt{font-weight:600;font-variant-numeric:tabular-nums}

.note{font-size:var(--fs-help);color:var(--muted);margin-top:9px;line-height:1.55;max-width:680px}
.assumptions{font-size:var(--fs-help);color:var(--muted);background:var(--surface-2);border:none;
  border-radius:10px;padding:12px 14px;margin-top:8px;line-height:1.7}

/* =====================================================================
   ISA / GIA BRIDGE PLANNER  ("Accessible Wealth")
   ===================================================================== */
.bridge-planner{background:var(--surface-1);
  border-radius:var(--radius);padding:24px 26px 22px;margin-bottom:20px;box-shadow:var(--shadow)}
.bp-topline{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.bp-q{display:none}
.bp-title{font-size:var(--fs-result);font-weight:600;letter-spacing:-0.02em;margin:0 0 2px;line-height:1.2}
.bp-title .bp-star{color:var(--accent)}
.bp-terms{display:flex;gap:6px;align-items:center;flex:0 0 auto}
/* the units switch is a utility, not a headline — keep it compact and on one line */
.bp-terms .bp-seg button{white-space:nowrap;padding:7px 11px;min-height:34px;font-size:var(--fs-help);font-weight:600}
@media (max-width:560px){
  .bp-topline{gap:10px}
  .bp-terms{width:100%}
  .bp-terms .bp-seg{width:100%}
  .bp-terms .bp-seg button{flex:1 1 0;min-height:38px}
}
/* headline result — three tiers: answer → evidence → help */
.bp-result{margin:16px 0 14px}
/* one step below the headline cards on purpose — the cards are the hero, and
   a planner answer was rendering LARGER than the card answering the same thing */
.bp-answer{font-size:32px;font-weight:650;letter-spacing:-0.03em;line-height:1.08}
.bp-answer.reached{color:var(--good-text)}
.bp-answer.missed{color:var(--critical)}
/* "Work to 66" — the plan works, just later than they hoped. Not a success and
   not a failure, and red would be a lie about a perfectly reachable answer. */
.bp-answer.later{color:var(--warning)}
/* waiting on an input — deliberately quiet, and clearly not a result */
.bp-answer.waiting{color:var(--muted);font-size:var(--fs-result);font-weight:600;letter-spacing:-0.01em}
.bp-evidence{font-size:var(--fs-body);color:var(--text-secondary);margin-top:9px;line-height:1.45;
  font-variant-numeric:tabular-nums;max-width:640px}
.bp-evidence b{color:var(--text-primary);font-weight:650}
.bp-evidence .arrow{color:var(--muted);font-weight:400;margin:0 2px}
.bp-help-line{font-size:var(--fs-help);color:var(--muted);margin-top:6px;line-height:1.5;max-width:660px}
.bp-scen-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 0 4px}
.bp-scen-lbl{font-size:var(--fs-label);color:var(--muted);font-weight:600;margin-right:3px}
.bp-chip{display:inline-flex;align-items:baseline;gap:6px;font-size:var(--fs-label);font-weight:600;
  border:1px solid var(--border);border-radius:999px;padding:7px 13px;min-height:34px;background:transparent;color:var(--muted);cursor:pointer;transition:.12s}
.bp-chip .cd{width:8px;height:8px;border-radius:50%;align-self:center}
.bp-chip.off{color:var(--muted)}
.bp-chip:hover{border-color:var(--baseline);color:var(--text-secondary)}
.bp-chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text-primary)}
.bp-chip.on:hover{color:var(--text-primary)}
.bp-chip .cage{color:var(--muted);font-weight:600}
.bp-chip.on .cage{color:var(--text-secondary)}
/* supporting figures — no boxes, just hairlines and whitespace */
.bp-results{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:18px 0 4px;
  border-top:1px solid var(--border)}
.bp-tile{background:none;border:none;border-bottom:1px solid var(--border);padding:12px 16px 12px 0}
.bp-tile .bt-k{font-size:var(--fs-label);color:var(--muted);font-weight:600;line-height:1.3}
.bp-tile .bt-v{font-size:var(--fs-h);font-weight:650;margin-top:5px;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.bp-tile .bt-v.pos{color:var(--good-text)} .bp-tile .bt-v.neg{color:var(--critical)}
/* chart block */
.bp-chart{margin-top:12px;padding:2px 0}
/* sub-headings inside the planner — sentence case, one weight, a hairline rule */
.bp-sub{font-size:var(--fs-body);letter-spacing:-0.01em;color:var(--text-primary);font-weight:650;
  margin:24px 2px 11px;display:flex;align-items:center;gap:10px}
.bp-summary{font-size:var(--fs-body);color:var(--text-primary)}
.bp-sub::after{content:"";flex:1;height:1px;background:var(--border)}
/* input grid — one comfortable column on a phone, widening with the viewport.

   ⚠️ THE BOXES MUST LINE UP. Labels are not all one line — "Retirement income
   you want each year" wraps where "Inflation" does not — and with each field
   as its own independent column, one wrapped label pushed its input a line
   lower than every other box in the row. It read as a rendering fault.

   So each field spans three rows of the SHARED grid (label / input / hint) via
   subgrid: every label row is as tall as the tallest label, so every input
   starts at the same y, and the hints line up under them. Nothing is padded
   out when no label wraps — the row simply stays one line high, which is why
   this beats a min-height.

   The fallback below reserves two label lines outright. Uglier where nothing
   wraps, but level, which is the point. */
.bp-assump{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:561px){ .bp-assump{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))} }
.bp-fld{display:flex;flex-direction:column;gap:5px;min-width:0}
@supports (grid-template-rows: subgrid) {
  .bp-assump{row-gap:0}
  .bp-fld{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:5px;
    align-content:start;padding-bottom:14px}
}
.bp-fld label{font-size:var(--fs-label);color:var(--text-secondary);font-weight:600;line-height:1.3}
@supports not (grid-template-rows: subgrid) {
  .bp-fld label{min-height:2.6em}   /* two lines at line-height 1.3 */
}
.bp-fld .bp-hint{font-size:var(--fs-help);color:var(--muted);line-height:1.4}
.bp-inwrap{position:relative;display:flex;align-items:center}
.bp-inwrap>span.pfx{position:absolute;left:11px;color:var(--muted);font-size:var(--fs-body);pointer-events:none}
.bp-inwrap>span.sfx{position:absolute;right:11px;color:var(--muted);font-size:var(--fs-body);pointer-events:none}
.bp-inwrap input{width:100%;padding:9px 11px;border:1px solid var(--grid);border-radius:10px;background:var(--surface-2);
  color:var(--text-primary);font-size:var(--fs-body);font-weight:600;font-family:inherit;font-variant-numeric:tabular-nums;
  min-height:40px}
.bp-inwrap input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bp-inwrap.money input{padding-left:23px} .bp-inwrap.pct input{padding-right:26px}
/* phase editor — every field carries its own label, so it reads on a phone */
.bp-phases{display:flex;flex-direction:column;gap:6px}
.bp-phase{display:grid;grid-template-columns:1fr 1fr 1.6fr auto;gap:10px;align-items:end}
.bp-pf{display:flex;flex-direction:column;gap:5px;min-width:0}
.bp-pf label{font-size:var(--fs-label);color:var(--text-secondary);font-weight:600;line-height:1.3}
.bp-phase .icon-btn{align-self:end;margin-bottom:5px}
@media (max-width:560px){
  .bp-phase{grid-template-columns:1fr 1fr auto;gap:10px}
  .bp-pf.wide{grid-column:1 / 4;grid-row:2}
  .bp-phase .icon-btn{grid-column:3;grid-row:1}
}
/* segmented toggles */
.bp-toggles{display:flex;gap:16px 20px;flex-wrap:wrap;align-items:flex-start;margin-bottom:4px}
.bp-tgroup{display:flex;flex-direction:column;gap:5px;min-width:0}
.bp-tgroup>.tl{font-size:var(--fs-label);color:var(--text-secondary);font-weight:600;line-height:1.3}
.bp-seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.bp-seg button{background:none;border:none;padding:9px 14px;font-size:var(--fs-label);cursor:pointer;color:var(--text-secondary);font-family:inherit;font-weight:600;min-height:40px}
/* the selected option needs to be unmistakable — an accent-soft fill alone is too
   close to the track colour to read as "on", so ring it in the accent as well */
.bp-seg button.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.bp-seg button+button{border-left:1px solid var(--border)}
/* scenario editor cards */
.bp-scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bp-scard{background:var(--surface-2);border:none;border-radius:var(--radius-sm);padding:14px 15px}
.bp-scard-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.bp-scard-head .sn{display:flex;align-items:center;gap:8px;font-size:var(--fs-body);font-weight:650}
.bp-scard-head .sn .cd{width:11px;height:11px;border-radius:50%}
.bp-scard-sub{font-size:var(--fs-help);color:var(--muted);margin:-4px 0 9px;font-variant-numeric:tabular-nums}
.bp-scard.base .bp-scard-sub{color:var(--text-primary);font-weight:600}
.bp-scard .bp-fld{margin-bottom:9px}
.bp-scard .cross-line{font-size:var(--fs-help);color:var(--muted);margin-top:2px}
.bp-scard .cross-line b{color:var(--text-primary);font-weight:650}
.bp-scen-toggle{font-size:var(--fs-help);font-weight:650;color:var(--accent);cursor:pointer;background:none;
  border:none;font-family:inherit;padding:7px 8px;margin:-7px -8px;min-height:34px;border-radius:7px}
.bp-scen-toggle:hover{background:var(--accent-soft)}
/* colour-coded table indicators */
tr.bp-below td:first-child{box-shadow:inset 3px 0 var(--critical)}
tr.bp-amber td:first-child{box-shadow:inset 3px 0 var(--warning)}
tr.bp-green td:first-child{box-shadow:inset 3px 0 var(--good)}
tr.bp-green{background:var(--phase-ret)}
tr.bp-amber{background:var(--phase-bridge)}
.bp-status{font-weight:650;font-size:var(--fs-help);letter-spacing:0}
.bp-status.below{color:var(--critical)} .bp-status.amber{color:var(--warning)} .bp-status.green{color:var(--good-text)}
html[data-theme="dark"] .bp-status.amber{color:var(--warning)} html[data-theme="dark"] .bp-status.green{color:var(--good)}
.bp-cross-row td{border-top:2px solid var(--accent)!important}
.bp-note{font-size:var(--fs-help);color:var(--muted);margin-top:9px;line-height:1.55;max-width:680px}
@media (max-width:960px){
  .bp-results{grid-template-columns:repeat(2,1fr)}
  .bp-scenarios{grid-template-columns:1fr}
}
@media (max-width:560px){
  /* supporting figures become a plain label/value list — no grid squeeze */
  .bp-results{grid-template-columns:1fr;border-top:none}
  .bp-tile{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:11px 0}
  .bp-tile .bt-k{flex:1 1 auto}
  .bp-tile .bt-v{margin-top:0;flex:0 0 auto;text-align:right}
  .bridge-planner{padding:18px 15px}
}

/* =====================================================================
   MOBILE / ADAPTIVE — thumb-friendly targets, readable tables, tighter chrome
   ===================================================================== */
/* Mid widths (562–820px, e.g. tablets / large phones landscape): keep the
   tables as tables but pin the first (Age) column and add a scroll-shadow so
   it's clear there's more to swipe. Below 561px they become cards instead. */
@media (min-width:561px) and (max-width:820px){
  .tablewrap{
    -webkit-overflow-scrolling:touch;
    background:
      linear-gradient(to right, var(--surface-1) 30%, rgba(0,0,0,0)) left center / 22px 100% no-repeat local,
      linear-gradient(to left, var(--surface-1) 30%, rgba(0,0,0,0)) right center / 22px 100% no-repeat local,
      radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.14), rgba(0,0,0,0)) right center / 11px 100% no-repeat scroll;
  }
  .tablewrap table{font-size:12px}
  .tablewrap th,.tablewrap td{padding-left:8px;padding-right:8px;white-space:nowrap}
  .tablewrap thead th:first-child,
  .tablewrap tbody td:first-child{position:sticky;left:0;z-index:2;
    background:var(--surface-1);box-shadow:1px 0 0 var(--border)}
  .tablewrap tr.bp-green td:first-child{background:var(--phase-ret)}
  .tablewrap tr.bp-amber td:first-child{background:var(--phase-bridge)}
}
@media (max-width:560px){
  /* iOS zooms any focused input under 16px — bump font, and give comfy targets */
  .bp-inwrap input,.bp-phase input{font-size:16px;min-height:44px;padding-top:11px;padding-bottom:11px}
  .bp-inwrap.money input{padding-left:25px} .bp-inwrap.pct input{padding-right:28px}
  .bp-inwrap>span.pfx,.bp-inwrap>span.sfx{font-size:15px}
  /* bigger tap targets on the segmented toggles and toolbar buttons */
  .bp-seg button{padding:12px 14px;min-height:44px;font-size:13.5px}
  .btn{padding:10px 13px;min-height:44px}
  .icon-btn{width:44px;height:44px}
  /* ---- collapse the top bar into a burger menu so it stays one compact row ---- */
  .topbar{flex-wrap:nowrap;gap:10px;padding:calc(9px + env(safe-area-inset-top, 0px)) 0 9px}
  .brand-sub{display:none}          /* subtitle is dead weight on a phone */
  .brand h1{font-size:16px}
  /* 44px is the iOS minimum tap target; 40 with the notch above it was the
     difference between "fiddly" and "can't hit it" */
  .burger{display:inline-flex;position:relative;z-index:61;width:44px;height:44px}
  .fb-btn{margin-left:auto}
  .menu-backdrop{display:block;position:fixed;inset:0;z-index:59;background:transparent}
  .toolbar{display:none}
  .toolbar.open{display:flex;flex-direction:column;align-items:stretch;gap:0;
    position:absolute;top:calc(100% - 3px);right:0;z-index:60;min-width:220px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
    padding:5px;box-shadow:var(--shadow)}
  /* flat, high-contrast menu items — text-primary on the panel, divided, so each reads clearly.
     Scoped with '>' so it styles ONLY the top-level toolbar buttons, never the buttons inside
     the account modal (which is rendered within the still-open toolbar). */
  .toolbar.open > .btn{width:100%;justify-content:flex-start;text-align:left;min-height:44px;
    background:transparent;border:none;border-radius:10px;color:var(--text-primary);
    font-size:15px;font-weight:500;padding:12px 14px}
  .toolbar.open > .btn:hover{background:var(--surface-1);color:var(--text-primary)}
  .toolbar.open > .btn:active{background:var(--accent-soft)}
  .toolbar.open > .btn + .btn{border-top:1px solid var(--border);border-radius:0}
  .bp-seg{flex-wrap:wrap}
  .bp-scen-chips{gap:8px}
  /* reclaim horizontal space so content isn't pinched */
  .wrap{padding:14px max(12px, env(safe-area-inset-right, 0px)) calc(60px + env(safe-area-inset-bottom, 0px))
        max(12px, env(safe-area-inset-left, 0px))}
  .bridge-planner{padding:16px 13px}
  .bp-answer{font-size:25px}
  .bp-title{font-size:18px}
  .bp-sub{margin:20px 2px 10px}
  /* segmented toggle groups stack rather than overflow */
  .bp-toggles{gap:14px}
  .bp-tgroup{width:100%}
  .bp-seg{width:100%}
  .bp-seg button{flex:1 1 0}

  /* ---- Year-by-year tables become STACKED CARDS (one row = one card) ----
     Pure CSS, driven by data-label on each <td>; the <table> markup and the
     desktop rendering are unchanged. */
  .tablewrap.cards{border:none;background:none;overflow:visible;max-height:none!important}
  .tablewrap.cards table,
  .tablewrap.cards tbody,
  .tablewrap.cards tr,
  .tablewrap.cards td{display:block;width:auto}
  .tablewrap.cards thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .tablewrap.cards tr{border:1px solid var(--border);border-left-width:3px;border-radius:var(--radius);
    background:var(--surface-1);padding:6px 13px 8px;margin-bottom:11px;box-shadow:var(--shadow)}
  .tablewrap.cards td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    padding:6px 0;border:none;white-space:normal;text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums}
  .tablewrap.cards td::before{content:attr(data-label);color:var(--muted);font-size:11.5px;
    letter-spacing:0;font-weight:600;text-align:left;flex:0 0 auto;
    max-width:56%;line-height:1.3}
  .tablewrap.cards td:empty{display:none}
  /* the Age cell is the card header */
  .tablewrap.cards td:first-child{border-bottom:1px solid var(--border);margin-bottom:3px;
    padding:2px 0 8px;font-weight:650;font-size:16px}
  .tablewrap.cards td:first-child::before{align-self:center}
  /* status colour → the card's left border (mirrors the desktop row tint) */
  .tablewrap.cards tr.bp-green{border-left-color:var(--good)}
  .tablewrap.cards tr.bp-amber{border-left-color:var(--warning)}
  .tablewrap.cards tr.bp-below{border-left-color:var(--critical)}
  .tablewrap.cards tr.bp-cross-row{border-color:var(--accent);border-left-color:var(--accent)}
  /* combined table has no bp-* status classes — give it a neutral accent edge */
  .tablewrap.cards tr:not([class]){border-left-color:var(--baseline)}
}

/* =====================================================================
   MOBILE SPACING PASS — one place, applied last so it wins.
   Desktop spacing carried over to phones was leaving big empty bands
   between things that belong together. Gaps between RELATED items shrink;
   gaps between genuinely separate sections stay generous.
   ===================================================================== */
@media (max-width:560px){
  /* Eye-flow on a phone: answer -> chart -> key figures -> controls.
     In source order the five supporting figures sit between the headline and
     the chart, which pushed the chart most of a screen down. Reordered with
     flex rather than by moving markup, so desktop is untouched. */
  .bridge-planner{display:flex;flex-direction:column}
  .bridge-planner > *{order:3}
  .bridge-planner > .bp-topline,
  .bridge-planner > .bp-result,
  .bridge-planner > .bp-why,
  .bridge-planner > .bp-scen-chips{order:0}
  .bridge-planner > .bp-chart{order:1}
  .bridge-planner > .bp-results{order:2;margin-top:14px}

  /* The units switch already lives in the menu and is repeated in BOTH
     planners; on a phone that is three copies of one control costing a
     full-width row each. Keep the menu one. */
  .bp-terms{display:none}

  .wrap{padding:12px max(12px, env(safe-area-inset-right, 0px)) calc(44px + env(safe-area-inset-bottom, 0px))
        max(12px, env(safe-area-inset-left, 0px))}
  .hero{margin:6px 2px 12px}
  .hc-foot{margin-top:1px}
  .bridge-planner{padding:15px 13px 14px;margin-bottom:12px}
  .bp-result{margin:12px 0 10px}
  .bp-sub{margin:18px 2px 9px}
  .bp-note{margin-top:8px}
  .bp-chart{margin-top:10px}
  .legend-row{margin:9px 0 2px;gap:8px 14px}
  .bp-scen-chips{margin-bottom:2px}
  summary.bp-summary{padding:13px 2px;min-height:48px}
  details.bp-collapse > :not(summary){padding-bottom:12px}
  .panel{padding:15px 14px}
  .panel .desc{margin-bottom:12px}
  .outputs-block .panel{margin-bottom:12px!important}
  .bp-tile{padding:8px 0}
  .bp-tile .bt-v{font-size:var(--fs-body)}
  .bp-chip{padding:8px 12px;min-height:40px}
  .bp-scen-chips{gap:6px}
  .bp-phase-sum{margin:2px 0 8px 2px;padding-bottom:8px}
  .bp-assump{gap:11px}
  .bp-inwrap input,.bp-phase input{min-height:44px}
  .bp-fld{gap:4px}
  .bp-phases{gap:4px}
  .site-foot{margin:32px 2px 0;padding-top:16px}
  .add-link{margin-top:4px}
}

@media print{
  .toolbar,.add-link,.icon-btn,input[type=range]{display:none!important}
  body{background:#fff} .panel{box-shadow:none;border:1px solid #ddd}
  .wrap{max-width:100%}
}

/* --- collapsible planner sections: a hairline and a row, not a nested box --- */
details.bp-collapse{margin:0;border:none;border-top:1px solid var(--border);border-radius:0;background:none}
details.bp-collapse + details.bp-collapse{margin-top:0}
summary.bp-summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;
  padding:15px 2px;margin:0;min-height:52px;color:var(--text-primary);font-weight:650}
summary.bp-summary::-webkit-details-marker{display:none}
summary.bp-summary::before{content:"▸";flex:0 0 auto;font-size:12px;color:var(--accent);transition:transform .15s ease}
details.bp-collapse[open]>summary.bp-summary::before{transform:rotate(90deg)}
summary.bp-summary::after{content:"Show";flex:0 0 auto;margin-left:auto;background:none;height:auto;
  font-size:var(--fs-help);font-weight:600;color:var(--accent);white-space:nowrap}
details.bp-collapse[open]>summary.bp-summary::after{content:"Hide"}
summary.bp-summary:hover::after{text-decoration:underline}
details.bp-collapse > :not(summary){padding-bottom:16px}
/* --- per-phase year/total readout --- */
.bp-phase-sum{font-size:var(--fs-help);color:var(--muted);margin:2px 0 10px 2px;line-height:1.45;
  padding-bottom:10px;border-bottom:1px solid var(--border)}
.bp-phases > .bp-phase-sum:last-of-type{border-bottom:none;padding-bottom:2px}
.bp-phase-sum b{color:var(--text);font-weight:600}
/* --- market-growth column --- */
td.bp-growth{color:var(--muted);font-variant-numeric:tabular-nums}


/* --- metric-tile sub-note (e.g. "= £801k in today's money") --- */
.bt-sub{font-size:var(--fs-help);color:var(--muted);margin-top:3px;line-height:1.3}


/* =====================================================================
   FIRST USE — the setup card, and the "not said yet" field state
   ---------------------------------------------------------------------
   Two rules run through all of this:

   1. NOTHING HERE IS RED. An unanswered question is not a failed plan.
      Red is reserved for "your plan doesn't currently achieve this" —
      if it also means "you haven't finished typing", it stops meaning
      anything at all. So an unset field is quieter than a set one, never
      louder: a dashed edge and a faded prefix, no warning colour.

   2. The setup card is a PLANNER STATE, not a wizard. It sits exactly
      where the result will appear, in the same card, and is replaced by
      that result. There is no modal, no step counter and no separate
      onboarding route to maintain.
   ===================================================================== */
.setup{margin:14px 0 4px}
.su-lead{font-size:var(--fs-result);font-weight:650;letter-spacing:-0.02em;line-height:1.25;
  color:var(--text-primary);margin:0 0 4px}
.su-sub{font-size:var(--fs-body);color:var(--text-secondary);line-height:1.5;margin:0 0 16px;max-width:60ch}
.su-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:640px){ .su-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px} }
.su-fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.su-fld > label{font-size:var(--fs-body);font-weight:650;color:var(--text-primary);line-height:1.3;
  letter-spacing:-0.01em}
.su-fld .su-hint{font-size:var(--fs-help);color:var(--muted);line-height:1.45}
.su-cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:22px 0 2px}
.su-go{appearance:none;border:none;border-radius:11px;padding:13px 22px;min-height:48px;
  background:var(--accent);color:#fff;font-size:var(--fs-body);font-weight:650;letter-spacing:-0.01em;
  cursor:pointer;transition:opacity .15s ease,transform .15s ease}
.su-go:hover:not(:disabled){transform:translateY(-1px)}
.su-go:disabled{background:var(--surface-2);color:var(--muted);cursor:default;
  box-shadow:inset 0 0 0 1px var(--border)}
.su-left{font-size:var(--fs-help);color:var(--muted);line-height:1.4}
.su-fine{font-size:var(--fs-help);color:var(--muted);line-height:1.5;margin-top:18px;
  padding-top:14px;border-top:1px solid var(--border)}
.su-fine a,.su-fine button.linkish{color:var(--accent);font-weight:600}

/* bigger, calmer inputs for the four questions that actually matter */
.bp-inwrap.big input{padding:13px 13px;font-size:17px;min-height:50px;border-radius:11px}
.bp-inwrap.big.money input{padding-left:28px}
.bp-inwrap.big>span.pfx{left:13px;font-size:16px}
/* "hasn't said yet" — quieter than a filled field, never an error */
.bp-inwrap.unset input{border-style:dashed;border-color:var(--grid)}
.bp-inwrap.unset input::placeholder{color:var(--muted);opacity:.65}
.bp-inwrap.unset>span.pfx{opacity:.45}

/* --- "Your numbers" ---
   There WAS a small-print summary line here restating every figure, and a
   standing line of assumption percentages under each result. Both are gone.
   The boxes sit open directly below the heading and say the same things at a
   size you can read; the assumptions are disclosed once, in the setup card,
   where somebody actually meets them. A figure repeated in 12px grey above the
   input holding it is not reassurance, it's noise. */
.yn-fields{margin-top:4px}

/* =====================================================================
   THE DISCLAIMER, AND THE ACCOUNT OFFER
   ---------------------------------------------------------------------
   Both are deliberately quiet. The disclaimer is a panel in the flow, not
   a modal and not a legal wall — it sits exactly where the setup card was
   and is left by pressing the button you were already reaching for. The
   account card comes AFTER the first answer and can be waved away for
   good; the header keeps a small standing offer instead of asking again.
   ===================================================================== */
/* The gate. Centred over the app, dismissed by one button — no X, no backdrop
   click, no checkbox. Not because it is a contract, but because it is four
   short paragraphs and skipping them is the only failure mode that matters.
   ⚠️ On a short phone this is TALLER than the viewport, so the card scrolls
   inside itself (100dvh, not vh — vh ignores mobile browser chrome and puts
   the button under the address bar) and the button stays reachable. */
.dscl-veil{position:fixed;inset:0;z-index:1200;display:flex;align-items:center;justify-content:center;
  padding:16px;background:rgba(10,12,18,.55);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dscl{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-lift);width:100%;max-width:62ch;padding:26px 26px 22px;
  max-height:calc(100dvh - 32px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.dscl-h{font-size:var(--fs-result);font-weight:650;letter-spacing:-0.02em;line-height:1.25;
  color:var(--text-primary);margin:0 0 12px}
.dscl p{font-size:var(--fs-body);color:var(--text-secondary);line-height:1.6;margin:0 0 11px}
.dscl p b{color:var(--text-primary);font-weight:650}
.dscl .su-cta{margin:20px 0 0;position:sticky;bottom:-22px;padding:12px 0 2px;
  background:linear-gradient(to bottom, transparent, var(--surface-1) 30%)}
.dscl .su-go{width:100%;justify-content:center}
@media (max-width:560px){
  .dscl-veil{padding:10px}
  .dscl{padding:20px 18px 16px}
  .dscl p{font-size:15px}
}
@media (prefers-reduced-motion:no-preference){
  .dscl{animation:dscl-in .18s ease-out}
}
@keyframes dscl-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* --- "keep your plan" --- */
.nudge{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 22px;
  margin:16px 0 4px;padding:15px 18px;border-radius:12px;
  background:var(--accent-soft);border:1px solid var(--grid)}
.nudge-txt{min-width:min(100%,26ch);flex:1 1 30ch}
.nudge-h{font-size:var(--fs-body);font-weight:650;color:var(--text-primary);letter-spacing:-0.01em}
.nudge-txt p{font-size:var(--fs-help);color:var(--text-secondary);line-height:1.5;margin:4px 0 0;max-width:52ch}
.nudge-act{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;flex:0 0 auto}
.su-go.sm{padding:10px 17px;min-height:42px;font-size:var(--fs-help);border-radius:10px}
.nudge-no{background:none;border:none;padding:6px 2px;font:inherit;font-size:var(--fs-help);
  color:var(--text-secondary);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.nudge-no:hover{color:var(--text-primary)}
@media (max-width:560px){
  .nudge{padding:14px}
  .nudge-act{width:100%} .su-go.sm{flex:1 1 auto;justify-content:center}
}

/* --- the standing offer in the header --- */
.save-plan{margin-left:auto;background:none;border:1px solid var(--grid);border-radius:9px;
  padding:0 12px;height:36px;min-height:36px;font:inherit;font-size:var(--fs-help);font-weight:600;
  color:var(--accent);cursor:pointer;white-space:nowrap;flex:0 0 auto}
.save-plan:hover{border-color:var(--accent);background:var(--accent-soft)}
/* .fb-btn also carries margin-left:auto to push the right-hand group over. With
   both set the free space is SPLIT between them and Save plan floats out in the
   middle of the bar — so whichever comes first keeps the auto. */
.save-plan + .fb-btn{margin-left:0}
@media (max-width:560px){
  /* On a phone the brand, two 44px icons and this all share one row. Losing the
     second word buys back the ~40px that was making "Future Funded" wrap onto
     two lines — and "Save" alone still reads, where an icon would not. */
  .save-plan{padding:0 10px;height:36px;min-height:36px;font-size:12px}
  .save-plan .sp-word{display:none}
}

/* --- headline card: waiting for numbers ---
   Deliberately NOT dimmed into invisibility. It is the main way into setup,
   so it has to stay legible and obviously tappable. */
.hcard.waiting{border:1px dashed var(--grid);box-shadow:none;background:var(--surface-1)}
.hc-v.prompt{color:var(--text-secondary)}
.hc-ask{font-size:var(--fs-help);color:var(--accent);font-weight:600;margin-top:6px}

.bp-why{margin:10px 0 2px;font-size:var(--fs-help)}
/* ---- inline "learn more": explanation that isn't always on screen ---- */
details.learn{margin:7px 0 0}
details.learn > summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;
  font-size:var(--fs-help);font-weight:600;color:var(--muted);padding:8px 0;min-height:34px}
details.learn > summary::-webkit-details-marker{display:none}
details.learn > summary::before{content:'i';display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;border-radius:50%;border:1px solid var(--baseline);
  font-size:10px;font-weight:650;font-style:italic;flex:0 0 auto}
details.learn > summary:hover{color:var(--text-secondary)}
details.learn > div{font-size:var(--fs-help);color:var(--muted);line-height:1.55;max-width:680px;margin:3px 0 2px}
details.learn > div b{color:var(--text-secondary);font-weight:650}

/* a footnote, not a call to action — keep it quiet next to the headline answer */
.bp-why>summary{cursor:pointer;color:var(--muted);font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:8px 0;min-height:34px}
.bp-why>summary:hover{color:var(--text-secondary)}
.bp-why>summary::-webkit-details-marker{display:none}
.bp-why>summary::before{content:'?';display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:none;border:1px solid var(--baseline);color:inherit;font-size:10px;font-weight:650}
.bp-why[open]>summary{margin-bottom:4px}
.bp-why ol{margin:2px 0 4px;padding-left:20px;color:var(--muted);line-height:1.6}
.bp-why li{margin-bottom:4px}
.bp-why li b{color:var(--text-primary);font-weight:650}

/* --- sequence-risk / drawdown stress test --- */
.bp-stress{margin:6px 0 4px;border:none;border-radius:var(--radius);background:var(--surface-2);padding:16px 18px}
/* when wrapped in the collapsible module section, the details provides the frame — drop the inner card's own chrome so it doesn't double-box */
details.bp-stress-collapse{margin:12px 0}
details.bp-stress-collapse > .bp-stress{border:none;background:none;border-radius:0;box-shadow:none;margin:0;padding:15px 16px}
.bp-stress-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.bp-stress-q{font-size:var(--fs-result);font-weight:650;letter-spacing:-0.02em;line-height:1.15}
.bp-stress-resid{display:flex;flex-direction:column;gap:4px;min-width:150px}
.bp-stress-resid label{font-size:11px;color:var(--muted);font-weight:600}
.bp-stress-controls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.bp-seg.sm button{padding:7px 12px;font-size:12.5px;min-height:34px;flex:1 1 0;min-width:78px}
@media (max-width:560px){ .bp-stress-controls{width:100%} .bp-stress-controls .bp-stress-resid{flex:1 1 100%} .bp-seg.sm{width:100%} .bp-seg.sm button{flex:1 1 0;min-height:44px;min-width:0} }
.bp-stress-lines{display:flex;flex-direction:column}
.ssl{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 2px;border-top:1px solid var(--border)}
.ssl:first-child{border-top:none}
.ssl .k{font-size:var(--fs-body);color:var(--text-secondary)}
.ssl .k .muted{font-weight:500}
.ssl .v{font-size:var(--fs-h);font-weight:650;font-variant-numeric:tabular-nums}
.ssl .v.ok{color:var(--good-text)}
.ssl .v.no{color:var(--critical)}
.ssl .v.muted{color:var(--muted);font-weight:600;font-size:12px}
.ssl.next .k{color:var(--muted)}
.bp-stress-sub{font-size:var(--fs-help);color:var(--text-secondary);margin-top:11px;line-height:1.55}
.bp-stress-sub.bad{color:var(--critical)}
.ss-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.ss-card{border:none;border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface-2)}
.ss-card .n{font-size:var(--fs-label);font-weight:650;display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ss-card .n .cd{width:9px;height:9px;border-radius:50%}
.ss-card .st{font-size:var(--fs-body);font-weight:650}
.ss-card .st.ok{color:var(--good-text)} .ss-card .st.no{color:var(--critical)}
.ss-card .dt{font-size:var(--fs-help);color:var(--muted);margin-top:3px;line-height:1.4}
@media (max-width:560px){ .ss-cards{grid-template-columns:1fr} .bp-stress-q{font-size:18px} .bp-stress-resid{min-width:0;width:100%} }

/* =====================================================================
   EXPLORE OTHER DECISIONS — side calculators beneath the two planners.
   Lighter chrome than a planner on purpose: this is an extra, not a
   third dashboard.
   ===================================================================== */
.explore{margin:30px 0 0}
.ex-h{font-size:var(--fs-body);letter-spacing:-0.01em;color:var(--text-primary);font-weight:650;
  margin:0 2px 11px;display:flex;align-items:center;gap:10px}
.ex-h::after{content:"";flex:1;height:1px;background:var(--border)}
.ex-card{background:var(--surface-1);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px}
.ex-card-k{font-size:var(--fs-h);font-weight:650;letter-spacing:-0.02em;margin-bottom:5px}
.ex-card-b{font-size:var(--fs-help);color:var(--text-secondary);line-height:1.55;max-width:520px;margin-bottom:14px}

/* ---- mortgage overpayment vs investing ---- */
.mo-strap{font-size:var(--fs-help);color:var(--muted);line-height:1.5;max-width:560px;margin-top:3px}
.mo-hide{flex:0 0 auto}
.mo-hero{margin:16px 0 2px}
.mo-hero .v{font-size:27px;font-weight:650;letter-spacing:-0.03em;line-height:1.12}
.mo-hero .v.waiting{color:var(--muted);font-size:var(--fs-result);font-weight:600;letter-spacing:-0.01em}
.mo-hero .sub{font-size:var(--fs-help);color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.mo-line{font-size:var(--fs-body);color:var(--text-secondary);line-height:1.5;max-width:660px;margin-top:10px}
.mo-line b{color:var(--text-primary);font-weight:650}
/* the break-even rate is the most useful number in the module — give it a frame */
/* mortgage-free date */
/* the two paths, side by side */
.mo-cols,.mo-tradeoff{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mo-col{background:var(--surface-2);border-radius:var(--radius-sm);padding:14px 16px}
.mo-col h4{font-size:var(--fs-label);font-weight:650;margin:0;display:flex;align-items:center;gap:8px}
.mo-col .cd{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.mo-col .net{font-size:var(--fs-result);font-weight:650;letter-spacing:-0.02em;margin:7px 0 9px;font-variant-numeric:tabular-nums}
.mo-col .net .nl{font-size:var(--fs-help);font-weight:600;color:var(--muted);letter-spacing:0}
.mo-col ul{margin:8px 0 0;padding-left:17px;color:var(--muted);font-size:var(--fs-help);line-height:1.65}
.mo-col ul b{color:var(--text-secondary);font-weight:650}
.mo-r .v.strong{color:var(--accent)}
.mo-key{font-size:var(--fs-help);color:var(--text-secondary);line-height:1.6;margin-top:12px;max-width:680px}
.mo-key b{color:var(--text-primary);font-weight:650}
@media (max-width:560px){
  .ex-card{padding:16px 13px}
  .explore{margin:22px 0 0}
  .mo-hero .v{font-size:22px}
  .mo-cols,.mo-tradeoff{grid-template-columns:1fr}
  .mo-hide{align-self:flex-start}
}

/* ---- mortgage module: the trade-off hero, the timeline, the gap callout ---- */
.mo-trade{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-bottom:2px}
.mo-tcell{background:var(--surface-2);border-radius:var(--radius-sm);padding:16px 18px}
.mo-tcell .k{font-size:var(--fs-label);color:var(--muted);font-weight:600;line-height:1.35}
.mo-tcell .v{font-size:25px;font-weight:650;letter-spacing:-0.03em;line-height:1.15;margin-top:6px}
.mo-tcell .s{font-size:var(--fs-help);color:var(--text-secondary);margin-top:8px;line-height:1.45}
.mo-vs{align-self:center;font-size:var(--fs-label);color:var(--muted);font-weight:650}
/* Each path as a short numbered journey. Deliberately almost no rules — the
   card tells the story, the year-by-year table below is the audit trail. */
.mo-flows{align-items:stretch;margin-top:4px}  /* equal-height cards: one path is
   shorter than the other and a half-height panel beside a full one reads as broken */
.mo-flow{background:var(--surface-2);border-radius:var(--radius-sm);padding:16px 18px}
.mo-flow h4{margin:0 0 14px;font-size:var(--fs-label);font-weight:650;display:flex;align-items:center;gap:8px}
.mo-flow .cd{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.mo-jn{list-style:none;counter-reset:jn;margin:0;padding:0}
.mo-jn li{counter-increment:jn;position:relative;padding:0 0 20px 28px}
.mo-jn li::before{content:counter(jn);position:absolute;left:0;top:0;width:19px;height:19px;
  border-radius:50%;background:var(--surface-1);color:var(--muted);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
/* the connector: a hairline, not a divider — it joins the steps rather than
   cutting the card into a statement */
.mo-jn li::after{content:"";position:absolute;left:9px;top:24px;bottom:2px;width:1px;background:var(--border)}
.mo-jn li:last-child::after{display:none}
.mo-jn .t{font-size:var(--fs-label);font-weight:650;line-height:1.35}
.mo-jn .big{font-size:21px;font-weight:650;letter-spacing:-0.02em;margin-top:5px;line-height:1.2;
  font-variant-numeric:tabular-nums}
.mo-jn .big.sm{font-size:var(--fs-h);letter-spacing:-0.01em}
.mo-jn .s{font-size:var(--fs-help);color:var(--text-secondary);margin-top:5px;line-height:1.45}
/* the freed-up-cash sum: the parts understated, the total not */
.mo-sum{margin:9px 0 3px;font-size:var(--fs-help);color:var(--text-secondary)}
.mo-sum>div{display:flex;align-items:baseline;gap:8px;padding:1px 0}
.mo-sum .op{width:10px;flex:0 0 auto;color:var(--muted);font-weight:650}
.mo-sum .tot{margin-top:6px}
.mo-sum .tot b{font-size:21px;font-weight:650;letter-spacing:-0.02em;color:var(--text-primary);
  font-variant-numeric:tabular-nums}
/* Type scale inside the module. The step LABEL is quiet and the figure under it
   is the loud thing — the other way round and every step shouts equally. The
   supporting copy is 13px rather than 12px and sits on --text-secondary, not
   --muted: it is meant to be read, not skimmed past. */
/* Every prose block in the module runs the page width — .bp-note was already
   lifted; .mo-key and .mo-caveat were still capped at the 680px measure and
   read as text hugging the left edge of a wide page.
   Scoped to the module on purpose: the planners above use that measure
   deliberately, and widening those was not asked for. */
.mortgage-module .bp-note,
.mortgage-module .mo-key,
.mortgage-module .mo-caveat,
.mortgage-module .assumptions,
.mortgage-module .desc{max-width:none}
.mo-flow h4{font-size:var(--fs-h);font-weight:650;letter-spacing:-0.01em}
.mo-jn .t{font-size:13px;font-weight:600;color:var(--text-secondary);line-height:1.4}
.mo-jn .big{font-size:22px;color:var(--text-primary);margin-top:3px}
.mo-jn .big.sm{font-size:var(--fs-h)}
.mo-jn .s{font-size:13px;font-weight:400;color:var(--text-secondary);margin-top:4px;line-height:1.5}
.mo-sum{font-size:13px;font-weight:400}
.mo-sum .tot b{font-size:22px}
/* the outcome, lined up with the steps above it */
.mo-out{padding-left:28px}
.mo-out .w{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mo-out .hero{font-size:28px;font-weight:650;letter-spacing:-0.03em;margin-top:4px;line-height:1.15;
  font-variant-numeric:tabular-nums}
.mo-out .s{font-size:13px;font-weight:400;color:var(--text-secondary);margin-top:5px;line-height:1.5}
.mo-caveat{font-size:var(--fs-help);color:var(--muted);line-height:1.55;margin-top:14px;max-width:680px}
@media (max-width:560px){
  .mo-trade{grid-template-columns:1fr;gap:9px}
  .mo-vs{justify-self:start;padding:0 2px}
  .mo-tcell .v{font-size:21px}
  .mo-sum .tot b,.mo-jn .big{font-size:var(--fs-result)}
  .mo-out .hero{font-size:22px}
}
</style>
