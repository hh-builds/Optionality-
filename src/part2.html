              {!isBase && <button className="bp-scen-toggle" onClick={()=>updScen(scn.key,{enabled:!scEnabled[scn.key]})}>{scEnabled[scn.key]?'On chart ✓':'Show on chart'}</button>}
            </div>
            <div className="bp-scard-sub">{(s.growth*100).toFixed(0)}% return · {(scInfl*100).toFixed(1)}% inflation · {(((s.withdrawalRate!=null?s.withdrawalRate:cp.withdrawalRate))*100).toFixed(1)}% draw → {(((1+s.growth)/(1+scInfl)-1)*100).toFixed(1)}% real</div>
            {isBase
              ? <div className="bp-note" style={{margin:'2px 0 6px'}}>Uses your assumptions above. Edit the return / inflation there to move this line.</div>
              : <React.Fragment>
                <div className="bp-fld"><label>Nominal return</label><BpNum pct value={+((s.growth||0)*100).toFixed(2)} step="0.1"
                  onChange={v=> updScen(scn.key,{growth:(v||0)/100})} /></div>
                <div className="bp-fld"><label>Inflation</label><BpNum pct value={+((scInfl||0)*100).toFixed(2)} step="0.1"
                  onChange={v=> updScen(scn.key,{inflation:(v||0)/100})} /></div>
              </React.Fragment>}
            <div className="cross-line">Coast: <b>{res.coastAge!=null?'age '+res.coastAge:'not by '+res.objAge}</b></div>
          </div>
          );
        })}
      </div>
      <div className="bp-note">Scenarios differ by market assumptions <b>and</b> the safe withdrawal rate (return / inflation / draw): <b>Optimistic</b> 9% / 2% / 4.0% · <b>Base</b> {(cp.growth*100).toFixed(0)}% / {(cp.inflation*100).toFixed(1)}% / {(cp.withdrawalRate*100).toFixed(1)}% · <b>Conservative</b> 5% / 3% / 3.0%.</div>
      <Learn label={realTerms ? 'Showing today’s money' : 'Showing future £'}>{realTerms
        ? 'Every figure is at today’s prices, with inflation stripped out.'
        : 'Actual future pounds, including inflation — so they look bigger than their worth today.'} The toggle only relabels the units; it never changes the plan.</Learn>
      </div>
      </details>

      {/* ===== SEQUENCE RISK — PENSION DRAWDOWN ===== */}
      {(function(){
        const sc = stress.scenarios;
        const accessNf = realTerms ? 1 : Math.pow(1+(cp.inflation||0), stress.accessAge - cp.currentAge);
        const fmtAge = a => a==null?null:(Number.isInteger(a)?String(a):a.toFixed(1));
        const ageLabel = fmtAge(stress.startAgeExact!=null?stress.startAgeExact:stress.startAge);
        const hasDraw = stress.reached && stress.bridgeYears>0;
        const targetPct = Math.round((cp.confidence!=null?cp.confidence:0.9)*100);
        const confPct = sim.confidenceAtCrossover!=null ? Math.round(sim.confidenceAtCrossover*100) : null;
        const meetsTarget = sim.confidenceAtCrossover!=null && sim.confidenceAtCrossover >= (cp.confidence!=null?cp.confidence:0.9);
        const stressAgeLabel = fmtAge(sim.stressAgeExact);
        const trialsLbl = sim.trials ? sim.trials.toLocaleString() : '';
        const realPct = (((1+cp.growth)/(1+(cp.inflation||0))-1)*100).toFixed(1);
        let sData = [];
        if (hasDraw){
          const n = sc.normal.rows.length;
          for (let i=0;i<n;i++){ const a = sc.normal.rows[i].age;
            sData.push({ age:a, normal: sc.normal.rows[i].startBalance*bf(a),
              poor: sc.poorStart.rows[i].startBalance*bf(a), crash: sc.crash.rows[i].startBalance*bf(a) }); }
          const acc = stress.accessAge;
          sData.push({ age:acc, normal: Math.max(0,sc.normal.residual)*bf(acc),
            poor: Math.max(0,sc.poorStart.residual)*bf(acc), crash: Math.max(0,sc.crash.residual)*bf(acc) });
        }
        let fData = [];
        if (hasDraw && sim.bands){ fData = sim.bands.map(function(b){ return { age:b.age, p10:b.p10*bf(b.age), p50:b.p50*bf(b.age), p90:b.p90*bf(b.age) }; }); }
        const yn = (b)=> b ? <span className="v ok">Yes</span> : <span className="v no">No</span>;
        let sub, subBad=false;
        if (!hasDraw){
          sub = 'Your retirement age is at or beyond life expectancy, so there’s no drawdown to stress-test.';
        } else if (meetsTarget){
          sub = 'Across '+trialsLbl+' historical market sequences the pension lasted to life expectancy '+stress.accessAge+' in '+confPct+'% of them — at or above your '+targetPct+'% target. Retiring at '+ageLabel+' holds up even against bad early runs.';
        } else if (stressAgeLabel==null){
          sub = 'Even retiring right at life expectancy can’t reach '+targetPct+'% confidence with a '+gbpC(cp.minResidual||0)+' buffer — lower the income or the buffer.';
          subBad=true;
        } else {
          sub = 'Across '+trialsLbl+' historical sequences the pension lasted '+confPct+'% of the time retiring at '+ageLabel+' — below your '+targetPct+'% target. To clear '+targetPct+'% you’d retire at about '+stressAgeLabel+' (or lower the income, keep a bigger buffer, or flex spending after a fall).';
          subBad=true;
        }
        return (
        <React.Fragment>
          <details className="bp-collapse bp-stress-collapse" onToggle={TRK.open('view_projection')}>
          <summary className="bp-sub bp-summary"><span>{(function(){
            if(!(hasDraw && confPct!=null)) return 'Sequence risk · can bad early markets drain the pension?';
            let t = 'Sequence risk · '+confPct+'% confidence retiring at '+ageLabel;
            if(meetsTarget) t += ' — clears '+targetPct+'%';
            else if(stressAgeLabel!=null) t += ' — '+targetPct+'% at '+stressAgeLabel;
            else t += ' — below '+targetPct+'%';
            return t;
          })()}</span></summary>
          <div className="bp-stress">
            <div className="bp-stress-head">
              <div className="bp-stress-q">{'Will my pension last if I retire at '+ageLabel+'?'}</div>
              <div className="bp-stress-controls">
                <div className="bp-stress-resid">
                  <label>Buffer to leave at {stress.accessAge}</label>
                  <BpNum money value={cp.minResidual||0} step={5000} onChange={v=>setCp({minResidual:Math.max(0,v)})} />
                </div>
                <div className="bp-stress-resid">
                  <label>Confidence target</label>
                  <div className="bp-seg sm" role="group" aria-label="confidence target">
                    {[80,90,95].map(function(p){ return <button key={p} className={targetPct===p?'on':''} onClick={()=>setCp({confidence:p/100})}>{p}%</button>; })}
                  </div>
                </div>
              </div>
            </div>
            <div className="bp-stress-lines">
              <div className="ssl"><span className="k">Base projection <span className="muted">(steady returns)</span></span>{hasDraw?yn(stress.survivesNormal):<span className="v muted">—</span>}</div>
              <div className="ssl"><span className="k">Bad early markets <span className="muted">(poor start / crash)</span></span>{hasDraw?yn(stress.survivesBadStart):<span className="v muted">—</span>}</div>
              <div className="ssl"><span className="k">Simulation confidence <span className="muted">({trialsLbl} historical runs)</span></span>{hasDraw&&confPct!=null?<span className={'v '+(meetsTarget?'ok':'')}>{confPct}%</span>:<span className="v muted">—</span>}</div>
              <div className="ssl"><span className="k">Stress-tested retirement age <span className="muted">(at {targetPct}%)</span></span>{hasDraw?(stressAgeLabel!=null?<span className={'v '+(meetsTarget?'ok':'')}>{stressAgeLabel}</span>:<span className="v no">—</span>):<span className="v muted">—</span>}</div>
            </div>
            <div className={'bp-stress-sub'+(subBad?' bad':'')}>{sub}</div>

            <details className="bp-why"><summary>What does “bad early markets” mean?</summary>
              <ol>
                <li><b>Sequence risk is about order, not average.</b> Once you retire you’re <b>drawing income from the pension</b> with no wage to top it up. If markets fall in the <b>first few years</b>, you’re selling units to live on while prices are low, so there’s less left to recover when markets bounce — the same set of returns in a different order can pass or fail. Bad years <b>early</b> do far more damage than the same bad years later.</li>
                <li><b>“Yes” means the pension lasts through both stress runs.</b> We replay your plan — retire at {ageLabel}, draw {gbpC(stress.income)}/yr{stress.statePension>0?<span> (less the {gbpC(stress.statePension)} State Pension from {stress.spAge})</span>:''} — against two deliberately harsh openings: <b>Poor start</b> (a weak first three years, roughly −6%, −10%, −3% real) and <b>Crash</b> (−35% in year one, then a normal +18% / +12% rebound). After the shock, returns revert to your {(stress.baseReal*100).toFixed(1)}% trend.</li>
                <li><b>Survive = the pot never runs below your buffer</b> ({gbpC(cp.minResidual||0)}) before life expectancy {stress.accessAge}. If <b>either</b> run drains it first, this reads <b>No</b>{stress.worstFail?<span> — here a {stress.worstFail==='crash'?'crash':'poor start'} runs it dry at age {sc[stress.worstFail].failAge}</span>:''}. It’s a deliberately tough test: your Base projection can say Yes while this says No, which is exactly the sequence risk a single average-return line hides.</li>
              </ol>
            </details>

            {hasDraw && <details className="bp-collapse">
              <summary className="bp-sub bp-summary">Stress test detail &amp; methodology</summary>
              <div className="ss-cards">
                {[{k:'normal',l:'Normal',c:C.pension},{k:'poorStart',l:'Poor start',c:C.cash},{k:'crash',l:'Crash',c:C.red}].map(function(x){
                  const s = sc[x.k];
                  return <div className="ss-card" key={x.k}>
                    <div className="n"><span className="cd" style={{background:x.c}}></span>{x.l}</div>
                    <div className={'st '+(s.survived?'ok':'no')}>{s.survived?'Lasts to '+stress.accessAge:'Runs dry @ '+s.failAge}</div>
                    <div className="dt">{s.survived? 'Leaves '+m(s.residual, stress.accessAge)+' at '+stress.accessAge : (stress.accessAge-s.failAge)+' yr'+((stress.accessAge-s.failAge)===1?'':'s')+' short of '+stress.accessAge}</div>
                  </div>;
                })}
              </div>
              <div className="bp-chart" style={{marginTop:6}}>
                {ResponsiveContainer ? (
                <ResponsiveContainer width="100%" height={narrow?220:290}>
                  <LineChart data={sData} margin={{top:22,right:18,left:8,bottom:2}}>
                    <CartesianGrid stroke={C.grid} vertical={false} />
                    <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} minTickGap={narrow?22:6} interval="preserveStartEnd" />
                    <YAxis stroke={C.axis} tick={{fontSize:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={52} />
                    <Tooltip content={<ChartTip/>} trigger={narrow?'click':'hover'} />
                    {(cp.minResidual||0)>0 && <ReferenceLine y={(cp.minResidual||0)*accessNf} stroke={C.axis} strokeDasharray="4 3" label={{value:'Buffer', position:'insideTopLeft', fill:C.axis, fontSize:10}} />}
                    <ReferenceLine y={0} stroke={C.red} strokeOpacity={0.55} />
                    <Line type="monotone" dataKey="normal" name="Normal" stroke={C.pension} strokeWidth={2.4} dot={false} />
                    <Line type="monotone" dataKey="poor" name="Poor start" stroke={C.cash} strokeWidth={2} dot={false} />
                    <Line type="monotone" dataKey="crash" name="Crash" stroke={C.red} strokeWidth={2} dot={false} />
                  </LineChart>
                </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
                <div className="legend-row" style={{marginBottom:2}}>
                  <span><span className="sw" style={{background:C.pension}}></span>Normal</span>
                  <span><span className="sw" style={{background:C.cash}}></span>Poor start</span>
                  <span><span className="sw" style={{background:C.red}}></span>Crash</span>
                  <span className="terms-tag">{realTerms?'today’s money':'future £ (nominal)'}</span>
                </div>
              </div>
              <div className="tablewrap" style={{marginTop:12}}>
                <table>
                  <thead><tr><th>Age</th><th>Normal</th><th>Poor start</th><th>Crash</th></tr></thead>
                  <tbody>
                    {sData.map(function(r,i){
                      const cell = (v)=> v<=0 ? <span style={{color:'var(--critical)'}}>Empty</span> : gbpC(v);
                      return <tr key={i}>
                        <td>{r.age}{r.age===stress.accessAge?' (life exp)':''}</td>
                        <td>{cell(r.normal)}</td><td>{cell(r.poor)}</td><td>{cell(r.crash)}</td>
                      </tr>;
                    })}
                  </tbody>
                </table>
              </div>
              <div className="bp-note" style={{marginTop:10}}>
                <b>Method (stress overlays).</b> Starting from the pension you’d hold at retirement ({ageLabel}) — <b>{m(stress.startBalance, stress.startAge)}</b> — each scenario draws your <b>{gbpC(stress.income)}/yr</b>{stress.statePension>0?<span> (less the {gbpC(stress.statePension)} State Pension from {stress.spAge})</span>:''}, constant in today’s money, and grows the remainder at a <b>variable</b> real return, year by year, to life expectancy {stress.accessAge}. The base real return is {(stress.baseReal*100).toFixed(1)}%. <b>Poor start</b> applies roughly −6%, −10%, −3% real over the first three years, then reverts to trend; <b>Crash</b> applies −35% in year one then a +18% / +12% rebound, then trend. A scenario <b>survives</b> if it funds every year and still holds at least your {gbpC(cp.minResidual||0)} buffer at {stress.accessAge}. These three are hand-picked overlays; the historical simulation below turns the same idea into a probability across thousands of sequences.
              </div>

              <div className="bp-sub" style={{marginTop:20}}>Historical simulation · {trialsLbl} sequences</div>
              <div className="bp-note" style={{marginTop:0,marginBottom:8}}>The lines are the 10th / 50th / 90th percentiles of where the pension lands each year across {trialsLbl} bootstrapped historical return sequences, retiring at {ageLabel}. <b>{confPct}%</b> stay funded to life expectancy {stress.accessAge}{(cp.minResidual||0)>0?<span> above your {gbpC(cp.minResidual||0)} buffer</span>:''}; the 10th-percentile line is where sequence risk bites hardest.</div>
              <div className="bp-chart" style={{marginTop:0}}>
                {ResponsiveContainer ? (
                <ResponsiveContainer width="100%" height={narrow?220:290}>
                  <LineChart data={fData} margin={{top:22,right:18,left:8,bottom:2}}>
                    <CartesianGrid stroke={C.grid} vertical={false} />
                    <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} minTickGap={narrow?22:6} interval="preserveStartEnd" />
                    <YAxis stroke={C.axis} tick={{fontSize:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={52} />
                    <Tooltip content={<ChartTip/>} trigger={narrow?'click':'hover'} />
                    {(cp.minResidual||0)>0 && <ReferenceLine y={(cp.minResidual||0)*accessNf} stroke={C.axis} strokeDasharray="4 3" label={{value:'Buffer', position:'insideTopLeft', fill:C.axis, fontSize:10}} />}
                    <ReferenceLine y={0} stroke={C.red} strokeOpacity={0.55} />
                    <Line type="monotone" dataKey="p90" name="90th pct" stroke={C.isa} strokeWidth={1.8} dot={false} strokeDasharray="5 4" />
                    <Line type="monotone" dataKey="p50" name="Median" stroke={C.pension} strokeWidth={2.6} dot={false} />
                    <Line type="monotone" dataKey="p10" name="10th pct" stroke={C.red} strokeWidth={1.8} dot={false} strokeDasharray="5 4" />
                  </LineChart>
                </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
                <div className="legend-row" style={{marginBottom:2}}>
                  <span><span className="sw" style={{background:C.isa}}></span>90th percentile</span>
                  <span><span className="sw" style={{background:C.pension}}></span>Median</span>
                  <span><span className="sw" style={{background:C.red}}></span>10th percentile</span>
                  <span className="terms-tag">{realTerms?'today’s money':'future £ (nominal)'}</span>
                </div>
              </div>
              <div className="bp-note" style={{marginTop:10}}>
                <b>Simulation method.</b> The pension drawdown is replayed against <b>{trialsLbl}</b> return sequences drawn from <b>actual history</b> — annual real total returns of US large-cap equity (S&P 500 with dividends, deflated by US CPI), <b>{sim.hist?sim.hist.from:1928}–{sim.hist?sim.hist.to:2024}</b> ({sim.hist?sim.hist.n:97} years; ~{sim.hist?(sim.hist.geoMean*100).toFixed(1):'6.7'}% real return, ~{sim.hist?(sim.hist.vol*100).toFixed(0):'20'}% volatility) as the equity proxy. A <b>block bootstrap</b> stitches random 5-year runs so crashes and recoveries cluster as they did historically, not as independent coin-flips. Because these are <b>raw</b> historical returns, the simulation’s average comes from history (~{sim.hist?(sim.hist.geoMean*100).toFixed(1):'6.7'}% real), not your {realPct}% assumption — which is used only to build the pot up to the day you retire. The <b>stress-tested retirement age</b> is the earliest retirement age whose drawdown clears your {targetPct}% confidence. Runs are seeded, so the figures are stable. Planning model, not financial advice.
              </div>
            </details>}
          </div>
          </details>
        </React.Fragment>
        );
      })()}

      {/* YEAR-BY-YEAR */}
      <details className="bp-collapse" onToggle={TRK.open('view_projection')}><summary className="bp-sub bp-summary">Year-by-year · age {cp.currentAge}–{base.rows.length?base.rows[base.rows.length-1].age:base.objAge}</summary>
      <div className="tablewrap cards">
        <table>
          <thead><tr><th>Age</th><th>Projected pension</th><th>Coast balance required</th><th>Surplus / shortfall</th><th>Annual contribution</th><th>Withdrawal</th><th>Market growth</th><th>Status</th></tr></thead>
          <tbody>
            {base.rows.map((r,i)=>{ const st = rowStat(r); return (
              <tr key={i} className={rowClass(r)+(r.age===base.coastAge?' bp-cross-row':'')}>
                <td data-label="Age">{r.age}</td>
                <td data-label="Projected pension">{m(r.projected, r.age)}</td>
                <td data-label="Coast balance required">{m(r.required, r.age)}</td>
                <td data-label="Surplus / shortfall" style={{color:r.surplus>=0?'var(--good-text)':'var(--critical)'}}>{(r.surplus>=0?'+':'−')+m(Math.abs(r.surplus), r.age)}</td>
                <td data-label="Annual contribution">{r.contribution?m(r.contribution, r.age):'—'}</td>
                <td data-label="Withdrawal">{r.withdraw?<span style={{color:'var(--critical)'}}>{m(-r.withdraw, r.age)}</span>:'—'}</td>
                <td data-label="Market growth" className="bp-growth">{(function(){var w=r.withdraw||0;var g=(r.projected+r.contribution-w+r.growth)*bf(r.age+1)-r.projected*bf(r.age)-r.contribution*bf(r.age)+w*bf(r.age);return (g>=0?'+':'−')+gbpC(Math.abs(g));})()}</td>
                <td data-label="Status"><span className={'bp-status '+st[0]}>{st[1]}</span></td>
              </tr>
            ); })}
          </tbody>
        </table>
      </div>

      </details>
      </React.Fragment>)}
    </div>
  );
}

function shortEmail(e){ if(!e) return 'Account'; return e.length>18 ? e.slice(0,16)+'…' : e; }
/* password input with a Show/Hide reveal toggle — so people can check what they typed,
   which matters most on the "set a new password" step */
function PwInput({ value, onChange, placeholder, autoComplete, onKeyDown }){
  const [show, setShow] = useState(false);
  return (
    <div className="pw-wrap">
      <input className="auth-input" type={show?'text':'password'} placeholder={placeholder}
        value={value} onChange={onChange} autoComplete={autoComplete} onKeyDown={onKeyDown} />
      <button type="button" className="pw-eye" onClick={()=>setShow(s=>!s)}
        aria-label={show?'Hide password':'Show password'} title={show?'Hide password':'Show password'}>{show?'Hide':'Show'}</button>
    </div>
  );
}

/* Render a fixed overlay into <body>. The sticky top bar uses backdrop-filter, which makes it a
   containing block for position:fixed descendants — without this the modal is clipped to the bar. */
function inBody(node){
  if (typeof document !== 'undefined' && typeof ReactDOM !== 'undefined' && ReactDOM.createPortal) {
    return ReactDOM.createPortal(node, document.body);
  }
  return node;
}

/* =============================================================
   FEEDBACK — a suggestion box in the top bar
   -------------------------------------------------------------
   Open to everyone, signed in or not: the people whose feedback is
   most worth having are usually the ones who never made an account.
   Sends straight to public.feedback (migration 009), which is
   insert-anyone / read-admins-only, the same trust model as events.
   ============================================================= */
function FeedbackIcon(){
  /* a suggestion box: a slot-lid carton with a note going in */
  return (
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
         strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <path d="M3 10.5h18V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9.5Z" />
      <path d="M8.5 10.5V4.2a.7.7 0 0 1 .7-.7h5.6a.7.7 0 0 1 .7.7v6.3" />
      <path d="M10.6 6.1h2.8M10.6 8.1h2.8" />
      <path d="M7.4 10.5h9.2" />
    </svg>
  );
}

function FeedbackButton({ onOpen }){
  const [open, setOpen] = useState(false);
  const [msg, setMsg] = useState('');
  const [contact, setContact] = useState('');
  const [state, setState] = useState('idle');     // idle | sending | sent | error
  const [err, setErr] = useState('');
  const box = useRef(null);

  const close = () => { setOpen(false); setState('idle'); setErr(''); };

  useEffect(() => {
    if (!open) return;
    TRK.once('session', 'feedback_open');
    const t = setTimeout(() => { try { box.current && box.current.focus(); } catch(e){} }, 30);
    const esc = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', esc);
    return () => { clearTimeout(t); document.removeEventListener('keydown', esc); };
  }, [open]);

  // Enough about the device to make "the chart looks wrong" actionable, and
  // nothing that isn't already in the usage log except the browser string —
  // which is the single most useful thing for reproducing a layout bug.
  function context(){
    const c = {};
    try {
      c.tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      c.viewport = window.innerWidth + 'x' + window.innerHeight;
      c.standalone = !!((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                        || navigator.standalone === true);
      c.lang = navigator.language;
      c.ua = String(navigator.userAgent || '').slice(0, 300);
    } catch(e){}
    return c;
  }

  async function send(){
    const text = msg.trim();
    if (text.length < 2) { setErr('Add a little more and it’ll go through.'); setState('error'); return; }
    setState('sending'); setErr('');
    const row = {
      message: text.slice(0, 4000),
      contact: contact.trim() ? contact.trim().slice(0, 200) : null,
      device_kind: (function(){ const w = Math.min(window.innerWidth || 1024,
        (window.screen && window.screen.width) || 1024);
        return w < 768 ? 'mobile' : w < 1024 ? 'tablet' : 'desktop'; })(),
      props: context()
    };
    try {
      const C = window.OptCloud;
      if (C && C.client) {
        // the signed-in case carries the auth token, so the row is attributed
        const u = C.getUser && C.getUser();
        if (u && u.id) row.user_id = u.id;
        try { row.device_id = localStorage.getItem('ff.did') || null; } catch(e){}
        const r = await C.client.from('feedback').insert(row);
        if (r.error) throw new Error(r.error.message);
      } else {
        throw new Error('offline');
      }
      TRK.ev('feedback_sent');
      setState('sent'); setMsg(''); setContact('');
    } catch(e){
      setState('error');
      setErr('That didn’t send — you may be offline. Your note is still in the box, so try again in a moment.');
    }
  }

  return (
    <React.Fragment>
      <button className="burger fb-btn" aria-label="Send feedback" title="Send feedback"
        onClick={() => { if (onOpen) onOpen(); setOpen(true); }}><FeedbackIcon /></button>
      {open && inBody(
        <div className="auth-overlay" onMouseDown={e => { if (e.target === e.currentTarget) close(); }}>
          <div className="auth-modal" role="dialog" aria-modal="true" aria-label="Send feedback">
            <button className="auth-x" onClick={close} aria-label="Close">×</button>
            {state === 'sent' ? (
              <React.Fragment>
                <h3 className="auth-title">Thank you — that’s landed</h3>
                <p className="auth-sub">Genuinely useful. If you left an email address and it needs a
                  reply, you’ll get one.</p>
                <button className="btn primary" style={{ width:'100%' }} onClick={close}>Close</button>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <h3 className="auth-title">Tell me what you think</h3>
                <p className="auth-sub">What’s confusing, what’s missing, what’s wrong. It goes straight
                  to the person who built it.</p>
                {err && <div className="auth-msg err">{err}</div>}
                <textarea ref={box} className="auth-input fb-text" rows={5} value={msg}
                  maxLength={4000} placeholder="Anything at all…"
                  onChange={e => { setMsg(e.target.value); if (state === 'error') setState('idle'); }} />
                <input className="auth-input" type="email" value={contact} maxLength={200}
                  placeholder="Email (optional, only if you’d like a reply)"
                  onChange={e => setContact(e.target.value)} />
                <button className="btn primary" style={{ width:'100%' }}
                  disabled={state === 'sending'} onClick={send}>
                  {state === 'sending' ? 'Sending…' : 'Send'}</button>
                <p className="fb-fine">Sent with the date, your browser and screen size, and your account
                  if you’re signed in — so a problem can actually be reproduced. Nothing from your plan
                  is included.</p>
              </React.Fragment>
            )}
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function AuthButton(props){
  const Cloud = typeof window !== 'undefined' ? window.OptCloud : null;
  const [user, setUser] = useState(() => (Cloud && Cloud.user) || null);
  const [status, setStatus] = useState(() => (Cloud && Cloud.status) || 'idle');
  const [open, setOpen] = useState(false);
  const [recovery, setRecovery] = useState(false);   // arrived from a reset-password email
  const [mode, setMode] = useState('link');          // 'link' | 'password'
  const [signup, setSignup] = useState(false);
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);              // {type:'ok'|'err', text}
  // account-panel fields
  const [accName, setAccName] = useState('');
  const [accEmail, setAccEmail] = useState('');
  const [accPw, setAccPw] = useState('');

  useEffect(() => {
    if (!Cloud) return;
    const onAuth = (e) => setUser(e.detail || null);
    const onStat = (e) => setStatus(e.detail || 'idle');
    const onRecovery = () => { setRecovery(true); setOpen(true); };
    window.addEventListener('optcloud:auth', onAuth);
    window.addEventListener('optcloud:status', onStat);
    window.addEventListener('optcloud:recovery', onRecovery);
    setUser(Cloud.user || null);
    setStatus(Cloud.status || 'idle');
    if (Cloud.recovery){ setRecovery(true); setOpen(true); }
    return () => {
      window.removeEventListener('optcloud:auth', onAuth);
      window.removeEventListener('optcloud:status', onStat);
      window.removeEventListener('optcloud:recovery', onRecovery);
    };
  }, []);

  // prefill the account panel whenever it opens for a signed-in user
  useEffect(() => {
    if (open && user){
      setAccName((user.user_metadata && user.user_metadata.full_name) || '');
      setAccEmail(user.email || '');
      setAccPw('');
    }
  }, [open, user]);

  if (!Cloud || !Cloud.available) return null;

  const close = () => { setOpen(false); setMsg(null); setPw(''); setAccPw(''); setBusy(false); };

  const submit = async () => {
    setMsg(null);
    if (!email || email.indexOf('@') < 0){ setMsg({type:'err', text:'Enter a valid email address.'}); return; }
    setBusy(true);
    try {
      if (mode === 'link'){
        const { error } = await Cloud.signInWithMagicLink(email);
        if (error) setMsg({type:'err', text:error.message});
        else setMsg({type:'ok', text:'Check your email — tap the link to sign in.'});
      } else {
        if (!pw || pw.length < 6){ setMsg({type:'err', text:'Password must be at least 6 characters.'}); setBusy(false); return; }
        if (signup){
          const { data, error } = await Cloud.signUpWithPassword(email, pw);
          if (error) setMsg({type:'err', text:error.message});
          else if (data && data.session){ TRK.once('device','register'); setMsg({type:'ok', text:'Account created — you’re in!'}); setTimeout(close, 900); }
          else { TRK.once('device','register'); setMsg({type:'ok', text:'Account created — check your email to confirm, then sign in.'}); }
        } else {
          const { error } = await Cloud.signInWithPassword(email, pw);
          if (error){
            var t = error.message || 'Sign-in failed.';
            if (/invalid login credentials/i.test(t))
              t = 'Email or password not recognised. New here? Switch to “Create account” below. If you first signed in with an email link, you don’t have a password yet — use “Email me a link” instead.';
            else if (/email not confirmed/i.test(t))
              t = 'Check your inbox and confirm your email first, then sign in.';
            setMsg({type:'err', text:t});
          }
          else { TRK.once('session','sign_in'); setMsg({type:'ok', text:'Signed in!'}); setTimeout(close, 700); }
        }
      }
    } catch(e){ setMsg({type:'err', text:String((e && e.message) || e)}); }
    setBusy(false);
  };

  const sendReset = async () => {
    setMsg(null);
    if (!email || email.indexOf('@') < 0){ setMsg({type:'err', text:'Enter your email above first.'}); return; }
    setBusy(true);
    try { const { error } = await Cloud.resetPassword(email);
      setMsg(error ? {type:'err', text:error.message} : {type:'ok', text:'Check your email for a link to reset your password.'});
    } catch(e){ setMsg({type:'err', text:String((e && e.message) || e)}); }
    setBusy(false);
  };

  const saveName = async () => {
    setMsg(null); setBusy(true);
    try { const { error } = await Cloud.updateUser({ data:{ full_name: accName.trim() } });
      setMsg(error ? {type:'err', text:error.message} : {type:'ok', text:'Name saved.'});
    } catch(e){ setMsg({type:'err', text:String((e && e.message) || e)}); }
    setBusy(false);
  };
  const saveEmail = async () => {
    setMsg(null);
    if (!accEmail || accEmail.indexOf('@') < 0){ setMsg({type:'err', text:'Enter a valid email address.'}); return; }
    if (accEmail.trim() === (user && user.email)){ setMsg({type:'ok', text:'That’s already your email.'}); return; }
    setBusy(true);
    try { const { error } = await Cloud.updateUser({ email: accEmail.trim() });
      setMsg(error ? {type:'err', text:error.message} : {type:'ok', text:'Almost there — check your inbox to confirm the new address.'});
    } catch(e){ setMsg({type:'err', text:String((e && e.message) || e)}); }
    setBusy(false);
  };
  const savePassword = async () => {
    setMsg(null);
    if (!accPw || accPw.length < 6){ setMsg({type:'err', text:'Password must be at least 6 characters.'}); return; }
    setBusy(true);
    try { const { error } = await Cloud.updateUser({ password: accPw });
      if (error) setMsg({type:'err', text:error.message});
      else { setMsg({type:'ok', text:'Password updated.'}); setAccPw(''); }
    } catch(e){ setMsg({type:'err', text:String((e && e.message) || e)}); }
    setBusy(false);
  };
  const setRecoveryPassword = async () => {
    setMsg(null);
    if (!accPw || accPw.length < 6){ setMsg({type:'err', text:'Password must be at least 6 characters.'}); return; }
    setBusy(true);
    try { const { error } = await Cloud.updateUser({ password: accPw });
      if (error){ setMsg({type:'err', text:error.message}); setBusy(false); }
      else { setMsg({type:'ok', text:'Password set — signing you in…'}); setTimeout(()=>{ try{ location.reload(); }catch(e){} }, 1100); }
    } catch(e){ setMsg({type:'err', text:String((e && e.message) || e)}); setBusy(false); }
  };

  const doSignOut = async () => { setBusy(true); await Cloud.signOut(); setBusy(false); close(); };

  const statusLabel = status==='saving' ? 'Saving…' : status==='saved' ? 'Saved ✓' : status==='error' ? 'Save failed — will retry' : '';
  const btnLabel = user ? ('☁ ' + shortEmail((user.user_metadata && user.user_metadata.full_name) || user.email)) : '☁ Sign in';
  const msgBox = msg ? <div className={'auth-msg ' + (msg.type==='err'?'err':'ok')}>{msg.text}</div> : null;

  return (
    <React.Fragment>
      <button className="btn" onClick={()=>{ if (props && props.onOpen) props.onOpen(); setOpen(true); }} title={user ? 'Your account' : 'Sign in to save your projections across devices'}>
        {btnLabel}
      </button>
      {open && inBody(
        <div className="auth-overlay" onClick={close}>
          <div className="auth-modal" onClick={(e)=>e.stopPropagation()}>
            <button className="auth-x" onClick={close} aria-label="Close">×</button>

            {recovery ? (
              <div>
                <h3 className="auth-title">Set a new password</h3>
                <p className="auth-sub">Choose a new password{user && user.email ? (' for ' + user.email) : ''}.</p>
                <PwInput placeholder="New password (6+ characters)" value={accPw}
                  onChange={(e)=>setAccPw(e.target.value)} autoComplete="new-password"
                  onKeyDown={(e)=>{ if(e.key==='Enter') setRecoveryPassword(); }} />
                {msgBox}
                <button className="btn primary auth-go" disabled={busy} onClick={setRecoveryPassword}>{busy ? 'Working…' : 'Set password'}</button>
              </div>
            ) : user ? (
              <div>
                <h3 className="auth-title">Your account</h3>
                <p className="auth-sub">{statusLabel ? ('Projections sync: ' + statusLabel) : 'Your projections sync to your account automatically as you edit.'}</p>
                <div className="acc-divider"></div>

                <div className="acc-sec">
                  <label className="acc-label">Display name</label>
                  <div className="acc-row">
                    <input className="auth-input" type="text" placeholder="Your name (optional)" value={accName} onChange={(e)=>setAccName(e.target.value)} />
                    <button className="btn" disabled={busy} onClick={saveName}>Save</button>
                  </div>
                </div>

                <div className="acc-sec">
                  <label className="acc-label">Email</label>
                  <div className="acc-row">
                    <input className="auth-input" type="email" value={accEmail} onChange={(e)=>setAccEmail(e.target.value)} autoComplete="email" />
                    <button className="btn" disabled={busy} onClick={saveEmail}>Update</button>
                  </div>
                </div>

                <div className="acc-sec">
                  <label className="acc-label">Change password</label>
                  <div className="acc-row">
                    <PwInput placeholder="New password (6+ characters)" value={accPw} onChange={(e)=>setAccPw(e.target.value)} autoComplete="new-password" />
                    <button className="btn" disabled={busy} onClick={savePassword}>Update</button>
                  </div>
                </div>

                {msgBox}
                <button className="btn acc-signout" disabled={busy} onClick={doSignOut}>Sign out</button>
              </div>
            ) : (
              <div>
                <h3 className="auth-title">Save your projections</h3>
                <p className="auth-sub">Create a free account (or sign in) to keep your inputs and open them on any device. Optional — the tool works fine without it, and your data stays in this browser until you do.</p>
                <div className="auth-seg">
                  <button className={mode==='link'?'on':''} onClick={()=>{setMode('link'); setMsg(null);}}>Email me a link</button>
                  <button className={mode==='password'?'on':''} onClick={()=>{setMode('password'); setMsg(null);}}>Use a password</button>
                </div>
                <input className="auth-input" type="email" placeholder="you@example.com" value={email} onChange={(e)=>setEmail(e.target.value)} autoComplete="email"
                  onKeyDown={(e)=>{ if(e.key==='Enter' && mode==='link') submit(); }} />
                {mode==='password' && (
                  <PwInput placeholder="Password (6+ characters)" value={pw} onChange={(e)=>setPw(e.target.value)}
                    autoComplete={signup?'new-password':'current-password'} onKeyDown={(e)=>{ if(e.key==='Enter') submit(); }} />
                )}
                {msgBox}
                <button className="btn primary auth-go" disabled={busy} onClick={submit}>
                  {busy ? 'Working…' : mode==='link' ? 'Send magic link' : signup ? 'Create account' : 'Sign in'}
                </button>
                {mode==='password' && (
                  <button className="auth-link" onClick={()=>{setSignup(!signup); setMsg(null);}}>
                    {signup ? 'Have an account? Sign in' : 'New here? Create an account'}
                  </button>
                )}
                {mode==='password' && !signup && (
                  <button className="auth-link" style={{marginTop:8, color:'var(--muted)'}} onClick={sendReset}>Forgot password?</button>
                )}
              </div>
            )}
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

/* ============================================================= */
/* =============================================================
   MORTGAGE OVERPAYMENT vs INVESTING — side calculator
   -------------------------------------------------------------
   Simple answer on top, serious model underneath. The module has
   to answer three things almost immediately:
     1. which option could leave me wealthier?
     2. what do I get in exchange for overpaying?  (time)
     3. how good do returns need to be before investing wins?
   Everything else is supporting evidence and progressively
   discloses underneath. It must never declare a "winner".
   ============================================================= */
function MortgageModule({ mp, setMp, plan, C, inheritedGrowth, inflation, onClose }) {
  const narrow = useIsNarrow();
  const pc = (x, dp) => (x == null ? '—' : (x * 100).toFixed(dp == null ? 1 : dp) + '%');
  /* the gap is an estimate off assumed returns — £100s of precision would be false precision */
  const round100 = (x) => Math.round(Math.abs(x) / 100) * 100;
  const sgn = (v) => (v < 0 ? '−' + gbpC(-v) : gbpC(v));
  const spanStr = (months, compact) => {
    if (months == null) return '—';
    const y = Math.floor(months / 12), m = months % 12;
    if (compact) return (y ? y + 'y ' : '') + (m ? m + 'm' : (y ? '' : '0m'));
    const p = [];
    if (y) p.push(y + ' year' + (y === 1 ? '' : 's'));
    if (m) p.push(m + ' month' + (m === 1 ? '' : 's'));
    return p.length ? p.join(' ') : '0 months';
  };
  const dateIn = (months) => {
    if (months == null) return '—';
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + months);
    return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  };
  const H = plan.horizonYears;
  const horizonLabel = H === 1 ? '1 year' : H + ' years';
  const endDate = dateIn(plan.months);
  const todayEquiv = (v) => v / Math.pow(1 + (inflation || 0), H);
  const winsInvest = plan.winner === 'invest';
  const level = plan.ready && Math.abs(plan.diff) < 100;
  const earlier = plan.termCutMonths != null && plan.termCutMonths > 0;
  const capEarly = (plan.spareAnnualTotal || 0) > (mp.overpayLimitPct || 0) * (mp.balance || 0);

  return (
    <div className="mortgage-module">
      <div className="bp-topline">
        <div>
          <h3 className="bp-title">Mortgage or invest?</h3>
          <div className="mo-strap">The same spare cash, two uses — more wealth, or a mortgage gone sooner.</div>
        </div>
        <button className="btn subtle mo-hide" onClick={onClose}>✕ Close</button>
      </div>

      {/* ---- 1) YOUR NUMBERS — fill it in, then read the answer ---- */}
      <div className="bp-sub" style={{ marginTop: 16 }}>Your numbers</div>
      <div className="bp-assump">
        <div className="bp-fld"><label>Mortgage balance</label><BpNum money value={mp.balance} step={1000} onChange={v => setMp({ balance: v })} /></div>
        <div className="bp-fld"><label>Interest rate</label><BpNum pct value={+(mp.rate * 100).toFixed(2)} step="0.1" onChange={v => setMp({ rate: (v || 0) / 100 })} /></div>
        <div className="bp-fld"><label>Years left</label><BpNum value={mp.termYears} step="1" onChange={v => setMp({ termYears: v })} />
          <div className="bp-hint">Payment {gbp(plan.payment)}/month{mp.payment > 0 ? '' : ' (calculated)'}</div></div>
        <div className="bp-fld"><label>Spare cash available</label><BpNum money value={mp.spare} step={100} onChange={v => setMp({ spare: v })} />
          <div className="bp-seg sm" style={{ marginTop: 6 }}>
            <button className={mp.spareFreq === 'monthly' ? 'on' : ''} onClick={() => setMp({ spareFreq: 'monthly' })}>a month</button>
            <button className={mp.spareFreq !== 'monthly' ? 'on' : ''} onClick={() => setMp({ spareFreq: 'annual' })}>a year</button>
          </div>
        </div>
      </div>
      <div className="bp-tgroup" style={{ marginTop: 16 }}><span className="tl">Compare over</span>
        <div className="bp-seg sm">
          {[['term', 'Full term'], ['5', '5 years'], ['10', '10 years'], ['20', '20 years'], ['custom', 'Custom']].map(function (o) {
            return <button key={o[0]} className={(mp.horizonMode || 'term') === o[0] ? 'on' : ''} onClick={() => setMp({ horizonMode: o[0] })}>{o[1]}</button>;
          })}
        </div>
      </div>
      {(mp.horizonMode === 'custom') && <div className="bp-fld" style={{ marginTop: 10, maxWidth: 200 }}><label>Years to compare over</label>
        <BpNum value={mp.horizonYears} step="1" onChange={v => setMp({ horizonYears: Math.max(1, Math.round(v)) })} /></div>}
      {/* Its own name, not open_advanced. The two planners use that one, and a
          single row labelled "Opened advanced assumptions" counting both could
          never be separated again afterwards. */}

      {!plan.ready ? (
        <div className="mo-hero"><div className="v waiting">{plan.need}</div></div>
      ) : (
      <React.Fragment>

        {/* ---- 2) THE ANSWER, then the two paths that produce it ----
             ⚠️ THE ARITHMETIC RULE FOR THESE BOXES. Each side ends at what you
             would be worth: the pot you have built, MINUS any mortgage still
             owed. The difference between those two totals is the headline, at
             every horizon — that identity is what makes the boxes trustworthy,
             and it is asserted in /root/mortgagechart.js.

             Do NOT add "interest saved" into the overpay total. It is already
             inside that path's contributions: saving the interest is what clears
             the mortgage early, and clearing early is what frees the payment up
             to invest. Adding it again counts the same benefit twice — on the
             default figures it turns a £16,147 win for investing into a £4,719
             win for overpaying, i.e. it flips the answer. It is shown as the
             line that EXPLAINS the bigger contributions, not as an addend. */}
        <div className="mo-hero">
          <div className="v">{level
            ? 'Neither option is clearly ahead'
            : (winsInvest ? 'Investing' : 'Overpaying the mortgage')
              + ' could leave you ' + gbp(round100(plan.diff)) + ' better off'}</div>
          <div className="sub">{level
            ? 'The two finish within £100 of each other over ' + horizonLabel + ', on these assumptions.'
            : 'by ' + endDate + ' · ≈ ' + gbp(round100(todayEquiv(plan.diff))) + ' in today’s money'}
            {earlier ? ' · overpaying clears the mortgage ' + spanStr(plan.termCutMonths, true)
                       + ' sooner (' + dateIn(plan.payoffMonthsOverpay) + ', not ' + dateIn(plan.payoffMonths) + ')' : ''}</div>
        </div>

        {(function () {
          const oGrowth = plan.overpay.investments - plan.overpay.contributions;
          const spareM  = (plan.spareAnnualTotal || 0) / 12;
          const clearedInWindow = plan.overpay.freedInvested > 0;
          const monthsAfter = plan.payoffMonthsOverpay != null
            ? Math.max(0, plan.months - plan.payoffMonthsOverpay) : 0;
          // ⚠️ "£881/month × the months after payoff" does NOT always equal what
          // the overpaying path paid in. Spare cash the lender won't accept is
          // invested from day one instead, and when the allowance really bites
          // that is most of it — £80,606 of a £307,564 total on one test shape.
          // Show it as its own step when it is material, or the sum won't add up.
          const preInvested = Math.max(0, plan.overpay.contributions - plan.monthlyAfterPayoff * monthsAfter);
          const capMatters  = preInvested > Math.max(250, plan.overpay.contributions * 0.02);
          return (
        <React.Fragment>
        {/* Each path as a short numbered journey. The job of these cards is to
            make the STRATEGY understandable in about five seconds, not to
            reconcile the arithmetic — the year-by-year table below does that.
            ⚠️ Interest saved is deliberately NOT on these cards. It is a real
            benefit but it is not a pot, and sitting next to "£69k invested" it
            invites exactly the addition the whole design is trying to prevent.
            It lives in the paragraph underneath and in the table, where there is
            room to say what it actually is. */}
        <div className="mo-cols mo-flows">

          {/* ---- INVEST ---- */}
          <div className="mo-flow">
            <h4><span className="cd" style={{ background: C.isa }}></span>Invest {gbp(Math.round(spareM))}/month</h4>
            <ol className="mo-jn">
              <li>
                <div className="t">Put your spare cash into investments</div>
                <div className="big">{gbp(Math.round(spareM))}/month</div>
                <div className="s">on top of your normal {gbp(Math.round(plan.payment))} mortgage payment</div>
              </li>
              <li>
                <div className="t">Your mortgage runs its full term</div>
                <div className="big sm">{plan.invest.balance > 1
                  ? 'Still running at ' + endDate
                  : 'Mortgage-free ' + dateIn(plan.payoffMonths)}</div>
                {plan.invest.balance > 1 && <div className="s">clears {dateIn(plan.payoffMonths)}</div>}
              </li>
            </ol>
            <div className="mo-out">
              <div className="w">By {endDate}</div>
              <div className="hero">{gbpC(plan.invest.investments)} invested</div>
              <div className="s">≈ {gbpC(todayEquiv(plan.invest.investments))} in today’s money</div>
              <div className="s">{gbpC(plan.invest.contributions)} paid in · {gbpC(plan.invest.growthAmount)} investment growth</div>
              {plan.invest.balance > 1 && <div className="s">Mortgage still owed {gbpC(plan.invest.balance)} — you’d
                be worth {sgn(plan.invest.net)}</div>}
            </div>
          </div>

          {/* ---- OVERPAY ---- */}
          <div className="mo-flow">
            <h4><span className="cd" style={{ background: C.pension }}></span>Overpay {gbp(Math.round(spareM))}/month</h4>
            <ol className="mo-jn">
              <li>
                <div className="t">Put your spare cash into the mortgage</div>
                <div className="big">{gbp(Math.round(spareM))}/month extra</div>
                <div className="s">on top of your normal {gbp(Math.round(plan.payment))} mortgage payment</div>
                {capMatters && <div className="s">Your lender won’t take all of it — {gbpC(preInvested)} is
                  above the allowance, so that part is invested from the start</div>}
              </li>
              <li>
                <div className="t">{clearedInWindow ? 'Your mortgage is cleared early' : 'Your mortgage clears earlier'}</div>
                <div className="big">{clearedInWindow
                  ? 'Mortgage-free ' + dateIn(plan.payoffMonthsOverpay)
                  : 'Clears ' + dateIn(plan.payoffMonthsOverpay)}</div>
                <div className="s">{earlier
                  ? spanStr(plan.termCutMonths) + ' sooner'
                  : 'no sooner — your overpayments are capped'}{clearedInWindow ? '' : ', after this window'}</div>
              </li>
              {clearedInWindow && <li>
                <div className="t">Invest the money you’ve freed up</div>
                <div className="s">Once the mortgage is gone, the money that was going towards it is
                  available to invest:</div>
                <div className="mo-sum">
                  <div><span className="op"></span><span>{gbp(Math.round(plan.payment))} old mortgage payment</span></div>
                  <div><span className="op">+</span><span>{gbp(Math.round(spareM))} spare cash</span></div>
                  <div className="tot"><span className="op">=</span><b>{gbp(Math.round(plan.monthlyAfterPayoff))}/month invested</b></div>
                </div>
                <div className="s">for the remaining {spanStr(monthsAfter)}</div>
              </li>}
            </ol>
            <div className="mo-out">
              <div className="w">By {endDate}</div>
              <div className="hero">{gbpC(plan.overpay.investments)} invested</div>
              <div className="s">≈ {gbpC(todayEquiv(plan.overpay.investments))} in today’s money</div>
              <div className="s">{gbpC(plan.overpay.contributions)} paid in · {gbpC(oGrowth)} investment growth</div>
              {plan.overpay.balance > 1 && <div className="s">Mortgage still owed {gbpC(plan.overpay.balance)} — you’d
                be worth {sgn(plan.overpay.net)}</div>}
            </div>
          </div>
        </div>

        {/* One paragraph doing the whole job: what overpaying buys you, and why
            the interest saved must not be added to the pot next to it. The
            "vs" strip that used to sit here said the same things in less
            English, and the figures are all in the cards above anyway. */}
        <div className="mo-key">
          {(function () {
            const saved = gbp(round100(plan.interestSaved));
            const pot   = gbp(round100(plan.overpay.investments));
            const perM  = gbp(Math.round(plan.monthlyAfterPayoff));
            if (clearedInWindow) {
              return <span>Overpaying saves <b>{saved}</b> of interest{earlier
                ? <span> and clears the mortgage <b>{spanStr(plan.termCutMonths)}</b> sooner</span>
                : <span></span>}. That {saved} isn’t extra money to add to the {pot} investment
                pot — it’s what helps clear the mortgage early, freeing up <b>{perM} a month</b> to
                invest from then on.</span>;
            }
            // the mortgage is still running at the comparison date, so nothing has
            // been freed up yet — don't describe a windfall that hasn't happened
            return <span>Overpaying has saved <b>{saved}</b> of interest so far{earlier
              ? <span> and puts the mortgage on course to clear <b>{spanStr(plan.termCutMonths)}</b> sooner</span>
              : <span></span>}. That {saved} isn’t extra money to add to the {pot} investment
              pot — it’s what shrinks the balance faster, and once the mortgage is gone it frees
              up <b>{perM} a month</b> to invest.</span>;
          })()}
        </div>
        </React.Fragment>
          );
        })()}

      <details className="bp-collapse" onToggle={TRK.open('mortgage_advanced')}><summary className="bp-sub bp-summary">Adjust assumptions</summary>
      <div>
        <div className="bp-assump" style={{ marginTop: 4 }}>
          <div className="bp-fld"><label>Your monthly payment</label>
            <BpNum money value={mp.payment != null ? mp.payment : ''} step={50} onChange={v => setMp({ payment: v > 0 ? v : null })} />
            <div className="bp-hint">{mp.payment > 0
              ? (plan.paymentTooLow ? 'That doesn’t cover the interest — using ' + gbp(plan.derivedPayment) + ' instead.' : 'Leave blank to use the calculated ' + gbp(plan.derivedPayment) + '.')
              : 'Blank = calculated from the balance, rate and term.'}</div></div>
          <div className="bp-fld"><label>Overpayment allowance</label><BpNum pct value={+((mp.overpayLimitPct || 0) * 100).toFixed(1)} step="1" onChange={v => setMp({ overpayLimitPct: (v || 0) / 100 })} />
            <div className="bp-hint">% of the balance each year, penalty-free. 0 = no limit.</div></div>
          <div className="bp-fld"><label>Investment fee</label><BpNum pct value={+((mp.fee || 0) * 100).toFixed(2)} step="0.05" onChange={v => setMp({ fee: (v || 0) / 100 })} />
            <div className="bp-hint">Platform + fund charges, taken off the return.</div></div>
          <div className="bp-fld"><label>Rate changes to</label><BpNum pct value={mp.rateChangeTo != null ? +(mp.rateChangeTo * 100).toFixed(2) : ''} step="0.1"
            onChange={v => setMp({ rateChangeTo: v > 0 ? v / 100 : null })} />
            <div className="bp-hint">Optional — e.g. when a fix ends.</div></div>
          <div className="bp-fld"><label>…after</label><BpNum value={mp.rateChangeAfterYears != null ? mp.rateChangeAfterYears : ''} step="1"
            onChange={v => setMp({ rateChangeAfterYears: v > 0 ? Math.round(v) : null })} suffix="yrs" />
            <div className="bp-hint">The payment is then recalculated over the remaining term.</div></div>
        </div>
        <div className="bp-note">The expected return is <b>{pc(plan.growth)}</b> nominal, and the lower / higher cases are
          your Conservative and Optimistic scenarios — inherited from the planners above rather than a second set of
          assumptions to keep in step. Change them there.</div>
      </div>
      </details>

        {/* ---- 4) THE CHART — the two GAINS, both starting at zero.
             ⚠️ Do not put net position back on here. Net wealth starts at minus
             the whole mortgage, so the axis runs from about −£200k and the few
             thousand pounds the decision is actually worth becomes an invisible
             hairline near the top. Cash conservation makes (growth − interest
             saved) identical to the net-wealth gap, so this chart answers the
             same question at a scale you can actually read.
             The net positions are still on the page — they are the end of each
             row in "How the two run" just below. */}
        <div className="bp-chart">
          {ResponsiveContainer ? (
          <ResponsiveContainer width="100%" height={narrow ? 230 : 290}>
            <LineChart data={plan.series} margin={{ top: 26, right: 14, left: narrow ? 0 : 8, bottom: 2 }}>
              <CartesianGrid stroke={C.grid} vertical={false} />
              <XAxis dataKey="year" type="number" domain={[0, H]} stroke={C.axis}
                tick={{ fontSize: narrow ? 10 : 11, fill: C.axis }} tickLine={false}
                axisLine={{ stroke: C.baseline }} minTickGap={narrow ? 26 : 8} interval="preserveStartEnd" />
              <YAxis stroke={C.axis} tick={{ fontSize: narrow ? 10 : 11, fill: C.axis }} tickLine={false}
                axisLine={false} tickFormatter={gbpC} width={narrow ? 54 : 56} tickCount={narrow ? 4 : 6} />
              <Tooltip content={<ChartTip lbl="Year" />} trigger={narrow ? 'click' : 'hover'} />
              {plan.crossover && <ReferenceLine x={Math.round((plan.crossover.month / 12) * 10) / 10} stroke={C.good} strokeDasharray="4 3" strokeWidth={1.5}
                label={{ value: (plan.crossover.winner === 'invest' ? 'Investing ahead' : 'Overpaying ahead') + ' — year ' + Math.round(plan.crossover.month / 12),
                         position: 'insideTopLeft', fill: C.good, fontSize: narrow ? 10 : 11, fontWeight: 700 }} />}
              <Line type="monotone" dataKey="growth" name="Investment growth" stroke={C.isa} strokeWidth={2.6} dot={false} />
              <Line type="monotone" dataKey="saved" name={plan.overpay.investments - plan.overpay.contributions > 1
                ? 'Interest saved + growth' : 'Interest saved by overpaying'} stroke={C.pension} strokeWidth={2.6} dot={false} />
              {/* the lines often only part company near the end — mark where they finish */}
              <ReferenceDot x={H} y={plan.investGain} r={4} fill={C.isa} stroke="none" isFront={true} />
              <ReferenceDot x={H} y={plan.overpayGain} r={4} fill={C.pension} stroke="none" isFront={true} />
            </LineChart>
          </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
          {/* The figure strip and the explainer that sat here are gone: the
              series are named in the tooltip, the cards above carry the totals,
              and "Year by year" below is the audit trail. */}
        </div>

        {/* ---- YEAR BY YEAR — the whole comparison, line by line.
             The two "Interest paid" columns are the point: the gap between them
             IS the interest saved. Seeing it as a cost that one path pays and
             the other doesn't is what makes clear it is money never spent, not a
             second pot sitting somewhere waiting to be added on. */}
        <details className="bp-collapse" onToggle={TRK.open('view_projection')}>
        <summary className="bp-sub bp-summary">Year by year</summary>
        <div>
          <div className="desc" style={{ marginTop: 0, marginBottom: 10 }}>Everything each strategy owes,
            holds and has paid in interest, at the end of every year. Cash terms, as entered.</div>
          <div className="tablewrap cards" style={{ maxHeight: 460 }}>
            <table>
              <thead>
                {/* Invest first, matching the cards and the chart — the colours
                    and the sides mean the same thing everywhere on the page */}
                <tr className="grouprow"><th></th>
                  <th colSpan={3} className="grp grp-a">Invest the spare cash</th>
                  <th colSpan={3} className="grp grp-p">Overpay the mortgage</th>
                  <th></th></tr>
                <tr><th>Year</th>
                  <th>Owed</th><th>Invested</th><th>Interest paid</th>
                  <th>Owed</th><th>Invested</th><th>Interest paid</th>
                  <th>Difference</th></tr>
              </thead>
              <tbody>
                {plan.series.map(function (r, i) {
                  const d = (r.invest || 0) - (r.overpay || 0);   // + = investing ahead
                  return (
                  <tr key={i}>
                    <td data-label="Year">{r.year}</td>
                    <td data-label="Invest owed">{r.debtInvest > 0 ? gbpC(r.debtInvest) : <span className="muted">cleared</span>}</td>
                    <td data-label="Invest invested">{gbpC(r.potInvest)}</td>
                    <td data-label="Invest interest paid">{gbpC(r.intInvest)}</td>
                    <td data-label="Overpay owed">{r.debtOverpay > 0 ? gbpC(r.debtOverpay) : <span className="muted">cleared</span>}</td>
                    <td data-label="Overpay invested">{gbpC(r.potOverpay)}</td>
                    <td data-label="Overpay interest paid">{gbpC(r.intOverpay)}</td>
                    <td data-label="Difference">{Math.abs(d) < 100
                      ? <span className="muted">level</span>
                      : (d > 0 ? '+' : '−') + gbpC(Math.abs(d)) + (narrow ? '' : d > 0 ? ' inv' : ' ovp')}</td>
                  </tr>);
                })}
              </tbody>
            </table>
          </div>
          <div className="bp-note" style={{ marginTop: 8 }}>“Invested” is what that strategy is holding;
            “Owed” is what is left on the mortgage. <b>Difference</b> is what you would be worth on one path
            against the other — investments minus the mortgage — so <b>+</b> means investing is ahead
            and <b>−</b> means overpaying is.
            {plan.overpay.balance <= 1 && plan.invest.balance <= 1
              ? <span> The two <b>Interest paid</b> columns end {gbpC(plan.interestSaved)} apart, and
                that gap is the interest overpaying avoided. It is a cost never incurred, which is why it
                is not added to the pot on the right of it.</span>
              : <span> The two <b>Interest paid</b> columns are {gbpC(plan.interestSaved)} apart so
                far — that gap is the interest overpaying has avoided to date. It is a cost never incurred,
                not a pot to add on.</span>}</div>
        </div>
        </details>

        {/* The old "How the two run" timeline lived here. The two flow cards
             above now tell that story with the money attached, so keeping it was
             the same journey said twice. */}
        <div className="bp-note" style={{ marginTop: 2 }}><b>What happens when the mortgage is paid off?</b> We don’t
          stop the comparison there. Once your mortgage is cleared we assume you invest both the payment you’ve freed
          up and your spare cash, until the original mortgage end date. That keeps the amount leaving your pocket the
          same under either strategy.</div>

        {/* ---- 6) SENSITIVITY — inherited assumptions, not a new set of controls ---- */}
        <div className="bp-sub">What if returns differ?</div>
        <div className="bp-stress-lines">
          {plan.sensitivity.map(function (s, i) {
            return (
              <div className="ssl" key={i}>
                <span className="k">{pc(s.growth)} a year{s.key === 'central' ? <span className="muted"> · your assumption</span> : ''}</span>
                <span className="v">{Math.abs(s.diff) < 100
                  ? 'line-ball'
                  : narrow
                    ? (s.winner === 'invest' ? 'invest +' : 'overpay +') + gbp(round100(s.diff))
                    : (s.winner === 'invest' ? 'investing ahead by ' : 'overpaying ahead by ') + gbp(round100(s.diff))}</span>
              </div>
            );
          })}
        </div>

        {/* ---- 7) CERTAINTY vs POTENTIAL — short ---- */}
        <div className="bp-sub">Certainty vs potential return</div>
        <div className="mo-tradeoff">
          <div className="mo-col">
            <h4><span className="cd" style={{ background: C.isa }}></span>Invest</h4>
            <ul>
              <li>Higher potential return</li>
              <li>Money remains accessible</li>
              <li>Returns are uncertain</li>
            </ul>
          </div>
          <div className="mo-col">
            <h4><span className="cd" style={{ background: C.pension }}></span>Overpay</h4>
            <ul>
              <li>Guaranteed interest saving</li>
              <li>Mortgage-free sooner</li>
              <li>Money becomes less accessible</li>
            </ul>
          </div>
        </div>
        <div className="mo-key">This isn’t purely a maths question. Overpaying gives a <b>known</b> saving;
          investing gives an <b>uncertain</b> return with potentially greater upside.</div>

        {/* ---- 9) HOW THIS WORKS + the caveats ---- */}
        <details className="bp-collapse"><summary className="bp-sub bp-summary">How this works &amp; important assumptions</summary>
        <div>
          <div className="bp-note" style={{ marginTop: 2 }}><b>Monthly, in cash terms.</b> A mortgage is a cash debt,
            so the comparison runs in pounds of the day; the trade-off also shows the gap in today’s money. Both
            strategies spend the same each month — your payment plus the spare — to the original mortgage end date.
            Overpaying <b>shortens the term</b> rather than cutting the payment. Break-even is solved on the full
            model, so the allowance, the timing and the reinvested payments are all inside it — it isn’t your
            mortgage rate handed back to you. Mortgage interest is charged monthly on the quoted rate; investment
            returns are annual, which is why break-even sits a little above rate + fee.</div>
          <div className="assumptions" style={{ marginTop: 10 }}>
            <b>What this doesn’t model.</b> Early repayment charges — check your lender’s before overpaying a penny;
            many charge a percentage of the amount repaid during a fixed period. It assumes an <b>ISA</b>, so no tax
            on growth (a taxable account would need a tax-drag assumption — a later iteration), and it doesn’t cover
            offset or interest-only mortgages, product fees, remortgaging, or capital gains tax schedules.
            Overpayments are generally <b>irreversible</b> — money in the house isn’t money you can spend, and an
            emergency fund comes before either option.
          </div>
        </div>
        </details>
        <div className="mo-caveat">Investment returns aren’t guaranteed, and mortgage overpayments may be subject to
          lender limits or early repayment charges.</div>
      </React.Fragment>)}
    </div>
  );
}

function App() {
  const C = useColors();
  const narrow = useIsNarrow();
  const isAdmin = useIsAdmin();
  const install = useInstall();
  const [installHelp, setInstallHelp] = useState(false);
  const [inputs, setInputs] = useState(() => {
    let base = JSON.parse(JSON.stringify(Engine.DEFAULTS));
    try { const s = localStorage.getItem('optionality.inputs');
      if (s) base = Object.assign({}, JSON.parse(JSON.stringify(Engine.DEFAULTS)), JSON.parse(s)); } catch(e){}
    if (!Array.isArray(base.savingsPlan) || !base.savingsPlan.length) {
      base.savingsPlan = [{ fromYear:0, amount: base.annualSavings != null ? base.annualSavings : 10000,
        allocPension: base.allocPension != null ? base.allocPension : 0.30 }];
    }
    base.spendingInflationLinked = true; // spending always holds its real (today's-money) value
    return base;
  });
  const [dark, setDark] = useState(() => {
    try { return localStorage.getItem('optionality.dark') === '1'; } catch(e){ return false; }
  });
  const [showAllRows, setShowAllRows] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);   // mobile burger menu
  const [realTerms, setRealTerms] = useState(() => {
    try { const v = localStorage.getItem('optionality.realTerms'); return v==null ? true : v==='1'; } catch(e){ return true; }
  });

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    try { localStorage.setItem('optionality.dark', dark ? '1':'0'); } catch(e){}
  }, [dark]);
  useEffect(() => { try { localStorage.setItem('optionality.realTerms', realTerms?'1':'0'); } catch(e){} }, [realTerms]);
  useEffect(() => {
    try { localStorage.setItem('optionality.inputs', JSON.stringify(inputs)); } catch(e){}
  }, [inputs]);

  const [optMsg, setOptMsg] = useState(null);
  const set = (patch) => { setOptMsg(null); setInputs(prev => Object.assign({}, prev, patch)); };

  const optimiseSavings = () => {
    const res = Engine.optimisePlan(inputs);
    if (!res.changed) { setOptMsg({ ok:false, text:'Add some annual savings first, then I can optimise the split.' }); return; }
    const before = res.baselineAge, after = res.optionalityAge;
    setInputs(prev => Object.assign({}, prev, { savingsPlan: res.savingsPlan, plannedStopAge: null }));
    if (before != null && after != null && before - after > 0.05) {
      setOptMsg({ ok:true, text:'Optimised — earliest optionality age '+ageStr(before)+' → '+ageStr(after)+' ('+monthsStr(Math.round((before-after)*12))+' earlier). Applied the split year by year below.' });
    } else if (after != null) {
      setOptMsg({ ok:true, text:'Your allocation is already about optimal for the earliest age ('+ageStr(after)+'). I tidied the split below.' });
    } else {
      setOptMsg({ ok:false, text:'Even the best split can’t reach optionality with these assumptions — try saving more or spending less.' });
    }
  };

  // ISA/GIA Bridge Planner — independent inputs.
  //
  // It used to start from a worked example (35, £50k, £43k). It now starts
  // BLANK on the personal figures and keeps the shipped assumptions, so a new
  // visitor is asked for their numbers instead of being shown someone else's.
  // A saved plan still merges on top and is completely unaffected: every blob
  // ever written carries these fields, so nothing that exists gets cleared.
  const [bridgeInputs, setBridgeInputs] = useState(() => {
    let b = Engine.bridgeBlank();
    try { const s = localStorage.getItem('optionality.bridge');
      if (s) b = Object.assign({}, Engine.bridgeBlank(), JSON.parse(s)); } catch(e){}
    if (!Array.isArray(b.phases) || !b.phases.length) b.phases = Engine.bridgeBlank().phases;
    if (!b.scenarios) b.scenarios = JSON.parse(JSON.stringify(Engine.BRIDGE_DEFAULTS.scenarios));
    // migrate any previously-saved separate lump sum into a one-off phase
    if (b.lumpSum > 0 && b.lumpSumAge != null) {
      const exists = b.phases.some(p => p.fromAge === b.lumpSumAge && p.toAge === b.lumpSumAge && p.annual === b.lumpSum);
      if (!exists) b.phases = b.phases.concat([{ fromAge: b.lumpSumAge, toAge: b.lumpSumAge, annual: b.lumpSum }]);
    }
    delete b.lumpSum; delete b.lumpSumAge;
    delete b.targetAge;   // removed 2026-08-19 — it was display-only and fed nothing
    // one-time migration: turn on the drawdown showcase for saved states that pre-date it
    if (!b._bv || b._bv < 2) { b.drawdownFromOptionality = true; if (b.lifeExpectancy == null) b.lifeExpectancy = 90; b._bv = 2; }
    // one-time migration: bump the default nominal return 7% -> 9% (and the scenario bands), where untouched
    if (b._bv < 3) {
      if (b.growth === 0.07) b.growth = 0.09;
      if (b.scenarios) {
        if (b.scenarios.conservative && b.scenarios.conservative.growth === 0.05) b.scenarios.conservative.growth = 0.07;
        if (b.scenarios.optimistic && b.scenarios.optimistic.growth === 0.09) b.scenarios.optimistic.growth = 0.11;
      }
      b._bv = 3;
    }
    // one-time migration: make scenarios explicit return+inflation pairs (drop old wr/retirementAge overrides)
    if (b._bv < 4) {
      const ds = JSON.parse(JSON.stringify(Engine.BRIDGE_DEFAULTS.scenarios));
      const wasOn = b.scenarios || {};
      ds.conservative.enabled = !!(wasOn.conservative && wasOn.conservative.enabled);
      ds.optimistic.enabled = !!(wasOn.optimistic && wasOn.optimistic.enabled);
      b.scenarios = ds; b._bv = 4;
    }
    // one-time migration (v5): new house assumptions — base 7% / 2.5% / 3.5% wr;
    // scenarios 5%·3%·3% (cons) and 9%·2%·4% (opt). Bump untouched base values and
    // reset the scenario presets (preserving on-chart toggles).
    if (b._bv < 5) {
      if (b.growth === 0.09) b.growth = 0.07;
      if (b.withdrawalRate === 0.04) b.withdrawalRate = 0.035;
      const ds5 = JSON.parse(JSON.stringify(Engine.BRIDGE_DEFAULTS.scenarios));
      const was5 = b.scenarios || {};
      ds5.conservative.enabled = !!(was5.conservative && was5.conservative.enabled);
      ds5.optimistic.enabled = !!(was5.optimistic && was5.optimistic.enabled);
      b.scenarios = ds5; b._bv = 5;
    }
    // one-time migration (v6): sequence-risk minimum residual buffer at access
    if (b._bv < 6) { if (b.minResidual == null) b.minResidual = 0; b._bv = 6; }
    // one-time migration (v7): sequence-risk Phase 2 target confidence
    if (b._bv < 7) { if (b.confidence == null) b.confidence = 0.90; b._bv = 7; }
    return b;
  });
  useEffect(() => { try { localStorage.setItem('optionality.bridge', JSON.stringify(bridgeInputs)); } catch(e){} }, [bridgeInputs]);
  // ---- product analytics -------------------------------------------------
  // Every planner edit funnels through setBp/setCp, so one hook here covers
  // both planners and every field without sprinkling calls through the JSX.
  // Which planners this device has EVER filled in. This used to be page-local, so
  // `plan_completed` only fired if somebody did both halves in a single sitting —
  // fill in your pension on Tuesday and your ISA on Thursday and it never fired at
  // all, which is why so many people with a perfectly good plan read as Incomplete.
  const touched = useRef({ bridge: TRK.marked('touched_bridge'), coast: TRK.marked('touched_coast') });
  const dirty = useRef(false);
  const notePatch = (which, patch) => {
    const keys = Object.keys(patch || {});
    if (!keys.length) return;
    const core = which === 'bridge'
      ? ['currentAge','currentBalance','phases','targetIncome']
      : ['currentAge','currentPension','phases','targetIncome','targetPot'];
    if (keys.some(k => core.indexOf(k) >= 0)) {
      touched.current[which] = true;
      TRK.mark('touched_' + which);
      dirty.current = true;
      TRK.once('device','finances_entered');
    }
    if (keys.indexOf('phases') >= 0)       TRK.once('session','edit_savings');
    if (keys.indexOf('targetIncome') >= 0) TRK.once('session','edit_target_income');
    if (keys.indexOf('scenarios') >= 0)    TRK.once('session','scenario_toggle');
    if (keys.indexOf('growth') >= 0 || keys.indexOf('inflation') >= 0)
      TRK.once('session','edit_return_inflation');
  };

  const setBp = (patch) => { notePatch('bridge', patch); setBridgeInputs(prev => Object.assign({}, prev, patch)); };
  const bridge = useMemo(() => Engine.bridgePlan(bridgeInputs), [bridgeInputs]);

  // Pension Coast Planner — independent inputs, blank on the personal figures
  // for the same reason as the bridge above.
  const [coastInputs, setCoastInputs] = useState(() => {
    let c = Engine.coastBlank();
    try { const s = localStorage.getItem('optionality.coast');
      if (s) c = Object.assign({}, Engine.coastBlank(), JSON.parse(s)); } catch(e){}
    if (!Array.isArray(c.phases) || !c.phases.length) c.phases = Engine.coastBlank().phases;
    if (!c.scenarios) c.scenarios = JSON.parse(JSON.stringify(Engine.COAST_DEFAULTS.scenarios));
    // one-time migration: seed the State Pension for saved states that pre-date it
    if (!c._cv || c._cv < 2) { if (c.statePensionAmount == null) c.statePensionAmount = 11900; if (c.statePensionAge == null) c.statePensionAge = 67; c._cv = 2; }
    // one-time migration: bump the default nominal return 7% -> 9% (and the scenario bands), where untouched
    if (c._cv < 3) {
      if (c.growth === 0.07) c.growth = 0.09;
      if (c.scenarios) {
        if (c.scenarios.conservative && c.scenarios.conservative.growth === 0.05) c.scenarios.conservative.growth = 0.07;
        if (c.scenarios.optimistic && c.scenarios.optimistic.growth === 0.09) c.scenarios.optimistic.growth = 0.11;
      }
      c._cv = 3;
    }
    // one-time migration: make scenarios explicit return+inflation pairs (drop old wr/retirementAge overrides)
    if (c._cv < 4) {
      const ds = JSON.parse(JSON.stringify(Engine.COAST_DEFAULTS.scenarios));
      const wasOn = c.scenarios || {};
      ds.conservative.enabled = !!(wasOn.conservative && wasOn.conservative.enabled);
      ds.optimistic.enabled = !!(wasOn.optimistic && wasOn.optimistic.enabled);
      c.scenarios = ds; c._cv = 4;
    }
    // one-time migration (v5): new house assumptions — base 7% / 2.5% / 3.5% wr;
    // scenarios 5%·3%·3% (cons) and 9%·2%·4% (opt). Bump untouched base values and
    // reset the scenario presets (preserving on-chart toggles).
    if (c._cv < 5) {
      if (c.growth === 0.09) c.growth = 0.07;
      if (c.withdrawalRate === 0.04) c.withdrawalRate = 0.035;
      const ds5 = JSON.parse(JSON.stringify(Engine.COAST_DEFAULTS.scenarios));
      const was5 = c.scenarios || {};
      ds5.conservative.enabled = !!(was5.conservative && was5.conservative.enabled);
      ds5.optimistic.enabled = !!(was5.optimistic && was5.optimistic.enabled);
      c.scenarios = ds5; c._cv = 5;
    }
    // one-time migration (v6): sequence-risk fields for the pension drawdown
    if (c._cv < 6) { if (c.lifeExpectancy == null) c.lifeExpectancy = 90; if (c.minResidual == null) c.minResidual = 0; if (c.confidence == null) c.confidence = 0.90; c._cv = 6; }
    return c;
  });
  useEffect(() => { try { localStorage.setItem('optionality.coast', JSON.stringify(coastInputs)); } catch(e){} }, [coastInputs]);
  const setCp = (patch) => { notePatch('coast', patch); setCoastInputs(prev => Object.assign({}, prev, patch)); };
  const coast = useMemo(() => Engine.coastPlan(coastInputs), [coastInputs]);
  // ONE age for the whole page. It is asked for in both planners — whichever
  // you reach first — and a person only has one, so either field writes to
  // both models. Clearing it clears both, which is why null passes straight
  // through instead of being rounded into a 0.
  const setAge = (v) => { const a = isSet(v) ? Math.round(v*10)/10 : null;
    setBp({currentAge:a}); setCp({currentAge:a}); };

  /* ---- say what you want to live on once ----
     Both planners need a target income and, for most people, it is the same
     figure: the pension pays it after access, the bridge pays it before. So
     the first one you answer seeds the other — but ONLY while the other is
     still blank. Once a figure has been typed into a planner it is that
     planner's, and nothing here will overwrite it; the two stay independently
     editable exactly as before, which is what somebody planning a leaner
     early-retirement than their eventual retirement needs. */
  useEffect(() => {
    const b = bridgeInputs.targetIncome, c = coastInputs.targetIncome;
