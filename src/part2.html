    if (isSet(b) && !isSet(c) && coastInputs.goalMode !== 'pot')
      setCoastInputs(prev => Object.assign({}, prev, { targetIncome: b }));
    else if (isSet(c) && !isSet(b))
      setBridgeInputs(prev => Object.assign({}, prev, { targetIncome: c }));
  }, [bridgeInputs.targetIncome, coastInputs.targetIncome, coastInputs.goalMode]);
  /* Reconcile the two saved ages once, on mount. This used to make the coast
     age follow the bridge unconditionally — safe only while both always held a
     number. Now that an age can be genuinely absent, copying the bridge's over
     would ERASE an age the person had already given the pension planner (fill
     in your pension, come back, and your age is gone). So whichever one exists
     wins, and the bridge only takes precedence when both do. */
  useEffect(() => {
    const b = bridgeInputs.currentAge, c = coastInputs.currentAge;
    if (b === c) return;
    const a = isSet(b) ? b : c;
    setBridgeInputs(prev => Object.assign({}, prev, { currentAge: a }));
    setCoastInputs(prev => Object.assign({}, prev, { currentAge: a }));
  }, []);
  const combined = useMemo(() => Engine.combinedPlan(bridgeInputs, coastInputs), [bridgeInputs, coastInputs]);
  // Whether each half has been filled in. Everything that draws BOTH pots
  // together — the combined net-worth chart, the cash-flow chart, the CSV —
  // is meaningless until both are, and a flat line at zero is a worse answer
  // than no chart at all.
  const bridgeReady = Engine.bridgeReady(bridgeInputs);
  const coastReady  = Engine.coastReady(coastInputs);
  const bothReady   = bridgeReady && coastReady;

  // ---- Mortgage or invest? — the side calculator under the planners ----
  const [mortgageInputs, setMortgageInputs] = useState(() => {
    let x = JSON.parse(JSON.stringify(Engine.MORTGAGE_DEFAULTS));
    try { const s = localStorage.getItem('optionality.mortgage');
      if (s) x = Object.assign({}, JSON.parse(JSON.stringify(Engine.MORTGAGE_DEFAULTS)), JSON.parse(s)); } catch(e){}
    // v2: the full term is the natural finishing line — move saved states that
    // still carry the old 10-year default across, leaving deliberate choices alone
    if (!x._mv || x._mv < 2) { if (x.horizonMode === '10') x.horizonMode = 'term'; x._mv = 2; }
    return x;
  });
  useEffect(() => { try { localStorage.setItem('optionality.mortgage', JSON.stringify(mortgageInputs)); } catch(e){} }, [mortgageInputs]);
  const mgDirty = useRef(false);
  const setMp = (patch) => {
    TRK.once('session','edit_mortgage'); mgDirty.current = true;
    setMortgageInputs(prev => Object.assign({}, prev, patch));
  };
  const [exploreOpen, setExploreOpen] = useState(false);
  // It INHERITS the site's return assumptions (base + the two scenarios) rather
  // than introducing a third set of numbers to keep in step.
  const mortgage = useMemo(() => Engine.mortgagePlan(Object.assign({}, mortgageInputs, {
    growthFallback: bridgeInputs.growth,
    lowGrowth:  (bridgeInputs.scenarios && bridgeInputs.scenarios.conservative && bridgeInputs.scenarios.conservative.growth) || null,
    highGrowth: (bridgeInputs.scenarios && bridgeInputs.scenarios.optimistic && bridgeInputs.scenarios.optimistic.growth) || null
  })), [mortgageInputs, bridgeInputs.growth, bridgeInputs.scenarios]);

  // What did "Mortgage or invest?" actually TELL people? The single most useful
  // thing this calculator can report back, and the same shape as plan_completed
  // carrying the optionality age: the verdict, plus how demanding the bar was.
  //
  // Deliberately NOT their break-even rate itself — that tracks their mortgage
  // rate closely enough to be a personal figure, so it goes up as a band. No
  // balance, contribution or payment is sent, in line with everything else here.
  useEffect(() => {
    if (!mgDirty.current || !mortgage.ready) return;
    // Only after they have put their OWN situation in — the shipped defaults
    // have a verdict too, and it would tell us nothing about anybody.
    const t = setTimeout(() => {
      const b = mortgage.breakEven;
      TRK.once('session', 'mortgage_verdict', {
        verdict: mortgage.winner,
        // null break-even = investing never catches up, even at a 30% return
        band: b == null ? 'above 30%'
            : b < 0.04 ? 'under 4%' : b < 0.06 ? '4-6%' : b < 0.08 ? '6-8%' : '8% or more',
        horizon: mortgageInputs.horizonMode || 'term'
      });
    }, 1400);   // let typing settle, so we record a considered answer not a keystroke
    return () => clearTimeout(t);
  }, [mortgage, mortgageInputs.horizonMode]);

  // Fire the funnel events AFTER the model has recomputed, so the optionality
  // age we report is the one the user is actually looking at.
  useEffect(() => {
    if (!dirty.current) return;
    dirty.current = false;
    const age = bridge.base && bridge.base.crossAge != null ? bridge.base.crossAge : null;
    const props = age != null ? { optionality_age: age } : {};
    // "returned and updated an existing plan" means a LATER visit — not the
    // edit that completed the plan thirty seconds ago.
    if (TRK.firedEarlier('plan_completed')) TRK.once('session','plan_updated', props);
    else if (!TRK.fired('plan_completed') && touched.current.bridge && touched.current.coast)
      TRK.once('device','plan_completed', props);
  }, [bridgeInputs, coastInputs]);

  // "Used different assumptions by pot" — the pension and the accessible pot
  // no longer share a return / inflation view.
  useEffect(() => {
    if (bridgeInputs.growth !== coastInputs.growth || bridgeInputs.inflation !== coastInputs.inflation)
      TRK.once('session','per_pot_assumptions');
  }, [bridgeInputs.growth, bridgeInputs.inflation, coastInputs.growth, coastInputs.inflation]);
  const cwData = combined.series.map(function(r){
    var nf = realTerms ? 1 : Math.pow(1 + combined.infl, r.age - combined.startAge);
    return { age:r.age, pension:r.pension*nf, accessible:r.accessible*nf, netWorth:r.netWorth*nf,
             pensionIn:r.pensionIn*nf, accessibleIn:r.accessibleIn*nf, pensionOut:-r.pensionOut*nf, accessibleOut:-r.accessibleOut*nf };
  });

  const result = useMemo(() => Engine.compute(inputs), [inputs]);
  const opps = useMemo(() => Engine.opportunities(inputs), [inputs]);
  const rks = useMemo(() => Engine.risks(inputs), [inputs]);
  const rec = useMemo(() => Engine.recommendation(inputs), [inputs]);
  const buffer = useMemo(() => Engine.freedomBuffer(inputs), [inputs]);
  const [strategy, setStrategy] = useState('balanced');
  const [showWhy, setShowWhy] = useState(false);
  const [compareAmount, setCompareAmount] = useState(100000);
  const comparison = useMemo(() => Engine.decisionComparator(inputs, compareAmount), [inputs, compareAmount]);
  const chosenStrat = rec.strategies.find(s => s.key === strategy) || rec.strategies[0];
  const mstones = useMemo(() => Engine.milestones(inputs, result), [inputs, result]);
  const applyPatch = (patch) => set(Object.assign({}, patch));
  const applyStrategy = (allocP) => {
    const p = (inputs.savingsPlan && inputs.savingsPlan.length) ? inputs.savingsPlan : [{fromYear:0,amount:0,allocPension:0.30}];
    let idx=0; p.forEach((s,i)=>{ if((s.fromYear||0)<(p[idx].fromYear||0)) idx=i; });
    set({ savingsPlan: p.map((s,i)=> i===idx ? Object.assign({},s,{allocPension:allocP}) : s) });
  };
  const nextEvent = useMemo(() => {
    const evs = (inputs.cashEvents||[]).map(e => {
      const yrs = e.yearsFromNow!=null ? e.yearsFromNow : (e.age!=null ? e.age-inputs.currentAge : null);
      return yrs!=null ? { name:e.name, amount:e.amount, direction:e.direction||'in', yrs } : null;
    }).filter(e=>e && e.yrs>0.01 && e.direction==='in').sort((a,b)=>a.yrs-b.yrs);
    if (!evs.length) return null;
    return { name:evs[0].name, amount:evs[0].amount, inMonths: Math.max(1, Math.round(evs[0].yrs*12)) };
  }, [inputs]);
  const openSection = (key) => {
    const map = { personal:'sec-personal', pension:'sec-pension', events:'sec-events' };
    const el = document.getElementById(map[key]);
    if (el) { el.open = true; el.scrollIntoView({behavior:'smooth', block:'center'}); }
  };

  const rows = result.rows;
  const nw = result.netWorth;
  const totalNW = nw.total + nw.homeEquity;

  /* chart data */
  // real-terms deflator: express future £ in today's money when realTerms is on.
  // Each figure is deflated by the age at which it's measured.
  const rf = (age) => realTerms ? 1 / Math.pow(1 + inputs.inflation, (age||inputs.currentAge) - inputs.currentAge) : 1;
  const money = (v, age) => gbpC(v * rf(age));
  const gAcc  = (v) => gbpC(v * rf(inputs.pensionAccessAge));   // pots measured at pension access
  const gFree = (v) => gbpC(v * rf(result.effectiveStop));      // pots measured at the Freedom Age
  const gLife = (v) => gbpC(v * rf(inputs.lifeExpectancy));     // measured at life expectancy

  // ---- Personal-CFO narrative: am I on track, pension status, what to do now ----
  const balStrat = rec.strategies.find(s=>s.key==='balanced') || chosenStrat;
  const yearsToFreedom = result.achievable ? Math.max(0, result.effectiveStop - inputs.currentAge) : null;
  const pensionFunded = result.pension.atAccess >= result.pension.required;
  const pensionAlmost = !pensionFunded && result.pension.atAccess >= result.pension.required * 0.9;
  const pensionStatus = !result.achievable ? {cls:'r', label:'—'}
    : pensionFunded ? {cls:'g', label:'Fully funded'}
    : pensionAlmost ? {cls:'a', label:'Almost funded'}
    : {cls:'r', label:'Behind target'};
  const onTrackChip = !result.planSurvives ? {cls:'low', label:'Plan doesn’t hold yet'}
    : (inputs.targetOptionalityAge && result.effectiveStop > inputs.targetOptionalityAge + 0.5) ? {cls:'med', label:'Slightly behind'}
    : {cls:'good', label:'On track'};
  const priority = !result.achievable ? 'closing the gap so the plan can fund your lifestyle at all'
    : !result.planSurvives ? 'fixing the shortfall before you can stop'
    : pensionFunded ? 'building accessible wealth (your Bridge Fund) so you can stop earlier'
    : 'topping up your pension toward its target';
  const balDelta = (result.optionalityAge!=null && balStrat && balStrat.age!=null) ? Math.round((result.optionalityAge - balStrat.age)*12) : 0;
  const planLines = [];
  if (balStrat) {
    if (balStrat.split.pension > 0) planLines.push('Keep contributing about '+gbp(balStrat.split.pension)+' to your pension (at least your employer match and any tax-efficient minimum).');
    else planLines.push('Your pension needs no more contributions to hit its target — keep any employer match, and redirect the rest to accessible savings.');
    if (balStrat.split.isa > 0) planLines.push('Max your ISA ('+gbp(Math.min(balStrat.split.isa,20000))+').');
    if (balStrat.split.gia > 0) planLines.push('Invest the remaining '+gbp(balStrat.split.gia)+' in your GIA.');
  }
  const reqLine = realTerms ? result.pension.required * rf(inputs.pensionAccessAge) : result.pension.required;

  const chartData = rows.map(r => ({
    age: r.age, pension: r.pensionEnd * rf(r.age), required: reqLine,
    isa: r.isa * rf(r.age), gia: r.gia * rf(r.age), cash: r.cash * rf(r.age),
    home: nw.homeEquity * rf(r.age), net: (r.netWorth + nw.homeEquity) * rf(r.age),
    contributions: r.contributions * rf(r.age),
    withdrawals: -r.withdrawals * rf(r.age), pensionWithdrawals: -r.pensionWithdraw * rf(r.age)
  }));

  const confMap = { high:['good','Strong'], medium:['med','Moderate'], low:['low','Low'] };
  const conf = confMap[result.confidence];
  // headline age: the chosen (overridden) stop age, else the earliest achievable
  const heroAge = result.overridden ? result.effectiveStop : (result.achievable ? result.optionalityAge : null);

  // ---- Withdrawal-rate guardrail -------------------------------------
  const wd = result.withdrawal || {};
  const wdPct = (r) => (r!=null ? (r*100).toFixed(1)+'%' : '—');
  const wdWarn = result.planSurvives && wd.status && wd.status !== 'safe' && wd.initialRate != null;
  const wdMsg = wdWarn
    ? 'This plan starts by drawing about '+wdPct(wd.initialRate)+' of your pot a year at age '+ageStr(result.effectiveStop)+' — '
      + (wd.status==='high' ? 'well above' : 'above') + ' your '+wdPct(wd.target)+' sustainable guide. It still lasts to age '+inputs.lifeExpectancy
      + ' because the horizon is finite, the State Pension arrives at '+inputs.statePensionAge+', and full returns are assumed to hold — but there’s little margin for a bad run of markets.'
      + (wd.sustainableAge!=null && wd.sustainableAge>result.effectiveStop+0.1
          ? ' To stay within your '+wdPct(wd.target)+' guide you’d wait to about '+ageStr(wd.sustainableAge)+'.'
          : '')
    : '';

  // plain-language reason behind the confidence rating
  const legacy = result.endWorth;
  const legacyYears = inputs.retirementSpending > 0 ? legacy / inputs.retirementSpending : 0;
  const yearsClause = (legacyYears >= 1 && legacyYears <= 60) ? ' (≈' + Math.round(legacyYears) + ' years of spending)' : '';
  let confidenceWhy;
  if (!result.planSurvives && result.failPhase === 'bridge')
    confidenceWhy = 'You end with about ' + gbpC(legacy) + ' at age ' + inputs.lifeExpectancy + ', but most is locked in your pension until age ' + inputs.pensionAccessAge + '. Your accessible savings (ISA/GIA/cash) run dry around age ' + (result.failAge!=null?Math.floor(result.failAge):'—') + ', so you can’t fund the bridge to pension access — you’re about ' + gbpC(result.bridgeShortfall) + ' short of accessible savings. Fix it with a later stop age, more outside your pension, or an earlier access age — not by saving more into the pension.';
  else if (!result.planSurvives)
    confidenceWhy = 'The plan genuinely runs out of money around age ' + (result.failAge!=null?Math.floor(result.failAge):inputs.lifeExpectancy) + ' — spending outpaces what your savings and pensions can cover. Stop later, save more, or trim spending.';
  else if (result.confidence === 'high')
    confidenceWhy = 'Roomy cushion — about ' + gbpC(legacy) + ' left at age ' + inputs.lifeExpectancy + yearsClause + ', so the plan absorbs weaker returns or higher costs.';
  else if (result.confidence === 'medium')
    confidenceWhy = (!result.overridden
      ? 'This is the earliest age the plan just survives, so there’s little spare by design (~' + gbpC(legacy) + ' left at ' + inputs.lifeExpectancy + '). Push the stop age later or save more to build a buffer.'
      : 'Some cushion — about ' + gbpC(legacy) + ' left at age ' + inputs.lifeExpectancy + yearsClause + '.');
  else
    confidenceWhy = 'Very tight — almost nothing left at age ' + inputs.lifeExpectancy + '. Small changes in returns, inflation or spending could break the plan.';

  /* CSV export (nominal £, full precision) */
  const exportCsv = () => {
    const head = ['Age','Phase','Pension Start','Pension In','Pension Out','Pension Growth','Pension End',
      'ISA/GIA Start','ISA/GIA In','ISA/GIA Out','ISA/GIA Growth','ISA/GIA End','State Pension','Net Worth','Notes'];
    const lines = [head.join(',')].concat(rows.map(r => [
      r.age, r.phase, r.pensionStart, r.pensionIn, r.pensionWithdraw, r.pensionGrowth, r.pensionEnd,
      r.accessStart, r.accessIn, r.accessOut, r.growth, r.accessEnd, r.statePension, r.netWorth,
      '"'+(r.notes||'')+'"'].join(',')));
    const blob = new Blob([lines.join('\n')], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='future-funded-cashflow.csv'; a.click();
    URL.revokeObjectURL(url);
  };
  // Reset clears YOUR figures and puts the house assumptions back — it does not
  // reinstate a worked example, because there no longer is one.
  const reset = () => { if (confirm('Clear your figures and start again?')) { setInputs(JSON.parse(JSON.stringify(Engine.DEFAULTS))); setBridgeInputs(Engine.bridgeBlank()); setCoastInputs(Engine.coastBlank()); } };

  /* cash events */
  const updEvent = (i, patch) => {
    const ev = inputs.cashEvents.map((e,idx) => idx===i ? Object.assign({},e,patch) : e);
    set({ cashEvents: ev });
  };
  const addEvent = () => set({ cashEvents: inputs.cashEvents.concat([{ name:'New event', amount:10000, yearsFromNow:5, direction:'in', account:'gia', destination:'gia' }]) });

  /* savings plan */
  const plan = (inputs.savingsPlan && inputs.savingsPlan.length) ? inputs.savingsPlan : [{fromYear:0,amount:0,allocPension:0.30}];
  let earliestIdx = 0; plan.forEach((s,i)=>{ if ((s.fromYear||0) < (plan[earliestIdx].fromYear||0)) earliestIdx = i; });
  const seg0 = plan[earliestIdx];
  const seg0alloc = seg0.allocPension != null ? seg0.allocPension : 0.30;
  const updSeg = (i, patch) => set({ savingsPlan: plan.map((s,idx)=> idx===i ? Object.assign({},s,patch) : s) });
  const addSeg = () => { const last = plan[plan.length-1]; set({ savingsPlan: plan.concat([{ fromYear:(last.fromYear||0)+1, amount:last.amount, allocPension:last.allocPension }]) }); };
  const delSeg = (i) => { if (plan.length<=1) return; set({ savingsPlan: plan.filter((_,idx)=>idx!==i) }); };
  const delEvent = (i) => set({ cashEvents: inputs.cashEvents.filter((_,idx)=>idx!==i) });

  /* success lights */
  const lightFor = (s) => s==='ahead' ? 'g' : s==='ontrack' ? 'g' : 'r';
  const overall = (result.planSurvives && result.achievable) ? (result.confidence==='high'?'g':result.confidence==='medium'?'a':'r') : 'r';

  const visibleRows = showAllRows ? rows : rows.filter((r,i) => i < 3 || r.phase!=='accumulation' || rows[i+1] && rows[i+1].phase!=='accumulation' || i%2===0).slice(0, 40);

  return (
    <div className="wrap">
      {/* top bar */}
      <div className="topbar">
        <div className="brand"><span className="ff-mark">FF</span><h1>Future Funded</h1></div>
        <FeedbackButton onOpen={()=>setMenuOpen(false)} />
        <button className="burger" aria-label={menuOpen?'Close menu':'Open menu'} aria-expanded={menuOpen}
          onClick={()=>setMenuOpen(o=>!o)}>{menuOpen?'✕':'☰'}</button>
        {menuOpen && <div className="menu-backdrop" onClick={()=>setMenuOpen(false)}></div>}
        <div className={'toolbar'+(menuOpen?' open':'')}>
          <AuthButton onOpen={()=>setMenuOpen(false)} />
          {isAdmin && <a className="btn" href="admin.html" onClick={()=>setMenuOpen(false)}>⚙ Admin</a>}
          <button className="btn subtle" onClick={()=>{TRK.once('session','units_toggle'); setRealTerms(!realTerms);}} title={realTerms
            ? 'All figures are in today’s money (real terms) — what they’re worth at today’s prices. Click to show future pounds (nominal), which look bigger because of inflation.'
            : 'All figures are in future pounds (nominal) — inflated to the year they happen. Click to show today’s money (real terms).'}>ⓘ {realTerms?'Today’s money':'Future £'}</button>
          {!install.standalone && <button className="btn" onClick={async ()=>{
            TRK.ev('install_click', { platform: install.platform });
            const shown = await install.promptInstall();
            setMenuOpen(false);
            if (!shown) { TRK.ev('install_help', { platform: install.platform }); setInstallHelp(true); }
          }}>⤓ Install app</button>}
          <button className="btn" onClick={()=>{TRK.once('session','theme_toggle'); setDark(!dark);}}>{dark?'☀ Light':'☾ Dark'}</button>
          <button className="btn" onClick={()=>{TRK.ev('export_csv'); exportCsv(); setMenuOpen(false);}}>⬇ CSV</button>
          <button className="btn" onClick={()=>{window.print(); setMenuOpen(false);}}>⎙ Print</button>
          <button className="btn" onClick={()=>{reset(); setMenuOpen(false);}}>↺ Reset</button>
        </div>
      </div>

      {/* ===== STRAPLINE — one line; the three cards below are the hero ===== */}
      <section className="hero">
        <h2>Know when work becomes optional.</h2>
      </section>

      <div className="layout">
      <main className="main">

      {/* ===== THE THREE HEADLINE CARDS — this is the hero, AND the onboarding
           =====
           There is no separate wizard, no modal, no "step 1 of 4". These cards
           are the way in: before the numbers exist each one names what it needs
           and takes you to the field, and afterwards the same card carries the
           answer. Tapping one is how most people will reach a planner at all.

           THE RULE THAT MATTERS HERE: a card that is waiting for information is
           NEVER red, and never amber. Red means "your plan doesn't currently
           achieve this" — a real, useful, sometimes unwelcome finding. If it
           also means "you haven't finished typing", it stops meaning anything,
           and a first-time visitor is greeted by a wall of failure they had no
           chance to avoid. So: no dot, dashed border, and a plain request. */}
      {(function(){
        var cb = coast.base, bb = bridge.base;
        var cAge = bridgeInputs.currentAge, access = num(bridgeInputs.pensionAccessAge, 57);

        // One source of truth, shared with the planners themselves, so a card
        // can never ask for a figure the planner below is already using.
        var bMiss = Engine.bridgeMissing(bridgeInputs);
        var cMiss = Engine.coastMissing(coastInputs);
        var bReady = bMiss.length === 0, cReady = cMiss.length === 0;
        // Nothing at all yet? Then the first card shouldn't itemise — it should
        // just invite. Itemising only helps once you're part-way through.
        var fresh = bMiss.length >= 4 && cMiss.length >= 4;
        var bAsk = { age:'your age', balance:'your ISA / GIA balance', income:'the income you want',
                     contrib:'what you save each year' };
        var cAsk = { age:'your age', pension:'your pension balance', income:'the income you want',
                     contrib:'what you pay in each year' };
        var listOf = function(keys, dict){
          var t = keys.map(function(k){ return dict[k]; });
          return t.length === 1 ? t[0] : t.slice(0,-1).join(', ') + ' and ' + t[t.length-1];
        };

        var early = bReady && bb.crossAge != null && bb.crossAge < access;

        /* 1 — When can I stop needing to work? */
        var one;
        if (!bReady)            one = { k:'Work optional', waiting:true,
                                        prompt: fresh ? 'Add your numbers' : 'Almost there',
                                        sub: fresh ? 'We’ll work this out for you'
                                                   : 'Still need ' + listOf(bMiss, bAsk),
                                        ask:'Set it up →' };
        else if (bb.crossAge == null)
          one = { k:'Work optional', dot:'warn', v:'Not yet', sub:'Not reachable before pension access ' + access };
        else if (!early)
          one = { k:'Work optional', dot:'warn', v:'Age ' + bb.crossAge, sub:'Only when your pension unlocks' };
        else
          one = { k:'Work optional', dot:'good', v:'Age ' + bb.crossAge,
                  sub: bb.crossAge <= cAge + 0.01 ? 'You could stop now' : awayStr(bb.crossAge - cAge) };

        /* 2 — Is my bridge funded? */
        var lasts = bb.depletionAge == null || bb.depletionAge >= access;
        var two;
        if (!bReady)     two = { k:'Bridge fund', waiting:true, prompt:'Set up your bridge',
                                 sub:'Add your ISA / GIA balance and what you save', ask:'Set it up →' };
        else if (!early) two = { k:'Bridge fund', dot:'warn',
                                 v: gbpC(Math.max(0, bridge.targetPot - bridgeInputs.currentBalance)) + ' short',
                                 sub:'of the pot that lets you stop before ' + access };
        else if (!lasts) two = { k:'Bridge fund', dot:'bad', v:'Runs dry at ' + bb.depletionAge,
                                 sub:(access - bb.depletionAge) + ' year' + ((access - bb.depletionAge) === 1 ? '' : 's')
                                     + ' short of pension access ' + access };
        else             two = { k:'Bridge fund', dot:'good', v:'Funded',
                                 sub:'Covers you to pension access ' + access };

        /* 3 — Is my pension funded? */
        var three;
        if (!cReady)          three = { k:'Pension', waiting:true, prompt:'Set up your pension',
                                        sub:'Add your pension balance and contributions', ask:'Set it up →' };
        else if (cb.coasting) three = { k:'Pension', dot:'good', v:'Funded',
                                        sub:'No more contributions needed' };
        else if (cb.reached)  three = { k:'Pension', dot:'good', v:'Age ' + cb.coastAge,
                                        sub:'Stop contributing then — ' + cb.yearsUntilCoast
                                            + ' more year' + (cb.yearsUntilCoast === 1 ? '' : 's') };
        else                  three = { k:'Pension', dot:'warn',
                                        v: gbpC(Math.max(0, coast.targetPot - cb.potAtObj)) + ' short',
                                        sub:'Projected ' + gbpC(cb.potAtObj) + ' by ' + cb.objAge };

        return (
          <React.Fragment>
            <div className="hcards">
              {[one, two, three].map(function(c,i){
                return <HCard key={i} {...c} jumpTo={i === 2 ? 'planner-pension' : 'planner-bridge'} />;
              })}
            </div>
            <div className="hc-foot">{(bReady || cReady)
              ? <span>Bridge covers you before pension access {access}; pension takes over after. Today’s money.</span>
              : <span>Tap a card to fill in the few figures behind it — it takes about a minute, and everything
                  else is already set to Future Funded’s standard assumptions.</span>}</div>
          </React.Fragment>
        );
      })()}

      <div id="planner-pension"></div>
      <CoastPlanner cp={coastInputs} setCp={setCp} setAge={setAge} plan={coast} C={C} realTerms={realTerms} setRealTerms={setRealTerms} />
      <div id="planner-bridge"></div>
      <BridgePlanner bp={bridgeInputs} setBp={setBp} setAge={setAge} plan={bridge} C={C} realTerms={realTerms} setRealTerms={setRealTerms} />

      {/* ===== OUTPUTS =====
           Both pots on one picture. Held back until BOTH planners have been
           filled in: with one side empty this draws a confident chart of half
           a life, and the reader has no way to tell which half. */}
      {bothReady && <div className="outputs-block">
      {/* CHARTS — combined view from the two planners */}
      <div className="panel">
        <div className="chart-h"><h2>Combined net worth</h2></div>
        <div className="desc">Pension + accessible ISA/GIA wealth to age 90 — building until you go work-optional (age {combined.retireAge}), then drawn down for retirement income. {realTerms?'Today\u2019s money.':'Future \u00a3 (nominal).'}</div>
        {ResponsiveContainer ? (
        <ResponsiveContainer width="100%" height={narrow?200:260}>
          <AreaChart data={cwData} margin={{top:24,right:12,left:narrow?0:4,bottom:0}}>
            <CartesianGrid stroke={C.grid} vertical={false} />
            <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} minTickGap={narrow?30:8} interval="preserveStartEnd" />
            <YAxis stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={narrow?52:46} tickCount={narrow?4:6} />
            <Tooltip content={<ChartTip/>} trigger={narrow?'click':'hover'} />
            <ReferenceLine x={combined.retireAge} stroke={C.good} strokeWidth={1.5} label={{value:'Work optional — age '+combined.retireAge, position:'insideTopLeft', fill:C.good, fontSize:narrow?11:12, fontWeight:700}} />
            <ReferenceLine x={combined.pensionAccessAge} stroke={C.axis} strokeDasharray="3 3" label={{value:'Pension access '+combined.pensionAccessAge, position:'insideBottomRight', fill:C.axis, fontSize:narrow?10:11}} />
            <Area type="monotone" dataKey="accessible" name="ISA / GIA" stackId="1" stroke={C.isa} fill={C.isa} fillOpacity={0.5} />
            <Area type="monotone" dataKey="pension" name="Pension" stackId="1" stroke={C.pension} fill={C.pension} fillOpacity={0.5} />
          </AreaChart>
        </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
        <div className="legend-row">
          <span><span className="sw" style={{background:C.pension}}></span>Pension (Coast)</span>
          <span><span className="sw" style={{background:C.isa}}></span>ISA / GIA (Bridge)</span>
          <span className="terms-tag">{realTerms?'today\u2019s money':'future \u00a3 (nominal)'}</span>
        </div>
      </div>

      <div className="panel" style={{marginBottom:16}}>
        <div className="chart-h"><h2>Annual cash flow</h2></div>
        <div className="desc">Money <b>in</b> (contributions, above the line) and <b>out</b> (retirement income drawn, below the line), by pot — to age 90.</div>
        {ResponsiveContainer ? (
        <ResponsiveContainer width="100%" height={narrow?188:240}>
          <ComposedChart data={cwData} margin={{top:6,right:12,left:narrow?0:4,bottom:0}} stackOffset="sign">
            <CartesianGrid stroke={C.grid} vertical={false} />
            <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} minTickGap={narrow?30:8} interval="preserveStartEnd" />
            <YAxis stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={narrow?52:46} tickCount={narrow?4:6} />
            <Tooltip content={<ChartTip/>} trigger={narrow?'click':'hover'} />
            <ReferenceLine y={0} stroke={C.baseline} />
            <Bar dataKey="pensionIn" name="Into pension" fill={C.pension} maxBarSize={16} stackId="cf" />
            <Bar dataKey="accessibleIn" name="Into ISA/GIA" fill={C.isa} maxBarSize={16} stackId="cf" />
            <Bar dataKey="accessibleOut" name="From ISA/GIA" fill={C.red} maxBarSize={16} stackId="cf" />
            <Bar dataKey="pensionOut" name="From pension" fill={C.gia} maxBarSize={16} stackId="cf" />
          </ComposedChart>
        </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
        <div className="legend-row">
          <span><span className="sw" style={{background:C.pension}}></span>Into pension</span>
          <span><span className="sw" style={{background:C.isa}}></span>Into ISA / GIA</span>
          <span><span className="sw" style={{background:C.gia}}></span>From pension</span>
          <span><span className="sw" style={{background:C.red}}></span>From ISA / GIA</span>
        </div>
      </div>

      {/* YEAR BY YEAR (combined) — collapsed by default; it is a reference table,
           not part of the headline story, and open it is very long on a phone. */}
      <div className="panel" style={{marginBottom:16,paddingTop:4,paddingBottom:4}}>
        <details className="bp-collapse" style={{borderTop:'none'}} onToggle={TRK.open('view_projection')}>
        <summary className="bp-sub bp-summary" style={{margin:0}}>Year-by-year · age {combined.startAge}–{combined.series.length?combined.series[combined.series.length-1].age:''}</summary>
        <div>
        <div className="chart-h" style={{marginBottom:10}}>
          <div className="legend-row" style={{margin:0}}>
            <span><span className="sw" style={{background:C.pension}}></span>Pension</span>
            <span><span className="sw" style={{background:C.isa}}></span>ISA / GIA</span>
            <span className="terms-tag">{realTerms?'today\u2019s money':'future \u00a3 (nominal)'}</span>
          </div>
        </div>
        <div className="desc" style={{marginTop:0,marginBottom:10}}>Pension and accessible wealth side by side each year, from the two planners. Contributions shown as entered; balances and growth follow the toggle.</div>
        <div className="tablewrap cards" style={{maxHeight:520}}>
          <table>
            <thead>
              <tr className="grouprow"><th></th><th colSpan={5} className="grp grp-p">Pension</th><th colSpan={5} className="grp grp-a">ISA / GIA</th><th></th></tr>
              <tr><th>Age</th><th>Start</th><th>In</th><th>Out</th><th>Growth</th><th>End</th><th>Start</th><th>In</th><th>Out</th><th>Growth</th><th>End</th><th>Net worth</th></tr>
            </thead>
            <tbody>
              {combined.series.map(function(r,i){
                var nf = realTerms ? 1 : Math.pow(1 + combined.infl, r.age - combined.startAge);
                var mv = function(v){ return gbpC(v*nf); };
                var nf1 = realTerms ? 1 : Math.pow(1 + combined.infl, r.age + 1 - combined.startAge);
                var gv = function(end,start,inn,out){ return gbpC(end*nf1 - start*nf - inn*nf + out*nf); };
                return (
                <tr key={i}>
                  <td data-label="Age">{r.age}</td>
                  <td data-label="Pension start">{mv(r.pension)}</td><td data-label="Pension in">{r.pensionIn?mv(r.pensionIn):'\u2014'}</td><td data-label="Pension out">{r.pensionOut?<span style={{color:'var(--critical)'}}>{mv(-r.pensionOut)}</span>:'\u2014'}</td><td data-label="Pension growth">{gv(r.pensionEnd,r.pension,r.pensionIn,r.pensionOut)}</td><td data-label="Pension end">{gbpC(r.pensionEnd*nf1)}</td>
                  <td data-label="ISA/GIA start">{mv(r.accessible)}</td><td data-label="ISA/GIA in">{r.accessibleIn?mv(r.accessibleIn):'\u2014'}</td><td data-label="ISA/GIA out">{r.accessibleOut?<span style={{color:'var(--critical)'}}>{mv(-r.accessibleOut)}</span>:'\u2014'}</td><td data-label="ISA/GIA growth">{gv(r.accessibleEnd,r.accessible,r.accessibleIn,r.accessibleOut)}</td><td data-label="ISA/GIA end">{gbpC(r.accessibleEnd*nf1)}</td>
                  <td data-label="Net worth"><b>{mv(r.netWorth)}</b></td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
        </div>
        </details>
      </div>
      </div>}{/* end outputs-block */}

      {/* ===== EXPLORE OTHER DECISIONS =====
           Side calculators. They sit BELOW the two planners and the combined
           outputs on purpose: useful, but not part of the core answer. */}
      <section className="explore" id="explore">
        <div className="ex-h">Explore other decisions</div>
        <div className="ex-card">
          {!exploreOpen ? (
            <React.Fragment>
              <div className="ex-card-k">Mortgage or invest?</div>
              <div className="ex-card-b">See whether spare cash could work harder reducing your mortgage or being invested.</div>
              <button className="btn primary" onClick={()=>{ TRK.once('session','open_mortgage'); setExploreOpen(true); }}>Compare →</button>
            </React.Fragment>
          ) : (
            <MortgageModule mp={mortgageInputs} setMp={setMp} plan={mortgage} C={C}
              inheritedGrowth={bridgeInputs.growth} inflation={bridgeInputs.inflation}
              onClose={()=>setExploreOpen(false)} />
          )}
        </div>
      </section>
      </main>{/* end main */}


      </div>{/* end layout */}

      {installHelp && <InstallHelp platform={install.platform} onClose={()=>setInstallHelp(false)} />}

      {/* ===== FOOTER ===== */}
      <footer className="site-foot">
        <span className="foot-brand"><span className="foot-mark">FF</span>Future Funded</span>
        <span className="foot-legal">A planning model to help you see when your money gives you choices — not financial, investment or tax advice. Figures are illustrative; sense-check them against your own circumstances. <a href="privacy.html">Privacy</a></span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
