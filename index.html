            <ol className="mo-jn">
              <li>
                <div className="t">Put your spare cash into investments</div>
                <div className="big">{gbp(Math.round(spareM))}/month</div>
                <div className="s">on top of your normal {gbp(Math.round(plan.payment))} mortgage payment</div>
              </li>
              <li>
                <div className="t">Your mortgage runs its full term</div>
                <div className="big sm">{plan.invest.balance > 1
                  ? 'Still running at ' + endDate
                  : 'Mortgage-free ' + dateIn(plan.payoffMonths)}</div>
                {plan.invest.balance > 1 && <div className="s">clears {dateIn(plan.payoffMonths)}</div>}
              </li>
            </ol>
            <div className="mo-out">
              <div className="w">By {endDate}</div>
              <div className="hero">{gbpC(plan.invest.investments)} invested</div>
              <div className="s">≈ {gbpC(todayEquiv(plan.invest.investments))} in today’s money</div>
              <div className="s">{gbpC(plan.invest.contributions)} paid in · {gbpC(plan.invest.growthAmount)} investment growth</div>
              {plan.invest.balance > 1 && <div className="s">Mortgage still owed {gbpC(plan.invest.balance)} — you’d
                be worth {sgn(plan.invest.net)}</div>}
            </div>
          </div>

          {/* ---- OVERPAY ---- */}
          <div className="mo-flow">
            <h4><span className="cd" style={{ background: C.pension }}></span>Overpay {gbp(Math.round(spareM))}/month</h4>
            <ol className="mo-jn">
              <li>
                <div className="t">Put your spare cash into the mortgage</div>
                <div className="big">{gbp(Math.round(spareM))}/month extra</div>
                <div className="s">on top of your normal {gbp(Math.round(plan.payment))} mortgage payment</div>
                {capMatters && <div className="s">Your lender won’t take all of it — {gbpC(preInvested)} is
                  above the allowance, so that part is invested from the start</div>}
              </li>
              <li>
                <div className="t">{clearedInWindow ? 'Your mortgage is cleared early' : 'Your mortgage clears earlier'}</div>
                <div className="big">{clearedInWindow
                  ? 'Mortgage-free ' + dateIn(plan.payoffMonthsOverpay)
                  : 'Clears ' + dateIn(plan.payoffMonthsOverpay)}</div>
                <div className="s">{earlier
                  ? spanStr(plan.termCutMonths) + ' sooner'
                  : 'no sooner — your overpayments are capped'}{clearedInWindow ? '' : ', after this window'}</div>
              </li>
              {clearedInWindow && <li>
                <div className="t">Invest the money you’ve freed up</div>
                <div className="s">Once the mortgage is gone, the money that was going towards it is
                  available to invest:</div>
                <div className="mo-sum">
                  <div><span className="op"></span><span>{gbp(Math.round(plan.payment))} old mortgage payment</span></div>
                  <div><span className="op">+</span><span>{gbp(Math.round(spareM))} spare cash</span></div>
                  <div className="tot"><span className="op">=</span><b>{gbp(Math.round(plan.monthlyAfterPayoff))}/month invested</b></div>
                </div>
                <div className="s">for the remaining {spanStr(monthsAfter)}</div>
              </li>}
            </ol>
            <div className="mo-out">
              <div className="w">By {endDate}</div>
              <div className="hero">{gbpC(plan.overpay.investments)} invested</div>
              <div className="s">≈ {gbpC(todayEquiv(plan.overpay.investments))} in today’s money</div>
              <div className="s">{gbpC(plan.overpay.contributions)} paid in · {gbpC(oGrowth)} investment growth</div>
              {plan.overpay.balance > 1 && <div className="s">Mortgage still owed {gbpC(plan.overpay.balance)} — you’d
                be worth {sgn(plan.overpay.net)}</div>}
            </div>
          </div>
        </div>

        {/* One paragraph doing the whole job: what overpaying buys you, and why
            the interest saved must not be added to the pot next to it. The
            "vs" strip that used to sit here said the same things in less
            English, and the figures are all in the cards above anyway. */}
        <div className="mo-key">
          {(function () {
            const saved = gbp(round100(plan.interestSaved));
            const pot   = gbp(round100(plan.overpay.investments));
            const perM  = gbp(Math.round(plan.monthlyAfterPayoff));
            if (clearedInWindow) {
              return <span>Overpaying saves <b>{saved}</b> of interest{earlier
                ? <span> and clears the mortgage <b>{spanStr(plan.termCutMonths)}</b> sooner</span>
                : <span></span>}. That {saved} isn’t extra money to add to the {pot} investment
                pot — it’s what helps clear the mortgage early, freeing up <b>{perM} a month</b> to
                invest from then on.</span>;
            }
            // the mortgage is still running at the comparison date, so nothing has
            // been freed up yet — don't describe a windfall that hasn't happened
            return <span>Overpaying has saved <b>{saved}</b> of interest so far{earlier
              ? <span> and puts the mortgage on course to clear <b>{spanStr(plan.termCutMonths)}</b> sooner</span>
              : <span></span>}. That {saved} isn’t extra money to add to the {pot} investment
              pot — it’s what shrinks the balance faster, and once the mortgage is gone it frees
              up <b>{perM} a month</b> to invest.</span>;
          })()}
        </div>
        </React.Fragment>
          );
        })()}

      <details className="bp-collapse" onToggle={TRK.open('mortgage_advanced')}><summary className="bp-sub bp-summary">Adjust assumptions</summary>
      <div>
        <div className="bp-assump" style={{ marginTop: 4 }}>
          <div className="bp-fld"><label>Your monthly payment</label>
            <BpNum money value={mp.payment != null ? mp.payment : ''} step={50} onChange={v => setMp({ payment: v > 0 ? v : null })} />
            <div className="bp-hint">{mp.payment > 0
              ? (plan.paymentTooLow ? 'That doesn’t cover the interest — using ' + gbp(plan.derivedPayment) + ' instead.' : 'Leave blank to use the calculated ' + gbp(plan.derivedPayment) + '.')
              : 'Blank = calculated from the balance, rate and term.'}</div></div>
          <div className="bp-fld"><label>Overpayment allowance</label><BpNum pct value={+((mp.overpayLimitPct || 0) * 100).toFixed(1)} step="1" onChange={v => setMp({ overpayLimitPct: (v || 0) / 100 })} />
            <div className="bp-hint">% of the balance each year, penalty-free. 0 = no limit.</div></div>
          <div className="bp-fld"><label>Investment fee</label><BpNum pct value={+((mp.fee || 0) * 100).toFixed(2)} step="0.05" onChange={v => setMp({ fee: (v || 0) / 100 })} />
            <div className="bp-hint">Platform + fund charges, taken off the return.</div></div>
          <div className="bp-fld"><label>Rate changes to</label><BpNum pct value={mp.rateChangeTo != null ? +(mp.rateChangeTo * 100).toFixed(2) : ''} step="0.1"
            onChange={v => setMp({ rateChangeTo: v > 0 ? v / 100 : null })} />
            <div className="bp-hint">Optional — e.g. when a fix ends.</div></div>
          <div className="bp-fld"><label>…after</label><BpNum value={mp.rateChangeAfterYears != null ? mp.rateChangeAfterYears : ''} step="1"
            onChange={v => setMp({ rateChangeAfterYears: v > 0 ? Math.round(v) : null })} suffix="yrs" />
            <div className="bp-hint">The payment is then recalculated over the remaining term.</div></div>
        </div>
        <div className="bp-note">The expected return is <b>{pc(plan.growth)}</b> nominal, and the lower / higher cases are
          your Conservative and Optimistic scenarios — inherited from the planners above rather than a second set of
          assumptions to keep in step. Change them there.</div>
      </div>
      </details>

        {/* ---- 4) THE CHART — the two GAINS, both starting at zero.
             ⚠️ Do not put net position back on here. Net wealth starts at minus
             the whole mortgage, so the axis runs from about −£200k and the few
             thousand pounds the decision is actually worth becomes an invisible
             hairline near the top. Cash conservation makes (growth − interest
             saved) identical to the net-wealth gap, so this chart answers the
             same question at a scale you can actually read.
             The net positions are still on the page — they are the end of each
             row in "How the two run" just below. */}
        <div className="bp-chart">
          {ResponsiveContainer ? (
          <ResponsiveContainer width="100%" height={narrow ? 230 : 290}>
            <LineChart data={plan.series} margin={{ top: 26, right: 14, left: narrow ? 0 : 8, bottom: 2 }}>
              <CartesianGrid stroke={C.grid} vertical={false} />
              <XAxis dataKey="year" type="number" domain={[0, H]} stroke={C.axis}
                tick={{ fontSize: narrow ? 10 : 11, fill: C.axis }} tickLine={false}
                axisLine={{ stroke: C.baseline }} minTickGap={narrow ? 26 : 8} interval="preserveStartEnd" />
              <YAxis stroke={C.axis} tick={{ fontSize: narrow ? 10 : 11, fill: C.axis }} tickLine={false}
                axisLine={false} tickFormatter={gbpC} width={narrow ? 54 : 56} tickCount={narrow ? 4 : 6} />
              <Tooltip content={<ChartTip lbl="Year" />} trigger={narrow ? 'click' : 'hover'} />
              {plan.crossover && <ReferenceLine x={Math.round((plan.crossover.month / 12) * 10) / 10} stroke={C.good} strokeDasharray="4 3" strokeWidth={1.5}
                label={{ value: (plan.crossover.winner === 'invest' ? 'Investing ahead' : 'Overpaying ahead') + ' — year ' + Math.round(plan.crossover.month / 12),
                         position: 'insideTopLeft', fill: C.good, fontSize: narrow ? 10 : 11, fontWeight: 700 }} />}
              <Line type="monotone" dataKey="growth" name="Investment growth" stroke={C.isa} strokeWidth={2.6} dot={false} />
              <Line type="monotone" dataKey="saved" name={plan.overpay.investments - plan.overpay.contributions > 1
                ? 'Interest saved + growth' : 'Interest saved by overpaying'} stroke={C.pension} strokeWidth={2.6} dot={false} />
              {/* the lines often only part company near the end — mark where they finish */}
              <ReferenceDot x={H} y={plan.investGain} r={4} fill={C.isa} stroke="none" isFront={true} />
              <ReferenceDot x={H} y={plan.overpayGain} r={4} fill={C.pension} stroke="none" isFront={true} />
            </LineChart>
          </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
          {/* The figure strip and the explainer that sat here are gone: the
              series are named in the tooltip, the cards above carry the totals,
              and "Year by year" below is the audit trail. */}
        </div>

        {/* ---- YEAR BY YEAR — the whole comparison, line by line.
             The two "Interest paid" columns are the point: the gap between them
             IS the interest saved. Seeing it as a cost that one path pays and
             the other doesn't is what makes clear it is money never spent, not a
             second pot sitting somewhere waiting to be added on. */}
        <details className="bp-collapse" onToggle={TRK.open('view_projection')}>
        <summary className="bp-sub bp-summary">Year by year</summary>
        <div>
          <div className="desc" style={{ marginTop: 0, marginBottom: 10 }}>Everything each strategy owes,
            holds and has paid in interest, at the end of every year. Cash terms, as entered.</div>
          <div className="tablewrap cards" style={{ maxHeight: 460 }}>
            <table>
              <thead>
                {/* Invest first, matching the cards and the chart — the colours
                    and the sides mean the same thing everywhere on the page */}
                <tr className="grouprow"><th></th>
                  <th colSpan={3} className="grp grp-a">Invest the spare cash</th>
                  <th colSpan={3} className="grp grp-p">Overpay the mortgage</th>
                  <th></th></tr>
                <tr><th>Year</th>
                  <th>Owed</th><th>Invested</th><th>Interest paid</th>
                  <th>Owed</th><th>Invested</th><th>Interest paid</th>
                  <th>Difference</th></tr>
              </thead>
              <tbody>
                {plan.series.map(function (r, i) {
                  const d = (r.invest || 0) - (r.overpay || 0);   // + = investing ahead
                  return (
                  <tr key={i}>
                    <td data-label="Year">{r.year}</td>
                    <td data-label="Invest owed">{r.debtInvest > 0 ? gbpC(r.debtInvest) : <span className="muted">cleared</span>}</td>
                    <td data-label="Invest invested">{gbpC(r.potInvest)}</td>
                    <td data-label="Invest interest paid">{gbpC(r.intInvest)}</td>
                    <td data-label="Overpay owed">{r.debtOverpay > 0 ? gbpC(r.debtOverpay) : <span className="muted">cleared</span>}</td>
                    <td data-label="Overpay invested">{gbpC(r.potOverpay)}</td>
                    <td data-label="Overpay interest paid">{gbpC(r.intOverpay)}</td>
                    <td data-label="Difference">{Math.abs(d) < 100
                      ? <span className="muted">level</span>
                      : (d > 0 ? '+' : '−') + gbpC(Math.abs(d)) + (narrow ? '' : d > 0 ? ' inv' : ' ovp')}</td>
                  </tr>);
                })}
              </tbody>
            </table>
          </div>
          <div className="bp-note" style={{ marginTop: 8 }}>“Invested” is what that strategy is holding;
            “Owed” is what is left on the mortgage. <b>Difference</b> is what you would be worth on one path
            against the other — investments minus the mortgage — so <b>+</b> means investing is ahead
            and <b>−</b> means overpaying is.
            {plan.overpay.balance <= 1 && plan.invest.balance <= 1
              ? <span> The two <b>Interest paid</b> columns end {gbpC(plan.interestSaved)} apart, and
                that gap is the interest overpaying avoided. It is a cost never incurred, which is why it
                is not added to the pot on the right of it.</span>
              : <span> The two <b>Interest paid</b> columns are {gbpC(plan.interestSaved)} apart so
                far — that gap is the interest overpaying has avoided to date. It is a cost never incurred,
                not a pot to add on.</span>}</div>
        </div>
        </details>

        {/* The old "How the two run" timeline lived here. The two flow cards
             above now tell that story with the money attached, so keeping it was
             the same journey said twice. */}
        <div className="bp-note" style={{ marginTop: 2 }}><b>What happens when the mortgage is paid off?</b> We don’t
          stop the comparison there. Once your mortgage is cleared we assume you invest both the payment you’ve freed
          up and your spare cash, until the original mortgage end date. That keeps the amount leaving your pocket the
          same under either strategy.</div>

        {/* ---- 6) SENSITIVITY — inherited assumptions, not a new set of controls ---- */}
        <div className="bp-sub">What if returns differ?</div>
        <div className="bp-stress-lines">
          {plan.sensitivity.map(function (s, i) {
            return (
              <div className="ssl" key={i}>
                <span className="k">{pc(s.growth)} a year{s.key === 'central' ? <span className="muted"> · your assumption</span> : ''}</span>
                <span className="v">{Math.abs(s.diff) < 100
                  ? 'line-ball'
                  : narrow
                    ? (s.winner === 'invest' ? 'invest +' : 'overpay +') + gbp(round100(s.diff))
                    : (s.winner === 'invest' ? 'investing ahead by ' : 'overpaying ahead by ') + gbp(round100(s.diff))}</span>
              </div>
            );
          })}
        </div>

        {/* ---- 7) CERTAINTY vs POTENTIAL — short ---- */}
        <div className="bp-sub">Certainty vs potential return</div>
        <div className="mo-tradeoff">
          <div className="mo-col">
            <h4><span className="cd" style={{ background: C.isa }}></span>Invest</h4>
            <ul>
              <li>Higher potential return</li>
              <li>Money remains accessible</li>
              <li>Returns are uncertain</li>
            </ul>
          </div>
          <div className="mo-col">
            <h4><span className="cd" style={{ background: C.pension }}></span>Overpay</h4>
            <ul>
              <li>Guaranteed interest saving</li>
              <li>Mortgage-free sooner</li>
              <li>Money becomes less accessible</li>
            </ul>
          </div>
        </div>
        <div className="mo-key">This isn’t purely a maths question. Overpaying gives a <b>known</b> saving;
          investing gives an <b>uncertain</b> return with potentially greater upside.</div>

        {/* ---- 9) HOW THIS WORKS + the caveats ---- */}
        <details className="bp-collapse"><summary className="bp-sub bp-summary">How this works &amp; important assumptions</summary>
        <div>
          <div className="bp-note" style={{ marginTop: 2 }}><b>Monthly, in cash terms.</b> A mortgage is a cash debt,
            so the comparison runs in pounds of the day; the trade-off also shows the gap in today’s money. Both
            strategies spend the same each month — your payment plus the spare — to the original mortgage end date.
            Overpaying <b>shortens the term</b> rather than cutting the payment. Break-even is solved on the full
            model, so the allowance, the timing and the reinvested payments are all inside it — it isn’t your
            mortgage rate handed back to you. Mortgage interest is charged monthly on the quoted rate; investment
            returns are annual, which is why break-even sits a little above rate + fee.</div>
          <div className="assumptions" style={{ marginTop: 10 }}>
            <b>What this doesn’t model.</b> Early repayment charges — check your lender’s before overpaying a penny;
            many charge a percentage of the amount repaid during a fixed period. It assumes an <b>ISA</b>, so no tax
            on growth (a taxable account would need a tax-drag assumption — a later iteration), and it doesn’t cover
            offset or interest-only mortgages, product fees, remortgaging, or capital gains tax schedules.
            Overpayments are generally <b>irreversible</b> — money in the house isn’t money you can spend, and an
            emergency fund comes before either option.
          </div>
        </div>
        </details>
        <div className="mo-caveat">Investment returns aren’t guaranteed, and mortgage overpayments may be subject to
          lender limits or early repayment charges.</div>
      </React.Fragment>)}
    </div>
  );
}

/* ---- reading a plan out of localStorage --------------------------------
   These four were the inline initialisers of App's four state slices, and
   every one-time migration a saved plan has ever needed lives in them. They
   are named functions now for one reason: SWITCHING PLANS RE-RUNS THEM.

   ⚠️ Anything that must happen when a plan is loaded belongs in here, not in
   a mount effect. A mount effect runs once per page load; a plan can be
   swapped underneath the page five times without one. */
function readInputs(){
  let base = JSON.parse(JSON.stringify(Engine.DEFAULTS));
  try { const s = localStorage.getItem('optionality.inputs');
    if (s) base = Object.assign({}, JSON.parse(JSON.stringify(Engine.DEFAULTS)), JSON.parse(s)); } catch(e){}
  if (!Array.isArray(base.savingsPlan) || !base.savingsPlan.length) {
    base.savingsPlan = [{ fromYear:0, amount: base.annualSavings != null ? base.annualSavings : 10000,
      allocPension: base.allocPension != null ? base.allocPension : 0.30 }];
  }
  base.spendingInflationLinked = true; // spending always holds its real (today's-money) value
  return base;
}

function App() {
  const C = useColors();
  const narrow = useIsNarrow();
  const isAdmin = useIsAdmin();
  const install = useInstall();
  const [installHelp, setInstallHelp] = useState(false);
  const [inputs, setInputs] = useState(readInputs);
  const [dark, setDark] = useState(() => {
    try { return localStorage.getItem('optionality.dark') === '1'; } catch(e){ return false; }
  });
  const [showAllRows, setShowAllRows] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);   // mobile burger menu
  const [realTerms, setRealTerms] = useState(() => {
    try { const v = localStorage.getItem('optionality.realTerms'); return v==null ? true : v==='1'; } catch(e){ return true; }
  });

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    try { localStorage.setItem('optionality.dark', dark ? '1':'0'); } catch(e){}
  }, [dark]);
  useEffect(() => { try { localStorage.setItem('optionality.realTerms', realTerms?'1':'0'); } catch(e){} }, [realTerms]);
  useEffect(() => {
    try { localStorage.setItem('optionality.inputs', JSON.stringify(inputs)); } catch(e){}
  }, [inputs]);

  const [optMsg, setOptMsg] = useState(null);
  const set = (patch) => { setOptMsg(null); setInputs(prev => Object.assign({}, prev, patch)); };

  const optimiseSavings = () => {
    const res = Engine.optimisePlan(inputs);
    if (!res.changed) { setOptMsg({ ok:false, text:'Add some annual savings first, then I can optimise the split.' }); return; }
    const before = res.baselineAge, after = res.optionalityAge;
    setInputs(prev => Object.assign({}, prev, { savingsPlan: res.savingsPlan, plannedStopAge: null }));
    if (before != null && after != null && before - after > 0.05) {
      setOptMsg({ ok:true, text:'Optimised — earliest optionality age '+ageStr(before)+' → '+ageStr(after)+' ('+monthsStr(Math.round((before-after)*12))+' earlier). Applied the split year by year below.' });
    } else if (after != null) {
      setOptMsg({ ok:true, text:'Your allocation is already about optimal for the earliest age ('+ageStr(after)+'). I tidied the split below.' });
    } else {
      setOptMsg({ ok:false, text:'Even the best split can’t reach optionality with these assumptions — try saving more or spending less.' });
    }
  };

  // ISA/GIA Bridge Planner — independent inputs.
  //
  // It used to start from a worked example (35, £50k, £43k). It now starts
  // BLANK on the personal figures and keeps the shipped assumptions, so a new
  // visitor is asked for their numbers instead of being shown someone else's.
  // A saved plan still merges on top and is completely unaffected: every blob
  // ever written carries these fields, so nothing that exists gets cleared.
  const [bridgeInputs, setBridgeInputs] = useState(readBridge);
  /* A hoisted function declaration, not an inline initialiser, so that
     switching plans can re-run it — see readInputs above. Hoisting is what
     lets it sit below its own useState without moving a line of the migration
     chain, which is the part of this file least worth disturbing. */
  function readBridge(){
    let b = Engine.bridgeBlank();
    try { const s = localStorage.getItem('optionality.bridge');
      if (s) b = Object.assign({}, Engine.bridgeBlank(), JSON.parse(s)); } catch(e){}
    if (!Array.isArray(b.phases) || !b.phases.length) b.phases = Engine.bridgeBlank().phases;
    if (!b.scenarios) b.scenarios = JSON.parse(JSON.stringify(Engine.BRIDGE_DEFAULTS.scenarios));
    // migrate any previously-saved separate lump sum into a one-off phase
    if (b.lumpSum > 0 && b.lumpSumAge != null) {
      const exists = b.phases.some(p => p.fromAge === b.lumpSumAge && p.toAge === b.lumpSumAge && p.annual === b.lumpSum);
      if (!exists) b.phases = b.phases.concat([{ fromAge: b.lumpSumAge, toAge: b.lumpSumAge, annual: b.lumpSum }]);
    }
    delete b.lumpSum; delete b.lumpSumAge;
    delete b.targetAge;   // removed 2026-08-19 — it was display-only and fed nothing
    // one-time migration: turn on the drawdown showcase for saved states that pre-date it
    if (!b._bv || b._bv < 2) { b.drawdownFromOptionality = true; if (b.lifeExpectancy == null) b.lifeExpectancy = 90; b._bv = 2; }
    // one-time migration: bump the default nominal return 7% -> 9% (and the scenario bands), where untouched
    if (b._bv < 3) {
      if (b.growth === 0.07) b.growth = 0.09;
      if (b.scenarios) {
        if (b.scenarios.conservative && b.scenarios.conservative.growth === 0.05) b.scenarios.conservative.growth = 0.07;
        if (b.scenarios.optimistic && b.scenarios.optimistic.growth === 0.09) b.scenarios.optimistic.growth = 0.11;
      }
      b._bv = 3;
    }
    // one-time migration: make scenarios explicit return+inflation pairs (drop old wr/retirementAge overrides)
    if (b._bv < 4) {
      const ds = JSON.parse(JSON.stringify(Engine.BRIDGE_DEFAULTS.scenarios));
      const wasOn = b.scenarios || {};
      ds.conservative.enabled = !!(wasOn.conservative && wasOn.conservative.enabled);
      ds.optimistic.enabled = !!(wasOn.optimistic && wasOn.optimistic.enabled);
      b.scenarios = ds; b._bv = 4;
    }
    // one-time migration (v5): new house assumptions — base 7% / 2.5% / 3.5% wr;
    // scenarios 5%·3%·3% (cons) and 9%·2%·4% (opt). Bump untouched base values and
    // reset the scenario presets (preserving on-chart toggles).
    if (b._bv < 5) {
      if (b.growth === 0.09) b.growth = 0.07;
      if (b.withdrawalRate === 0.04) b.withdrawalRate = 0.035;
      const ds5 = JSON.parse(JSON.stringify(Engine.BRIDGE_DEFAULTS.scenarios));
      const was5 = b.scenarios || {};
      ds5.conservative.enabled = !!(was5.conservative && was5.conservative.enabled);
      ds5.optimistic.enabled = !!(was5.optimistic && was5.optimistic.enabled);
      b.scenarios = ds5; b._bv = 5;
    }
    // one-time migration (v6): sequence-risk minimum residual buffer at access
    if (b._bv < 6) { if (b.minResidual == null) b.minResidual = 0; b._bv = 6; }
    // one-time migration (v7): sequence-risk Phase 2 target confidence
    if (b._bv < 7) { if (b.confidence == null) b.confidence = 0.90; b._bv = 7; }
    return b;
  }
  useEffect(() => { try { localStorage.setItem('optionality.bridge', JSON.stringify(bridgeInputs)); } catch(e){} }, [bridgeInputs]);
  // ---- product analytics -------------------------------------------------
  // Every planner edit funnels through setBp/setCp, so one hook here covers
  // both planners and every field without sprinkling calls through the JSX.
  // Which planners this device has EVER filled in. This used to be page-local, so
  // `plan_completed` only fired if somebody did both halves in a single sitting —
  // fill in your pension on Tuesday and your ISA on Thursday and it never fired at
  // all, which is why so many people with a perfectly good plan read as Incomplete.
  const touched = useRef({ bridge: TRK.marked('touched_bridge'), coast: TRK.marked('touched_coast') });
  const dirty = useRef(false);
  const notePatch = (which, patch) => {
    const keys = Object.keys(patch || {});
    if (!keys.length) return;
    const core = which === 'bridge'
      ? ['currentAge','currentBalance','phases','targetIncome']
      : ['currentAge','currentPension','phases','targetIncome','targetPot'];
    if (keys.some(k => core.indexOf(k) >= 0)) {
      touched.current[which] = true;
      TRK.mark('touched_' + which);
      dirty.current = true;
      TRK.once('device','finances_entered');
    }
    if (keys.indexOf('phases') >= 0)       TRK.once('session','edit_savings');
    if (keys.indexOf('targetIncome') >= 0) TRK.once('session','edit_target_income');
    if (keys.indexOf('scenarios') >= 0)    TRK.once('session','scenario_toggle');
    if (keys.indexOf('growth') >= 0 || keys.indexOf('inflation') >= 0)
      TRK.once('session','edit_return_inflation');
  };

  const setBp = (patch) => { notePatch('bridge', patch); setBridgeInputs(prev => Object.assign({}, prev, patch)); };
  const bridge = useMemo(() => Engine.bridgePlan(bridgeInputs), [bridgeInputs]);

  // Pension Coast Planner — independent inputs, blank on the personal figures
  // for the same reason as the bridge above.
  const [coastInputs, setCoastInputs] = useState(readCoast);
  function readCoast(){
    let c = Engine.coastBlank();
    try { const s = localStorage.getItem('optionality.coast');
      if (s) c = Object.assign({}, Engine.coastBlank(), JSON.parse(s)); } catch(e){}
    if (!Array.isArray(c.phases) || !c.phases.length) c.phases = Engine.coastBlank().phases;
    if (!c.scenarios) c.scenarios = JSON.parse(JSON.stringify(Engine.COAST_DEFAULTS.scenarios));
    // one-time migration: seed the State Pension for saved states that pre-date it
    if (!c._cv || c._cv < 2) { if (c.statePensionAmount == null) c.statePensionAmount = 11900; if (c.statePensionAge == null) c.statePensionAge = 67; c._cv = 2; }
    // one-time migration: bump the default nominal return 7% -> 9% (and the scenario bands), where untouched
    if (c._cv < 3) {
      if (c.growth === 0.07) c.growth = 0.09;
      if (c.scenarios) {
        if (c.scenarios.conservative && c.scenarios.conservative.growth === 0.05) c.scenarios.conservative.growth = 0.07;
        if (c.scenarios.optimistic && c.scenarios.optimistic.growth === 0.09) c.scenarios.optimistic.growth = 0.11;
      }
      c._cv = 3;
    }
    // one-time migration: make scenarios explicit return+inflation pairs (drop old wr/retirementAge overrides)
    if (c._cv < 4) {
      const ds = JSON.parse(JSON.stringify(Engine.COAST_DEFAULTS.scenarios));
      const wasOn = c.scenarios || {};
      ds.conservative.enabled = !!(wasOn.conservative && wasOn.conservative.enabled);
      ds.optimistic.enabled = !!(wasOn.optimistic && wasOn.optimistic.enabled);
      c.scenarios = ds; c._cv = 4;
    }
    // one-time migration (v5): new house assumptions — base 7% / 2.5% / 3.5% wr;
    // scenarios 5%·3%·3% (cons) and 9%·2%·4% (opt). Bump untouched base values and
    // reset the scenario presets (preserving on-chart toggles).
    if (c._cv < 5) {
      if (c.growth === 0.09) c.growth = 0.07;
      if (c.withdrawalRate === 0.04) c.withdrawalRate = 0.035;
      const ds5 = JSON.parse(JSON.stringify(Engine.COAST_DEFAULTS.scenarios));
      const was5 = c.scenarios || {};
      ds5.conservative.enabled = !!(was5.conservative && was5.conservative.enabled);
      ds5.optimistic.enabled = !!(was5.optimistic && was5.optimistic.enabled);
      c.scenarios = ds5; c._cv = 5;
    }
    // one-time migration (v6): sequence-risk fields for the pension drawdown
    if (c._cv < 6) { if (c.lifeExpectancy == null) c.lifeExpectancy = 90; if (c.minResidual == null) c.minResidual = 0; if (c.confidence == null) c.confidence = 0.90; c._cv = 6; }
    return c;
  }
  useEffect(() => { try { localStorage.setItem('optionality.coast', JSON.stringify(coastInputs)); } catch(e){} }, [coastInputs]);
  const setCp = (patch) => { notePatch('coast', patch); setCoastInputs(prev => Object.assign({}, prev, patch)); };
  const coast = useMemo(() => Engine.coastPlan(coastInputs), [coastInputs]);
  // ONE age for the whole page. It is asked for in both planners — whichever
  // you reach first — and a person only has one, so either field writes to
  // both models. Clearing it clears both, which is why null passes straight
  // through instead of being rounded into a 0.
  const setAge = (v) => { const a = isSet(v) ? Math.round(v*10)/10 : null;
    setBp({currentAge:a}); setCp({currentAge:a}); };

  /* ---- say what you want to live on once ----
     Both planners need a target income and, for most people, it is the same
     figure: the pension pays it after access, the bridge pays it before. So
     the first one you answer seeds the other — but ONLY while the other is
     still blank. Once a figure has been typed into a planner it is that
     planner's, and nothing here will overwrite it; the two stay independently
     editable exactly as before, which is what somebody planning a leaner
     early-retirement than their eventual retirement needs. */
  useEffect(() => {
    const b = bridgeInputs.targetIncome, c = coastInputs.targetIncome;
    if (isSet(b) && !isSet(c) && coastInputs.goalMode !== 'pot')
      setCoastInputs(prev => Object.assign({}, prev, { targetIncome: b }));
    else if (isSet(c) && !isSet(b))
      setBridgeInputs(prev => Object.assign({}, prev, { targetIncome: c }));
  }, [bridgeInputs.targetIncome, coastInputs.targetIncome, coastInputs.goalMode]);
  /* Reconcile the two saved ages once, on mount. This used to make the coast
     age follow the bridge unconditionally — safe only while both always held a
     number. Now that an age can be genuinely absent, copying the bridge's over
     would ERASE an age the person had already given the pension planner (fill
     in your pension, come back, and your age is gone). So whichever one exists
     wins, and the bridge only takes precedence when both do. */
  useEffect(() => {
    const b = bridgeInputs.currentAge, c = coastInputs.currentAge;
    if (b === c) return;
    const a = isSet(b) ? b : c;
    setBridgeInputs(prev => Object.assign({}, prev, { currentAge: a }));
    setCoastInputs(prev => Object.assign({}, prev, { currentAge: a }));
  }, []);
  const combined = useMemo(() => Engine.combinedPlan(bridgeInputs, coastInputs), [bridgeInputs, coastInputs]);
  // Whether each half has been filled in. Everything that draws BOTH pots
  // together — the combined net-worth chart, the cash-flow chart, the CSV —
  // is meaningless until both are, and a flat line at zero is a worse answer
  // than no chart at all.
  const bridgeReady = Engine.bridgeReady(bridgeInputs);
  const coastReady  = Engine.coastReady(coastInputs);
  const bothReady   = bridgeReady && coastReady;

  /* ---- the two one-off things we say ----
     `ack.disclaimer` gates the FIRST answer; `ack.saveNudge` records that the
     account offer has been made and answered. Both live with the plan rather
     than in the analytics flags — see ACK_KEY. */
  const [ack, setAck] = useState(readAck);
  /* ⚠️ NOT tracked, on purpose. Firing `disclaimer_ack` / `save_nudge_dismiss`
     would be the obvious thing, and it would quietly break analytics: events go
     up in BATCHES, `public.events` has a CHECK constraint listing every allowed
     name, and one unrecognised name fails the whole insert — taking every
     legitimate event queued alongside it. Adding these needs a migration
     extending events_name_allowed FIRST, deployed before the client that fires
     them. Worth doing if first-use drop-off ever matters; not worth risking the
     existing numbers for. */
  const ackDisclaimer = () => setAck(writeAck({ disclaimer: 1 }));
  const dismissNudge  = () => setAck(writeAck({ saveNudge: 1 }));

  // Is anybody signed in? Only used to decide whether to offer an account at
  // all — AuthButton owns the actual session.
  const Cloud = typeof window !== 'undefined' ? window.OptCloud : null;
  const [signedIn, setSignedIn] = useState(() => !!(Cloud && Cloud.user));
  useEffect(() => {
    const on = (e) => setSignedIn(!!(e && e.detail));
    window.addEventListener('optcloud:auth', on);
    setSignedIn(!!(Cloud && Cloud.user));
    return () => window.removeEventListener('optcloud:auth', on);
  }, []);

  /* Which planner shows the "keep your plan" card: the one whose answer they
     have just seen. Set when a planner reveals, so the offer appears under the
     result that earned it rather than at the top of a page they'd have to
     scroll back to. Never on a page load — a returning visitor is not at a
     moment of delight, they are just checking their plan. */
  const [nudgeAt, setNudgeAt] = useState(null);
  const canNudge = !!(Cloud && Cloud.available) && !signedIn && !ack.saveNudge;
  const nudgeNode = canNudge ? <SaveNudge onDismiss={dismissNudge} /> : null;
  // The quiet standing offer in the header, once there is a plan worth keeping.
  const canSave = !!(Cloud && Cloud.available) && !signedIn && (bridgeReady || coastReady);
  const revealedIn = (which) => setNudgeAt(which);
  // Signing in mid-session answers the question; take the card away.
  useEffect(() => { if (signedIn) setNudgeAt(null); }, [signedIn]);

  // ---- Mortgage or invest? — the side calculator under the planners ----
  const [mortgageInputs, setMortgageInputs] = useState(readMortgage);
  function readMortgage(){
    let x = JSON.parse(JSON.stringify(Engine.MORTGAGE_DEFAULTS));
    try { const s = localStorage.getItem('optionality.mortgage');
      if (s) x = Object.assign({}, JSON.parse(JSON.stringify(Engine.MORTGAGE_DEFAULTS)), JSON.parse(s)); } catch(e){}
    // v2: the full term is the natural finishing line — move saved states that
    // still carry the old 10-year default across, leaving deliberate choices alone
    if (!x._mv || x._mv < 2) { if (x.horizonMode === '10') x.horizonMode = 'term'; x._mv = 2; }
    return x;
  }
  useEffect(() => { try { localStorage.setItem('optionality.mortgage', JSON.stringify(mortgageInputs)); } catch(e){} }, [mortgageInputs]);

  /* ---- switching between saved plans ----
     By the time this fires, OptCloud has already swapped the four plan keys in
     localStorage for the ones belonging to the plan just chosen. All that is
     left is to re-read them.

     Deliberately NOT location.reload(), which is how the cross-device sync
     pulls a plan in. The whole point of this feature is flicking between two
     futures and watching the answer move — "Work optional 43" then "Work
     optional 40" — and a reload turns that into a page transition with a
     white flash in the middle.

     `planKey` remounts both planners. They hold their own local state (which
     sections are open, whether the answer has been revealed), and a plan that
     is blank has to open on its setup card rather than inheriting the last
     plan's chart. One line, and it cannot get that wrong. */
  const [planKey, setPlanKey] = useState(0);
  useEffect(() => {
    const apply = () => {
      setInputs(readInputs());
      setBridgeInputs(readBridge());
      setCoastInputs(readCoast());
      setMortgageInputs(readMortgage());
      setNudgeAt(null);
      setPlanKey(k => k + 1);
      // A switch is not an edit. Without this the funnel would record
      // "returned and updated a plan" every time somebody looked at another one.
      dirty.current = false;
      mgDirty.current = false;
    };
    window.addEventListener('optcloud:planapply', apply);
    return () => window.removeEventListener('optcloud:planapply', apply);
  }, []);

  const mgDirty = useRef(false);
  const setMp = (patch) => {
    TRK.once('session','edit_mortgage'); mgDirty.current = true;
    setMortgageInputs(prev => Object.assign({}, prev, patch));
  };
  const [exploreOpen, setExploreOpen] = useState(false);
  // It INHERITS the site's return assumptions (base + the two scenarios) rather
  // than introducing a third set of numbers to keep in step.
  const mortgage = useMemo(() => Engine.mortgagePlan(Object.assign({}, mortgageInputs, {
    growthFallback: bridgeInputs.growth,
    lowGrowth:  (bridgeInputs.scenarios && bridgeInputs.scenarios.conservative && bridgeInputs.scenarios.conservative.growth) || null,
    highGrowth: (bridgeInputs.scenarios && bridgeInputs.scenarios.optimistic && bridgeInputs.scenarios.optimistic.growth) || null
  })), [mortgageInputs, bridgeInputs.growth, bridgeInputs.scenarios]);

  // What did "Mortgage or invest?" actually TELL people? The single most useful
  // thing this calculator can report back, and the same shape as plan_completed
  // carrying the optionality age: the verdict, plus how demanding the bar was.
  //
  // Deliberately NOT their break-even rate itself — that tracks their mortgage
  // rate closely enough to be a personal figure, so it goes up as a band. No
  // balance, contribution or payment is sent, in line with everything else here.
  useEffect(() => {
    if (!mgDirty.current || !mortgage.ready) return;
    // Only after they have put their OWN situation in — the shipped defaults
    // have a verdict too, and it would tell us nothing about anybody.
    const t = setTimeout(() => {
      const b = mortgage.breakEven;
      TRK.once('session', 'mortgage_verdict', {
        verdict: mortgage.winner,
        // null break-even = investing never catches up, even at a 30% return
        band: b == null ? 'above 30%'
            : b < 0.04 ? 'under 4%' : b < 0.06 ? '4-6%' : b < 0.08 ? '6-8%' : '8% or more',
        horizon: mortgageInputs.horizonMode || 'term'
      });
    }, 1400);   // let typing settle, so we record a considered answer not a keystroke
    return () => clearTimeout(t);
  }, [mortgage, mortgageInputs.horizonMode]);

  // Fire the funnel events AFTER the model has recomputed, so the optionality
  // age we report is the one the user is actually looking at.
  useEffect(() => {
    if (!dirty.current) return;
    dirty.current = false;
    const age = bridge.base && bridge.base.crossAge != null ? bridge.base.crossAge : null;
    const props = age != null ? { optionality_age: age } : {};
    // "returned and updated an existing plan" means a LATER visit — not the
    // edit that completed the plan thirty seconds ago.
    if (TRK.firedEarlier('plan_completed')) TRK.once('session','plan_updated', props);
    else if (!TRK.fired('plan_completed') && touched.current.bridge && touched.current.coast)
      TRK.once('device','plan_completed', props);
  }, [bridgeInputs, coastInputs]);

  // "Used different assumptions by pot" — the pension and the accessible pot
  // no longer share a return / inflation view.
  useEffect(() => {
    if (bridgeInputs.growth !== coastInputs.growth || bridgeInputs.inflation !== coastInputs.inflation)
      TRK.once('session','per_pot_assumptions');
  }, [bridgeInputs.growth, bridgeInputs.inflation, coastInputs.growth, coastInputs.inflation]);
  const cwData = combined.series.map(function(r){
    var nf = realTerms ? 1 : Math.pow(1 + combined.infl, r.age - combined.startAge);
    return { age:r.age, pension:r.pension*nf, accessible:r.accessible*nf, netWorth:r.netWorth*nf,
             pensionIn:r.pensionIn*nf, accessibleIn:r.accessibleIn*nf, pensionOut:-r.pensionOut*nf, accessibleOut:-r.accessibleOut*nf };
  });

  const result = useMemo(() => Engine.compute(inputs), [inputs]);
  const opps = useMemo(() => Engine.opportunities(inputs), [inputs]);
  const rks = useMemo(() => Engine.risks(inputs), [inputs]);
  const rec = useMemo(() => Engine.recommendation(inputs), [inputs]);
  const buffer = useMemo(() => Engine.freedomBuffer(inputs), [inputs]);
  const [strategy, setStrategy] = useState('balanced');
  const [showWhy, setShowWhy] = useState(false);
  const [compareAmount, setCompareAmount] = useState(100000);
  const comparison = useMemo(() => Engine.decisionComparator(inputs, compareAmount), [inputs, compareAmount]);
  const chosenStrat = rec.strategies.find(s => s.key === strategy) || rec.strategies[0];
  const mstones = useMemo(() => Engine.milestones(inputs, result), [inputs, result]);
  const applyPatch = (patch) => set(Object.assign({}, patch));
  const applyStrategy = (allocP) => {
    const p = (inputs.savingsPlan && inputs.savingsPlan.length) ? inputs.savingsPlan : [{fromYear:0,amount:0,allocPension:0.30}];
    let idx=0; p.forEach((s,i)=>{ if((s.fromYear||0)<(p[idx].fromYear||0)) idx=i; });
    set({ savingsPlan: p.map((s,i)=> i===idx ? Object.assign({},s,{allocPension:allocP}) : s) });
  };
  const nextEvent = useMemo(() => {
    const evs = (inputs.cashEvents||[]).map(e => {
      const yrs = e.yearsFromNow!=null ? e.yearsFromNow : (e.age!=null ? e.age-inputs.currentAge : null);
      return yrs!=null ? { name:e.name, amount:e.amount, direction:e.direction||'in', yrs } : null;
    }).filter(e=>e && e.yrs>0.01 && e.direction==='in').sort((a,b)=>a.yrs-b.yrs);
    if (!evs.length) return null;
    return { name:evs[0].name, amount:evs[0].amount, inMonths: Math.max(1, Math.round(evs[0].yrs*12)) };
  }, [inputs]);
  const openSection = (key) => {
    const map = { personal:'sec-personal', pension:'sec-pension', events:'sec-events' };
    const el = document.getElementById(map[key]);
    if (el) { el.open = true; el.scrollIntoView({behavior:'smooth', block:'center'}); }
  };

  const rows = result.rows;
  const nw = result.netWorth;
  const totalNW = nw.total + nw.homeEquity;

  /* chart data */
  // real-terms deflator: express future £ in today's money when realTerms is on.
  // Each figure is deflated by the age at which it's measured.
  const rf = (age) => realTerms ? 1 / Math.pow(1 + inputs.inflation, (age||inputs.currentAge) - inputs.currentAge) : 1;
  const money = (v, age) => gbpC(v * rf(age));
  const gAcc  = (v) => gbpC(v * rf(inputs.pensionAccessAge));   // pots measured at pension access
  const gFree = (v) => gbpC(v * rf(result.effectiveStop));      // pots measured at the Freedom Age
  const gLife = (v) => gbpC(v * rf(inputs.lifeExpectancy));     // measured at life expectancy

  // ---- Personal-CFO narrative: am I on track, pension status, what to do now ----
  const balStrat = rec.strategies.find(s=>s.key==='balanced') || chosenStrat;
  const yearsToFreedom = result.achievable ? Math.max(0, result.effectiveStop - inputs.currentAge) : null;
  const pensionFunded = result.pension.atAccess >= result.pension.required;
  const pensionAlmost = !pensionFunded && result.pension.atAccess >= result.pension.required * 0.9;
  const pensionStatus = !result.achievable ? {cls:'r', label:'—'}
    : pensionFunded ? {cls:'g', label:'Fully funded'}
    : pensionAlmost ? {cls:'a', label:'Almost funded'}
    : {cls:'r', label:'Behind target'};
  const onTrackChip = !result.planSurvives ? {cls:'low', label:'Plan doesn’t hold yet'}
    : (inputs.targetOptionalityAge && result.effectiveStop > inputs.targetOptionalityAge + 0.5) ? {cls:'med', label:'Slightly behind'}
    : {cls:'good', label:'On track'};
  const priority = !result.achievable ? 'closing the gap so the plan can fund your lifestyle at all'
    : !result.planSurvives ? 'fixing the shortfall before you can stop'
    : pensionFunded ? 'building accessible wealth (your Bridge Fund) so you can stop earlier'
    : 'topping up your pension toward its target';
  const balDelta = (result.optionalityAge!=null && balStrat && balStrat.age!=null) ? Math.round((result.optionalityAge - balStrat.age)*12) : 0;
  const planLines = [];
  if (balStrat) {
    if (balStrat.split.pension > 0) planLines.push('Keep contributing about '+gbp(balStrat.split.pension)+' to your pension (at least your employer match and any tax-efficient minimum).');
    else planLines.push('Your pension needs no more contributions to hit its target — keep any employer match, and redirect the rest to accessible savings.');
    if (balStrat.split.isa > 0) planLines.push('Max your ISA ('+gbp(Math.min(balStrat.split.isa,20000))+').');
    if (balStrat.split.gia > 0) planLines.push('Invest the remaining '+gbp(balStrat.split.gia)+' in your GIA.');
  }
  const reqLine = realTerms ? result.pension.required * rf(inputs.pensionAccessAge) : result.pension.required;

  const chartData = rows.map(r => ({
    age: r.age, pension: r.pensionEnd * rf(r.age), required: reqLine,
    isa: r.isa * rf(r.age), gia: r.gia * rf(r.age), cash: r.cash * rf(r.age),
    home: nw.homeEquity * rf(r.age), net: (r.netWorth + nw.homeEquity) * rf(r.age),
    contributions: r.contributions * rf(r.age),
    withdrawals: -r.withdrawals * rf(r.age), pensionWithdrawals: -r.pensionWithdraw * rf(r.age)
  }));

  const confMap = { high:['good','Strong'], medium:['med','Moderate'], low:['low','Low'] };
  const conf = confMap[result.confidence];
  // headline age: the chosen (overridden) stop age, else the earliest achievable
  const heroAge = result.overridden ? result.effectiveStop : (result.achievable ? result.optionalityAge : null);

  // ---- Withdrawal-rate guardrail -------------------------------------
  const wd = result.withdrawal || {};
  const wdPct = (r) => (r!=null ? (r*100).toFixed(1)+'%' : '—');
  const wdWarn = result.planSurvives && wd.status && wd.status !== 'safe' && wd.initialRate != null;
  const wdMsg = wdWarn
    ? 'This plan starts by drawing about '+wdPct(wd.initialRate)+' of your pot a year at age '+ageStr(result.effectiveStop)+' — '
      + (wd.status==='high' ? 'well above' : 'above') + ' your '+wdPct(wd.target)+' sustainable guide. It still lasts to age '+inputs.lifeExpectancy
      + ' because the horizon is finite, the State Pension arrives at '+inputs.statePensionAge+', and full returns are assumed to hold — but there’s little margin for a bad run of markets.'
      + (wd.sustainableAge!=null && wd.sustainableAge>result.effectiveStop+0.1
          ? ' To stay within your '+wdPct(wd.target)+' guide you’d wait to about '+ageStr(wd.sustainableAge)+'.'
          : '')
    : '';

  // plain-language reason behind the confidence rating
  const legacy = result.endWorth;
  const legacyYears = inputs.retirementSpending > 0 ? legacy / inputs.retirementSpending : 0;
  const yearsClause = (legacyYears >= 1 && legacyYears <= 60) ? ' (≈' + Math.round(legacyYears) + ' years of spending)' : '';
  let confidenceWhy;
  if (!result.planSurvives && result.failPhase === 'bridge')
    confidenceWhy = 'You end with about ' + gbpC(legacy) + ' at age ' + inputs.lifeExpectancy + ', but most is locked in your pension until age ' + inputs.pensionAccessAge + '. Your accessible savings (ISA/GIA/cash) run dry around age ' + (result.failAge!=null?Math.floor(result.failAge):'—') + ', so you can’t fund the bridge to pension access — you’re about ' + gbpC(result.bridgeShortfall) + ' short of accessible savings. Fix it with a later stop age, more outside your pension, or an earlier access age — not by saving more into the pension.';
  else if (!result.planSurvives)
    confidenceWhy = 'The plan genuinely runs out of money around age ' + (result.failAge!=null?Math.floor(result.failAge):inputs.lifeExpectancy) + ' — spending outpaces what your savings and pensions can cover. Stop later, save more, or trim spending.';
  else if (result.confidence === 'high')
    confidenceWhy = 'Roomy cushion — about ' + gbpC(legacy) + ' left at age ' + inputs.lifeExpectancy + yearsClause + ', so the plan absorbs weaker returns or higher costs.';
  else if (result.confidence === 'medium')
    confidenceWhy = (!result.overridden
      ? 'This is the earliest age the plan just survives, so there’s little spare by design (~' + gbpC(legacy) + ' left at ' + inputs.lifeExpectancy + '). Push the stop age later or save more to build a buffer.'
      : 'Some cushion — about ' + gbpC(legacy) + ' left at age ' + inputs.lifeExpectancy + yearsClause + '.');
  else
    confidenceWhy = 'Very tight — almost nothing left at age ' + inputs.lifeExpectancy + '. Small changes in returns, inflation or spending could break the plan.';

  /* CSV export (nominal £, full precision) */
  const exportCsv = () => {
    const head = ['Age','Phase','Pension Start','Pension In','Pension Out','Pension Growth','Pension End',
      'ISA/GIA Start','ISA/GIA In','ISA/GIA Out','ISA/GIA Growth','ISA/GIA End','State Pension','Net Worth','Notes'];
    const lines = [head.join(',')].concat(rows.map(r => [
      r.age, r.phase, r.pensionStart, r.pensionIn, r.pensionWithdraw, r.pensionGrowth, r.pensionEnd,
      r.accessStart, r.accessIn, r.accessOut, r.growth, r.accessEnd, r.statePension, r.netWorth,
      '"'+(r.notes||'')+'"'].join(',')));
    const blob = new Blob([lines.join('\n')], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='future-funded-cashflow.csv'; a.click();
    URL.revokeObjectURL(url);
  };
  // Reset clears YOUR figures and puts the house assumptions back — it does not
  // reinstate a worked example, because there no longer is one.
  // Reset means start over, so it also forgets that the disclaimer was shown:
  // the next person to use this browser is a first-time user and should meet it
  // again. (It is also the only way to see it a second time, which matters when
  // somebody is trying to check the thing works.)
  const reset = () => { if (confirm('Clear your figures and start again?')) {
    setInputs(JSON.parse(JSON.stringify(Engine.DEFAULTS)));
    setBridgeInputs(Engine.bridgeBlank()); setCoastInputs(Engine.coastBlank());
    try { localStorage.removeItem(ACK_KEY); } catch(e){}
    setAck({}); setNudgeAt(null);
  } };

  /* cash events */
  const updEvent = (i, patch) => {
    const ev = inputs.cashEvents.map((e,idx) => idx===i ? Object.assign({},e,patch) : e);
    set({ cashEvents: ev });
  };
  const addEvent = () => set({ cashEvents: inputs.cashEvents.concat([{ name:'New event', amount:10000, yearsFromNow:5, direction:'in', account:'gia', destination:'gia' }]) });

  /* savings plan */
  const plan = (inputs.savingsPlan && inputs.savingsPlan.length) ? inputs.savingsPlan : [{fromYear:0,amount:0,allocPension:0.30}];
  let earliestIdx = 0; plan.forEach((s,i)=>{ if ((s.fromYear||0) < (plan[earliestIdx].fromYear||0)) earliestIdx = i; });
  const seg0 = plan[earliestIdx];
  const seg0alloc = seg0.allocPension != null ? seg0.allocPension : 0.30;
  const updSeg = (i, patch) => set({ savingsPlan: plan.map((s,idx)=> idx===i ? Object.assign({},s,patch) : s) });
  const addSeg = () => { const last = plan[plan.length-1]; set({ savingsPlan: plan.concat([{ fromYear:(last.fromYear||0)+1, amount:last.amount, allocPension:last.allocPension }]) }); };
  const delSeg = (i) => { if (plan.length<=1) return; set({ savingsPlan: plan.filter((_,idx)=>idx!==i) }); };
  const delEvent = (i) => set({ cashEvents: inputs.cashEvents.filter((_,idx)=>idx!==i) });

  /* success lights */
  const lightFor = (s) => s==='ahead' ? 'g' : s==='ontrack' ? 'g' : 'r';
  const overall = (result.planSurvives && result.achievable) ? (result.confidence==='high'?'g':result.confidence==='medium'?'a':'r') : 'r';

  const visibleRows = showAllRows ? rows : rows.filter((r,i) => i < 3 || r.phase!=='accumulation' || rows[i+1] && rows[i+1].phase!=='accumulation' || i%2===0).slice(0, 40);

  return (
    <div className="wrap">
      {/* THE FIRST THING ANYBODY SEES.
          It was a step inside the setup flow — after the numbers, before the
          result. Harry wanted it front and centre instead, so it is now a gate
          on the whole app: nobody reaches a projection, or even the input
          boxes, without having been told what this does and does not model.
          One button, no checkbox, no X. On a short phone the card scrolls and
          the button is sticky, so it stays reachable WITHOUT scrolling to the
          end — that is deliberate. Forcing a scroll-to-bottom before enabling
          the button is the legal-wall pattern Harry ruled out, and it buys
          compliance theatre rather than comprehension. */}
      {!ack.disclaimer && <Disclaimer onAck={ackDisclaimer} />}
      {/* top bar */}
      <div className="topbar">
        <div className="brand"><span className="ff-mark">FF</span><h1>Future Funded</h1></div>
        {/* Once the card below has been answered, this is the whole of the
            account offer: quiet, always there, never asked again. It only
            appears when there is actually a plan worth keeping. */}
        {canSave && <button className="save-plan" onClick={()=>{
          try { window.dispatchEvent(new CustomEvent('ff:open-auth')); } catch(e){}
        }} title="Create a free account so your plan follows you between devices">Save<span className="sp-word"> plan</span></button>}
        <FeedbackButton onOpen={()=>setMenuOpen(false)} />
        <button className="burger" aria-label={menuOpen?'Close menu':'Open menu'} aria-expanded={menuOpen}
          onClick={()=>setMenuOpen(o=>!o)}>{menuOpen?'✕':'☰'}</button>
        {menuOpen && <div className="menu-backdrop" onClick={()=>setMenuOpen(false)}></div>}
        <div className={'toolbar'+(menuOpen?' open':'')}>
          <AuthButton onOpen={()=>setMenuOpen(false)} />
          {isAdmin && <a className="btn" href="admin.html" onClick={()=>setMenuOpen(false)}>⚙ Admin</a>}
          <button className="btn subtle" onClick={()=>{TRK.once('session','units_toggle'); setRealTerms(!realTerms);}} title={realTerms
            ? 'All figures are in today’s money (real terms) — what they’re worth at today’s prices. Click to show future pounds (nominal), which look bigger because of inflation.'
            : 'All figures are in future pounds (nominal) — inflated to the year they happen. Click to show today’s money (real terms).'}>ⓘ {realTerms?'Today’s money':'Future £'}</button>
          {!install.standalone && <button className="btn" onClick={async ()=>{
            TRK.ev('install_click', { platform: install.platform });
            const shown = await install.promptInstall();
            setMenuOpen(false);
            if (!shown) { TRK.ev('install_help', { platform: install.platform }); setInstallHelp(true); }
          }}>⤓ Install app</button>}
          <button className="btn" onClick={()=>{TRK.once('session','theme_toggle'); setDark(!dark);}}>{dark?'☀ Light':'☾ Dark'}</button>
          <button className="btn" onClick={()=>{TRK.ev('export_csv'); exportCsv(); setMenuOpen(false);}}>⬇ CSV</button>
          <button className="btn" onClick={()=>{window.print(); setMenuOpen(false);}}>⎙ Print</button>
          <button className="btn" onClick={()=>{reset(); setMenuOpen(false);}}>↺ Reset</button>
        </div>
      </div>

      {/* ===== STRAPLINE — one line; the three cards below are the hero ===== */}
      <section className="hero">
        <h2>Know when work becomes optional.</h2>
      </section>

      <div className="layout">
      <main className="main">

      {/* Saved plans, if there are any: one row, above the answer it belongs
          to and below the strapline. Renders nothing at all for a signed-out
          visitor, which is every first-time visitor. */}
      <PlanBar />

      {/* ===== THE THREE HEADLINE CARDS — this is the hero, AND the onboarding
           =====
           There is no separate wizard, no modal, no "step 1 of 4". These cards
           are the way in: before the numbers exist each one names what it needs
           and takes you to the field, and afterwards the same card carries the
           answer. Tapping one is how most people will reach a planner at all.

           THE RULE THAT MATTERS HERE: a card that is waiting for information is
           NEVER red, and never amber. Red means "your plan doesn't currently
           achieve this" — a real, useful, sometimes unwelcome finding. If it
           also means "you haven't finished typing", it stops meaning anything,
           and a first-time visitor is greeted by a wall of failure they had no
           chance to avoid. So: no dot, dashed border, and a plain request. */}
      {(function(){
        var cb = coast.base, bb = bridge.base;
        var cAge = bridgeInputs.currentAge, access = num(bridgeInputs.pensionAccessAge, 57);

        // One source of truth, shared with the planners themselves, so a card
        // can never ask for a figure the planner below is already using.
        var bMiss = Engine.bridgeMissing(bridgeInputs);
        var cMiss = Engine.coastMissing(coastInputs);
        var bReady = bMiss.length === 0, cReady = cMiss.length === 0;
        // Nothing at all yet? Then the first card shouldn't itemise — it should
        // just invite. Itemising only helps once you're part-way through.
        var fresh = bMiss.length >= 4 && cMiss.length >= 4;
        var bAsk = { age:'your age', balance:'your ISA / GIA balance', income:'the income you want',
                     contrib:'what you save each year' };
        var cAsk = { age:'your age', pension:'your pension balance', income:'the income you want',
                     contrib:'what you pay in each year' };
        var listOf = function(keys, dict){
          var t = keys.map(function(k){ return dict[k]; });
          return t.length === 1 ? t[0] : t.slice(0,-1).join(', ') + ' and ' + t[t.length-1];
        };

        var early = bReady && bb.crossAge != null && bb.crossAge < access;

        /* 1 — When can I stop needing to work? */
        var one;
        if (!bReady)            one = { k:'Work optional', waiting:true,
                                        prompt: fresh ? 'Add your numbers' : 'Almost there',
                                        sub: fresh ? 'We’ll work this out for you'
                                                   : 'Still need ' + listOf(bMiss, bAsk),
                                        ask:'Set it up →' };
        else if (bb.crossAge == null)
          one = { k:'Work optional', dot:'warn', v:'Not yet', sub:'Not reachable before pension access ' + access };
        else if (!early)
          one = { k:'Work optional', dot:'warn', v:'Age ' + bb.crossAge, sub:'Only when your pension unlocks' };
        else
          one = { k:'Work optional', dot:'good', v:'Age ' + bb.crossAge,
                  sub: bb.crossAge <= cAge + 0.01 ? 'You could stop now' : awayStr(bb.crossAge - cAge) };

        /* 2 — Is my bridge funded? */
        var lasts = bb.depletionAge == null || bb.depletionAge >= access;
        var two;
        if (!bReady)     two = { k:'Bridge fund', waiting:true, prompt:'Set up your bridge',
                                 sub:'Add your ISA / GIA balance and what you save', ask:'Set it up →' };
        else if (!early) two = { k:'Bridge fund', dot:'warn',
                                 v: gbpC(Math.max(0, bridge.targetPot - bridgeInputs.currentBalance)) + ' short',
                                 sub:'of the pot that lets you stop before ' + access };
        else if (!lasts) two = { k:'Bridge fund', dot:'bad', v:'Runs dry at ' + bb.depletionAge,
                                 sub:(access - bb.depletionAge) + ' year' + ((access - bb.depletionAge) === 1 ? '' : 's')
                                     + ' short of pension access ' + access };
        else             two = { k:'Bridge fund', dot:'good', v:'Funded',
                                 sub:'Covers you to pension access ' + access };

        /* 3 — Is my pension funded? */
        var three;
        if (!cReady)          three = { k:'Pension', waiting:true, prompt:'Set up your pension',
                                        sub:'Add your pension balance and contributions', ask:'Set it up →' };
        else if (cb.coasting) three = { k:'Pension', dot:'good', v:'Funded',
                                        sub:'No more contributions needed' };
        else if (cb.reached)  three = { k:'Pension', dot:'good', v:'Age ' + cb.coastAge,
                                        sub:'Stop contributing then — ' + cb.yearsUntilCoast
                                            + ' more year' + (cb.yearsUntilCoast === 1 ? '' : 's') };
        else                  three = { k:'Pension', dot:'warn',
                                        v: gbpC(Math.max(0, coast.targetPot - cb.potAtObj)) + ' short',
                                        sub:'Projected ' + gbpC(cb.potAtObj) + ' by ' + cb.objAge };

        return (
          <React.Fragment>
            <div className="hcards">
              {[one, two, three].map(function(c,i){
                return <HCard key={i} {...c} jumpTo={i === 2 ? 'planner-pension' : 'planner-bridge'} />;
              })}
            </div>
            {/* ⚠️ Only while the cards are still asking. Once there is an
                answer the line under them was explaining the layout to
                somebody already looking at it — removed 2026-08-24. The
                pension access age it quoted is on the Bridge card's own
                sub-line anyway, and "Today's money" is in the toolbar. */}
            {!(bReady || cReady) &&
              <div className="hc-foot">Tap a card to fill in the few figures behind it — it takes about
                a minute, and everything else is already set to Future Funded’s standard
                assumptions.</div>}
          </React.Fragment>
        );
      })()}

      {/* ⚠️ `key={planKey}` is what makes switching plans clean: both planners
          are remounted, so their local state starts again with the new
          figures instead of the previous plan's. See the planapply effect. */}
      <div id="planner-pension"></div>
      <CoastPlanner key={'c'+planKey} cp={coastInputs} setCp={setCp} setAge={setAge} plan={coast} C={C} realTerms={realTerms} setRealTerms={setRealTerms}
        onRevealed={()=>revealedIn('coast')}
        nudge={nudgeAt === 'coast' ? nudgeNode : null} />
      <div id="planner-bridge"></div>
      <BridgePlanner key={'b'+planKey} bp={bridgeInputs} setBp={setBp} setAge={setAge} plan={bridge} C={C} realTerms={realTerms} setRealTerms={setRealTerms}
        onRevealed={()=>revealedIn('bridge')}
        nudge={nudgeAt === 'bridge' ? nudgeNode : null} />

      {/* ===== OUTPUTS =====
           Both pots on one picture. Held back until BOTH planners have been
           filled in: with one side empty this draws a confident chart of half
           a life, and the reader has no way to tell which half. */}
      {bothReady && <div className="outputs-block">
      {/* CHARTS — combined view from the two planners */}
      <div className="panel">
        <div className="chart-h"><h2>Combined net worth</h2></div>
        <div className="desc">Pension + accessible ISA/GIA wealth to age 90 — building until you go work-optional (age {combined.retireAge}), then drawn down for retirement income. {realTerms?'Today\u2019s money.':'Future \u00a3 (nominal).'}</div>
        {ResponsiveContainer ? (
        <ResponsiveContainer width="100%" height={narrow?200:260}>
          <AreaChart data={cwData} margin={{top:24,right:12,left:narrow?0:4,bottom:0}}>
            <CartesianGrid stroke={C.grid} vertical={false} />
            <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} minTickGap={narrow?30:8} interval="preserveStartEnd" />
            <YAxis stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={narrow?52:46} tickCount={narrow?4:6} />
            <Tooltip content={<ChartTip/>} trigger={narrow?'click':'hover'} />
            <ReferenceLine x={combined.retireAge} stroke={C.good} strokeWidth={1.5} label={{value:'Work optional — age '+combined.retireAge, position:'insideTopLeft', fill:C.good, fontSize:narrow?11:12, fontWeight:700}} />
            <ReferenceLine x={combined.pensionAccessAge} stroke={C.axis} strokeDasharray="3 3" label={{value:'Pension access '+combined.pensionAccessAge, position:'insideBottomRight', fill:C.axis, fontSize:narrow?10:11}} />
            <Area type="monotone" dataKey="accessible" name="ISA / GIA" stackId="1" stroke={C.isa} fill={C.isa} fillOpacity={0.5} />
            <Area type="monotone" dataKey="pension" name="Pension" stackId="1" stroke={C.pension} fill={C.pension} fillOpacity={0.5} />
          </AreaChart>
        </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
        <div className="legend-row">
          <span><span className="sw" style={{background:C.pension}}></span>Pension (Coast)</span>
          <span><span className="sw" style={{background:C.isa}}></span>ISA / GIA (Bridge)</span>
          <span className="terms-tag">{realTerms?'today\u2019s money':'future \u00a3 (nominal)'}</span>
        </div>
      </div>

      <div className="panel" style={{marginBottom:16}}>
        <div className="chart-h"><h2>Annual cash flow</h2></div>
        <div className="desc">Money <b>in</b> (contributions, above the line) and <b>out</b> (retirement income drawn, below the line), by pot — to age 90.</div>
        {ResponsiveContainer ? (
        <ResponsiveContainer width="100%" height={narrow?188:240}>
          <ComposedChart data={cwData} margin={{top:6,right:12,left:narrow?0:4,bottom:0}} stackOffset="sign">
            <CartesianGrid stroke={C.grid} vertical={false} />
            <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} minTickGap={narrow?30:8} interval="preserveStartEnd" />
            <YAxis stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={narrow?52:46} tickCount={narrow?4:6} />
            <Tooltip content={<ChartTip/>} trigger={narrow?'click':'hover'} />
            <ReferenceLine y={0} stroke={C.baseline} />
            <Bar dataKey="pensionIn" name="Into pension" fill={C.pension} maxBarSize={16} stackId="cf" />
            <Bar dataKey="accessibleIn" name="Into ISA/GIA" fill={C.isa} maxBarSize={16} stackId="cf" />
            <Bar dataKey="accessibleOut" name="From ISA/GIA" fill={C.red} maxBarSize={16} stackId="cf" />
            <Bar dataKey="pensionOut" name="From pension" fill={C.gia} maxBarSize={16} stackId="cf" />
          </ComposedChart>
        </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
        <div className="legend-row">
          <span><span className="sw" style={{background:C.pension}}></span>Into pension</span>
          <span><span className="sw" style={{background:C.isa}}></span>Into ISA / GIA</span>
          <span><span className="sw" style={{background:C.gia}}></span>From pension</span>
          <span><span className="sw" style={{background:C.red}}></span>From ISA / GIA</span>
        </div>
      </div>

      {/* YEAR BY YEAR (combined) — collapsed by default; it is a reference table,
           not part of the headline story, and open it is very long on a phone. */}
      <div className="panel" style={{marginBottom:16,paddingTop:4,paddingBottom:4}}>
        <details className="bp-collapse" style={{borderTop:'none'}} onToggle={TRK.open('view_projection')}>
        <summary className="bp-sub bp-summary" style={{margin:0}}>Year-by-year · age {combined.startAge}–{combined.series.length?combined.series[combined.series.length-1].age:''}</summary>
        <div>
        <div className="chart-h" style={{marginBottom:10}}>
          <div className="legend-row" style={{margin:0}}>
            <span><span className="sw" style={{background:C.pension}}></span>Pension</span>
            <span><span className="sw" style={{background:C.isa}}></span>ISA / GIA</span>
            <span className="terms-tag">{realTerms?'today\u2019s money':'future \u00a3 (nominal)'}</span>
          </div>
        </div>
        <div className="desc" style={{marginTop:0,marginBottom:10}}>Pension and accessible wealth side by side each year, from the two planners. Contributions shown as entered; balances and growth follow the toggle.</div>
        <div className="tablewrap cards" style={{maxHeight:520}}>
          <table>
            <thead>
              <tr className="grouprow"><th></th><th colSpan={5} className="grp grp-p">Pension</th><th colSpan={5} className="grp grp-a">ISA / GIA</th><th></th></tr>
              <tr><th>Age</th><th>Start</th><th>In</th><th>Out</th><th>Growth</th><th>End</th><th>Start</th><th>In</th><th>Out</th><th>Growth</th><th>End</th><th>Net worth</th></tr>
            </thead>
            <tbody>
              {combined.series.map(function(r,i){
                var nf = realTerms ? 1 : Math.pow(1 + combined.infl, r.age - combined.startAge);
                var mv = function(v){ return gbpC(v*nf); };
                var nf1 = realTerms ? 1 : Math.pow(1 + combined.infl, r.age + 1 - combined.startAge);
                var gv = function(end,start,inn,out){ return gbpC(end*nf1 - start*nf - inn*nf + out*nf); };
                return (
                <tr key={i}>
                  <td data-label="Age">{r.age}</td>
                  <td data-label="Pension start">{mv(r.pension)}</td><td data-label="Pension in">{r.pensionIn?mv(r.pensionIn):'\u2014'}</td><td data-label="Pension out">{r.pensionOut?<span style={{color:'var(--critical)'}}>{mv(-r.pensionOut)}</span>:'\u2014'}</td><td data-label="Pension growth">{gv(r.pensionEnd,r.pension,r.pensionIn,r.pensionOut)}</td><td data-label="Pension end">{gbpC(r.pensionEnd*nf1)}</td>
                  <td data-label="ISA/GIA start">{mv(r.accessible)}</td><td data-label="ISA/GIA in">{r.accessibleIn?mv(r.accessibleIn):'\u2014'}</td><td data-label="ISA/GIA out">{r.accessibleOut?<span style={{color:'var(--critical)'}}>{mv(-r.accessibleOut)}</span>:'\u2014'}</td><td data-label="ISA/GIA growth">{gv(r.accessibleEnd,r.accessible,r.accessibleIn,r.accessibleOut)}</td><td data-label="ISA/GIA end">{gbpC(r.accessibleEnd*nf1)}</td>
                  <td data-label="Net worth"><b>{mv(r.netWorth)}</b></td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
        </div>
        </details>
      </div>
      </div>}{/* end outputs-block */}

      {/* ===== EXPLORE OTHER DECISIONS =====
           Side calculators. They sit BELOW the two planners and the combined
           outputs on purpose: useful, but not part of the core answer. */}
      <section className="explore" id="explore">
        <div className="ex-h">Explore other decisions</div>
        <div className="ex-card">
          {!exploreOpen ? (
            <React.Fragment>
              <div className="ex-card-k">Mortgage or invest?</div>
              <div className="ex-card-b">See whether spare cash could work harder reducing your mortgage or being invested.</div>
              <button className="btn primary" onClick={()=>{ TRK.once('session','open_mortgage'); setExploreOpen(true); }}>Compare →</button>
            </React.Fragment>
          ) : (
            <MortgageModule mp={mortgageInputs} setMp={setMp} plan={mortgage} C={C}
              inheritedGrowth={bridgeInputs.growth} inflation={bridgeInputs.inflation}
              onClose={()=>setExploreOpen(false)} />
          )}
        </div>
      </section>
      </main>{/* end main */}


      </div>{/* end layout */}

      {installHelp && <InstallHelp platform={install.platform} onClose={()=>setInstallHelp(false)} />}

      {/* ===== FOOTER ===== */}
      <footer className="site-foot">
        <span className="foot-brand"><span className="foot-mark">FF</span>Future Funded</span>
        <span className="foot-legal">A planning model to help you see when your money gives you choices — not financial, investment or tax advice. Figures are illustrative; sense-check them against your own circumstances. <a href="privacy.html">Privacy</a></span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
