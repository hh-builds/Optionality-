            <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} />
            <YAxis stroke={C.axis} tick={{fontSize:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={48} />
            <Tooltip content={<ChartTip/>} />
            {reached && <ReferenceLine x={base.crossAge} stroke={C.good} strokeDasharray="4 3" strokeWidth={1.5}
              label={{ value:'Optionality '+base.crossAge, position:'top', fill:C.good, fontSize:11, fontWeight:700 }} />}
            <Line type="monotone" dataKey="target" name="Target portfolio" stroke={C.red} strokeWidth={2} dot={false} strokeDasharray="5 4" />
            {scEnabled.conservative && <Line type="monotone" dataKey="cons" name="Conservative" stroke={C.gia} strokeWidth={1.6} dot={false} />}
            {scEnabled.optimistic && <Line type="monotone" dataKey="opt" name="Optimistic" stroke={C.isa} strokeWidth={1.6} dot={false} />}
            <Line type="monotone" dataKey="balance" name="Projected ISA/GIA" stroke={C.pension} strokeWidth={2.6} dot={false} />
          </LineChart>
        </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
        <div className="legend-row" style={{marginBottom:2}}>
          <span><span className="sw" style={{background:C.pension}}></span>Projected ISA/GIA (Base)</span>
          <span><span className="sw" style={{background:C.red}}></span>Target portfolio</span>
          {scEnabled.conservative && <span><span className="sw" style={{background:C.gia}}></span>Conservative</span>}
          {scEnabled.optimistic && <span><span className="sw" style={{background:C.isa}}></span>Optimistic</span>}
          <span className="terms-tag">{realTerms?'today’s money':'future £ (nominal)'}</span>
        </div>
      </div>

      {/* 3) KEY ASSUMPTIONS */}
      <div className="bp-sub">Key assumptions</div>
      <div className="bp-assump">
        <div className="bp-fld"><label>Current age</label><BpNum value={bp.currentAge} onChange={v=>setBp({currentAge:Math.round(v)})} /></div>
        <div className="bp-fld"><label>Current ISA / GIA</label><BpNum money value={bp.currentBalance} step={1000} onChange={v=>setBp({currentBalance:v})} /></div>
        <div className="bp-fld"><label>Target income / yr</label><BpNum money value={bp.targetIncome} step={1000} onChange={v=>setBp({targetIncome:v})} /></div>
        <div className="bp-fld"><label>Withdrawal rate</label><BpNum pct value={+(bp.withdrawalRate*100).toFixed(2)} step="0.1" onChange={v=>setBp({withdrawalRate:(v||0)/100})} /></div>
        <div className="bp-fld"><label>Growth (Base, real)</label><BpNum pct value={+(bp.growth*100).toFixed(2)} step="0.1" onChange={v=>setBp({growth:(v||0)/100})} /></div>
        <div className="bp-fld"><label>Lump sum</label><BpNum money value={bp.lumpSum} step={1000} onChange={v=>setBp({lumpSum:v})} /></div>
        <div className="bp-fld"><label>Lump sum at age</label><BpNum value={bp.lumpSumAge} onChange={v=>setBp({lumpSumAge:Math.round(v)})} /></div>
        <div className="bp-fld"><label>Pension access age</label><BpNum value={bp.pensionAccessAge} onChange={v=>setBp({pensionAccessAge:Math.round(v)})} /></div>
      </div>
      <div className="bp-note">Target portfolio = target income ÷ withdrawal rate = <b>{gbpC(bp.targetIncome)} ÷ {(bp.withdrawalRate*100).toFixed(1)}% = {gbpC(targetPot)}</b> (today’s money). Growth is a <b>real</b> (after-inflation) return, so the crossover age is the same in today’s money or nominal — the Nominal view only re-inflates the figures.</div>

      {/* 4) CONTRIBUTION PHASES */}
      <div className="bp-sub">Contribution phases</div>
      <div className="bp-phases">
        <div className="bp-phase-head"><span>From age</span><span>To age</span><span>Annual contribution</span><span></span></div>
        {bp.phases.map((p,i)=>(
          <div className="bp-phase" key={i}>
            <BpNum value={p.fromAge} onChange={v=>updPhase(i,{fromAge:Math.round(v)})} />
            <BpNum value={p.toAge} onChange={v=>updPhase(i,{toAge:Math.round(v)})} />
            <BpNum money value={p.annual} step={1000} onChange={v=>updPhase(i,{annual:v})} />
            <button className="icon-btn" onClick={()=>delPhase(i)} disabled={bp.phases.length<=1} title="Remove phase">✕</button>
          </div>
        ))}
        <button className="add-link" onClick={addPhase}>+ Add contribution phase</button>
      </div>
      <div className="bp-note">Each phase applies for its age range (inclusive). Contributions are annual and deployed during the year; growth is applied after. A phase with £0 stops contributions (e.g. once you’ve reached optionality).</div>

      {/* 6) ADVANCED — bridge framing, frequency, scenarios */}
      <div className="bp-sub">Advanced · bridge framing &amp; scenarios</div>
      <div className="bp-toggles">
        <div className="bp-tgroup"><span className="tl">Model</span>
          <div className="bp-seg">
            <button className={bp.mode==='perpetual'?'on':''} onClick={()=>setBp({mode:'perpetual'})} title="Target = a perpetual pot (income ÷ withdrawal rate) you never run down">Perpetual portfolio</button>
            <button className={bp.mode==='bridge'?'on':''} onClick={()=>setBp({mode:'bridge'})} title="Target = only the pot needed to bridge to pension access — falls as access nears">Bridge to pension access</button>
          </div>
        </div>
        {bp.mode==='bridge' && <div className="bp-tgroup"><span className="tl">By pension access, I’m comfortable…</span>
          <div className="bp-seg">
            <button className={bp.bridgeDepletion==='preserve'?'on':''} onClick={()=>setBp({bridgeDepletion:'preserve'})}>Preserving capital</button>
            <button className={bp.bridgeDepletion==='partial'?'on':''} onClick={()=>setBp({bridgeDepletion:'partial'})}>Partially depleting</button>
            <button className={bp.bridgeDepletion==='full'?'on':''} onClick={()=>setBp({bridgeDepletion:'full'})}>Fully using the bridge</button>
          </div>
        </div>}
        {bp.mode==='bridge' && bp.bridgeDepletion==='partial' && <div className="bp-tgroup"><span className="tl">Capital left at access</span>
          <BpNum pct value={+(((bp.partialRemainPct!=null?bp.partialRemainPct:0.5))*100).toFixed(0)} step="5" onChange={v=>setBp({partialRemainPct:(v||0)/100})} /></div>}
        <div className="bp-tgroup"><span className="tl">Contributions</span>
          <div className="bp-seg">
            <button className={bp.frequency==='annual'?'on':''} onClick={()=>setBp({frequency:'annual'})}>Annual</button>
            <button className={bp.frequency==='monthly'?'on':''} onClick={()=>setBp({frequency:'monthly'})}>Monthly</button>
          </div>
        </div>
      </div>
      <div className="bp-note" style={{marginBottom:14}}>{bp.mode==='perpetual'
        ? 'Perpetual: a fixed target you could live off indefinitely at your withdrawal rate — a 4–5% rule.'
        : 'Bridge: the ISA/GIA only needs to last until pension access age '+bp.pensionAccessAge+', so the required pot is smaller and shrinks each year — often bringing optionality forward. '+(bp.bridgeDepletion==='preserve'?'Preserving capital keeps the full perpetual target.':bp.bridgeDepletion==='full'?'Fully using the bridge draws it to zero by access.':'Partially depleting leaves '+Math.round((bp.partialRemainPct!=null?bp.partialRemainPct:0.5)*100)+'% of the perpetual pot at access.')}</div>

      <div className="bp-scenarios">
        {[{key:'base',label:'Base',color:C.pension},{key:'conservative',label:'Conservative',color:C.gia},{key:'optimistic',label:'Optimistic',color:C.isa}].map(sc=>{
          const isBase = sc.key==='base';
          const s = isBase ? {growth:bp.growth, withdrawalRate:bp.withdrawalRate, contribScale:1} : (bp.scenarios[sc.key]||{});
          const res = isBase ? base : (sc.key==='conservative'?cons:opt);
          return (
          <div className={'bp-scard'+(isBase?' base':'')} key={sc.key}>
            <div className="bp-scard-head">
              <span className="sn"><span className="cd" style={{background:sc.color}}></span>{sc.label}{isBase && ' (primary)'}</span>
              {!isBase && <button className="bp-scen-toggle" onClick={()=>updScen(sc.key,{enabled:!scEnabled[sc.key]})}>{scEnabled[sc.key]?'On chart ✓':'Show on chart'}</button>}
            </div>
            <div className="bp-fld"><label>Growth (real)</label><BpNum pct value={+((s.growth||0)*100).toFixed(2)} step="0.1"
              onChange={v=> isBase ? setBp({growth:(v||0)/100}) : updScen(sc.key,{growth:(v||0)/100})} /></div>
            <div className="bp-fld"><label>Withdrawal rate</label><BpNum pct value={+((s.withdrawalRate||0)*100).toFixed(2)} step="0.1"
              onChange={v=> isBase ? setBp({withdrawalRate:(v||0)/100}) : updScen(sc.key,{withdrawalRate:(v||0)/100})} /></div>
            {!isBase && <div className="bp-fld"><label>Contributions (× Base)</label><BpNum pct value={+((s.contribScale!=null?s.contribScale:1)*100).toFixed(0)} step="5"
              onChange={v=>updScen(sc.key,{contribScale:(v||0)/100})} /></div>}
            <div className="cross-line">Optionality: <b>{res.crossAge!=null?'age '+res.crossAge:'not by '+bp.pensionAccessAge}</b>{res.crossAge!=null && ' · target '+gbpC(res.perpetualPot)}</div>
          </div>
          );
        })}
      </div>

      {/* 5) YEAR-BY-YEAR TABLE */}
      <div className="bp-sub">Year-by-year · age {bp.currentAge}–{bp.pensionAccessAge}</div>
      <div className="tablewrap">
        <table>
          <thead><tr>
            <th>Age</th><th>Projected ISA/GIA</th><th>Target balance</th><th>Surplus / shortfall</th><th>Supported income</th><th>Status</th>
          </tr></thead>
          <tbody>
            {base.rows.map((r,i)=>{
              const st = rowStatus(r);
              return (
              <tr key={i} className={rowClass(r)+(r.age===base.crossAge?' bp-cross-row':'')}>
                <td>{r.age}</td>
                <td>{m(r.balance, r.age)}</td>
                <td>{m(r.target, r.age)}</td>
                <td style={{color:r.surplus>=0?'var(--good-text)':'var(--critical)'}}>{(r.surplus>=0?'+':'−')+m(Math.abs(r.surplus), r.age)}</td>
                <td>{m(r.income, r.age)}/yr</td>
                <td><span className={'bp-status '+st[0]}>{st[1]}</span></td>
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="bp-note">Red below target · amber within 10% · green once the target is reached. Figures in {realTerms?'today’s money':'future £ (nominal)'}. This is a planning model, not financial advice.</div>
    </div>
  );
}

/* ============================================================= */
function App() {
  const C = useColors();
  const [inputs, setInputs] = useState(() => {
    let base = JSON.parse(JSON.stringify(Engine.DEFAULTS));
    try { const s = localStorage.getItem('optionality.inputs');
      if (s) base = Object.assign({}, JSON.parse(JSON.stringify(Engine.DEFAULTS)), JSON.parse(s)); } catch(e){}
    if (!Array.isArray(base.savingsPlan) || !base.savingsPlan.length) {
      base.savingsPlan = [{ fromYear:0, amount: base.annualSavings != null ? base.annualSavings : 10000,
        allocPension: base.allocPension != null ? base.allocPension : 0.30 }];
    }
    base.spendingInflationLinked = true; // spending always holds its real (today's-money) value
    return base;
  });
  const [dark, setDark] = useState(() => {
    try { return localStorage.getItem('optionality.dark') === '1'; } catch(e){ return false; }
  });
  const [showAllRows, setShowAllRows] = useState(false);
  const [realTerms, setRealTerms] = useState(() => {
    try { const v = localStorage.getItem('optionality.realTerms'); return v==null ? true : v==='1'; } catch(e){ return true; }
  });

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    try { localStorage.setItem('optionality.dark', dark ? '1':'0'); } catch(e){}
  }, [dark]);
  useEffect(() => { try { localStorage.setItem('optionality.realTerms', realTerms?'1':'0'); } catch(e){} }, [realTerms]);
  useEffect(() => {
    try { localStorage.setItem('optionality.inputs', JSON.stringify(inputs)); } catch(e){}
  }, [inputs]);

  const [optMsg, setOptMsg] = useState(null);
  const set = (patch) => { setOptMsg(null); setInputs(prev => Object.assign({}, prev, patch)); };

  const optimiseSavings = () => {
    const res = Engine.optimisePlan(inputs);
    if (!res.changed) { setOptMsg({ ok:false, text:'Add some annual savings first, then I can optimise the split.' }); return; }
    const before = res.baselineAge, after = res.optionalityAge;
    setInputs(prev => Object.assign({}, prev, { savingsPlan: res.savingsPlan, plannedStopAge: null }));
    if (before != null && after != null && before - after > 0.05) {
      setOptMsg({ ok:true, text:'Optimised — earliest optionality age '+ageStr(before)+' → '+ageStr(after)+' ('+monthsStr(Math.round((before-after)*12))+' earlier). Applied the split year by year below.' });
    } else if (after != null) {
      setOptMsg({ ok:true, text:'Your allocation is already about optimal for the earliest age ('+ageStr(after)+'). I tidied the split below.' });
    } else {
      setOptMsg({ ok:false, text:'Even the best split can’t reach optionality with these assumptions — try saving more or spending less.' });
    }
  };

  // ISA/GIA Bridge Planner — independent inputs, seeded from the worked example
  const [bridgeInputs, setBridgeInputs] = useState(() => {
    let b = JSON.parse(JSON.stringify(Engine.BRIDGE_DEFAULTS));
    try { const s = localStorage.getItem('optionality.bridge');
      if (s) b = Object.assign({}, JSON.parse(JSON.stringify(Engine.BRIDGE_DEFAULTS)), JSON.parse(s)); } catch(e){}
    if (!Array.isArray(b.phases) || !b.phases.length) b.phases = JSON.parse(JSON.stringify(Engine.BRIDGE_DEFAULTS.phases));
    if (!b.scenarios) b.scenarios = JSON.parse(JSON.stringify(Engine.BRIDGE_DEFAULTS.scenarios));
    return b;
  });
  useEffect(() => { try { localStorage.setItem('optionality.bridge', JSON.stringify(bridgeInputs)); } catch(e){} }, [bridgeInputs]);
  const setBp = (patch) => setBridgeInputs(prev => Object.assign({}, prev, patch));
  const bridge = useMemo(() => Engine.bridgePlan(bridgeInputs), [bridgeInputs]);

  const result = useMemo(() => Engine.compute(inputs), [inputs]);
  const opps = useMemo(() => Engine.opportunities(inputs), [inputs]);
  const rks = useMemo(() => Engine.risks(inputs), [inputs]);
  const rec = useMemo(() => Engine.recommendation(inputs), [inputs]);
  const buffer = useMemo(() => Engine.freedomBuffer(inputs), [inputs]);
  const [strategy, setStrategy] = useState('balanced');
  const [showWhy, setShowWhy] = useState(false);
  const [compareAmount, setCompareAmount] = useState(100000);
  const comparison = useMemo(() => Engine.decisionComparator(inputs, compareAmount), [inputs, compareAmount]);
  const chosenStrat = rec.strategies.find(s => s.key === strategy) || rec.strategies[0];
  const mstones = useMemo(() => Engine.milestones(inputs, result), [inputs, result]);
  const applyPatch = (patch) => set(Object.assign({}, patch));
  const applyStrategy = (allocP) => {
    const p = (inputs.savingsPlan && inputs.savingsPlan.length) ? inputs.savingsPlan : [{fromYear:0,amount:0,allocPension:0.30}];
    let idx=0; p.forEach((s,i)=>{ if((s.fromYear||0)<(p[idx].fromYear||0)) idx=i; });
    set({ savingsPlan: p.map((s,i)=> i===idx ? Object.assign({},s,{allocPension:allocP}) : s) });
  };
  const nextEvent = useMemo(() => {
    const evs = (inputs.cashEvents||[]).map(e => {
      const yrs = e.yearsFromNow!=null ? e.yearsFromNow : (e.age!=null ? e.age-inputs.currentAge : null);
      return yrs!=null ? { name:e.name, amount:e.amount, direction:e.direction||'in', yrs } : null;
    }).filter(e=>e && e.yrs>0.01 && e.direction==='in').sort((a,b)=>a.yrs-b.yrs);
    if (!evs.length) return null;
    return { name:evs[0].name, amount:evs[0].amount, inMonths: Math.max(1, Math.round(evs[0].yrs*12)) };
  }, [inputs]);
  const openSection = (key) => {
    const map = { personal:'sec-personal', pension:'sec-pension', events:'sec-events' };
    const el = document.getElementById(map[key]);
    if (el) { el.open = true; el.scrollIntoView({behavior:'smooth', block:'center'}); }
  };

  const rows = result.rows;
  const nw = result.netWorth;
  const totalNW = nw.total + nw.homeEquity;

  /* chart data */
  // real-terms deflator: express future £ in today's money when realTerms is on.
  // Each figure is deflated by the age at which it's measured.
  const rf = (age) => realTerms ? 1 / Math.pow(1 + inputs.inflation, (age||inputs.currentAge) - inputs.currentAge) : 1;
  const money = (v, age) => gbpC(v * rf(age));
  const gAcc  = (v) => gbpC(v * rf(inputs.pensionAccessAge));   // pots measured at pension access
  const gFree = (v) => gbpC(v * rf(result.effectiveStop));      // pots measured at the Freedom Age
  const gLife = (v) => gbpC(v * rf(inputs.lifeExpectancy));     // measured at life expectancy

  // ---- Personal-CFO narrative: am I on track, pension status, what to do now ----
  const balStrat = rec.strategies.find(s=>s.key==='balanced') || chosenStrat;
  const yearsToFreedom = result.achievable ? Math.max(0, result.effectiveStop - inputs.currentAge) : null;
  const pensionFunded = result.pension.atAccess >= result.pension.required;
  const pensionAlmost = !pensionFunded && result.pension.atAccess >= result.pension.required * 0.9;
  const pensionStatus = !result.achievable ? {cls:'r', label:'—'}
    : pensionFunded ? {cls:'g', label:'Fully funded'}
    : pensionAlmost ? {cls:'a', label:'Almost funded'}
    : {cls:'r', label:'Behind target'};
  const onTrackChip = !result.planSurvives ? {cls:'low', label:'Plan doesn’t hold yet'}
    : (inputs.targetOptionalityAge && result.effectiveStop > inputs.targetOptionalityAge + 0.5) ? {cls:'med', label:'Slightly behind'}
    : {cls:'good', label:'On track'};
  const priority = !result.achievable ? 'closing the gap so the plan can fund your lifestyle at all'
    : !result.planSurvives ? 'fixing the shortfall before you can stop'
    : pensionFunded ? 'building accessible wealth (your Bridge Fund) so you can stop earlier'
    : 'topping up your pension toward its target';
  const balDelta = (result.optionalityAge!=null && balStrat && balStrat.age!=null) ? Math.round((result.optionalityAge - balStrat.age)*12) : 0;
  const planLines = [];
  if (balStrat) {
    if (balStrat.split.pension > 0) planLines.push('Keep contributing about '+gbp(balStrat.split.pension)+' to your pension (at least your employer match and any tax-efficient minimum).');
    else planLines.push('Your pension needs no more contributions to hit its target — keep any employer match, and redirect the rest to accessible savings.');
    if (balStrat.split.isa > 0) planLines.push('Max your ISA ('+gbp(Math.min(balStrat.split.isa,20000))+').');
    if (balStrat.split.gia > 0) planLines.push('Invest the remaining '+gbp(balStrat.split.gia)+' in your GIA.');
  }
  const reqLine = realTerms ? result.pension.required * rf(inputs.pensionAccessAge) : result.pension.required;

  const chartData = rows.map(r => ({
    age: r.age, pension: r.pensionEnd * rf(r.age), required: reqLine,
    isa: r.isa * rf(r.age), gia: r.gia * rf(r.age), cash: r.cash * rf(r.age),
    home: nw.homeEquity * rf(r.age), net: (r.netWorth + nw.homeEquity) * rf(r.age),
    contributions: r.contributions * rf(r.age),
    withdrawals: -r.withdrawals * rf(r.age), pensionWithdrawals: -r.pensionWithdraw * rf(r.age)
  }));

  const confMap = { high:['good','Strong'], medium:['med','Moderate'], low:['low','Low'] };
  const conf = confMap[result.confidence];
  // headline age: the chosen (overridden) stop age, else the earliest achievable
  const heroAge = result.overridden ? result.effectiveStop : (result.achievable ? result.optionalityAge : null);

  // ---- Withdrawal-rate guardrail -------------------------------------
  const wd = result.withdrawal || {};
  const wdPct = (r) => (r!=null ? (r*100).toFixed(1)+'%' : '—');
  const wdWarn = result.planSurvives && wd.status && wd.status !== 'safe' && wd.initialRate != null;
  const wdMsg = wdWarn
    ? 'This plan starts by drawing about '+wdPct(wd.initialRate)+' of your pot a year at age '+ageStr(result.effectiveStop)+' — '
      + (wd.status==='high' ? 'well above' : 'above') + ' your '+wdPct(wd.target)+' sustainable guide. It still lasts to age '+inputs.lifeExpectancy
      + ' because the horizon is finite, the State Pension arrives at '+inputs.statePensionAge+', and full returns are assumed to hold — but there’s little margin for a bad run of markets.'
      + (wd.sustainableAge!=null && wd.sustainableAge>result.effectiveStop+0.1
          ? ' To stay within your '+wdPct(wd.target)+' guide you’d wait to about '+ageStr(wd.sustainableAge)+'.'
          : '')
    : '';

  // plain-language reason behind the confidence rating
  const legacy = result.endWorth;
  const legacyYears = inputs.retirementSpending > 0 ? legacy / inputs.retirementSpending : 0;
  const yearsClause = (legacyYears >= 1 && legacyYears <= 60) ? ' (≈' + Math.round(legacyYears) + ' years of spending)' : '';
  let confidenceWhy;
  if (!result.planSurvives && result.failPhase === 'bridge')
    confidenceWhy = 'You end with about ' + gbpC(legacy) + ' at age ' + inputs.lifeExpectancy + ', but most is locked in your pension until age ' + inputs.pensionAccessAge + '. Your accessible savings (ISA/GIA/cash) run dry around age ' + (result.failAge!=null?Math.floor(result.failAge):'—') + ', so you can’t fund the bridge to pension access — you’re about ' + gbpC(result.bridgeShortfall) + ' short of accessible savings. Fix it with a later stop age, more outside your pension, or an earlier access age — not by saving more into the pension.';
  else if (!result.planSurvives)
    confidenceWhy = 'The plan genuinely runs out of money around age ' + (result.failAge!=null?Math.floor(result.failAge):inputs.lifeExpectancy) + ' — spending outpaces what your savings and pensions can cover. Stop later, save more, or trim spending.';
  else if (result.confidence === 'high')
    confidenceWhy = 'Roomy cushion — about ' + gbpC(legacy) + ' left at age ' + inputs.lifeExpectancy + yearsClause + ', so the plan absorbs weaker returns or higher costs.';
  else if (result.confidence === 'medium')
    confidenceWhy = (!result.overridden
      ? 'This is the earliest age the plan just survives, so there’s little spare by design (~' + gbpC(legacy) + ' left at ' + inputs.lifeExpectancy + '). Push the stop age later or save more to build a buffer.'
      : 'Some cushion — about ' + gbpC(legacy) + ' left at age ' + inputs.lifeExpectancy + yearsClause + '.');
  else
    confidenceWhy = 'Very tight — almost nothing left at age ' + inputs.lifeExpectancy + '. Small changes in returns, inflation or spending could break the plan.';

  /* CSV export (nominal £, full precision) */
  const exportCsv = () => {
    const head = ['Age','Phase','Pension Start','Pension In','Pension Out','Pension Growth','Pension End',
      'ISA/GIA Start','ISA/GIA In','ISA/GIA Out','ISA/GIA Growth','ISA/GIA End','State Pension','Net Worth','Notes'];
    const lines = [head.join(',')].concat(rows.map(r => [
      r.age, r.phase, r.pensionStart, r.pensionIn, r.pensionWithdraw, r.pensionGrowth, r.pensionEnd,
      r.accessStart, r.accessIn, r.accessOut, r.growth, r.accessEnd, r.statePension, r.netWorth,
      '"'+(r.notes||'')+'"'].join(',')));
    const blob = new Blob([lines.join('\n')], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='optionality-cashflow.csv'; a.click();
    URL.revokeObjectURL(url);
  };
  const reset = () => { if (confirm('Reset all inputs to defaults?')) { setInputs(JSON.parse(JSON.stringify(Engine.DEFAULTS))); setBridgeInputs(JSON.parse(JSON.stringify(Engine.BRIDGE_DEFAULTS))); } };

  /* cash events */
  const updEvent = (i, patch) => {
    const ev = inputs.cashEvents.map((e,idx) => idx===i ? Object.assign({},e,patch) : e);
    set({ cashEvents: ev });
  };
  const addEvent = () => set({ cashEvents: inputs.cashEvents.concat([{ name:'New event', amount:10000, yearsFromNow:5, direction:'in', account:'gia', destination:'gia' }]) });

  /* savings plan */
  const plan = (inputs.savingsPlan && inputs.savingsPlan.length) ? inputs.savingsPlan : [{fromYear:0,amount:0,allocPension:0.30}];
  let earliestIdx = 0; plan.forEach((s,i)=>{ if ((s.fromYear||0) < (plan[earliestIdx].fromYear||0)) earliestIdx = i; });
  const seg0 = plan[earliestIdx];
  const seg0alloc = seg0.allocPension != null ? seg0.allocPension : 0.30;
  const updSeg = (i, patch) => set({ savingsPlan: plan.map((s,idx)=> idx===i ? Object.assign({},s,patch) : s) });
  const addSeg = () => { const last = plan[plan.length-1]; set({ savingsPlan: plan.concat([{ fromYear:(last.fromYear||0)+1, amount:last.amount, allocPension:last.allocPension }]) }); };
  const delSeg = (i) => { if (plan.length<=1) return; set({ savingsPlan: plan.filter((_,idx)=>idx!==i) }); };
  const delEvent = (i) => set({ cashEvents: inputs.cashEvents.filter((_,idx)=>idx!==i) });

  /* success lights */
  const lightFor = (s) => s==='ahead' ? 'g' : s==='ontrack' ? 'g' : 'r';
  const overall = (result.planSurvives && result.achievable) ? (result.confidence==='high'?'g':result.confidence==='medium'?'a':'r') : 'r';

  const visibleRows = showAllRows ? rows : rows.filter((r,i) => i < 3 || r.phase!=='accumulation' || rows[i+1] && rows[i+1].phase!=='accumulation' || i%2===0).slice(0, 40);

  return (
    <div className="wrap">
      {/* top bar */}
      <div className="topbar">
        <div className="brand"><span className="dot"></span><h1>Financial Optionality</h1>
          <span className="muted" style={{fontSize:13}}>personal CFO dashboard</span></div>
        <div className="toolbar">
          <button className="btn subtle" onClick={()=>setRealTerms(!realTerms)} title={realTerms
            ? 'All figures are in today’s money (real terms) — what they’re worth at today’s prices. Click to show future pounds (nominal), which look bigger because of inflation.'
            : 'All figures are in future pounds (nominal) — inflated to the year they happen. Click to show today’s money (real terms).'}>ⓘ {realTerms?'Today’s money':'Future £'}</button>
          <button className="btn" onClick={()=>setDark(!dark)}>{dark?'☀ Light':'☾ Dark'}</button>
          <button className="btn" onClick={exportCsv}>⬇ CSV</button>
          <button className="btn" onClick={()=>window.print()}>⎙ Print</button>
          <button className="btn" onClick={reset}>↺ Reset</button>
        </div>
      </div>

      <div className="layout">
      <main className="main">

      {/* HERO — when can I go optional · when can I stop paying into pension · how solid */}
      <div className="hero">
        <div className="hero-main">
          <div className="lbl">🎯 Freedom Age {result.overridden && <span className="manual-tag">manual</span>}</div>
          <div className="big tnum">{heroAge != null ? ageStr(heroAge) : 'Not yet'}
            {heroAge != null && <span className="yrs"> years</span>}</div>
          <div className="sub">{
            result.overridden
              ? (result.planSurvives
                  ? 'Your chosen stop age — funds your lifestyle to age '+inputs.lifeExpectancy+'. Earliest possible is '+ageStr(result.optionalityAge)+'.'
                  : (result.failPhase==='bridge'
                      ? '⚠ Can’t bridge to pension access at this age — accessible savings run dry near age '+(result.failAge!=null?Math.floor(result.failAge):'—')+' (pension locked until '+inputs.pensionAccessAge+'). Earliest workable age is '+(result.achievable?ageStr(result.optionalityAge):'later')+'.'
                      : '⚠ Stopping this early runs out of money near age '+(result.failAge!=null?Math.floor(result.failAge):inputs.lifeExpectancy)+'. Earliest sustainable age is '+(result.achievable?ageStr(result.optionalityAge):'later than shown')+'.'))
              : (result.achievable
                  ? 'The earliest age you can stop for good and keep your lifestyle to age '+inputs.lifeExpectancy+'. Assumes all employment income and new savings stop at that age.'
                  : 'On current assumptions the plan never fully funds age '+inputs.lifeExpectancy+'. Adjust savings, spending or returns below.')
          }</div>
          {wdWarn && <div className={'wd-guard '+(wd.status==='high'?'wd-high':'wd-watch')}>
            <span className="wd-ic">{wd.status==='high'?'⚠':'⚡'}</span>
            <span><b>Withdrawal-rate check:</b> {wdMsg}</span>
            {wd.sustainableAge!=null && wd.sustainableAge>result.effectiveStop+0.1 &&
              <button className="wd-btn" onClick={()=>set({plannedStopAge: Math.round(wd.sustainableAge*10)/10})}
                title="Pin your plan to the age that stays within the sustainable rate">Use {ageStr(wd.sustainableAge)}</button>}
          </div>}
          <div className="hero-plan">
            <span className="hp-lbl">Plan to stop at</span>
            <NumInput className="inline-num" style={{width:76,padding:'5px 8px',fontSize:15,textAlign:'center'}} min={0} step="0.1"
              value={result.effectiveStop} ariaLabel="Planned stop age" onChange={v => set({ plannedStopAge: v })} />
            <button className="btn primary" onClick={()=>set({ plannedStopAge: null })} title="Snap to the earliest achievable age">⚡ Optimise</button>
            <span className="hp-dot">·</span>
            <span className="hp-lbl">Target</span>
            <NumInput className="inline-num" style={{width:56,padding:'5px 7px',fontSize:14,textAlign:'center'}} min={0}
              value={inputs.targetOptionalityAge} ariaLabel="Target age" onChange={v => set({ targetOptionalityAge: v })} />
            {result.achievable && inputs.targetOptionalityAge ?
              (result.yearsEarlyLate >= 0
                ? <b className="hp-ok">{monthsStr(result.yearsEarlyLate*12)} early</b>
                : <b className="hp-bad">{monthsStr(result.yearsEarlyLate*12)} late</b>) : null}
          </div>
        </div>
        <div className="hero-stats">
          <div className="hstat">
            <div className="hs-k">Pension status {result.pension.buffer>0 && <span className="hs-badge">+{Math.round(result.pension.buffer*100)}% margin</span>}
              <button className="why-btn" onClick={()=>setShowWhy(!showWhy)}>Why?</button></div>
            <span className={'pill '+(pensionStatus.cls==='g'?'good':pensionStatus.cls==='a'?'med':'low')} style={{margin:'3px 0'}}><span className="ic"></span>{pensionStatus.label}</span>
            <div className="hs-s">{gAcc(result.pension.atAccess)} projected vs {gAcc(result.pension.required)} target. {result.pension.coastFireAge!=null
              ? 'Coasted — projected to reach target with no further contributions (assumes your returns, spending, withdrawal rate and access age).'
              : 'Still needs contributions to reach the target.'}</div>
            {showWhy && <div className="why-box">
              <div className="why-row"><span>Current pension</span><b>{gbpC(result.pension.current)}</b></div>
              <div className="why-row"><span>Net return (after fee)</span><b>{(result.pension.netReturn*100).toFixed(1)}%</b></div>
              <div className="why-row"><span>Years to access ({inputs.pensionAccessAge})</span><b>{Math.round(result.pension.yearsToAccess)}</b></div>
              <div className="why-row"><span>Target pot at access</span><b>{gbpC(result.pension.rawRequired)}</b></div>
              <div className="why-row"><span>+ {Math.round(result.pension.buffer*100)}% safety margin</span><b>{gbpC(result.pension.required)}</b></div>
              <div className="why-row"><span>State Pension</span><b>{inputs.statePensionIncluded?gbpC(inputs.statePensionAmount)+'/yr from '+inputs.statePensionAge:'excluded'}</b></div>
              <div className="why-row"><span>Retirement spend · withdrawal</span><b>{gbpC(inputs.retirementSpending)}/yr · {(inputs.withdrawalRate*100).toFixed(1)}%</b></div>
              <div className="why-note">Coast = the age your <b>current</b> pension alone, growing at the net return with no further contributions, reaches the target + margin.</div>
            </div>}
          </div>
          <div className="hstat">
            <div className="hs-k">Plan resilience</div>
            <span className={'pill '+conf[0]} title={confidenceWhy}><span className="ic"></span>{conf[1]}</span>
            <div className="hs-s">{buffer && result.planSurvives
              ? 'Deterministic sensitivity, not a probability: your Freedom Age slips by a year if returns run '+(buffer.returnHeadroom*100).toFixed(1)+'% lower or spending is '+gbpC(buffer.spendHeadroom)+'/yr higher.'
              : confidenceWhy}</div>
          </div>
        </div>
      </div>

      {/* ===== YOUR PLAN — the personal-CFO narrative ===== */}
      <div className="panel cfo-plan">
        <div className="plan-head">
          <h2>📋 Your Plan</h2>
          <span className={'pill '+onTrackChip.cls}><span className="ic"></span>{onTrackChip.label}</span>
        </div>
        <div className="plan-narrative">{
          result.achievable
            ? <span>You’re about <b>{Math.round(yearsToFreedom)} year{Math.round(yearsToFreedom)===1?'':'s'}</b> from financial freedom (age <b>{ageStr(result.effectiveStop)}</b>). Your pension is <b style={{color:pensionStatus.cls==='g'?'var(--good-text)':pensionStatus.cls==='a'?'var(--warning)':'var(--critical)'}}>{pensionStatus.label.toLowerCase()}</b>. Your biggest priority now is <b>{priority}</b>.</span>
            : <span>On your current assumptions the plan doesn’t yet fund your lifestyle to age {inputs.lifeExpectancy}. The priority is {priority} — the opportunities below show the biggest levers.</span>
        }</div>
        {planLines.length>0 && <div className="plan-actions">
          <div className="pa-title">This year — {gbp(rec.amount)} of savings</div>
          {planLines.map((l,i)=>(<div className="pa-line" key={i}><span className="pa-tick">✓</span> {l}</div>))}
          <div className="pa-foot">{balDelta>0
            ? 'Following this brings your Freedom Age forward by about '+monthsStr(balDelta)+' vs your current split. '
            : 'This keeps you at your earliest Freedom Age. '}
            <span className="muted">Balanced plan — optimised for the earliest Freedom Age that keeps your pension on target. Excludes tax effects.</span></div>
        </div>}
      </div>

      {/* LIFE TIMELINE */}
      <div className="panel timeline-panel">
        <div className="chart-h" style={{marginBottom:12}}><h2>Life timeline</h2>
          <span className="muted" style={{fontSize:12}}>your plan's key milestones · click to jump to its inputs</span></div>
        <div className="timeline">
          <div className="tl-line"></div>
          {mstones.map((m,i) => (
            <button className={'tl-node '+(m.highlight?'hi':'')+' tl-'+m.key} key={i}
              onClick={()=>openSection(m.section)} title={m.label+' — age '+ageStr(m.age)}>
              <span className="tl-dot"></span>
              <span className="tl-age">{Math.round(m.age)}</span>
              <span className="tl-lbl">{m.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* ===== BEST USE OF YOUR SAVINGS — the savings plan leads ===== */}
      <div className="section-title">Best use of your savings</div>

      {/* SAVINGS PLAN — the core interactive panel */}
      <div className="panel savings-panel">
        <div className="chart-h" style={{marginBottom:2}}><h2>⭐ Your savings plan</h2>
          <button className="btn primary opt-btn" onClick={optimiseSavings} title="Keep your yearly amounts, find the split that reaches Freedom earliest">⚡ Optimise allocation</button></div>
        <div className="desc">How much you save each year and how it splits between <b style={{color:'var(--series-pension)'}}>pension</b> and <b style={{color:'var(--series-isa)'}}>accessible</b> (ISA/GIA). Each row applies from that point until the next — so contributions and the split can change over time. Edit anything; the impact updates instantly.</div>
        {optMsg && <div className={'opt-msg '+(optMsg.ok?'ok':'bad')}>{optMsg.text}</div>}

        <div className="plan-cards">
          {plan.map((s,i) => {
            const al = s.allocPension != null ? s.allocPension : 0.30;
            const fromAge = inputs.currentAge + (s.fromYear||0);
            const toAge = (i < plan.length-1) ? inputs.currentAge + (plan[i+1].fromYear||0) : null;
            const pensionAmt = s.amount*al, accessAmt = s.amount*(1-al);
            return (
            <div className="plan-card" key={i}>
              <div className="pc-head">
                <span className="pc-when">{toAge!=null ? ('Age '+Math.round(fromAge)+'–'+Math.round(toAge)) : ('Age '+Math.round(fromAge)+' onwards')}</span>
                <button className="icon-btn" onClick={()=>delSeg(i)} disabled={plan.length<=1} title="Remove period">✕</button>
              </div>
              <div className="pc-grid">
                <label className="pc-field">
                  <span className="pc-lbl">Starts (years from now)</span>
                  <div className="pc-inwrap"><NumInput value={s.fromYear||0} min={0} onChange={v=>updSeg(i,{fromYear:Math.max(0,Math.round(v))})} ariaLabel="Starts in years" /></div>
                </label>
                <label className="pc-field">
                  <span className="pc-lbl">Amount saved / year</span>
                  <div className="pc-inwrap money"><span className="pfx">£</span><NumInput value={s.amount} min={0} step={1000} onChange={v=>updSeg(i,{amount:Math.max(0,v)})} ariaLabel="Annual amount" style={{paddingLeft:18}} /></div>
                </label>
                <div className="pc-field pc-alloc">
                  <span className="pc-lbl">Split — {Math.round(al*100)}% pension / {Math.round((1-al)*100)}% ISA-GIA</span>
                  <div className="pc-slider">
                    <span className="ps-end p">Pension</span>
                    <input type="range" min="0" max="100" value={Math.round(al*100)} onChange={e=>updSeg(i,{allocPension:parseInt(e.target.value)/100})} />
                    <span className="ps-end i">ISA/GIA</span>
                  </div>
                  <div className="pc-split"><span style={{color:'var(--series-pension)'}}>{gbp(pensionAmt)} pension</span><span style={{color:'var(--series-isa)'}}>{gbp(accessAmt)} ISA/GIA</span></div>
                </div>
              </div>
            </div>
            );
          })}
          <button className="add-link plan-add" onClick={addSeg}>+ Add a period (change your saving later)</button>
        </div>

        <div className="plan-impact">
          <div className="pi-tile"><div className="pi-k">Freedom Age</div><div className="pi-v tnum" style={{color:'var(--accent)'}}>{result.achievable?ageStr(result.optionalityAge):'—'}</div></div>
          <div className="pi-tile"><div className="pi-k">Pension @ access</div><div className="pi-v tnum">{gAcc(result.pension.atAccess)}</div></div>
          <div className="pi-tile"><div className="pi-k">Bridge Fund @ freedom</div><div className="pi-v tnum">{gFree(result.accessible.atOptionality)}</div></div>
          <div className="pi-tile"><div className="pi-k">Left @ access</div><div className="pi-v tnum">{gAcc(result.accessible.remainingAtAccess)}</div></div>
          <div className="pi-tile"><div className="pi-k">Lifetime income</div><div className="pi-v tnum">{gbpC(result.retirement.sustainableIncome)}/yr</div></div>
        </div>
        <div className="note" style={{marginTop:8}}>New savings fill your ISA up to £20k/yr, then flow to the GIA. Savings stop automatically when you reach your Freedom Age.</div>
      </div>

      {/* ===== WHERE YOU STAND ===== */}
      <div className="section-title">Where you stand</div>
      <div className="kpis">
        <KpiCard title="Pension" status={result.pension.status}
          main={gAcc(result.pension.atAccess)}
          reason={{good: result.pension.difference>=0, text:(result.pension.difference>=0?'+':'−')+gAcc(Math.abs(result.pension.difference))+(result.pension.difference>=0?' ahead of target':' short of target')}}
          rows={[['Projected @ '+inputs.pensionAccessAge, gAcc(result.pension.atAccess)],
                 ['Need at target', gAcc(result.pension.required)],
                 ['Withdrawal rate', (inputs.withdrawalRate*100).toFixed(1)+'%']]} />
        <KpiCard title="Bridge Fund" status={result.accessible.status}
          main={gFree(result.accessible.atOptionality)}
          reason={{good: result.accessible.difference>=0, text:(result.accessible.difference>=0?'+':'−')+gAcc(Math.abs(result.accessible.difference))+(result.accessible.difference>=0?' surplus':' short of bridge')}}
          rows={[['Need to bridge to '+inputs.pensionAccessAge, gFree(result.accessible.requiredBridge)],
                 ['ISA/GIA now', gbpC(result.accessible.current)],
                 ['Left @ access', gAcc(result.accessible.remainingAtAccess)]]} />
        <KpiCard title="Income after pension" status={result.retirement.status}
          main={gbpC(result.retirement.sustainableIncome)+'/yr'}
          reason={{good: result.retirement.sustainableIncome>=result.retirement.target, text:(result.retirement.sustainableIncome>=result.retirement.target?'+':'−')+gbpC(Math.abs(result.retirement.sustainableIncome-result.retirement.target))+'/yr vs target'}}
          rows={[['Target spend', gbpC(result.retirement.target)+'/yr'],
                 ['State pension', gbpC(result.retirement.statePension)+'/yr'],
                 ['Est. legacy @ '+inputs.lifeExpectancy, gLife(result.retirement.legacy)]]} />
        <KpiCard title="Starting withdrawal rate"
          status={wd.status==='safe'?'ahead':wd.status==='watch'?'ontrack':'behind'}
          main={wd.initialRate!=null?wdPct(wd.initialRate):'—'}
          reason={{good: !wdWarn, text: wd.initialRate==null ? 'Covered by State Pension'
            : wdWarn ? 'above your '+wdPct(wd.target)+' guide' : 'within your '+wdPct(wd.target)+' guide'}}
          rows={[['Your sustainable guide', wdPct(wd.target)],
                 ['First-year draw @ '+ageStr(result.effectiveStop), wd.initialRate!=null?wdPct(wd.initialRate):'—'],
                 ['Within-guide age', wd.sustainableAge!=null?ageStr(wd.sustainableAge):'—']]} />
        <KpiCard title="Investable net worth"
          main={gbpC(nw.total)}
          rows={[['Pension', gbpC(nw.pension)],
                 ['ISA / GIA', gbpC(nw.isa+nw.gia)],
                 ['Cash', gbpC(nw.cash)]].concat(nw.homeEquity>0?[['+ Home equity', gbpC(nw.homeEquity)]]:[])} />
      </div>

      {/* ===== ACCESSIBLE WEALTH · ISA/GIA BRIDGE PLANNER ===== */}
      <div className="section-title">Accessible wealth · bridge to optionality</div>
      <BridgePlanner bp={bridgeInputs} setBp={setBp} plan={bridge} C={C} realTerms={realTerms} setRealTerms={setRealTerms} />

      {/* ===== DECISION TOOLS (optional add-ons) ===== */}
      <div className="section-title">Decision tools</div>
      <div className="panel action-panel">
        <div className="chart-h" style={{marginBottom:4}}><h2>⭐ What should I do this year?</h2>
          <span className="muted" style={{fontSize:13}}>this year’s savings of <b style={{color:'var(--text-primary)'}}>{gbp(rec.amount)}</b></span></div>
        <div className="tax-flag">⚠ A planning allocation based on the numbers above — a starting point, not financial advice. It doesn’t model your personal tax position.</div>
        <div className="strat-tabs">
          {rec.strategies.map(s => (
            <button key={s.key} className={'strat-tab'+(strategy===s.key?' on':'')} onClick={()=>setStrategy(s.key)}>{s.label}</button>
          ))}
        </div>
        <div className="strat-def">{{
          freedom: 'Maximise Freedom — earliest possible Freedom Age, directing savings to accessible accounts (ISA/GIA) to fund the bridge to pension access.',
          balanced: 'Balanced (default) — the earliest Freedom Age that still keeps your pension on track to its target (+ margin). Funds the pension only as much as it needs, then sends the rest to accessible savings — so it never over-weights the locked pension.',
          pension: 'Maximise Pension — everything into the pension for the biggest long-term pot and retirement income; your Freedom Age is later.',
          lowrisk: 'Lowest Risk — keeps your Freedom Age near the earliest while building the largest safety buffer at life expectancy.'
        }[strategy]}</div>
        <div className="rec-body">
          <div className="alloc-row">
            <div className="alloc-cell"><div className="ac-k" style={{color:'var(--series-pension)'}}>Pension</div><div className="ac-v tnum">{gbp(chosenStrat.split.pension)}</div></div>
            <div className="alloc-cell"><div className="ac-k" style={{color:'var(--series-isa)'}}>ISA</div><div className="ac-v tnum">{gbp(chosenStrat.split.isa)}</div></div>
            <div className="alloc-cell"><div className="ac-k" style={{color:'var(--series-gia)'}}>GIA</div><div className="ac-v tnum">{gbp(chosenStrat.split.gia)}</div></div>
          </div>
          <div className="rec-side">
            <div className="alloc-why">{
              chosenStrat.age!=null
                ? (chosenStrat.key==='freedom' ? 'Reaches Freedom Age '+ageStr(chosenStrat.age)+' — the earliest achievable with this year’s savings.'
                  : chosenStrat.key==='pension' ? 'Biggest long-term pension pot; Freedom Age '+ageStr(chosenStrat.age)+' (later, but ~'+gbpC(chosenStrat.legacy)+' legacy).'
                  : chosenStrat.key==='lowrisk' ? 'Keeps Freedom near the earliest ('+ageStr(chosenStrat.age)+') while building the biggest safety buffer (~'+gbpC(chosenStrat.legacy)+' at '+inputs.lifeExpectancy+').'
                  : 'An even split — Freedom Age '+ageStr(chosenStrat.age)+', ~'+gbpC(chosenStrat.legacy)+' legacy.')
                : 'Not achievable with these assumptions.'
            }</div>
            <button className="btn primary" onClick={()=>applyStrategy(chosenStrat.allocPension)}>Apply to my plan →</button>
          </div>
        </div>
        <div className="checklist">
          {rec.amount>0 && <div className="chk"><span className="ck">✓</span> Pension: <b>{gbp(chosenStrat.split.pension)}</b>{chosenStrat.split.pension>=60000?' (annual limit)':''}</div>}
          {chosenStrat.split.isa>0 && <div className="chk"><span className="ck">✓</span> ISA: <b>{gbp(chosenStrat.split.isa)}</b>{chosenStrat.split.isa>=20000?' (£20k maxed)':''}</div>}
          {chosenStrat.split.gia>0 && <div className="chk"><span className="ck">✓</span> GIA: <b>{gbp(chosenStrat.split.gia)}</b></div>}
          {nextEvent && <div className="chk"><span className="ck">◷</span> {nextEvent.name} in {nextEvent.inMonths} month{nextEvent.inMonths===1?'':'s'} ({gbpC(nextEvent.amount)})</div>}
          {inputs.mortgage>0 && <div className="chk"><span className="ck">○</span> Mortgage overpay won’t move your Freedom Age (home equity isn’t drawn on)</div>}
        </div>
      </div>

      {/* DECISION COMPARATOR */}
      <div className="panel comparator" style={{marginBottom:16}}>
        <div className="chart-h" style={{marginBottom:4}}><h2>💡 I’ve got a lump sum — where should it go?</h2></div>
        <div className="desc" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>Compare
          <span style={{position:'relative',display:'inline-flex',alignItems:'center'}}>
            <span style={{position:'absolute',left:9,color:'var(--muted)',fontSize:13,pointerEvents:'none'}}>£</span>
            <NumInput className="inline-num" style={{paddingLeft:18,width:120}} step={5000} min={0} value={compareAmount} ariaLabel="Lump sum amount" onChange={v=>setCompareAmount(v)} />
          </span>
          to invest — ranked by earliest Freedom Age. <span className="muted">The lump goes straight into each account (ISA fills its £20k limit first, the rest to GIA). Accessible money can fund the bridge to pension access; pension is locked until {inputs.pensionAccessAge}.</span></div>
        <div className="tablewrap">
          <table className="cmp-table">
            <thead><tr><th>Put it…</th><th>Goes in</th><th>Freedom Age</th><th>Pension @ access</th><th>Bridge Fund</th><th>Lifetime income</th></tr></thead>
            <tbody>
              {comparison.map((d,i)=>(
                <tr key={i} className={d.best?'cmp-best':''}>
                  <td style={{textAlign:'left'}}>{d.label}{d.best && <span className="best-tag">best for freedom</span>}</td>
                  <td className="tnum">{gbpC(d.invested)}</td>
                  <td className="tnum">{d.freedomAge!=null?ageStr(d.freedomAge):'—'}</td>
                  <td className="tnum">{gAcc(d.pension)}</td>
                  <td className="tnum">{gbpC(d.bridge * rf(d.freedomAge!=null?d.freedomAge:result.effectiveStop))}</td>
                  <td className="tnum">{gbpC(d.income)}/yr</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {comparison.length>0 && (() => {
          const best = comparison[0];
          const penOpt = comparison.find(d=>d.key==='pension');
          const bestIsAccessible = best.key==='isa'||best.key==='gia'||best.key==='cash';
          return <div className="cmp-rec">
            <b>Recommendation:</b> {bestIsAccessible
              ? gbp(compareAmount)+' as “'+best.label+'” reaches Freedom Age '+ageStr(best.freedomAge)+(penOpt&&penOpt.freedomAge!=null&&penOpt.freedomAge>best.freedomAge?' — '+monthsStr(Math.round((penOpt.freedomAge-best.freedomAge)*12))+' sooner than pension':'')+'. Accessible money funds the bridge to pension access, which pension (locked until '+inputs.pensionAccessAge+') can’t — though pension would build a bigger pot and higher lifetime income for later.'
              : '“'+best.label+'” gives the earliest Freedom Age ('+ageStr(best.freedomAge)+') here.'}
          </div>;
        })()}
      </div>

      {/* ===== OUTPUTS ===== */}
      <div className="outputs-block">
      {/* OPPORTUNITY + RISK */}
      <div className="grid2">
        <div className="panel">
          <h2>⭐ Biggest opportunities</h2>
          <div className="desc">Your top three levers to bring Freedom forward — click any to apply it.</div>
          {opps.length===0 && <div className="muted">Set an achievable plan to see opportunities.</div>}
          {opps.slice(0,3).map((o,i) => (
            <button className="oppitem clickable" key={i} onClick={()=>applyPatch(o.patch)} title="Apply this change to your plan">
              <span className="lab">{o.label}</span>
              <span className={'delta '+(o.deltaMonths>0?'pos':'neg')}>{o.deltaMonths>0?'▲ '+monthsStr(o.deltaMonths)+' earlier':o.deltaMonths<0?'▼ later':'≈ no change'} <span className="apply-hint">apply →</span></span>
            </button>
          ))}
        </div>
        <div className="panel">
          <h2>⚠ Biggest risks</h2>
          <div className="desc">What pushes your Freedom Age back most — click to stress-test your plan against it.</div>
          {rks.map((o,i) => (
            <button className="oppitem clickable" key={i} onClick={()=>applyPatch(o.patch)} title="Apply this scenario to stress-test your plan">
              <span className="lab">{o.label}</span>
              <span className="delta neg">{o.breaks?'✕ plan fails':'▼ '+monthsStr(o.deltaMonths)+' later'} <span className="apply-hint">apply →</span></span>
            </button>
          ))}
        </div>
      </div>

      {/* SUCCESS LIGHTS */}
      <div className="panel" style={{marginBottom:16}}>
        <h2 style={{marginBottom:4}}>Success indicators</h2>
        <div className="desc">The three pillars of the plan — plus overall. Green means the projection meets what that pillar needs; red means a shortfall. Each shows the figures behind it.</div>
        <div className="lights">
          <div className="light" title={'Projected pension £'+Math.round(result.pension.atAccess).toLocaleString('en-GB')+' at access vs £'+Math.round(result.pension.required).toLocaleString('en-GB')+' required.'}>
            <span className={'ld '+lightFor(result.pension.status)}></span>
            <span className="name">Pension</span>
            <span className="st">{result.pension.status==='behind'?'Behind target':'On track'}</span>
            <span className="lsub">{gbpC(result.pension.atAccess)} vs {gbpC(result.pension.required)} needed at {inputs.pensionAccessAge}</span></div>
          <div className="light" title={'Accessible-wealth Bridge Planner: projected ISA/GIA £'+Math.round(bridge.base.balanceAtAccess||0).toLocaleString('en-GB')+' at access vs the £'+Math.round(bridge.targetPot).toLocaleString('en-GB')+' portfolio target.'}>
            <span className={'ld '+(bridge.base.reached ? 'g' : ((bridge.base.balanceAtAccess||0) >= bridge.base.targetAtAccess*0.9 ? 'a' : 'r'))}></span>
            <span className="name">Bridge</span>
            <span className="st">{bridge.base.reached ? 'Optional at '+bridge.base.crossAge : 'Not by '+bridgeInputs.pensionAccessAge}</span>
            <span className="lsub">{bridge.base.reached
              ? gbpC(bridge.base.crossBalance)+' ≥ '+gbpC(bridge.targetPot)+' target at age '+bridge.base.crossAge
              : gbpC(bridge.base.balanceAtAccess)+' vs '+gbpC(bridge.targetPot)+' by age '+bridgeInputs.pensionAccessAge+' — see Bridge Planner'}</span></div>
          <div className="light" title={'Sustainable retirement income £'+Math.round(result.retirement.sustainableIncome).toLocaleString('en-GB')+'/yr vs £'+Math.round(result.retirement.target).toLocaleString('en-GB')+'/yr target.'}>
            <span className={'ld '+lightFor(result.retirement.status)}></span>
            <span className="name">Retirement</span>
            <span className="st">{result.retirement.status==='behind'?'Below target':'Target income'}</span>
            <span className="lsub">{gbpC(result.retirement.sustainableIncome)}/yr vs {gbpC(result.retirement.target)}/yr target</span></div>
          <div className="light" title={confidenceWhy}>
            <span className={'ld '+overall}></span>
            <span className="name">Overall</span>
            <span className="st">{
              (!result.planSurvives && result.failPhase==='bridge') ? 'Bridge shortfall'
              : !result.planSurvives ? 'Plan runs short'
              : result.overridden ? 'Optional at '+Math.round(result.effectiveStop)
              : result.achievable ? 'Optional by '+Math.round(result.optionalityAge)
              : 'Not yet optional'}</span>
            <span className="lsub">{
              (!result.planSurvives && result.failPhase==='bridge') ? 'accessible runs dry ~age '+(result.failAge!=null?Math.floor(result.failAge):'—')+'; ≈'+gbpC(result.endWorth)+' locked in pension'
              : !result.planSurvives ? 'runs out ~age '+(result.failAge!=null?Math.floor(result.failAge):inputs.lifeExpectancy)
              : '≈'+gbpC(result.endWorth)+' left at age '+inputs.lifeExpectancy}</span></div>
        </div>
      </div>

      {/* CHARTS */}
      <div className="section-title">Projections</div>
      <div className="grid2">
        <div className="panel">
          <div className="chart-h"><h2>Pension vs target</h2></div>
          <div className="desc">Projected pot against the value needed at access age {inputs.pensionAccessAge}.</div>
          {ResponsiveContainer ? (
          <ResponsiveContainer width="100%" height={230}>
            <LineChart data={chartData} margin={{top:6,right:12,left:4,bottom:0}}>
              <CartesianGrid stroke={C.grid} vertical={false} />
              <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} />
              <YAxis stroke={C.axis} tick={{fontSize:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={44} />
              <Tooltip content={<ChartTip/>} />
              <ReferenceLine x={inputs.pensionAccessAge} stroke={C.axis} strokeDasharray="3 3" />
              <Line type="monotone" dataKey="required" name="Target" stroke={C.red} strokeWidth={2} dot={false} strokeDasharray="5 4" />
              <Line type="monotone" dataKey="pension" name="Projected" stroke={C.pension} strokeWidth={2} dot={false} />
            </LineChart>
          </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
          <div className="legend-row">
            <span><span className="sw" style={{background:C.pension}}></span>Projected pension</span>
            <span><span className="sw" style={{background:C.red}}></span>Required at access</span>
          </div>
        </div>

        <div className="panel">
          <div className="chart-h"><h2>Combined net worth</h2></div>
          <div className="desc">Pension, ISA, GIA, cash{nw.homeEquity>0?' and home equity':''} over time.</div>
          {ResponsiveContainer ? (
          <ResponsiveContainer width="100%" height={230}>
            <AreaChart data={chartData} margin={{top:6,right:12,left:4,bottom:0}}>
              <CartesianGrid stroke={C.grid} vertical={false} />
              <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} />
              <YAxis stroke={C.axis} tick={{fontSize:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={44} />
              <Tooltip content={<ChartTip/>} />
              <ReferenceLine x={inputs.pensionAccessAge} stroke={C.axis} strokeDasharray="3 3" />
              {nw.homeEquity>0 && <Area type="monotone" dataKey="home" name="Home equity" stackId="1" stroke={C.home} fill={C.home} fillOpacity={0.5} />}
              <Area type="monotone" dataKey="cash" name="Cash" stackId="1" stroke={C.cash} fill={C.cash} fillOpacity={0.5} />
              <Area type="monotone" dataKey="gia" name="GIA" stackId="1" stroke={C.gia} fill={C.gia} fillOpacity={0.5} />
              <Area type="monotone" dataKey="isa" name="ISA" stackId="1" stroke={C.isa} fill={C.isa} fillOpacity={0.5} />
              <Area type="monotone" dataKey="pension" name="Pension" stackId="1" stroke={C.pension} fill={C.pension} fillOpacity={0.5} />
            </AreaChart>
          </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
          <div className="legend-row">
            <span><span className="sw" style={{background:C.pension}}></span>Pension</span>
            <span><span className="sw" style={{background:C.isa}}></span>ISA</span>
            <span><span className="sw" style={{background:C.gia}}></span>GIA</span>
            <span><span className="sw" style={{background:C.cash}}></span>Cash</span>
            {nw.homeEquity>0 && <span><span className="sw" style={{background:C.home}}></span>Home</span>}
          </div>
        </div>
      </div>

      <div className="panel" style={{marginBottom:16}}>
        <div className="chart-h"><h2>Annual cash flow</h2></div>
        <div className="desc">Contributions in (positive) and withdrawals out (negative), split by where the money comes from.</div>
        {ResponsiveContainer ? (
        <ResponsiveContainer width="100%" height={220}>
          <ComposedChart data={chartData} margin={{top:6,right:12,left:4,bottom:0}} stackOffset="sign">
            <CartesianGrid stroke={C.grid} vertical={false} />
            <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} />
            <YAxis stroke={C.axis} tick={{fontSize:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={44} />
            <Tooltip content={<ChartTip/>} />
            <ReferenceLine y={0} stroke={C.baseline} />
            <Bar dataKey="contributions" name="Contributions" fill={C.isa} radius={[3,3,0,0]} maxBarSize={18} stackId="cf" />
            <Bar dataKey="withdrawals" name="ISA/GIA withdrawals" fill={C.red} radius={[0,0,0,0]} maxBarSize={18} stackId="cf" />
            <Bar dataKey="pensionWithdrawals" name="Pension withdrawals" fill={C.gia} radius={[0,0,3,3]} maxBarSize={18} stackId="cf" />
          </ComposedChart>
        </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
        <div className="legend-row">
          <span><span className="sw" style={{background:C.isa}}></span>Contributions in</span>
          <span><span className="sw" style={{background:C.red}}></span>ISA/GIA withdrawals</span>
          <span><span className="sw" style={{background:C.gia}}></span>Pension withdrawals</span>
        </div>
      </div>

      {/* YEAR BY YEAR TABLE */}
      <div className="section-title">Year-by-year cash flow</div>
      <div className="panel" style={{marginBottom:16}}>
        <div className="chart-h" style={{marginBottom:10}}>
          <div className="legend-row" style={{margin:0}}>
            <span><span className="sw" style={{background:'var(--series-pension)'}}></span>Accumulation</span>
            <span><span className="sw" style={{background:'var(--warning)'}}></span>Bridge</span>
            <span><span className="sw" style={{background:'var(--series-isa)'}}></span>Retirement</span>
            <span className="terms-tag">{realTerms?'today’s money':'future £ (nominal)'}</span>
          </div>
          <button className="btn" onClick={()=>setShowAllRows(!showAllRows)}>{showAllRows?'Collapse':'Show all years'}</button>
        </div>
        <div className="desc" style={{marginTop:0,marginBottom:10}}>“Out” shows where each year’s spending is drawn from — ISA/GIA/cash during the bridge, then your pension once you can access it. {realTerms?'Figures are in today’s money.':'Figures are future (nominal) pounds — toggle “Today’s money” in the toolbar to see them in today’s terms.'}</div>
        <div className="tablewrap" style={{maxHeight:showAllRows?520:'auto'}}>
          <table>
            <thead>
              <tr className="grouprow">
                <th></th><th colSpan={5} className="grp grp-p">Pension</th><th colSpan={5} className="grp grp-a">ISA / GIA / cash</th><th></th><th></th>
              </tr>
              <tr>
                <th>Age</th>
                <th>Start</th><th>In</th><th>Out</th><th>Growth</th><th>End</th>
                <th>Start</th><th>In</th><th>Out</th><th>Growth</th><th>End</th>
                <th title={'Spending drawn from your invested pot this year, as a % of the pot. Your sustainable guide is '+(inputs.withdrawalRate*100).toFixed(1)+'%. Highlighted when above it.'}>Draw&nbsp;rate</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody>
              {(showAllRows?rows:rows.filter((r,i)=> i%2===0 || r.phase!=='accumulation')).map((r,i) => (
                <tr key={i} className={r.phase}>
                  <td>{r.age}</td>
                  <td>{money(r.pensionStart, r.age)}</td>
                  <td>{r.pensionIn?money(r.pensionIn, r.age):'—'}</td>
                  <td>{r.pensionWithdraw?<span style={{color:'var(--critical)'}}>{money(-r.pensionWithdraw, r.age)}</span>:'—'}</td>
                  <td>{money(r.pensionGrowth, r.age)}</td>
                  <td>{money(r.pensionEnd, r.age)}</td>
                  <td>{money(r.accessStart, r.age)}</td>
                  <td>{r.accessIn?money(r.accessIn, r.age):'—'}</td>
                  <td>{r.accessOut?<span style={{color:'var(--critical)'}}>{money(-r.accessOut, r.age)}</span>:'—'}</td>
                  <td>{money(r.growth, r.age)}</td>
                  <td>{money(r.accessEnd, r.age)}</td>
                  <td className="tnum" style={r.withdrawalRate>inputs.withdrawalRate*1.05?{color:'var(--critical)',fontWeight:600}:{color:'var(--muted)'}}>
                    {r.withdrawalRate>0 && r.phase!=='accumulation' ? (r.withdrawalRate*100).toFixed(1)+'%' : '—'}</td>
                  <td className="notecell">{r.notes}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {!showAllRows && <div className="note">Showing a sample of years — “Show all years” for the full schedule. Export the complete table with the CSV button.</div>}
      </div>
      </div>{/* end outputs-block */}
      </main>{/* end main */}

      {/* ===== SIDEBAR: all the inputs that build the simulation ===== */}
      <aside className="sidebar">
      <div className="sb-inner">
        <div className="sb-head">🧮 Your inputs</div>
        <div className="sb-note">The simulation is built from these — add your current position, assumptions and any cash events. Everything updates live.</div>
        <div className="qedit sb-block">
          <h3 className="sb-sec">Current position</h3>
          <div className="qgrid">
            <div className="qcell"><label>Pension</label>
              <div className="qin"><span>£</span><NumInput step={1000} min={0} value={inputs.pensionCurrent} ariaLabel="Current pension" onChange={v=>set({pensionCurrent:v})} /></div></div>
            <div className="qcell"><label>ISA</label>
              <div className="qin"><span>£</span><NumInput step={1000} min={0} value={inputs.isaCurrent} ariaLabel="Current ISA" onChange={v=>set({isaCurrent:v})} /></div></div>
            <div className="qcell"><label>GIA</label>
              <div className="qin"><span>£</span><NumInput step={1000} min={0} value={inputs.giaCurrent} ariaLabel="Current GIA" onChange={v=>set({giaCurrent:v})} /></div></div>
            <div className="qcell"><label>Cash</label>
              <div className="qin"><span>£</span><NumInput step={1000} min={0} value={inputs.cashCurrent} ariaLabel="Current cash" onChange={v=>set({cashCurrent:v})} /></div></div>
          </div>
        </div>
      <div className="inputs-block">
      <div className="inputs-grid">
        <Section title="Personal" open id="sec-personal">
          <Num label="Current age" value={inputs.currentAge} onChange={v=>set({currentAge:v})} />
          <Num label="Desired optionality age (target)" value={inputs.targetOptionalityAge} onChange={v=>set({targetOptionalityAge:v})} />
          <Num label="Pension access age" value={inputs.pensionAccessAge} onChange={v=>set({pensionAccessAge:v})} />
          <Num label="Life expectancy" value={inputs.lifeExpectancy} onChange={v=>set({lifeExpectancy:v})} />
          <Num label="State Pension age" value={inputs.statePensionAge} onChange={v=>set({statePensionAge:v})} />
          <label className="switch"><input type="checkbox" checked={inputs.statePensionIncluded} onChange={e=>set({statePensionIncluded:e.target.checked})} />Include State Pension</label>
          {inputs.statePensionIncluded && <Num label="State Pension (annual, today's £)" value={inputs.statePensionAmount} onChange={v=>set({statePensionAmount:v})} prefix="£" />}
        </Section>

        <Section title="Pension" id="sec-pension">
          <Num label="Current pension value" value={inputs.pensionCurrent} onChange={v=>set({pensionCurrent:v})} prefix="£" />
          <Num label="Employer contribution (annual)" value={inputs.employerContribution} onChange={v=>set({employerContribution:v})} prefix="£" />
          <Pct label="Expected annual return (nominal)" value={inputs.pensionReturn} onChange={v=>set({pensionReturn:v})} />
          <Pct label="Annual fee" value={inputs.pensionFee} onChange={v=>set({pensionFee:v})} />
          <Pct label="Target withdrawal rate" value={inputs.withdrawalRate} onChange={v=>set({withdrawalRate:v})} />
          <Pct label="Pension safety margin (on top of target)" value={inputs.pensionBuffer} onChange={v=>set({pensionBuffer:v})} />
          <div className="note">The Coast age and pension status aim for the required pot × (1 + margin). 0% = just the target; 10–20% adds a cushion so “stop contributing” isn’t called on a razor-thin surplus.</div>
        </Section>

        <Section title="ISA">
          <Num label="Current ISA value" value={inputs.isaCurrent} onChange={v=>set({isaCurrent:v})} prefix="£" />
          <Pct label="Expected return" value={inputs.isaReturn} onChange={v=>set({isaReturn:v})} />
        </Section>

        <Section title="GIA">
          <Num label="Current GIA value" value={inputs.giaCurrent} onChange={v=>set({giaCurrent:v})} prefix="£" />
          <Pct label="Expected return" value={inputs.giaReturn} onChange={v=>set({giaReturn:v})} />
          <Pct label="Tax drag" value={inputs.giaTaxDrag} onChange={v=>set({giaTaxDrag:v})} />
          <Num label="Current cash" value={inputs.cashCurrent} onChange={v=>set({cashCurrent:v})} prefix="£" />
        </Section>

        <Section title="Spending">
          <div className="note" style={{marginTop:0,marginBottom:6}}>Spending is in <b>today’s money</b> and holds its real value — the cash actually withdrawn rises with inflation, but its buying power stays constant.</div>
          <Num label="Bridge spending / yr (before pension access)" value={inputs.bridgeSpending} onChange={v=>set({bridgeSpending:v})} prefix="£" />
          <Num label="Retirement spending / yr (after access)" value={inputs.retirementSpending} onChange={v=>set({retirementSpending:v})} prefix="£" />
          <Pct label="Expected return during bridge" value={inputs.bridgeReturn} onChange={v=>set({bridgeReturn:v})} />
          <Pct label="Inflation" value={inputs.inflation} onChange={v=>set({inflation:v})} />
          <div className="note" style={{marginTop:6}}>Returns are <b>nominal</b> (before inflation). The <b>{realTerms?'Today’s money':'Future £'}</b> toggle in the top bar shows every figure in today’s money (real) or future pounds (nominal) — real ≈ nominal return − inflation.</div>
        </Section>

        <Section title="Property (optional)">
          <Num label="Home value" value={inputs.homeValue} onChange={v=>set({homeValue:v})} prefix="£" />
          <Num label="Mortgage outstanding" value={inputs.mortgage} onChange={v=>set({mortgage:v})} prefix="£" />
          <div className="note">Home equity is shown in net worth but not drawn on to fund optionality.</div>
        </Section>

        <Section title="Future cash events" open span id="sec-events">
          <div className="note" style={{marginTop:0,marginBottom:8}}>Money <b>in</b> — earn-out, inheritance, house sale, bonus. Or one-off <b>hits (out)</b> — house purchase, school fees, new car, tax bill.
            Timed in <b>years from now</b>: e.g. a £100k lump sum in 5 years → set amount 100000, In, 5&nbsp;yrs.</div>
          <div className="event-row" style={{marginBottom:2}}>
            <span className="evh">Name</span><span className="evh">In / out</span><span className="evh">Amount £</span>
            <span className="evh">In (yrs)</span><span className="evh">Account</span><span></span>
          </div>
          {inputs.cashEvents.map((ev,i) => {
            const dir = ev.direction || 'in';
            const acct = ev.account || ev.destination || 'gia';
            const yrs = ev.yearsFromNow != null ? ev.yearsFromNow
              : (ev.age != null ? Math.max(0, Math.round(ev.age - inputs.currentAge)) : 0);
            return (
            <div className="event-row" key={i}>
              <input type="text" value={ev.name} onChange={e=>updEvent(i,{name:e.target.value})} title="Name" />
              <select value={dir} onChange={e=>updEvent(i,{direction:e.target.value})} title="Direction"
                style={dir==='out'?{color:'var(--critical)',fontWeight:600}:{color:'var(--good-text)',fontWeight:600}}>
                <option value="in">In +</option><option value="out">Out −</option>
              </select>
              <NumInput value={ev.amount} min={0} onChange={v=>updEvent(i,{amount:Math.abs(v)})} title="Amount" ariaLabel="Amount" />
              <div style={{position:'relative',display:'flex',alignItems:'center'}}>
                <NumInput value={yrs} min={0} style={{paddingRight:26}}
                  onChange={v=>updEvent(i,{yearsFromNow:Math.max(0,v)})}
                  title={'In how many years from now (→ age '+(inputs.currentAge+yrs)+')'} ariaLabel="Years from now" />
                <span style={{position:'absolute',right:7,fontSize:11,color:'var(--muted)',pointerEvents:'none'}}>yrs</span>
              </div>
              <select value={acct} onChange={e=>updEvent(i,{account:e.target.value,destination:e.target.value})} title={dir==='out'?'Paid from':'Paid into'}>
                <option value="pension">Pension</option><option value="isa">ISA</option>
                <option value="gia">GIA</option><option value="cash">Cash</option>
              </select>
              <button className="icon-btn" onClick={()=>delEvent(i)} title="Remove">✕</button>
            </div>
            );
          })}
          <button className="add-link" onClick={addEvent}>+ Add cash event</button>
        </Section>
      </div>
      </div>{/* end inputs-block */}

      <div className="foot-block">
      <div className="assumptions">
        <b>How the optionality age is calculated.</b> The engine finds the earliest age at which you can stop
        earning permanently and still fund spending every year to age {inputs.lifeExpectancy}, drawing on
        accessible wealth (ISA/GIA/cash) during the bridge to age {inputs.pensionAccessAge}, then pension plus
        any remainder — with the State Pension from age {inputs.statePensionAge}{inputs.statePensionIncluded?'':' (excluded)'}.
        Returns are entered nominal; spending is in today’s money and holds its real value. Every figure is shown in
        <b> {realTerms?'today’s money (real)':'future £ (nominal)'}</b> — switch with the toggle in the top bar.
        This is a planning model, not financial advice — sense-check the assumptions against your own circumstances and tax position.
      </div>

      <div className="note" style={{textAlign:'center',marginTop:20}}>Inputs auto-save to this browser. Financial Optionality Dashboard.</div>
      </div>{/* end foot-block */}
      </div>{/* end sb-inner */}
      </aside>{/* end sidebar */}
      </div>{/* end layout */}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
