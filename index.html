    // pension at objAge WITH all contributions (value leaving the objective year)
    var finalProjected = projAfterObj != null ? projAfterObj
      : (rows.length ? (rows[rows.length - 1].projected + rows[rows.length - 1].contribution) * (1 + g) : running);
    // objAge row projected is the value entering objAge:
    if (potAtObj == null) potAtObj = rows.length ? rows[rows.length - 1].projected : running;

    var requiredNow = rows.length ? rows[0].required : targetPot;
    var yearsToObj = objAge - cp.currentAge;
    var meetsTarget = potAtObj >= targetPot - 1;

    return {
      rows: rows,
      objAge: objAge,
      targetPot: targetPot,
      withdrawalRate: wr,
      coastAge: coastAge,
      coastAgeExact: coastAgeExact,
      coasting: coastAge !== null && coastAge <= cp.currentAge,
      reached: coastAge !== null,
      coastBalance: coastBalance,
      yearsUntilCoast: coastAge !== null ? Math.max(0, coastAge - cp.currentAge) : null,
      shortfallNow: Math.max(0, requiredNow - cp.currentPension),
      potAtObj: potAtObj,
      incomeAtObj: potAtObj * wr,
      drawIncome: drawIncome,
      coastDepletionAge: coastDepletionAge,
      meetsTarget: meetsTarget,
      requiredNow: requiredNow
    };
  }

  /* =====================================================================
     "Then when COULD I?"
     ---------------------------------------------------------------------
     When the pot doesn't reach the target by the age somebody picked, the
     useful answer is not "no". It is the age at which the answer becomes
     yes. Telling a 56-year-old their pension is £14k short at 65 and
     leaving it there makes them do the search themselves, badly.

     Pushing the date back helps in two separate ways, and both are real:
       * more years of contributions, and more years of compounding; and
       * a SMALLER target — retire before the State Pension starts and the
         pot has to self-fund that income over the gap, so every year you
         wait shrinks the bridge it has to carry (see coastTargetPot).
     Testing each candidate age with retirementAge set to that age is what
     captures the second one; a naive "keep growing the pot until it passes
     today's target" would overstate the wait.

     Contributions follow the work: a period that runs to the retirement
     age means "I pay in until I stop working", so it is extended with the
     date. A period the user deliberately ended earlier is left alone —
     they have said contributions stop then, and they meant it.
     ===================================================================== */
  function coastWorkUntil(cp, sc, capAge) {
    cp = fillCoast(cp);
    sc = sc || { growth: cp.growth, withdrawalRate: cp.withdrawalRate };
    var from = Math.round(coastObjAge(cp, sc));
    var cap = Math.round(capAge || Math.max(from + 15, 75));
    for (var a = from; a <= cap; a++) {
      var x = Object.assign({}, cp, {
        retirementAge: a,
        phases: (cp.phases || []).map(function (p) {
          return (p.toAge === from) ? Object.assign({}, p, { toAge: a }) : p;
        })
      });
      var scA = Object.assign({}, sc, { retirementAge: a });
      var pot = coastBalanceIfRetireAt(x, a);
      var need = coastTargetPot(x, scA);
      if (pot >= need - 1) {
        return { age: a, extraYears: a - from, pot: pot, target: need,
                 // did waiting help mainly by saving more, or by needing less?
                 targetAtFrom: coastTargetPot(cp, sc),
                 contributesLonger: (cp.phases || []).some(function (p) { return p.toAge === from; }) };
      }
    }
    return null;   // not reachable by the cap — the answer is a different plan
  }

  // "If I stopped contributing at age X…" — pension at objAge for each stop age.
  function coastStopSchedule(cp, sc) {
    var objAge = coastObjAge(cp, sc), targetPot = coastTargetPot(cp, sc), out = [];
    for (var a = cp.currentAge; a <= objAge; a++) {
      var fin = coastFinalIfStop(cp, sc, a);
      out.push({ stopAge: a, finalPension: fin, meetsTarget: fin >= targetPot - 1,
                 yearsContributing: a - cp.currentAge });
    }
    return out;
  }

  // Compare flat annual contribution levels: coast age, final pot, income.
  function coastContributionImpact(cp, sc) {
    var levels = cp.impactLevels || [20000, 40000, 60000];
    return levels.map(function (lvl) {
      var x = JSON.parse(JSON.stringify(cp));
      x.phases = [{ fromAge: cp.currentAge, toAge: coastObjAge(cp, sc), annual: lvl }];
      var r = coastProject(x, sc);
      return { level: lvl, coastAge: r.coastAge, finalPension: r.potAtObj, income: r.incomeAtObj };
    });
  }

  function coastPlan(cp) {
    cp = fillCoast(cp);
    var baseSc = { growth: cp.growth, withdrawalRate: cp.withdrawalRate, retirementAge: cp.retirementAge };
    var sc = cp.scenarios || {};
    var cons = Object.assign({}, COAST_DEFAULTS.scenarios.conservative, sc.conservative);
    var opt = Object.assign({}, COAST_DEFAULTS.scenarios.optimistic, sc.optimistic);
    var base = coastProject(cp, baseSc);
    return {
      base: base,
      conservative: coastProject(cp, cons),
      optimistic: coastProject(cp, opt),
      stopSchedule: coastStopSchedule(cp, baseSc),
      targetPot: base.targetPot,
      objAge: base.objAge
    };
  }

  // =====================================================================
  //  SEQUENCE RISK — PENSION DRAWDOWN (Coast planner)
  //  The same idea as the bridge stress test, applied to the RETIREMENT
  //  drawdown: from the retirement age you draw your income (real, less the
  //  State Pension once it starts) against variable real returns, out to life

  // MORTGAGE OVERPAYMENT vs INVESTING — side calculator

                    saved: round2(lastRow.gainA), growth: round2(lastRow.gainB),

      },

/* ---------- analytics: never throws, no-ops when tracking is off ---------- */
const TRK = {
  ev:  (n, p) => { try { window.OptTrack && window.OptTrack.track(n, p); } catch(e){} },
  once:(scope, n, p) => { try { window.OptTrack && window.OptTrack.once(scope, n, p); } catch(e){} },
  fired:(n) => { try { return !!(window.OptTrack && window.OptTrack.hasFired(n)); } catch(e){ return false; } },
  firedEarlier:(n) => { try { return !!(window.OptTrack && window.OptTrack.hasFired(n) && !window.OptTrack.firedThisSession(n)); } catch(e){ return false; } },
  /* durable per-device flags that outlive a page load */
  mark:(k) => { try { return !!(window.OptTrack && window.OptTrack.mark && window.OptTrack.mark(k)); } catch(e){ return false; } },
  marked:(k) => { try { return !!(window.OptTrack && window.OptTrack.marked && window.OptTrack.marked(k)); } catch(e){ return false; } },
  /* fires when a <details> is opened, not when it's closed again */
  open:(n) => (e) => { try { if (e.target.open) TRK.once('session', n); } catch(err){} }
};

/* ---------- things the person has already been told ----------
   One-off acknowledgements: the pre-results disclaimer, and the "keep your
   plan" nudge once they have dismissed it.

   ⚠️ NOT stored through OptTrack's mark()/marked(), which is where the other
   durable per-device flags live. OptTrack bails out entirely when Global
   Privacy Control is set, and again inside an admin plan preview — so a mark
   would never stick for those people and they would be shown the disclaimer on
   EVERY load. An acknowledgement is a preference, not analytics, and belongs
   with the plan.

   Under the `optionality.` prefix on purpose: it rides the cloud sync with
   everything else (acknowledge on your laptop, don't get asked again on your
   phone) and it is shadowed by the read-only preview shim, so opening
   somebody's plan from the admin page cannot write to it. */
const ACK_KEY = 'optionality.ack';
function readAck(){
  try { return JSON.parse(localStorage.getItem(ACK_KEY) || '{}') || {}; } catch(e){ return {}; }
}
function writeAck(patch){
  try {
    const next = Object.assign(readAck(), patch);
    localStorage.setItem(ACK_KEY, JSON.stringify(next));
    return next;
  } catch(e){ return readAck(); }
}

/* ---------- formatting helpers ---------- */
const gbp = (x, dp) => {
  if (x == null || isNaN(x)) return '—';
  return new Intl.NumberFormat('en-GB', { style:'currency', currency:'GBP',
    minimumFractionDigits: dp||0, maximumFractionDigits: dp||0 }).format(x);
};
/* The one compact currency format, used for every figure on the page —
   cards, planners, tables and chart axes — so a pot never reads as £1.22M in
   one place and £1.2M in another. */
const gbpC = (x) => {
  if (x == null || isNaN(x)) return '—';
  const a = Math.abs(x);
  if (a >= 1e6) return '£' + (x/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if (a >= 1e3) return '£' + Math.round(x/1e3) + 'k';
  return '£' + Math.round(x);
};
const ageStr = (a) => a == null ? '—' : a.toFixed(1);
/* A personal figure that hasn't been entered yet is null, and null is NOT
   zero — see Engine's first-use notes. `num` is how the UI reads one where it
   needs an actual number to work with (a phase's default end age, a chart
   bound) without turning "not said yet" into "£0". */
const num = (v, fallback) => (typeof v === 'number' && isFinite(v)) ? v : fallback;
const isSet = (v) => typeof v === 'number' && isFinite(v);
const monthsStr = (m) => {
  const s = Math.round(Math.abs(m)); const y = Math.floor(s/12); const mo = s%12;
  if (y === 0) return mo + ' month' + (mo===1?'':'s');
  if (mo === 0) return y + ' year' + (y===1?'':'s');
  return y + 'y ' + mo + 'm';
};
/* "6 years 8 months away" — the distance-from-today line under a headline age */
const awayStr = (yrs) => {
  if (yrs == null || isNaN(yrs)) return '';
  const t = Math.max(0, Math.round(yrs * 12));
  if (t <= 0) return 'Reached — you could stop now';
  const y = Math.floor(t / 12), mo = t % 12, parts = [];
  if (y) parts.push(y + ' year' + (y === 1 ? '' : 's'));
  if (mo) parts.push(mo + ' month' + (mo === 1 ? '' : 's'));
  return parts.join(' ') + ' away';
};

/* ---------- inline explanation ----------

/* ---------- headline card ----------

   its answer changes, so an edit to an assumption is visibly connected to the
   result rather than something you have to go looking for. */
function HCard({ k, dot, v, sub, prompt, ask, waiting, jumpTo }) {
  const [flash, setFlash] = useState(false);
  const prev = useRef(v);
  useEffect(() => {
    if (prev.current === v) return;
    prev.current = v;
    setFlash(true);
    const t = setTimeout(() => setFlash(false), 900);
    return () => clearTimeout(t);
  }, [v]);
  // Tapping a card jumps to the planner behind it. This is the answer to
  // "does mobile need a sticky nav": it removes the same scrolling friction
  // without permanently spending 56px of every screen on a toolbar.
  const jump = () => {
    if (!jumpTo || typeof document === 'undefined') return;
    const el = document.getElementById(jumpTo);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  };

    <div className={'hcard' + (flash ? ' changed' : '') + (jumpTo ? ' tappable' : '') + (waiting ? ' waiting' : '')}
      onClick={jumpTo ? jump : undefined}

/* ---------- install as an app ----------
   Chromium fires beforeinstallprompt (captured in the head before React mounts);
   iOS Safari never does, and Chrome's own banner is heuristic and often silent —
   which is why this is an explicit menu item with written steps as the fallback. */
function useInstall() {
  const read = () => {
    if (typeof window === 'undefined') return { standalone:false, canPrompt:false, platform:'other' };
    const ua = navigator.userAgent || '';
    const iOS = /iPad|iPhone|iPod/.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                       || navigator.standalone === true
                       || !!(window.__ffInstall && window.__ffInstall.installed);
    return {
      standalone: standalone,
      canPrompt: !!(window.__ffInstall && window.__ffInstall.deferred),
      platform: iOS ? 'ios' : (/Android/.test(ua) ? 'android' : 'desktop')
    };
  };
  const [st, setSt] = useState(read);
  useEffect(() => {
    if (typeof window === 'undefined') return;
    const sync = () => setSt(read());
    window.addEventListener('ff:installable', sync);
    window.addEventListener('ff:installed', sync);
    return () => {
      window.removeEventListener('ff:installable', sync);
      window.removeEventListener('ff:installed', sync);
    };
  }, []);
  // returns true if the browser's own install dialog was shown
  const promptInstall = async () => {
    const d = window.__ffInstall && window.__ffInstall.deferred;
    if (!d) return false;
    try {
      TRK.ev('install_prompted');
      d.prompt();
      const choice = await d.userChoice;
      TRK.ev(choice && choice.outcome === 'accepted' ? 'install_accepted' : 'install_dismissed');
      window.__ffInstall.deferred = null;
      setSt(read());
      return true;
    } catch (e) { return false; }
  };
  return { ...st, promptInstall };
}

/* ---------- is this account on the admin allowlist? ----------
   Drives the Admin link in the menu. is_admin() is SECURITY DEFINER and
   returns a plain boolean, so a non-admin simply gets false — the link is a
   convenience, not the security boundary (admin.html re-checks server-side). */
function useIsAdmin() {
  const [isAdmin, setIsAdmin] = useState(false);
  useEffect(() => {
    let alive = true;
    const check = () => {
      const C = (typeof window !== 'undefined') ? window.OptCloud : null;
      if (!C || !C.client || !C.getUser || !C.getUser()) { if (alive) setIsAdmin(false); return; }
      try {
        C.client.rpc('is_admin')
          .then(r => { if (alive) setIsAdmin(!r.error && r.data === true); })
          .catch(() => { if (alive) setIsAdmin(false); });
      } catch (e) { if (alive) setIsAdmin(false); }
    };
    check();
    if (typeof window === 'undefined') return;
    window.addEventListener('optcloud:auth', check);
    window.addEventListener('optcloud:ready', check);
    return () => { alive = false;
      window.removeEventListener('optcloud:auth', check);
      window.removeEventListener('optcloud:ready', check); };
  }, []);
  return isAdmin;
}

/* ---------- theme-aware chart colours ---------- */

/* ---------- viewport width hook (adaptive charts / labels) ---------- */
function useIsNarrow(px) {
  const q = '(max-width:' + (px || 560) + 'px)';
  const get = () => (typeof window !== 'undefined' && window.matchMedia) ? window.matchMedia(q).matches : false;
  const [narrow, setNarrow] = useState(get);
  useEffect(() => {
    if (typeof window === 'undefined' || !window.matchMedia) return;

/* ---------- robust number input ----------
   Keeps a local text buffer and selects-all on focus, so typing a new
   number always REPLACES the old one (no stray leading zero) while the
   dashboard still recalculates live on every keystroke. */
function NumInput({ value, onChange, step, min, className, style, title, ariaLabel, group, nullable, placeholder }) {
  // `nullable` = an empty box means "hasn't said yet", not "zero". That
  // distinction is the whole first-use model: £0 saved is a real answer plenty
  // of people have, and it must not look the same as a field nobody has got to
  // yet. Without this flag the box coerces blank to 0 on the way in and again
  // on blur, which would mark an untouched plan as filled in the moment it
  // rendered — and the empty state would be unreachable.
  //
  // `group` = thousands separators. £90,000 vs £90000 is the difference between
  // reading a balance and counting its digits, and it is the single most-scanned
  // thing on the page. Separators mean a text input (type=number can't show
  // them), so the raw value is restored on focus and reformatted on blur.
  const fmt = (v) => (v == null || isNaN(v)) ? '' : (group ? Number(v).toLocaleString('en-GB') : String(v));
  const parse = (raw) => parseFloat(String(raw).replace(/[^0-9.eE+-]/g, ''));
  const [txt, setTxt] = useState(() => fmt(value));
  const focused = useRef(false);
  useEffect(() => { if (!focused.current) setTxt(fmt(value)); }, [value, group]);
  const handle = (raw) => {
    setTxt(raw);
    // A nullable box that has been emptied says nothing to the model until it
    // is left. Clearing a figure marks the plan incomplete, which sends that
    // planner back to its setup card — and doing that on the keystroke that
    // empties the box would tear the field out from under the cursor of
    // someone who was only select-all-retyping a number. Blur decides.
    if (raw === '' || raw === '-' || raw === '.') { if (!nullable) onChange(0); return; }
    const n = parse(raw);
    if (!isNaN(n)) onChange(n);
  };
  return (
    <input type={group ? 'text' : 'number'} className={className} style={style}
      step={group ? undefined : (step || 'any')} min={group ? undefined : min}
      title={title} aria-label={ariaLabel} value={txt} placeholder={placeholder}
      inputMode={group ? 'numeric' : 'decimal'}
      autoComplete="off"
      onFocus={e => {
        focused.current = true;
        if (group) setTxt(value == null ? '' : String(value));
        const el = e.target;
        // select AFTER the unformatted value lands, or the selection is dropped
        requestAnimationFrame(() => { try { el.select(); } catch (err) {} });
      }}
      onBlur={() => {
        focused.current = false;
        if (nullable && String(txt).trim() === '') { setTxt(''); onChange(null); return; }
        let n = parse(txt);
        if (isNaN(n)) { if (nullable) { setTxt(''); onChange(null); return; } n = 0; }
        if (min != null) n = Math.max(min, n);
        setTxt(fmt(n));
        onChange(n);
      }}
      onChange={e => handle(e.target.value)} />
  );
}

/* ---------- custom tooltip ---------- */
function ChartTip({ active, payload, label, fmt, lbl }) {
  if (!active || !payload || !payload.length) return null;
  return (
    <div className="tooltip">
      <div className="t-age">{(lbl || 'Age') + ' ' + label}</div>
      {payload.filter(p => p.value != null).map((p,i) => (

          <span className="amt">{(fmt||gbpC)(p.value)}</span>

  );
}

/* =============================================================
   ISA / GIA BRIDGE PLANNER  ("Accessible Wealth")
   Self-contained module: its own inputs, its own year-by-year
   projection, scenarios and bridge framing. Answers: "When does my
   accessible wealth give me full optionality?"  All engine figures
   are REAL (today's money); the nominal view just re-inflates for
   display, so the crossover age never moves.

   Three things are kept apart on purpose, and the layout is built
   around the separation:
     1. what YOU tell us      — Your numbers, and the setup card
     2. what WE assume        — Advanced assumptions, pre-loaded
     3. what we TELL you      — the answer, the chart, the tables
   A first-time visitor should only have to deal with 1 and 3.
   ============================================================= */

/* ---------- setup-card field ----------
   Bigger label, bigger box, hint underneath. The hint is where "£0 is a
   perfectly good answer" gets said, because the alternative is people
   typing a number they don't have. */
function SuField({ label, hint, children }) {
  return (
    <div className="su-fld">

/* ---------- the one thing we say before the first answer ----------
   It stands between the last box and the first result, once ever, and it is
   deliberately a panel in the flow rather than a modal: a plain page that
   scrolls, that you can read at your own pace, and that you leave by pressing
   the button you were going to press anyway.

   No checkbox, no "I accept". A tickbox implies a contract and invites the
   reflex of clicking past it; the button already says "I understand". The
   point is that somebody has actually READ what the tool does and does not
   model — above all that tax is not in it — before they see a number they

function Disclaimer({ onAck }) {

    // Front and centre means it also takes the focus and stops the page moving
    // underneath it — otherwise it is just a box somebody scrolls past.

    el.style.overflow = 'hidden';
    if (btn.current) { try { btn.current.focus({ preventScroll:true }); } catch(e){ btn.current.focus(); } }
    return () => { el.style.overflow = prev; };
  }, []);
  return inBody(
    <div className="dscl-veil" role="dialog" aria-modal="true" aria-labelledby="dscl-h">
    <div className="dscl">
      <h3 className="dscl-h" id="dscl-h">Before we crunch the numbers</h3>
      <p><b>Future Funded is a planning tool, not financial advice.</b> It uses assumptions about
        investment returns and inflation to show the options that building pension and accessible
        investments could give you over time.</p>
      <p>It’s deliberately simplified and doesn’t model every downside or financial consequence.
        <b> Tax isn’t modelled</b> — including personal tax, pension tax relief, tax on withdrawals,
        or the different tax treatment of pensions, ISAs and GIAs. For simplicity, the numbers you
        enter are treated at face value.</p>
      <p><b>Investment returns aren’t guaranteed.</b> Investments can fall as well as rise, past
        performance doesn’t guarantee future returns, and actual outcomes could be materially
        different from the projections shown.</p>
      <p>Tax and pension rules can also change. Use Future Funded to explore possibilities rather
        than as a prediction or recommendation. If you’re unsure what’s right for you, consider
        speaking to a regulated financial adviser.</p>
      <div className="su-cta">
        <button className="su-go" ref={btn} onClick={onAck}>I understand — start planning →</button>
      </div>
    </div>
    </div>
  );
}

/* ---------- "keep your plan" ----------
   Shown ONCE, after the first real answer — never before it. Asking somebody
   to register before they have seen anything is a toll gate on a tool that
   works perfectly well without an account.

   ⚠️ THE COPY HAS TO BE TRUE, and this is the second version of it. The first
   was careful not to say "create an account to save your numbers", because
   that would imply they are otherwise lost and they are not — every figure is
   written to localStorage on each keystroke and survives a reload. So it
   offered the two things an account genuinely bought: other devices, and not
   losing the plan with the browser storage.

   Saved plans add a third, and it is the strongest of them: WITHOUT an account
   there is exactly one plan, and trying a pay rise means typing over the
   numbers you had. "Try different versions without losing your original" is
   therefore literally true, and it is the reason the wording below opens with
   the exploring rather than with the saving. Harry's copy, kept as close to
   verbatim as the layout allows. */
function SaveNudge({ onDismiss }) {
  return (
    <div className="nudge">
      <div className="nudge-txt">
        <div className="nudge-h">Want to keep exploring?</div>
        <p>Your plan is saved on this device. A free account keeps it safe across your devices — and
          lets you save several versions, so you can try a pay rise or a different retirement age
          without losing your original.</p>
      </div>
      <div className="nudge-act">
        <button className="su-go sm" onClick={() => {
          try { window.dispatchEvent(new CustomEvent('ff:open-auth')); } catch(e){}
        }}>Save my plan →</button>
        <button className="nudge-no" onClick={onDismiss}>Continue without saving</button>
      </div>
    </div>
  );
}

/* The reveal. There is nothing to submit — the model recalculates on every
   keystroke — but the button gives the moment a shape, and it is the one
   place the app says "right, here's your answer". Disabled until the last
   question is answered, with a count of what's left rather than a list of
   complaints against individual fields. */
function SuCta({ left, label, onGo }) {
  return (
    <div className="su-cta">
      <button className="su-go" disabled={left > 0} onClick={onGo}>{label}</button>
      {left > 0 ? <div className="su-left">{left} more to fill in</div> : null}
    </div>
  );
}

function BpNum({ value, onChange, step, min, money, pct, suffix, nullable, placeholder, big }) {
  // `.unset` fades the £ so an empty money field reads as a question rather
  // than as "£ nothing". It is deliberately NOT an error style — the user has
  // done nothing wrong by not having answered yet.
  return (
    <div className={'bp-inwrap'+(money?' money':'')+(pct?' pct':'')+(big?' big':'')
      +(nullable && value == null ? ' unset' : '')}>
      {money && <span className="pfx">£</span>}
      <NumInput value={value} onChange={onChange} step={step} min={min!=null?min:0} group={!!money}
        nullable={nullable} placeholder={placeholder} />
      {pct && <span className="sfx">%</span>}
      {suffix && !pct && <span className="sfx">{suffix}</span>}
    </div>
  );
}

function BridgePlanner({ bp, setBp, setAge, plan, C, realTerms, setRealTerms,
                        onRevealed, nudge }) {
  const base = plan.base, cons = plan.conservative, opt = plan.optimistic;
  const narrow = useIsNarrow();
  /* ---- is this plan set up yet? ----
     Engine.bridgeMissing is the single source of truth, shared with the
     headline cards above, so a card can never say "add your savings" while
     the planner below is showing a confident answer. */
  const missing = Engine.bridgeMissing(bp);
  const ready = missing.length === 0;
  // Already complete when the component mounted => a returning user, so go
  // straight to the answer. Filling the last box in this session earns the
  // reveal button instead.
  const [revealed, setRevealed] = useState(ready);
  // And if a required figure is later cleared, the reveal is withdrawn along
  // with it — otherwise typing the first digit of its replacement would make
  // the plan momentarily "complete" again and snap the form away mid-keystroke.
  useEffect(() => { if (!ready) setRevealed(false); }, [ready]);
  // The disclaimer stands between the last box and the first answer, once ever.
  // `pending` is the gap: they have pressed the button but haven't read it yet.
  // The disclaimer is a gate on the whole app now, met before anything else, so
  // the reveal here is simply the reveal.
  const go = () => { setRevealed(true); onRevealed && onRevealed(); };
  const showSetup = !(ready && revealed);
  // sequence-risk layers (memoised — the Monte Carlo is ~50ms, don't rerun on theme/units toggles)
  const stress = useMemo(() => Engine.bridgeStressTest(bp, bp.minResidual||0), [bp]);
  const sim = useMemo(() => Engine.bridgeSimulate(bp), [bp]);
  // display factor: engine is REAL; nominal view re-inflates by (1+infl)^t
  const bf = (age) => { const a0 = num(bp.currentAge, 0);
    return realTerms ? 1 : Math.pow(1 + (bp.inflation||0), (age||a0) - a0); };
  const m = (v, age) => gbpC(v * bf(age));

  const scEnabled = { base: !(bp.scenarios&&bp.scenarios.base&&bp.scenarios.base.enabled===false),
                      conservative: !!(bp.scenarios&&bp.scenarios.conservative&&bp.scenarios.conservative.enabled),
                      optimistic: !!(bp.scenarios&&bp.scenarios.optimistic&&bp.scenarios.optimistic.enabled) };

  const data = base.rows.map((r,i) => {
    const o = { age: r.age, target: r.target*bf(r.age), balance: r.balance*bf(r.age) };
    if (scEnabled.conservative && cons.rows[i]) o.cons = cons.rows[i].balance*bf(r.age);
    if (scEnabled.optimistic && opt.rows[i]) o.opt = opt.rows[i].balance*bf(r.age);
    return o;
  });

  const updScen = (key, patch) => setBp({ scenarios: Object.assign({}, bp.scenarios, { [key]: Object.assign({}, (bp.scenarios||{})[key], patch) }) });
  const updPhase = (i, patch) => setBp({ phases: bp.phases.map((p,idx)=> idx===i ? Object.assign({},p,patch) : p) });
  const addPhase = () => { const last = bp.phases[bp.phases.length-1];
    // every one of these can still be blank on a plan that isn't set up yet
    const start = num(bp.currentAge, 30);
    const from = last && num(last.toAge, null) != null ? last.toAge + 1 : start;
    setBp({ phases: bp.phases.concat([{ fromAge:from, toAge:Math.max(from, num(bp.pensionAccessAge, 57)), annual:0 }]) }); };
  const delPhase = (i) => { if (bp.phases.length<=1) return; setBp({ phases: bp.phases.filter((_,idx)=>idx!==i) }); };

  /* ---- contributions: one number, with the by-age editor one level down ----
     Almost everybody saves roughly the same amount every year until they
     stop, and asking them for From age / To age / Amount before they have
     told us anything is three questions where one would do. So the plain
     "£ a year" field IS the single-period case of the phase editor — the
     same data, not a parallel setting. Nothing is removed: open "Plan
     contributions by age" and the full editor is there, and once there is
     more than one period the simple field steps aside rather than lying
     about a total. */
  const onePhase = bp.phases.length === 1;
  const flatAnnual = onePhase ? bp.phases[0].annual : null;
  const setFlatAnnual = (v) => setBp({ phases: [Object.assign({}, bp.phases[0], { annual: v })] });
  // A period with no ages on it means "from now until the pension unlocks" —
  // which is what the engine assumes too. Materialise that the moment somebody
  // opens the by-age editor, so they are never shown empty age boxes.
  const materialisePhases = () => {
    if (!bp.phases.some(p => !isSet(p.fromAge) || !isSet(p.toAge))) return;
    const a = num(bp.currentAge, 30), end = Math.max(a, num(bp.pensionAccessAge, 57));
    setBp({ phases: bp.phases.map(p => Object.assign({}, p,
      { fromAge: num(p.fromAge, a), toAge: num(p.toAge, end) })) });
  };

  const reached = base.reached;
  const targetPot = plan.targetPot;
  /* ---- "then when COULD I?" — the bridge twin of the pension's Work-to age.
     The search runs past pension access to STATE PENSION age, because that is
     the next point at which income arrives from somewhere other than this pot.
     It only fires where the target does not vanish at access (Perpetual,
     Preserve, Partial); in the ordinary Bridge/Full model the plan always
     reaches by access and the answer is already on screen. */
  const workUntil = useMemo(() => reached ? null : Engine.bridgeWorkUntil(bp), [bp, reached]);
  // keep the crossover annotation inside the plot: flip sides past the midpoint
  const crossLabelPos = (function(){
    const rs = base.rows; if (!rs || !rs.length || base.crossAge==null) return 'insideTopLeft';
    const a0 = rs[0].age, a1 = rs[rs.length-1].age;
    return base.crossAge > a0 + (a1-a0)*0.55 ? 'insideTopRight' : 'insideTopLeft';
  })();
  const accessLabelPos = (function(){
    const rs = base.rows; if (!rs || !rs.length) return 'insideBottomRight';
    const a0 = rs[0].age, a1 = rs[rs.length-1].age;
    return bp.pensionAccessAge > a0 + (a1-a0)*0.6 ? 'insideBottomRight' : 'insideBottomLeft';
  })();
  const surplusGood = base.surplusAtCross!=null && base.surplusAtCross>=0;

  const rowClass = (r) => {
    const ratio = r.target>0 ? r.balance/r.target : (r.balance>=0?2:0);
    if (ratio>=1) return 'bp-green'; if (ratio>=0.9) return 'bp-amber'; return 'bp-below';
  };
  const rowStatus = (r) => {
    const ratio = r.target>0 ? r.balance/r.target : (r.balance>=0?2:0);
    if (ratio>=1) return ['green','Reached']; if (ratio>=0.9) return ['amber','Close']; return ['below','Below'];
  };

  const ScenChip = ({name,label,res,toggleable}) => {
    const on = !toggleable || scEnabled[name];
    return (
    <button className={'bp-chip'+(on?' on':' off')}
      onClick={()=> toggleable ? updScen(name,{enabled:!scEnabled[name]}) : null}
      title={toggleable ? 'Show / hide this scenario on the chart' : 'The primary scenario — drives the headline and table'}>
      {label}
      <span className="cage">{res.crossAge!=null ? res.crossAge : 'not by '+bp.pensionAccessAge}</span>
    </button>
    );
  };

  return (
    <div className="bridge-planner">
      <div className="bp-topline">
        <div>
          <div className="bp-q">Accessible wealth · bridge planner</div>
          <h2 className="bp-title">When can I stop needing to work?</h2>
        </div>
        <div className="bp-terms">
          <div className="bp-seg" role="group" aria-label="value basis">
            <button className={realTerms?'on':''} onClick={()=>{TRK.once('session','units_toggle'); setRealTerms(true);}}>Today’s money</button>
            <button className={!realTerms?'on':''} onClick={()=>{TRK.once('session','units_toggle'); setRealTerms(false);}}>Nominal</button>
          </div>
        </div>
      </div>

      {/* 0) FIRST USE — the setup card.
             It stands in the same place the answer will, because it IS the
             answer's precondition, and it goes away for good once the four
             questions are answered. An empty chart ringed with warnings is
             the thing this replaces. */}
      {showSetup ? (
      <div className="setup">
        <div className="su-lead">Four numbers and we can tell you when work becomes optional.</div>
        <div className="su-sub">This is about the money you can reach <i>before</i> your pension unlocks
          at {num(bp.pensionAccessAge, 57)} — ISAs, general investment accounts, savings. Your pension is the
          planner above.</div>
        <div className="su-grid">
          <SuField label="Your age" hint="Used by both planners.">
            <BpNum big nullable value={bp.currentAge} step="1" placeholder="38"
              onChange={v=>setAge(v)} />
          </SuField>
          <SuField label="ISA / GIA today"
            hint="Everything you could get at before pension access. £0 is a perfectly good answer.">
            <BpNum big money nullable value={bp.currentBalance} step={1000} placeholder="0"
              onChange={v=>setBp({currentBalance:v})} />
          </SuField>
          <SuField label="Income you want each year"
            hint="In today’s money, for the years before your pension starts.">
            <BpNum big money nullable value={bp.targetIncome} step={1000} placeholder="30,000"
              onChange={v=>setBp({targetIncome:v})} />
          </SuField>
          <SuField label="What you save each year"
            hint="Into ISAs and investment accounts, not your pension. £0 if you’re not adding anything right now.">
            <BpNum big money nullable value={flatAnnual} step={1000} placeholder="0"
              onChange={setFlatAnnual} />
          </SuField>
        </div>
        <SuCta left={missing.length} label="See when work becomes optional" onGo={go} />
        <div className="su-fine">Returns, inflation and pension access age are already set to Future Funded’s
          standard assumptions — you don’t need to touch them, but every one of them is editable under
          <b> Advanced assumptions</b> once you’re in.</div>
      </div>
      ) : (
      <React.Fragment>

      {/* 1) RESULT — answer → evidence → help. */}
      <div className="bp-result">
        <div className={'bp-answer '+(reached ? 'reached' : (workUntil ? 'later' : 'missed'))}>{reached
          ? 'Work-optional at '+base.crossAge
          : workUntil ? 'Work to '+workUntil.age
          : 'Not by '+bp.pensionAccessAge}</div>
        <div className="bp-evidence">{reached
          ? (bp.mode==='bridge'
              ? <span><b>{m(base.crossBalance, base.crossAge)}</b> funds <b>{gbpC(bp.targetIncome*bf(base.crossAge))}/yr</b> to pension access {bp.pensionAccessAge}</span>
              : <span><b>{m(base.crossBalance, base.crossAge)}</b> pot — enough for <b>{gbpC(bp.targetIncome*bf(base.crossAge))}/yr</b> at {(bp.withdrawalRate*100).toFixed(1)}%</span>)
          : workUntil
          ? <span>Not by pension access {bp.pensionAccessAge} — but keep saving to {workUntil.age} and
              you reach <b>{gbpC(workUntil.pot)}</b> against the <b>{gbpC(workUntil.target)}</b> you need.</span>
          : <span>Short of the <b>{gbpC(targetPot)}</b> pot needed to fund {gbpC(bp.targetIncome)}/yr by pension access {bp.pensionAccessAge}</span>}</div>
        {(function(){
          var perp = bp.mode !== 'bridge';   // perpetual portfolio — a pot you live off indefinitely
          var lifeAge = bp.lifeExpectancy || 90;
          var runsDry = reached && bp.drawdownFromOptionality && base.depletionAge != null && (perp ? base.depletionAge <= lifeAge : base.depletionAge < bp.pensionAccessAge);
          var txt;
          if (!reached && workUntil) {
            txt = 'That is ' + (workUntil.pastAccess
                    ? (workUntil.age - bp.pensionAccessAge) + ' year'
                      + ((workUntil.age - bp.pensionAccessAge) === 1 ? '' : 's')
                      + ' past pension access ' + bp.pensionAccessAge + ', still paying in.'
                    : Math.round(workUntil.yearsFromNow) + ' more year'
                      + (Math.round(workUntil.yearsFromNow) === 1 ? '' : 's') + ' of saving.')
                + ' Or pay in more, or want less.';
          } else if (!reached) {
            // Searched every age to State Pension. Saying "adjust something"
            // when working longer is not the lever wastes the reader's time.
            txt = 'Working longer doesn’t close this on these figures — it needs more going in, '
                + 'a higher return, or a lower target income.';
          } else if (perp) {
            // perpetual: no bridge / pension-handover framing — the pot is meant to last forever
            txt = !bp.drawdownFromOptionality
              ? 'A pot you could live off indefinitely at your '+(bp.withdrawalRate*100).toFixed(1)+'% withdrawal rate.'
              : (base.depletionAge
                  ? 'Drawing that income it still empties by age '+base.depletionAge+' — trim the draw or raise growth for a truly perpetual pot.'
                  : 'Drawing that income, growth keeps the pot intact to '+lifeAge+'.');
          } else if (runsDry) {
            txt = 'On these assumptions it runs dry at age '+base.depletionAge+' — '+(bp.pensionAccessAge-base.depletionAge)+' year'+((bp.pensionAccessAge-base.depletionAge)===1?'':'s')+' short of pension access '+bp.pensionAccessAge+'.';
          } else if (!bp.drawdownFromOptionality) {
            txt = 'From then your ISA/GIA can carry you until your pension takes over at '+bp.pensionAccessAge+'.';
          } else {
            txt = 'Your bridge lasts to pension access '+bp.pensionAccessAge+', when your pension takes over.';
          }
          return <div className="bp-help-line" style={runsDry?{color:'var(--critical)'}:null}>{txt}</div>;
        })()}
      </div>
      {/* The ask lands HERE, right under the answer they just unlocked — not at
          the top of the page they would have to scroll back to, and not before
          the result. Value first, then the offer. */}
      {nudge}
      <details className="bp-why"><summary>Why can it run out later?</summary>
        <ol>
          <li>The bridge fund only has to cover the years <b>between stopping work and pension access ({bp.pensionAccessAge})</b> — from {bp.pensionAccessAge} your pension can take over the income.</li>
          <li>The chart keeps drawing from your ISA/GIA <b>past {bp.pensionAccessAge}</b> to stress-test it alone, so it can show the accessible pot emptying later{base.depletionAge?<span> (age {base.depletionAge})</span>:''} — but in reality your pension covers you from {bp.pensionAccessAge}, so that "run-out" is just the bridge on its own.</li>
          <li>These figures are <b>live from your inputs</b> — right now that's {(bp.growth*100).toFixed(1)}% nominal return − {((bp.inflation||0)*100).toFixed(1)}% inflation ≈ <b>{(((1+bp.growth)/(1+(bp.inflation||0))-1)*100).toFixed(1)}% real growth</b>. Change the return, inflation, contributions, target or ages above and every age, balance and the chart recompute instantly. The Today's money / Nominal toggle only relabels the units — it doesn't change the plan.</li>
        </ol>
      </details>
      <div className="bp-scen-chips">
        <span className="bp-scen-lbl">Scenarios</span>
        <ScenChip name="base" label="Base" res={base} toggleable={true} />
        <ScenChip name="conservative" label="Conservative" res={cons} toggleable={true} />
        <ScenChip name="optimistic" label="Optimistic" res={opt} toggleable={true} />
      </div>

      {/* result tiles */}
      <div className="bp-results">
        <div className="bp-tile"><div className="bt-k">Years to optionality</div><div className="bt-v">{base.yearsUntil!=null?base.yearsUntil+(base.yearsUntil===1?' yr':' yrs'):'—'}</div></div>
        <div className="bp-tile"><div className="bt-k">Balance at crossover</div><div className="bt-v">{base.crossBalance!=null?m(base.crossBalance, base.crossAge):'—'}</div></div>
        <div className="bp-tile"><div className="bt-k">{bp.mode==='bridge'?'Income funded':'Income supported'} · today’s £</div><div className="bt-v">{bp.mode==='bridge'?(reached?gbpC(bp.targetIncome)+'/yr':'—'):(base.incomeAtCross!=null?gbpC(base.incomeAtCross)+'/yr':'—')}</div></div>
        <div className="bp-tile"><div className="bt-k">Surplus vs target</div><div className={'bt-v '+(base.surplusAtCross!=null?(surplusGood?'pos':'neg'):'')}>{base.surplusAtCross!=null?(surplusGood?'+':'−')+m(Math.abs(base.surplusAtCross), base.crossAge):'—'}</div></div>
        <div className="bp-tile"><div className="bt-k">Balance @ access {bp.pensionAccessAge}</div><div className="bt-v">{base.balanceAtAccess!=null?m(base.balanceAtAccess, bp.pensionAccessAge):'—'}</div></div>
      </div>

      {/* 2) GRAPH */}
      <div className="bp-chart">
        {ResponsiveContainer ? (
        <ResponsiveContainer width="100%" height={narrow?236:320}>
          <LineChart data={data} margin={{top:28,right:14,left:narrow?0:8,bottom:2}}>
            <CartesianGrid stroke={C.grid} vertical={false} />
            <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} padding={{left:4,right:8}} minTickGap={narrow?30:8} interval="preserveStartEnd" />
            <YAxis stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={narrow?52:52} tickCount={narrow?4:6} />
            <Tooltip content={<ChartTip/>} trigger={narrow?'click':'hover'} />
            {reached && <ReferenceLine x={base.crossAge} stroke={C.good} strokeWidth={1.5}
              label={{ value:(narrow?'Optionality — age ':'Optionality reached — age ')+base.crossAge, position:crossLabelPos, fill:C.good, fontSize:narrow?11:12, fontWeight:700 }} />}
            {reached && base.crossBalance!=null && <ReferenceDot x={base.crossAge} y={base.crossBalance*bf(base.crossAge)} r={5} fill={C.good} stroke="none" isFront={true} />}
            <ReferenceLine x={bp.pensionAccessAge} stroke={C.axis} strokeDasharray="3 3" label={{ value:'Pension access '+bp.pensionAccessAge, position:accessLabelPos, fill:C.axis, fontSize:narrow?10:11 }} />
            {base.depletionAge && base.depletionAge < bp.pensionAccessAge && <ReferenceLine x={base.depletionAge} stroke={C.red} strokeDasharray="4 3" strokeWidth={1.5} label={{ value:'Runs out '+base.depletionAge, position:'insideBottomRight', fill:C.red, fontSize:narrow?10:11, fontWeight:700 }} />}
            <Line type="monotone" dataKey="target" name="Target portfolio" stroke={C.red} strokeWidth={2} dot={false} strokeDasharray="5 4" />
            {scEnabled.conservative && <Line type="monotone" dataKey="cons" name="Conservative" stroke={C.gia} strokeWidth={1.6} dot={false} />}
            {scEnabled.optimistic && <Line type="monotone" dataKey="opt" name="Optimistic" stroke={C.isa} strokeWidth={1.6} dot={false} />}
            {scEnabled.base && <Line type="monotone" dataKey="balance" name="Projected ISA/GIA" stroke={C.pension} strokeWidth={2.6} dot={false} />}
          </LineChart>
        </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
        <div className="legend-row" style={{marginBottom:2}}>
          {scEnabled.base && <span><span className="sw" style={{background:C.pension}}></span>Projected ISA/GIA (Base)</span>}
          <span><span className="sw" style={{background:C.red}}></span>Target portfolio</span>
          {scEnabled.conservative && <span><span className="sw" style={{background:C.gia}}></span>Conservative</span>}
          {scEnabled.optimistic && <span><span className="sw" style={{background:C.isa}}></span>Optimistic</span>}
          <span className="terms-tag">{realTerms?'today’s money':'future £ (nominal)'}</span>
        </div>
      </div>

      {/* 3) YOUR NUMBERS — what YOU told us.
             The summary line reads at a glance; the boxes sit open underneath
             it, because changing a figure is the commonest thing anyone does
             here and putting it behind a disclosure made it a two-step job.
             These are the same fields the setup card asked for, so there is
             only ever one place each figure lives. */}
      <div className="bp-sub">Your numbers</div>
      <div className="bp-assump yn-fields">
        <div className="bp-fld"><label>Current age</label><BpNum nullable value={bp.currentAge} step="0.1" onChange={v=>setAge(v)} />
          <div className="bp-hint">Used by both planners.</div></div>
        <div className="bp-fld"><label>ISA / GIA balance today</label><BpNum money nullable value={bp.currentBalance} step={1000} onChange={v=>setBp({currentBalance:v})} /></div>
        <div className="bp-fld"><label>Income you want each year</label><BpNum money nullable value={bp.targetIncome} step={1000} onChange={v=>setBp({targetIncome:v})} /></div>
        {onePhase && <div className="bp-fld"><label>What you save each year</label>
          <BpNum money nullable value={flatAnnual} step={1000} onChange={setFlatAnnual} />
          <div className="bp-hint">Into ISAs and investment accounts, not your pension.</div></div>}
      </div>

      {/* 4) CONTRIBUTIONS BY AGE — the full phase editor, one level down.
             Nothing has been removed: this is the same editor it has always
             been. It just no longer stands between a newcomer and their

        : 'Bridge: the accessible pot only needs to last until pension access '+bp.pensionAccessAge+', so the target is smaller and shrinks each year. '+(bp.bridgeDepletion==='preserve'?'Preserving capital keeps the full '+gbpC(targetPot)+' perpetual pot intact at access.':bp.bridgeDepletion==='full'?'Fully using it draws the pot to zero by access — the withdrawal rate isn’t used here.':'Partially depleting leaves '+Math.round((bp.partialRemainPct!=null?bp.partialRemainPct:0.5)*100)+'% of the perpetual pot at access.')}</div>

      </details>

      {/* ===== SEQUENCE RISK / DRAWDOWN STRESS TEST (Phase 1) ===== */}
      {(function(){
        const sc = stress.scenarios;
        const accessNf = realTerms ? 1 : Math.pow(1+(bp.inflation||0), stress.accessAge - bp.currentAge);
        const ageLabel = stress.startAgeExact!=null ? stress.startAgeExact.toFixed(1) : (stress.startAge!=null?stress.startAge:'—');
        const hasBridge = stress.reached && stress.bridgeYears>0;
        const targetPct = Math.round((bp.confidence!=null?bp.confidence:0.9)*100);
        const confPct = sim.confidenceAtCrossover!=null ? Math.round(sim.confidenceAtCrossover*100) : null;
        const meetsTarget = sim.reached && sim.confidenceAtCrossover!=null && sim.confidenceAtCrossover >= (bp.confidence!=null?bp.confidence:0.9);
        const stressAgeLabel = sim.stressAgeExact!=null ? sim.stressAgeExact.toFixed(1) : null;
        const trialsLbl = sim.trials ? sim.trials.toLocaleString() : '';
        const realPct = (((1+bp.growth)/(1+(bp.inflation||0))-1)*100).toFixed(1);
        // Phase-1 deterministic trajectories (Normal / Poor / Crash)
        let sData = [];
        if (hasBridge){
          const n = sc.normal.rows.length;
          for (let i=0;i<n;i++){ const a = sc.normal.rows[i].age;
            sData.push({ age:a, normal: sc.normal.rows[i].startBalance*bf(a),
              poor: sc.poorStart.rows[i].startBalance*bf(a), crash: sc.crash.rows[i].startBalance*bf(a) }); }
          const acc = stress.accessAge;
          sData.push({ age:acc, normal: Math.max(0,sc.normal.residual)*bf(acc),
            poor: Math.max(0,sc.poorStart.residual)*bf(acc), crash: Math.max(0,sc.crash.residual)*bf(acc) });
        }
        // Phase-2 percentile fan (p10/p50/p90), display-factored
        let fData = [];
        if (hasBridge && sim.bands){ fData = sim.bands.map(function(b){ return { age:b.age, p10:b.p10*bf(b.age), p50:b.p50*bf(b.age), p90:b.p90*bf(b.age) }; }); }
        const yn = (b)=> b ? <span className="v ok">Yes</span> : <span className="v no">No</span>;
        let sub, subBad=false;
        if (!stress.reached){
          sub = 'You’re not work-optional before pension access on the current plan, so there’s no bridge period to stress-test yet — adjust contributions, growth or the target above.';
        } else if (!hasBridge){
          sub = 'You reach optionality only at pension access, so there’s no ISA/GIA bridge gap that markets could break.';
        } else if (meetsTarget){
          sub = 'Across '+trialsLbl+' historical market sequences the bridge stayed funded to pension access '+sim.accessAge+' in '+confPct+'% of them — at or above your '+targetPct+'% target. Stopping at '+ageLabel+' holds up even against bad early runs.';
        } else if (stressAgeLabel==null){
          sub = 'Even stopping right at pension access can’t reach '+targetPct+'% confidence with a '+gbpC(bp.minResidual||0)+' buffer on these figures — trim the target income or the buffer.';
          subBad=true;
        } else {
          sub = 'Across '+trialsLbl+' historical sequences the bridge stayed funded '+confPct+'% of the time from age '+ageLabel+' — below your '+targetPct+'% target. To clear '+targetPct+'% you’d wait to about '+stressAgeLabel+' (or keep a bigger buffer, or flex spending after a fall).';
          subBad=true;
        }
        return (
        <React.Fragment>
          <details className="bp-collapse bp-stress-collapse" onToggle={TRK.open('view_projection')}>
          <summary className="bp-sub bp-summary"><span>{(function(){
            if(!(sim.reached && hasBridge && confPct!=null)) return 'Sequence risk · can bad early markets break the bridge?';
            let t = 'Sequence risk · '+confPct+'% confidence at '+ageLabel;
            if(meetsTarget) t += ' — clears '+targetPct+'%';
            else if(stressAgeLabel!=null) t += ' — '+targetPct+'% at '+stressAgeLabel;
            else t += ' — below '+targetPct+'%';
            return t;
          })()}</span></summary>
          <div className="bp-stress">
            <div className="bp-stress-head">
              <div className="bp-stress-q">{stress.reached ? 'Can I stop working at '+ageLabel+'?' : 'Can I stop working before pension access?'}</div>
              <div className="bp-stress-controls">
                <div className="bp-stress-resid">
                  <label>Buffer to keep at access {bp.pensionAccessAge}</label>
                  <BpNum money value={bp.minResidual||0} step={5000} onChange={v=>setBp({minResidual:Math.max(0,v)})} />
                </div>
                <div className="bp-stress-resid">
                  <label>Confidence target</label>
                  <div className="bp-seg sm" role="group" aria-label="confidence target">
                    {[80,90,95].map(function(p){ return <button key={p} className={targetPct===p?'on':''} onClick={()=>setBp({confidence:p/100})}>{p}%</button>; })}
                  </div>
                </div>
              </div>
            </div>
            <div className="bp-stress-lines">
              <div className="ssl"><span className="k">Base projection <span className="muted">(steady returns)</span></span>{stress.reached?yn(stress.survivesNormal):<span className="v muted">—</span>}</div>
              <div className="ssl"><span className="k">Bad early markets <span className="muted">(poor start / crash)</span></span>{stress.reached&&hasBridge?yn(stress.survivesBadStart):<span className="v muted">—</span>}</div>
              <div className="ssl"><span className="k">Simulation confidence <span className="muted">({trialsLbl} historical runs)</span></span>{sim.reached&&hasBridge&&confPct!=null?<span className={'v '+(meetsTarget?'ok':'')}>{confPct}%</span>:<span className="v muted">—</span>}</div>
              <div className="ssl"><span className="k">Stress-tested optionality age <span className="muted">(at {targetPct}%)</span></span>{sim.reached&&hasBridge?(stressAgeLabel!=null?<span className={'v '+(meetsTarget?'ok':'')}>{stressAgeLabel}</span>:<span className="v no">after {sim.accessAge}</span>):<span className="v muted">—</span>}</div>

            <details className="bp-why"><summary>What does “bad early markets” mean?</summary>
              <ol>
                <li><b>Sequence risk is about order, not average.</b> Once you stop working you’re <b>drawing income from the pot</b> with no wage to top it up. If markets fall in the <b>first few years</b>, you’re selling units to live on while prices are low, so there’s less left to recover when markets bounce — the same set of returns in a different order can pass or fail. Bad years <b>early</b> do far more damage than the same bad years later.</li>
                <li><b>“Yes” means the bridge survives both stress runs.</b> We replay your plan — stop at {ageLabel}, draw {gbpC(bp.targetIncome)}/yr — against two deliberately harsh openings: <b>Poor start</b> (a weak first three years, roughly −6%, −10%, −3% real) and <b>Crash</b> (−35% in year one, then a normal +18% / +12% rebound). After the shock, returns revert to your {(stress.baseReal*100).toFixed(1)}% trend.</li>

            {hasBridge && <details className="bp-collapse">
              <summary className="bp-sub bp-summary">Stress test detail &amp; methodology</summary>
              <div className="ss-cards">
                {[{k:'normal',l:'Normal',c:C.pension},{k:'poorStart',l:'Poor start',c:C.cash},{k:'crash',l:'Crash',c:C.red}].map(function(x){
                  const s = sc[x.k];

                {ResponsiveContainer ? (
