                  <LineChart data={sData} margin={{top:22,right:18,left:8,bottom:2}}>
                    <CartesianGrid stroke={C.grid} vertical={false} />
                    <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} minTickGap={narrow?22:6} interval="preserveStartEnd" />
                    <YAxis stroke={C.axis} tick={{fontSize:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={52} />
                    <Tooltip content={<ChartTip/>} trigger={narrow?'click':'hover'} />
                    {(bp.minResidual||0)>0 && <ReferenceLine y={(bp.minResidual||0)*accessNf} stroke={C.axis} strokeDasharray="4 3" label={{value:'Buffer', position:'insideTopLeft', fill:C.axis, fontSize:10}} />}
                    <ReferenceLine y={0} stroke={C.red} strokeOpacity={0.55} />
                    <Line type="monotone" dataKey="normal" name="Normal" stroke={C.pension} strokeWidth={2.4} dot={false} />
                    <Line type="monotone" dataKey="poor" name="Poor start" stroke={C.cash} strokeWidth={2} dot={false} />
                    <Line type="monotone" dataKey="crash" name="Crash" stroke={C.red} strokeWidth={2} dot={false} />
                  </LineChart>
                </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
                <div className="legend-row" style={{marginBottom:2}}>
                  <span><span className="sw" style={{background:C.pension}}></span>Normal</span>
                  <span><span className="sw" style={{background:C.cash}}></span>Poor start</span>
                  <span><span className="sw" style={{background:C.red}}></span>Crash</span>
                  <span className="terms-tag">{realTerms?'today’s money':'future £ (nominal)'}</span>
                </div>
              </div>
              <div className="tablewrap" style={{marginTop:12}}>
                <table>
                  <thead><tr><th>Age</th><th>Normal</th><th>Poor start</th><th>Crash</th></tr></thead>
                  <tbody>
                    {sData.map(function(r,i){
                      const cell = (v)=> v<=0 ? <span style={{color:'var(--critical)'}}>Empty</span> : gbpC(v);
                      return <tr key={i}>
                        <td>{r.age}{r.age===stress.accessAge?' (access)':''}</td>
                        <td>{cell(r.normal)}</td><td>{cell(r.poor)}</td><td>{cell(r.crash)}</td>
                      </tr>;
                    })}
                  </tbody>
                </table>
              </div>
              <div className="bp-note" style={{marginTop:10}}>
                <b>Method (stress overlays).</b> Starting from the pot you’d hold at your work-optional age ({ageLabel}) — <b>{m(stress.startBalance, stress.startAge)}</b> — each scenario draws your <b>{gbpC(bp.targetIncome)}/yr</b> target income (constant in today’s money) and grows the remainder at a <b>variable</b> real return, year by year, to pension access {stress.accessAge}. The base real return is {(stress.baseReal*100).toFixed(1)}%. <b>Poor start</b> applies roughly −6%, −10%, −3% real over the first three years, then reverts to trend; <b>Crash</b> applies −35% in year one then a +18% / +12% rebound, then trend. A scenario <b>survives</b> if it funds every year’s income and still holds at least your {gbpC(bp.minResidual||0)} buffer when the pension unlocks. These three are hand-picked overlays; the historical simulation below turns the same idea into a probability across thousands of sequences.
              </div>

              <div className="bp-sub" style={{marginTop:20}}>Historical simulation · {trialsLbl} sequences</div>
              <div className="bp-note" style={{marginTop:0,marginBottom:8}}>The lines are the 10th / 50th / 90th percentiles of where the bridge pot lands each year across {trialsLbl} bootstrapped historical return sequences, drawn from age {ageLabel}. <b>{confPct}%</b> stay funded to pension access {sim.accessAge}{(bp.minResidual||0)>0?<span> above your {gbpC(bp.minResidual||0)} buffer</span>:''}; the 10th-percentile line is where sequence risk bites hardest.</div>
              <div className="bp-chart" style={{marginTop:0}}>
                {ResponsiveContainer ? (
                <ResponsiveContainer width="100%" height={narrow?220:290}>
                  <LineChart data={fData} margin={{top:22,right:18,left:8,bottom:2}}>
                    <CartesianGrid stroke={C.grid} vertical={false} />
                    <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} minTickGap={narrow?22:6} interval="preserveStartEnd" />
                    <YAxis stroke={C.axis} tick={{fontSize:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={52} />
                    <Tooltip content={<ChartTip/>} trigger={narrow?'click':'hover'} />
                    {(bp.minResidual||0)>0 && <ReferenceLine y={(bp.minResidual||0)*accessNf} stroke={C.axis} strokeDasharray="4 3" label={{value:'Buffer', position:'insideTopLeft', fill:C.axis, fontSize:10}} />}
                    <ReferenceLine y={0} stroke={C.red} strokeOpacity={0.55} />
                    <Line type="monotone" dataKey="p90" name="90th pct" stroke={C.isa} strokeWidth={1.8} dot={false} strokeDasharray="5 4" />
                    <Line type="monotone" dataKey="p50" name="Median" stroke={C.pension} strokeWidth={2.6} dot={false} />
                    <Line type="monotone" dataKey="p10" name="10th pct" stroke={C.red} strokeWidth={1.8} dot={false} strokeDasharray="5 4" />
                  </LineChart>
                </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
                <div className="legend-row" style={{marginBottom:2}}>
                  <span><span className="sw" style={{background:C.isa}}></span>90th percentile</span>
                  <span><span className="sw" style={{background:C.pension}}></span>Median</span>
                  <span><span className="sw" style={{background:C.red}}></span>10th percentile</span>
                  <span className="terms-tag">{realTerms?'today’s money':'future £ (nominal)'}</span>
                </div>
              </div>
              <div className="bp-note" style={{marginTop:10}}>
                <b>Simulation method.</b> The bridge drawdown is replayed against <b>{trialsLbl}</b> return sequences drawn from <b>actual history</b> — annual real total returns of US large-cap equity (S&P 500 with dividends, deflated by US CPI), <b>{sim.hist?sim.hist.from:1928}–{sim.hist?sim.hist.to:2024}</b> ({sim.hist?sim.hist.n:97} years; ~{sim.hist?(sim.hist.geoMean*100).toFixed(1):'6.7'}% real return, ~{sim.hist?(sim.hist.vol*100).toFixed(0):'20'}% volatility) as the equity proxy. A <b>block bootstrap</b> stitches random 5-year runs so crashes and recoveries cluster as they did historically, not as independent coin-flips. Because these are <b>raw</b> historical returns, the simulation’s average comes from history (~{sim.hist?(sim.hist.geoMean*100).toFixed(1):'6.7'}% real), not your {realPct}% assumption — which is used only to build the pot up to the day you stop. The <b>stress-tested optionality age</b> is the earliest age whose bridge clears your {targetPct}% confidence. Runs are seeded, so the figures are stable. Planning model, not financial advice.
              </div>
            </details>}
          </div>
          </details>
        </React.Fragment>
        );
      })()}


      {/* 5) YEAR-BY-YEAR TABLE */}
      <details className="bp-collapse" onToggle={TRK.open('view_projection')}><summary className="bp-sub bp-summary">Year-by-year · age {bp.currentAge}–{bp.pensionAccessAge}</summary>
      <div className="tablewrap cards">
        <table>
          <thead><tr>
            <th>Age</th><th>Projected ISA/GIA</th><th>Contribution</th><th>Withdrawal</th><th>Market growth</th><th>Target balance</th><th>Surplus / shortfall</th><th title="What this balance could pay every year indefinitely at your withdrawal rate (balance × rate). It's the perpetual view, so in Bridge mode — where the target deliberately depletes — it can read below your target income even on 'Reached' rows.">Perpetual income</th><th>Status</th>
          </tr></thead>
          <tbody>
            {base.rows.map((r,i)=>{
              const st = rowStatus(r);
              return (
              <tr key={i} className={rowClass(r)+(r.age===base.crossAge?' bp-cross-row':'')}>
                <td data-label="Age">{r.age}</td>
                <td data-label="Projected ISA/GIA">{m(r.balance, r.age)}</td>
                <td data-label="Contribution">{r.contribution?m(r.contribution, r.age):'—'}</td>
                <td data-label="Withdrawal">{r.withdraw?<span style={{color:'var(--critical)'}}>{m(-r.withdraw, r.age)}</span>:'—'}</td>
                <td data-label="Market growth" className="bp-growth">{(function(){var w=r.withdraw||0;var g=(r.balance+r.contribution-w+r.growth)*bf(r.age+1)-r.balance*bf(r.age)-r.contribution*bf(r.age)+w*bf(r.age);return (g>=0?'+':'−')+gbpC(Math.abs(g));})()}</td>
                <td data-label="Target balance">{m(r.target, r.age)}</td>
                <td data-label="Surplus / shortfall" style={{color:r.surplus>=0?'var(--good-text)':'var(--critical)'}}>{(r.surplus>=0?'+':'−')+m(Math.abs(r.surplus), r.age)}</td>
                <td data-label="Perpetual income">{m(r.income, r.age)}/yr</td>
                <td data-label="Status"><span className={'bp-status '+st[0]}>{st[1]}</span></td>
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="bp-note"><b>Perpetual income</b> = balance × your {(bp.withdrawalRate*100).toFixed(1)}% withdrawal rate — the income this pot could pay <i>forever</i>, shown as a gauge. {bp.mode==='bridge' ? <span>In this <b>Bridge</b> mode the target only has to last to pension access (and here leaves {bp.bridgeDepletion==='full'?'nothing':bp.bridgeDepletion==='preserve'?'the full pot':Math.round((bp.partialRemainPct!=null?bp.partialRemainPct:0.5)*100)+'%'} at access), so it's smaller than a perpetual pot — that's why a row can be <b>Reached</b> while perpetual income still sits below your {gbpC(bp.targetIncome)} target.</span> : <span>In Perpetual mode the target <i>is</i> income ÷ rate, so at the target this equals your {gbpC(bp.targetIncome)}/yr.</span>} Red below target · amber within 10% · green once reached. Figures in {realTerms?'today’s money':'future £ (nominal)'}. Not financial advice.</div>
      </details>
      </React.Fragment>)}
    </div>
  );
}

/* =============================================================
   PENSION COAST PLANNER
   "Have I reached Pension Coast?" — when does the pension
   become self-sustaining (reaches the retirement objective with
   zero further contributions)? Reuses the .bridge-planner / bp-*
   styling. Real-terms model; nominal view only re-inflates.
   ============================================================= */
function CoastPlanner({ cp, setCp, setAge, plan, C, realTerms, setRealTerms,
                       onRevealed, nudge }) {
  const base = plan.base, cons = plan.conservative, opt = plan.optimistic;
  const narrow = useIsNarrow();
  // first use — see the notes on BridgePlanner; this half works identically
  const missing = Engine.coastMissing(cp);
  const ready = missing.length === 0;
  const [revealed, setRevealed] = useState(ready);
  // Lose a required figure and the reveal is withdrawn with it, so filling the
  // box back in does NOT snap to the answer on the first digit you type.
  useEffect(() => { if (!ready) setRevealed(false); }, [ready]);
  // The disclaimer is a gate on the whole app now, met before anything else, so
  // the reveal here is simply the reveal.
  const go = () => { setRevealed(true); onRevealed && onRevealed(); };
  const showSetup = !(ready && revealed);
  // sequence-risk (pension drawdown) — memoised; the Monte Carlo is ~50ms
  const stress = useMemo(() => Engine.coastStressTest(cp, cp.minResidual||0), [cp]);
  const sim = useMemo(() => Engine.coastSimulate(cp), [cp]);
  const bf = (age) => { const a0 = num(cp.currentAge, 0);
    return realTerms ? 1 : Math.pow(1 + (cp.inflation||0), (age||a0) - a0); };
  const m = (v, age) => gbpC(v * bf(age));

  const scEnabled = { base: !(cp.scenarios&&cp.scenarios.base&&cp.scenarios.base.enabled===false),
                      conservative: !!(cp.scenarios&&cp.scenarios.conservative&&cp.scenarios.conservative.enabled),
                      optimistic: !!(cp.scenarios&&cp.scenarios.optimistic&&cp.scenarios.optimistic.enabled) };

  const data = base.rows.map((r,i) => {
    const o = { age: r.age, required: r.required*bf(r.age), projected: r.projected*bf(r.age) };
    if (scEnabled.conservative && cons.rows[i]) o.cons = cons.rows[i].projected*bf(r.age);
    if (scEnabled.optimistic && opt.rows[i]) o.opt = opt.rows[i].projected*bf(r.age);
    return o;
  });
  const stopData = plan.stopSchedule.map(s => ({ stopAge: s.stopAge, final: s.finalPension*bf(cp.retirementAge), target: plan.targetPot*bf(cp.retirementAge) }));

  const updScen = (key, patch) => setCp({ scenarios: Object.assign({}, cp.scenarios, { [key]: Object.assign({}, (cp.scenarios||{})[key], patch) }) });
  const updPhase = (i, patch) => setCp({ phases: cp.phases.map((p,idx)=> idx===i ? Object.assign({},p,patch) : p) });
  const addPhase = () => { const last = cp.phases[cp.phases.length-1];
    const start = num(cp.currentAge, 30);
    const from = last && num(last.toAge, null) != null ? last.toAge + 1 : start;
    setCp({ phases: cp.phases.concat([{ fromAge:from, toAge:Math.max(from, num(cp.retirementAge, 65)), annual:0 }]) }); };
  const delPhase = (i) => { if (cp.phases.length<=1) return; setCp({ phases: cp.phases.filter((_,idx)=>idx!==i) }); };

  // contributions: one number by default, the by-age editor a level down
  const onePhase = cp.phases.length === 1;
  const flatAnnual = onePhase ? cp.phases[0].annual : null;
  const setFlatAnnual = (v) => setCp({ phases: [Object.assign({}, cp.phases[0], { annual: v })] });
  const materialisePhases = () => {
    if (!cp.phases.some(p => !isSet(p.fromAge) || !isSet(p.toAge))) return;
    const a = num(cp.currentAge, 30), end = Math.max(a, num(cp.retirementAge, 65));
    setCp({ phases: cp.phases.map(p => Object.assign({}, p,
      { fromAge: num(p.fromAge, a), toAge: num(p.toAge, end) })) });
  };

  const rowClass = (r) => { if (r.drawing) return r.projected>1?'bp-green':'bp-below'; const ratio = r.required>0 ? r.projected/r.required : 2; return ratio>=1?'bp-green':ratio>=0.9?'bp-amber':'bp-below'; };
  const rowStat = (r) => { if (r.drawing) return r.projected>1?['green','Drawing']:['below','Depleted']; const ratio = r.required>0 ? r.projected/r.required : 2; return ratio>=1?['green','Above']:ratio>=0.9?['amber','Close']:['below','Below']; };
  const coastLabelPos = (function(){
    const rs = base.rows; if (!rs || !rs.length || base.coastAge==null) return 'insideTopLeft';
    const a0 = rs[0].age, a1 = rs[rs.length-1].age;
    return base.coastAge > a0 + (a1-a0)*0.55 ? 'insideTopRight' : 'insideTopLeft';
  })();
  const objLabelPos = (function(){
    const rs = base.rows; if (!rs || !rs.length) return 'insideBottomRight';
    const a0 = rs[0].age, a1 = rs[rs.length-1].age;
    return base.objAge > a0 + (a1-a0)*0.6 ? 'insideBottomRight' : 'insideBottomLeft';
  })();
  const statusText = base.coasting ? 'Already coasting'
    : base.reached ? base.yearsUntilCoast+(base.yearsUntilCoast===1?' yr to coast':' yrs to coast')
    : gbpC(base.shortfallNow)+' below coast';

  /* ---- "then when COULD I?" ----
     When the pot doesn't reach the target by the age they picked, "no" is a
     useless answer. The age at which it becomes yes is the useful one, and
     without it the reader has to search for it by nudging the retirement age
     up a year at a time. Only worth working out when the target is actually
     missed, and the Monte Carlo above is the expensive memo — this one is a
     short loop, but it recomputes on every keystroke, so it is memoised too. */
  const missesTarget = ready && !base.meetsTarget;
  const workUntil = useMemo(
    () => missesTarget ? Engine.coastWorkUntil(cp) : null,
    [cp, missesTarget]);
  // Waiting also SHRINKS the target, because the pot has one year less of
  // State Pension to self-fund before it starts. Only say so when it happened.
  const targetFell = workUntil && workUntil.targetAtFrom - workUntil.target > 500;

  const ScenChip = ({name,label,res,toggleable}) => {
    const on = !toggleable || scEnabled[name];
    return (
    <button className={'bp-chip'+(on?' on':' off')}
      onClick={()=> toggleable ? updScen(name,{enabled:!scEnabled[name]}) : null}
      title={toggleable ? 'Show / hide this scenario on the chart' : 'The primary scenario — drives the headline'}>
      {label}
      <span className="cage">{res.coastAge!=null ? res.coastAge : 'not by '+res.objAge}</span>
    </button>
    );
  };

  return (
    <div className="bridge-planner">
      <div className="bp-topline">
        <div>
          <div className="bp-q">Pension Coast · self-sustaining pension</div>
          <h2 className="bp-title">When can my pension look after itself?</h2>
        </div>
        <div className="bp-terms">
          <div className="bp-seg" role="group" aria-label="value basis">
            <button className={realTerms?'on':''} onClick={()=>{TRK.once('session','units_toggle'); setRealTerms(true);}}>Today’s money</button>
            <button className={!realTerms?'on':''} onClick={()=>{TRK.once('session','units_toggle'); setRealTerms(false);}}>Nominal</button>
          </div>
        </div>
      </div>

      {/* 0) FIRST USE — the setup card (see BridgePlanner for the reasoning) */}
      {showSetup ? (
      <div className="setup">
        <div className="su-lead">Four numbers and we can tell you when your pension can look after itself.</div>
        <div className="su-sub">“Coast” is the point where the pot you already have grows into your retirement
          target on its own — no further contributions needed.</div>
        <div className="su-grid">
          <SuField label="Your age" hint="Used by both planners.">
            <BpNum big nullable value={cp.currentAge} step="1" placeholder="38"
              onChange={v=>setAge(v)} />
          </SuField>
          <SuField label="Pension pot today"
            hint="All your pensions added together — workplace, personal, old ones. £0 is a perfectly good answer.">
            <BpNum big money nullable value={cp.currentPension} step={1000} placeholder="0"
              onChange={v=>setCp({currentPension:v})} />
          </SuField>
          {cp.goalMode === 'pot'
            ? <SuField label="Target pension pot" hint="In today’s money.">
                <BpNum big money nullable value={cp.targetPot} step={50000} placeholder="500,000"
                  onChange={v=>setCp({targetPot:v})} />
              </SuField>
            : <SuField label="Retirement income you want each year"
                hint={'In today’s money, State Pension included — we assume '
                  + gbpC(cp.statePensionAmount||0) + '/yr from ' + num(cp.statePensionAge, 67) + '.'}>
                <BpNum big money nullable value={cp.targetIncome} step={1000} placeholder="30,000"
                  onChange={v=>setCp({targetIncome:v})} />
              </SuField>}
          <SuField label="What you pay in each year"
            hint="Employee plus employer, plus any tax relief. £0 if you’re not contributing right now.">
            <BpNum big money nullable value={flatAnnual} step={1000} placeholder="0"
              onChange={setFlatAnnual} />
          </SuField>
        </div>
        <SuCta left={missing.length} label="See my pension outlook" onGo={go} />
        <div className="su-fine">Returns, inflation, the State Pension and the age you draw your pension are
          already set to Future Funded’s standard assumptions — all editable under <b>Advanced
          assumptions</b> once you’re in.</div>
      </div>
      ) : (
      <React.Fragment>

      {/* 1) RESULT — answer → evidence → help (the dominant answer first) */}
      <div className="bp-result">
        {/* The answer. When the age they picked doesn't reach the target, the
            headline is the age that DOES — "not reached by 65" is a fact
            about their guess, not an answer to their question. */}
        <div className={'bp-answer '+(base.reached ? 'reached' : (workUntil ? 'later' : 'missed'))}>{
          base.coasting ? 'Coasting now'
          : base.reached ? 'Coast achieved at '+(base.coastAgeExact!=null?base.coastAgeExact.toFixed(1):base.coastAge)
          : workUntil ? (workUntil.extraYears === 0 ? 'On track for ' + workUntil.age
                                                    : 'Work to ' + workUntil.age)
          : 'Not reached by '+base.objAge}</div>
        <div className="bp-evidence">{base.reached
          ? <span><b>{m(base.coastBalance, base.coastAge)}</b> <span className="arrow">→</span> <b>{gbpC(plan.targetPot*bf(base.objAge))}</b> by age {base.objAge}</span>
          : workUntil
          ? <span>Stopping at {base.objAge} leaves you <b>{gbpC(Math.max(0, plan.targetPot - base.potAtObj))}</b> short.
              {' '}{workUntil.extraYears === 1 ? 'One more year' : workUntil.extraYears + ' more years'} gets you
              to <b>{gbpC(workUntil.pot)}</b> against a <b>{gbpC(workUntil.target)}</b> target.</span>
          : <span>Projected <b>{m(base.potAtObj, base.objAge)}</b> vs <b>{gbpC(plan.targetPot*bf(base.objAge))}</b> target by age {base.objAge}</span>}</div>
        <div className="bp-help-line">{base.reached
          ? (base.coasting
              ? 'Your pension already self-funds the target, with no further contributions.'
              : (base.yearsUntilCoast===0 ? 'No further contributions needed — it grows there on its own.'
                 : base.yearsUntilCoast+' more year'+(base.yearsUntilCoast===1?'':'s')+' of contributions, then it grows there on its own.'))
          : workUntil
          ? (targetFell
              ? 'Waiting helps twice: another ' + (workUntil.extraYears===1?'year':workUntil.extraYears+' years')
                + ' of paying in and growing, and a smaller target — the pension has '
                + (workUntil.extraYears===1?'one year':workUntil.extraYears+' years')
                + ' less to cover on its own before the State Pension starts at ' + (cp.statePensionAge||67) + '.'
              : 'Another ' + (workUntil.extraYears===1?'year':workUntil.extraYears+' years')
                + ' of paying in and growing closes the gap. Or pay in more, or want less.')
          : 'Working longer alone doesn’t close this — it needs more going in, a higher return, or a lower target income.'}</div>
      </div>
      {nudge}
      <details className="bp-why"><summary>Why so early?</summary>
        <ol>
          <li><b>Coast</b> is the point where your existing pot, left to grow on its own, would still hit your target by age {base.objAge} — <b>with no further contributions</b>. It's not when you retire, it's when saving becomes optional.</li>
          <li>It lands early when your <b>real return is high</b> — a big pot compounding for {Math.max(0, base.objAge-cp.currentAge)} years does the heavy lifting, so even a modest balance today can coast.</li>
          <li>From your target age ({base.objAge}) the pension is <b>drawn down</b> for income (less State Pension once it starts at {cp.statePensionAge}). Everything here is <b>live from your inputs</b> — right now {(cp.growth*100).toFixed(1)}% − {((cp.inflation||0)*100).toFixed(1)}% ≈ {(((1+cp.growth)/(1+(cp.inflation||0))-1)*100).toFixed(1)}% real; change the return, inflation, contributions or target age above and the coast age, chart and drawdown recompute instantly.</li>
        </ol>
      </details>
      <div className="bp-scen-chips">
        <span className="bp-scen-lbl">Scenarios</span>
        <ScenChip name="base" label="Base" res={base} toggleable={true} />
        <ScenChip name="conservative" label="Conservative" res={cons} toggleable={true} />
        <ScenChip name="optimistic" label="Optimistic" res={opt} toggleable={true} />
      </div>

      {/* status tiles */}
      <div className="bp-results">
        <div className="bp-tile"><div className="bt-k">Status</div><div className={'bt-v '+(base.reached?'pos':'neg')}>{statusText}</div></div>
        <div className="bp-tile"><div className="bt-k">Coast balance needed</div><div className="bt-v">{base.coastBalance!=null?m(base.coastBalance, base.coastAge):'—'}</div></div>
        <div className="bp-tile"><div className="bt-k">Target pension @ {base.objAge}{realTerms?'':' (future £)'}</div><div className="bt-v">{gbpC(plan.targetPot*bf(base.objAge))}</div>{!realTerms && <div className="bt-sub">= {gbpC(plan.targetPot)} in today’s money</div>}</div>
        <div className="bp-tile"><div className="bt-k">Projected pot @ {base.objAge}</div><div className="bt-v">{m(base.potAtObj, base.objAge)}</div></div>
        {/* When coast isn't reached this tile used to read a bare "—", which is
            the one place the reader most wants a number. Give it the answer. */}
        <div className="bp-tile">
          <div className="bt-k">{base.reached ? 'More years to contribute' : 'Extra years to work'}</div>
          <div className="bt-v">{base.reached ? (base.yearsUntilCoast===0 ? '0 — done' : base.yearsUntilCoast)
            : workUntil ? (workUntil.extraYears===0 ? '0 — on track' : '+'+workUntil.extraYears)
            : '—'}</div></div>
      </div>

      {/* 2) GRAPH */}
      <div className="bp-chart">
        {ResponsiveContainer ? (
        <ResponsiveContainer width="100%" height={narrow?236:320}>
          <LineChart data={data} margin={{top:28,right:14,left:narrow?0:8,bottom:2}}>
            <CartesianGrid stroke={C.grid} vertical={false} />
            <XAxis dataKey="age" stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={{stroke:C.baseline}} padding={{left:4,right:8}} minTickGap={narrow?30:8} interval="preserveStartEnd" />
            <YAxis stroke={C.axis} tick={{fontSize:narrow?10:11,fill:C.axis}} tickLine={false} axisLine={false} tickFormatter={gbpC} width={narrow?52:52} tickCount={narrow?4:6} />
            <Tooltip content={<ChartTip/>} trigger={narrow?'click':'hover'} />
            {base.reached && !base.coasting && <ReferenceLine x={base.coastAge} stroke={C.good} strokeWidth={1.5}
              label={{ value:'Pension self-funding — age '+base.coastAge, position:coastLabelPos, fill:C.good, fontSize:narrow?11:12, fontWeight:700 }} />}
            {base.reached && !base.coasting && base.coastBalance!=null && <ReferenceDot x={base.coastAge} y={base.coastBalance*bf(base.coastAge)} r={5} fill={C.good} stroke="none" isFront={true} />}
            <ReferenceLine x={base.objAge} stroke={C.axis} strokeDasharray="3 3" label={{ value:'Draw from '+base.objAge, position:objLabelPos, fill:C.axis, fontSize:narrow?10:11 }} />
            {base.coastDepletionAge && <ReferenceLine x={base.coastDepletionAge} stroke={C.red} strokeDasharray="4 3" strokeWidth={1.5} label={{ value:'Runs out '+base.coastDepletionAge, position:'insideTopRight', fill:C.red, fontSize:narrow?10:11, fontWeight:700 }} />}
            <Line type="monotone" dataKey="required" name="Required coast balance" stroke={C.red} strokeWidth={2} dot={false} strokeDasharray="5 4" />
            {scEnabled.conservative && <Line type="monotone" dataKey="cons" name="Conservative" stroke={C.gia} strokeWidth={1.6} dot={false} />}
            {scEnabled.optimistic && <Line type="monotone" dataKey="opt" name="Optimistic" stroke={C.isa} strokeWidth={1.6} dot={false} />}
            {scEnabled.base && <Line type="monotone" dataKey="projected" name="Projected pension" stroke={C.pension} strokeWidth={2.6} dot={false} />}
          </LineChart>
        </ResponsiveContainer>) : <div className="muted">Chart library unavailable.</div>}
        <div className="legend-row" style={{marginBottom:2}}>
          {scEnabled.base && <span><span className="sw" style={{background:C.pension}}></span>Projected pension (Base)</span>}
          <span><span className="sw" style={{background:C.red}}></span>Required coast balance</span>
          {scEnabled.conservative && <span><span className="sw" style={{background:C.gia}}></span>Conservative</span>}
          {scEnabled.optimistic && <span><span className="sw" style={{background:C.isa}}></span>Optimistic</span>}
          <span className="terms-tag">{realTerms?'today’s money':'future £ (nominal)'}</span>
        </div>
        <div className="bp-note" style={{marginTop:6}}>From {base.objAge} the pension pays out <b>{gbpC(base.drawIncome)}/yr</b>. {base.coastDepletionAge ? <span>On these assumptions it <b style={{color:'var(--critical)'}}>runs out at age {base.coastDepletionAge}</b>.</span> : <span>Growth still outpaces withdrawals, so the pot keeps rising to {base.rows.length?base.rows[base.rows.length-1].age:70}.</span>}</div>
      {cp.goalMode==='income' && cp.statePensionAmount>0 && <Learn label="Once the State Pension starts">Your pension draw drops to {gbpC(Math.max(0, base.drawIncome-(cp.statePensionAmount||0)))}/yr from age {cp.statePensionAge}, because the State Pension covers the rest. The Withdrawal column in the year-by-year table shows the full draw until then.</Learn>}
      </div>

      {base.coasting && <div className="bp-note" style={{marginTop:12}}>

      {/* ===== SEQUENCE RISK — PENSION DRAWDOWN ===== */}
      {(function(){
        const sc = stress.scenarios;

        const ageLabel = fmtAge(stress.startAgeExact!=null?stress.startAgeExact:stress.startAge);
        const hasDraw = stress.reached && stress.bridgeYears>0;
        const targetPct = Math.round((cp.confidence!=null?cp.confidence:0.9)*100);
        const confPct = sim.confidenceAtCrossover!=null ? Math.round(sim.confidenceAtCrossover*100) : null;
        const meetsTarget = sim.confidenceAtCrossover!=null && sim.confidenceAtCrossover >= (cp.confidence!=null?cp.confidence:0.9);
        const stressAgeLabel = fmtAge(sim.stressAgeExact);
        const trialsLbl = sim.trials ? sim.trials.toLocaleString() : '';
        const realPct = (((1+cp.growth)/(1+(cp.inflation||0))-1)*100).toFixed(1);

          const acc = stress.accessAge;
          sData.push({ age:acc, normal: Math.max(0,sc.normal.residual)*bf(acc),
            poor: Math.max(0,sc.poorStart.residual)*bf(acc), crash: Math.max(0,sc.crash.residual)*bf(acc) });

        let fData = [];
        if (hasDraw && sim.bands){ fData = sim.bands.map(function(b){ return { age:b.age, p10:b.p10*bf(b.age), p50:b.p50*bf(b.age), p90:b.p90*bf(b.age) }; }); }
        const yn = (b)=> b ? <span className="v ok">Yes</span> : <span className="v no">No</span>;
        let sub, subBad=false;
        if (!hasDraw){

        } else if (meetsTarget){
          sub = 'Across '+trialsLbl+' historical market sequences the pension lasted to life expectancy '+stress.accessAge+' in '+confPct+'% of them — at or above your '+targetPct+'% target. Retiring at '+ageLabel+' holds up even against bad early runs.';

          sub = 'Even retiring right at life expectancy can’t reach '+targetPct+'% confidence with a '+gbpC(cp.minResidual||0)+' buffer — lower the income or the buffer.';

        } else {
          sub = 'Across '+trialsLbl+' historical sequences the pension lasted '+confPct+'% of the time retiring at '+ageLabel+' — below your '+targetPct+'% target. To clear '+targetPct+'% you’d retire at about '+stressAgeLabel+' (or lower the income, keep a bigger buffer, or flex spending after a fall).';

            <details className="bp-why"><summary>What does “bad early markets” mean?</summary>

                <li><b>“Yes” means the pension lasts through both stress runs.</b> We replay your plan — retire at {ageLabel}, draw {gbpC(stress.income)}/yr{stress.statePension>0?<span> (less the {gbpC(stress.statePension)} State Pension from {stress.spAge})</span>:''} — against two deliberately harsh openings: <b>Poor start</b> (a weak first three years, roughly −6%, −10%, −3% real) and <b>Crash</b> (−35% in year one, then a normal +18% / +12% rebound). After the shock, returns revert to your {(stress.baseReal*100).toFixed(1)}% trend.</li>

              <div className="bp-note" style={{marginTop:0,marginBottom:8}}>The lines are the 10th / 50th / 90th percentiles of where the pension lands each year across {trialsLbl} bootstrapped historical return sequences, retiring at {ageLabel}. <b>{confPct}%</b> stay funded to life expectancy {stress.accessAge}{(cp.minResidual||0)>0?<span> above your {gbpC(cp.minResidual||0)} buffer</span>:''}; the 10th-percentile line is where sequence risk bites hardest.</div>
              <div className="bp-chart" style={{marginTop:0}}>

                  <span className="terms-tag">{realTerms?'today’s money':'future £ (nominal)'}</span>

              </div>
              <div className="bp-note" style={{marginTop:10}}>
                <b>Simulation method.</b> The pension drawdown is replayed against <b>{trialsLbl}</b> return sequences drawn from <b>actual history</b> — annual real total returns of US large-cap equity (S&P 500 with dividends, deflated by US CPI), <b>{sim.hist?sim.hist.from:1928}–{sim.hist?sim.hist.to:2024}</b> ({sim.hist?sim.hist.n:97} years; ~{sim.hist?(sim.hist.geoMean*100).toFixed(1):'6.7'}% real return, ~{sim.hist?(sim.hist.vol*100).toFixed(0):'20'}% volatility) as the equity proxy. A <b>block bootstrap</b> stitches random 5-year runs so crashes and recoveries cluster as they did historically, not as independent coin-flips. Because these are <b>raw</b> historical returns, the simulation’s average comes from history (~{sim.hist?(sim.hist.geoMean*100).toFixed(1):'6.7'}% real), not your {realPct}% assumption — which is used only to build the pot up to the day you retire. The <b>stress-tested retirement age</b> is the earliest retirement age whose drawdown clears your {targetPct}% confidence. Runs are seeded, so the figures are stable. Planning model, not financial advice.
              </div>
            </details>}
          </div>
          </details>
        </React.Fragment>
        );
      })()}

      {/* YEAR-BY-YEAR */}
      <details className="bp-collapse" onToggle={TRK.open('view_projection')}><summary className="bp-sub bp-summary">Year-by-year · age {cp.currentAge}–{base.rows.length?base.rows[base.rows.length-1].age:base.objAge}</summary>
      <div className="tablewrap cards">
        <table>
          <thead><tr><th>Age</th><th>Projected pension</th><th>Coast balance required</th><th>Surplus / shortfall</th><th>Annual contribution</th><th>Withdrawal</th><th>Market growth</th><th>Status</th></tr></thead>
          <tbody>
            {base.rows.map((r,i)=>{ const st = rowStat(r); return (
              <tr key={i} className={rowClass(r)+(r.age===base.coastAge?' bp-cross-row':'')}>
                <td data-label="Age">{r.age}</td>
                <td data-label="Projected pension">{m(r.projected, r.age)}</td>
                <td data-label="Coast balance required">{m(r.required, r.age)}</td>
                <td data-label="Surplus / shortfall" style={{color:r.surplus>=0?'var(--good-text)':'var(--critical)'}}>{(r.surplus>=0?'+':'−')+m(Math.abs(r.surplus), r.age)}</td>
                <td data-label="Annual contribution">{r.contribution?m(r.contribution, r.age):'—'}</td>
                <td data-label="Withdrawal">{r.withdraw?<span style={{color:'var(--critical)'}}>{m(-r.withdraw, r.age)}</span>:'—'}</td>
                <td data-label="Market growth" className="bp-growth">{(function(){var w=r.withdraw||0;var g=(r.projected+r.contribution-w+r.growth)*bf(r.age+1)-r.projected*bf(r.age)-r.contribution*bf(r.age)+w*bf(r.age);return (g>=0?'+':'−')+gbpC(Math.abs(g));})()}</td>
                <td data-label="Status"><span className={'bp-status '+st[0]}>{st[1]}</span></td>
              </tr>
            ); })}
          </tbody>
        </table>
      </div>

      </details>
      </React.Fragment>)}
    </div>
  );
}

/* Optional accounts: sign in to sync projections across devices. */
function shortEmail(e){ if(!e) return 'Account'; return e.length>18 ? e.slice(0,16)+'…' : e; }
/* password input with a Show/Hide reveal toggle — so people can check what they typed,
   which matters most on the "set a new password" step */
function PwInput({ value, onChange, placeholder, autoComplete, onKeyDown }){
  const [show, setShow] = useState(false);
  return (
    <div className="pw-wrap">
      <input className="auth-input" type={show?'text':'password'} placeholder={placeholder}
        value={value} onChange={onChange} autoComplete={autoComplete} onKeyDown={onKeyDown} />
      <button type="button" className="pw-eye" onClick={()=>setShow(s=>!s)}
        aria-label={show?'Hide password':'Show password'} title={show?'Hide password':'Show password'}>{show?'Hide':'Show'}</button>
    </div>
  );
}

/* ⚠️ DO NOT AUTOFOCUS A TEXT FIELD IN A MODAL ON A TOUCH DEVICE.
   Focusing an input opens the software keyboard, and iOS responds by scrolling
   the VISUAL viewport — which takes a position:fixed overlay up with it. On a
   tall dialog the title and the first controls end up above the top of the
   screen with no way to scroll back to them, because the thing that moved was
   the viewport and not the page. Reported on the installed app, 2026-08-24:
   the New plan dialog opened with its two options already off screen.

   A keyboard the user did not ask for is a poor trade on a phone anyway — they
   have to tap the field to type either way. On a desktop, where there is no
   keyboard to open and tabbing straight into the field is genuinely useful,
   this is true and the focus happens as before. */
function canAutofocus(){
  try { return window.matchMedia('(hover: hover) and (pointer: fine)').matches; }
  catch(e){ return true; }
}

/* Render a fixed overlay into <body>. The sticky top bar uses backdrop-filter, which makes it a
   containing block for position:fixed descendants — without this the modal is clipped to the bar. */
function inBody(node){
  if (typeof document !== 'undefined' && typeof ReactDOM !== 'undefined' && ReactDOM.createPortal) {
    return ReactDOM.createPortal(node, document.body);
  }
  return node;
}

/* =============================================================
   FEEDBACK — a suggestion box in the top bar
   -------------------------------------------------------------
   Open to everyone, signed in or not: the people whose feedback is
   most worth having are usually the ones who never made an account.
   Sends straight to public.feedback (migration 009), which is
   insert-anyone / read-admins-only, the same trust model as events.
   ============================================================= */
function FeedbackIcon(){
  /* a suggestion box: a slot-lid carton with a note going in */
  return (
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
         strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <path d="M3 10.5h18V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9.5Z" />
      <path d="M8.5 10.5V4.2a.7.7 0 0 1 .7-.7h5.6a.7.7 0 0 1 .7.7v6.3" />
      <path d="M10.6 6.1h2.8M10.6 8.1h2.8" />
      <path d="M7.4 10.5h9.2" />
    </svg>
  );
}

function FeedbackButton({ onOpen }){
  const [open, setOpen] = useState(false);
  const [msg, setMsg] = useState('');
  const [contact, setContact] = useState('');
  const [state, setState] = useState('idle');     // idle | sending | sent | error
  const [err, setErr] = useState('');
  const box = useRef(null);

  const close = () => { setOpen(false); setState('idle'); setErr(''); };

  useEffect(() => {
    if (!open) return;
    TRK.once('session', 'feedback_open');
    // ⚠️ Desktop only, for the same reason as the plan dialogs — see
    // canAutofocus. This box is tall enough to have had the same problem.
    const t = setTimeout(() => { try { if (canAutofocus() && box.current) box.current.focus(); } catch(e){} }, 30);
    const esc = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', esc);
    return () => { clearTimeout(t); document.removeEventListener('keydown', esc); };
  }, [open]);

  // Enough about the device to make "the chart looks wrong" actionable, and
  // nothing that isn't already in the usage log except the browser string —
  // which is the single most useful thing for reproducing a layout bug.
  function context(){
    const c = {};
    try {
      c.tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      c.viewport = window.innerWidth + 'x' + window.innerHeight;
      c.standalone = !!((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                        || navigator.standalone === true);
      c.lang = navigator.language;
      c.ua = String(navigator.userAgent || '').slice(0, 300);
    } catch(e){}
    return c;
  }

  async function send(){
    const text = msg.trim();
    if (text.length < 2) { setErr('Add a little more and it’ll go through.'); setState('error'); return; }
    setState('sending'); setErr('');
    const row = {
      message: text.slice(0, 4000),
      contact: contact.trim() ? contact.trim().slice(0, 200) : null,
      device_kind: (function(){ const w = Math.min(window.innerWidth || 1024,
        (window.screen && window.screen.width) || 1024);
        return w < 768 ? 'mobile' : w < 1024 ? 'tablet' : 'desktop'; })(),
      props: context()
    };
    try {
      const C = window.OptCloud;
      if (C && C.client) {
        // the signed-in case carries the auth token, so the row is attributed
        const u = C.getUser && C.getUser();
        if (u && u.id) row.user_id = u.id;
        try { row.device_id = localStorage.getItem('ff.did') || null; } catch(e){}
        const r = await C.client.from('feedback').insert(row);
        if (r.error) throw new Error(r.error.message);
      } else {
        throw new Error('offline');
      }
      TRK.ev('feedback_sent');
      setState('sent'); setMsg(''); setContact('');
    } catch(e){
      setState('error');
      setErr('That didn’t send — you may be offline. Your note is still in the box, so try again in a moment.');
    }
  }

  return (
    <React.Fragment>
      <button className="burger fb-btn" aria-label="Send feedback" title="Send feedback"
        onClick={() => { if (onOpen) onOpen(); setOpen(true); }}><FeedbackIcon /></button>
      {open && inBody(
        <div className="auth-overlay" onMouseDown={e => { if (e.target === e.currentTarget) close(); }}>
          <div className="auth-modal" role="dialog" aria-modal="true" aria-label="Send feedback">
            <button className="auth-x" onClick={close} aria-label="Close">×</button>
            {state === 'sent' ? (
              <React.Fragment>
                <h3 className="auth-title">Thank you — that’s landed</h3>
                <p className="auth-sub">Genuinely useful. If you left an email address and it needs a
                  reply, you’ll get one.</p>
                <button className="btn primary" style={{ width:'100%' }} onClick={close}>Close</button>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <h3 className="auth-title">Tell me what you think</h3>
                <p className="auth-sub">What’s confusing, what’s missing, what’s wrong. It goes straight
                  to the person who built it.</p>
                {err && <div className="auth-msg err">{err}</div>}
                <textarea ref={box} className="auth-input fb-text" rows={5} value={msg}
                  maxLength={4000} placeholder="Anything at all…"
                  onChange={e => { setMsg(e.target.value); if (state === 'error') setState('idle'); }} />
                <input className="auth-input" type="email" value={contact} maxLength={200}
                  placeholder="Email (optional, only if you’d like a reply)"
                  onChange={e => setContact(e.target.value)} />
                <button className="btn primary" style={{ width:'100%' }}
                  disabled={state === 'sending'} onClick={send}>
                  {state === 'sending' ? 'Sending…' : 'Send'}</button>
                <p className="fb-fine">Sent with the date, your browser and screen size, and your account
                  if you’re signed in — so a problem can actually be reproduced. Nothing from your plan
                  is included.</p>
              </React.Fragment>
            )}
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function AuthButton(props){
  const Cloud = typeof window !== 'undefined' ? window.OptCloud : null;
  const [user, setUser] = useState(() => (Cloud && Cloud.user) || null);
  const [status, setStatus] = useState(() => (Cloud && Cloud.status) || 'idle');
  const [open, setOpen] = useState(false);
  const [recovery, setRecovery] = useState(false);   // arrived from a reset-password email
  const [mode, setMode] = useState('link');          // 'link' | 'password'
  const [signup, setSignup] = useState(false);
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);              // {type:'ok'|'err', text}
  // account-panel fields
  const [accName, setAccName] = useState('');
  const [accEmail, setAccEmail] = useState('');
  const [accPw, setAccPw] = useState('');

  useEffect(() => {
    if (!Cloud) return;
    const onAuth = (e) => setUser(e.detail || null);
    const onStat = (e) => setStatus(e.detail || 'idle');
    const onRecovery = () => { setRecovery(true); setOpen(true); };
    // Opened from elsewhere on the page — the "keep your plan" card, or Save
    // plan in the header. An event rather than lifted state: the session
    // belongs to this component and nothing else needs to know about it.
    const onAsk = () => { setSignup(!Cloud.user); setMsg(null); setOpen(true); };
    window.addEventListener('optcloud:auth', onAuth);
    window.addEventListener('optcloud:status', onStat);
    window.addEventListener('optcloud:recovery', onRecovery);
    window.addEventListener('ff:open-auth', onAsk);
    setUser(Cloud.user || null);
    setStatus(Cloud.status || 'idle');
    if (Cloud.recovery){ setRecovery(true); setOpen(true); }
    return () => {
      window.removeEventListener('optcloud:auth', onAuth);
      window.removeEventListener('optcloud:status', onStat);
      window.removeEventListener('optcloud:recovery', onRecovery);
      window.removeEventListener('ff:open-auth', onAsk);
    };
  }, []);

  // prefill the account panel whenever it opens for a signed-in user
  useEffect(() => {
    if (open && user){
      setAccName((user.user_metadata && user.user_metadata.full_name) || '');
      setAccEmail(user.email || '');
      setAccPw('');
    }
  }, [open, user]);

  if (!Cloud || !Cloud.available) return null;

  const close = () => { setOpen(false); setMsg(null); setPw(''); setAccPw(''); setBusy(false); };

  const submit = async () => {
    setMsg(null);
    if (!email || email.indexOf('@') < 0){ setMsg({type:'err', text:'Enter a valid email address.'}); return; }
    setBusy(true);
    try {
      if (mode === 'link'){
        const { error } = await Cloud.signInWithMagicLink(email);
        if (error) setMsg({type:'err', text:error.message});
        else setMsg({type:'ok', text:'Check your email — tap the link to sign in.'});
      } else {
        if (!pw || pw.length < 6){ setMsg({type:'err', text:'Password must be at least 6 characters.'}); setBusy(false); return; }
        if (signup){
          const { data, error } = await Cloud.signUpWithPassword(email, pw);
          if (error) setMsg({type:'err', text:error.message});
          else if (data && data.session){ TRK.once('device','register'); setMsg({type:'ok', text:'Account created — you’re in!'}); setTimeout(close, 900); }
          else { TRK.once('device','register'); setMsg({type:'ok', text:'Account created — check your email to confirm, then sign in.'}); }
        } else {
          const { error } = await Cloud.signInWithPassword(email, pw);
          if (error){
            var t = error.message || 'Sign-in failed.';
            if (/invalid login credentials/i.test(t))
              t = 'Email or password not recognised. New here? Switch to “Create account” below. If you first signed in with an email link, you don’t have a password yet — use “Email me a link” instead.';
            else if (/email not confirmed/i.test(t))
              t = 'Check your inbox and confirm your email first, then sign in.';
            setMsg({type:'err', text:t});
          }
          else { TRK.once('session','sign_in'); setMsg({type:'ok', text:'Signed in!'}); setTimeout(close, 700); }
        }
      }
    } catch(e){ setMsg({type:'err', text:String((e && e.message) || e)}); }
    setBusy(false);
  };

  const sendReset = async () => {
    setMsg(null);
    if (!email || email.indexOf('@') < 0){ setMsg({type:'err', text:'Enter your email above first.'}); return; }
    setBusy(true);
    try { const { error } = await Cloud.resetPassword(email);
      setMsg(error ? {type:'err', text:error.message} : {type:'ok', text:'Check your email for a link to reset your password.'});
    } catch(e){ setMsg({type:'err', text:String((e && e.message) || e)}); }
    setBusy(false);
  };

  const saveName = async () => {
    setMsg(null); setBusy(true);
    try { const { error } = await Cloud.updateUser({ data:{ full_name: accName.trim() } });
      setMsg(error ? {type:'err', text:error.message} : {type:'ok', text:'Name saved.'});
    } catch(e){ setMsg({type:'err', text:String((e && e.message) || e)}); }
    setBusy(false);
  };
  const saveEmail = async () => {
    setMsg(null);
    if (!accEmail || accEmail.indexOf('@') < 0){ setMsg({type:'err', text:'Enter a valid email address.'}); return; }
    if (accEmail.trim() === (user && user.email)){ setMsg({type:'ok', text:'That’s already your email.'}); return; }
    setBusy(true);
    try { const { error } = await Cloud.updateUser({ email: accEmail.trim() });
      setMsg(error ? {type:'err', text:error.message} : {type:'ok', text:'Almost there — check your inbox to confirm the new address.'});
    } catch(e){ setMsg({type:'err', text:String((e && e.message) || e)}); }
    setBusy(false);
  };
  const savePassword = async () => {
    setMsg(null);
    if (!accPw || accPw.length < 6){ setMsg({type:'err', text:'Password must be at least 6 characters.'}); return; }
    setBusy(true);
    try { const { error } = await Cloud.updateUser({ password: accPw });
      if (error) setMsg({type:'err', text:error.message});
      else { setMsg({type:'ok', text:'Password updated.'}); setAccPw(''); }
    } catch(e){ setMsg({type:'err', text:String((e && e.message) || e)}); }
    setBusy(false);
  };
  const setRecoveryPassword = async () => {
    setMsg(null);
    if (!accPw || accPw.length < 6){ setMsg({type:'err', text:'Password must be at least 6 characters.'}); return; }
    setBusy(true);
    try { const { error } = await Cloud.updateUser({ password: accPw });
      if (error){ setMsg({type:'err', text:error.message}); setBusy(false); }
      else { setMsg({type:'ok', text:'Password set — signing you in…'}); setTimeout(()=>{ try{ location.reload(); }catch(e){} }, 1100); }
    } catch(e){ setMsg({type:'err', text:String((e && e.message) || e)}); setBusy(false); }
  };

  const doSignOut = async () => { setBusy(true); await Cloud.signOut(); setBusy(false); close(); };

  const statusLabel = status==='saving' ? 'Saving…' : status==='saved' ? 'Saved ✓' : status==='error' ? 'Save failed — will retry' : '';
  const btnLabel = user ? ('☁ ' + shortEmail((user.user_metadata && user.user_metadata.full_name) || user.email)) : '☁ Sign in';
  const msgBox = msg ? <div className={'auth-msg ' + (msg.type==='err'?'err':'ok')}>{msg.text}</div> : null;

  return (
    <React.Fragment>
      <button className="btn" onClick={()=>{ if (props && props.onOpen) props.onOpen(); setOpen(true); }} title={user ? 'Your account' : 'Sign in to save your projections across devices'}>
        {btnLabel}
      </button>
      {open && inBody(
        <div className="auth-overlay" onClick={close}>
          <div className="auth-modal" onClick={(e)=>e.stopPropagation()}>
            <button className="auth-x" onClick={close} aria-label="Close">×</button>

            {recovery ? (
              <div>
                <h3 className="auth-title">Set a new password</h3>
                <p className="auth-sub">Choose a new password{user && user.email ? (' for ' + user.email) : ''}.</p>
                <PwInput placeholder="New password (6+ characters)" value={accPw}
                  onChange={(e)=>setAccPw(e.target.value)} autoComplete="new-password"
                  onKeyDown={(e)=>{ if(e.key==='Enter') setRecoveryPassword(); }} />
                {msgBox}
                <button className="btn primary auth-go" disabled={busy} onClick={setRecoveryPassword}>{busy ? 'Working…' : 'Set password'}</button>
              </div>
            ) : user ? (
              <div>
                <h3 className="auth-title">Your account</h3>
                <p className="auth-sub">{statusLabel ? ('Projections sync: ' + statusLabel) : 'Your projections sync to your account automatically as you edit.'}</p>
                <div className="acc-divider"></div>

                <div className="acc-sec">
                  <label className="acc-label">Display name</label>
                  <div className="acc-row">
                    <input className="auth-input" type="text" placeholder="Your name (optional)" value={accName} onChange={(e)=>setAccName(e.target.value)} />
                    <button className="btn" disabled={busy} onClick={saveName}>Save</button>
                  </div>
                </div>

                <div className="acc-sec">
                  <label className="acc-label">Email</label>
                  <div className="acc-row">
                    <input className="auth-input" type="email" value={accEmail} onChange={(e)=>setAccEmail(e.target.value)} autoComplete="email" />
                    <button className="btn" disabled={busy} onClick={saveEmail}>Update</button>
                  </div>
                </div>

                <div className="acc-sec">
                  <label className="acc-label">Change password</label>
                  <div className="acc-row">
                    <PwInput placeholder="New password (6+ characters)" value={accPw} onChange={(e)=>setAccPw(e.target.value)} autoComplete="new-password" />
                    <button className="btn" disabled={busy} onClick={savePassword}>Update</button>
                  </div>
                </div>

                {msgBox}
                <button className="btn acc-signout" disabled={busy} onClick={doSignOut}>Sign out</button>
              </div>
            ) : (
              <div>
                <h3 className="auth-title">Save your projections</h3>
                <p className="auth-sub">Create a free account (or sign in) to keep your inputs and open them on any device. Optional — the tool works fine without it, and your data stays in this browser until you do.</p>
                <div className="auth-seg">
                  <button className={mode==='link'?'on':''} onClick={()=>{setMode('link'); setMsg(null);}}>Email me a link</button>
                  <button className={mode==='password'?'on':''} onClick={()=>{setMode('password'); setMsg(null);}}>Use a password</button>
                </div>
                <input className="auth-input" type="email" placeholder="you@example.com" value={email} onChange={(e)=>setEmail(e.target.value)} autoComplete="email"
                  onKeyDown={(e)=>{ if(e.key==='Enter' && mode==='link') submit(); }} />
                {mode==='password' && (
                  <PwInput placeholder="Password (6+ characters)" value={pw} onChange={(e)=>setPw(e.target.value)}
                    autoComplete={signup?'new-password':'current-password'} onKeyDown={(e)=>{ if(e.key==='Enter') submit(); }} />
                )}
                {msgBox}
                <button className="btn primary auth-go" disabled={busy} onClick={submit}>
                  {busy ? 'Working…' : mode==='link' ? 'Send magic link' : signup ? 'Create account' : 'Sign in'}
                </button>
                {mode==='password' && (
                  <button className="auth-link" onClick={()=>{setSignup(!signup); setMsg(null);}}>
                    {signup ? 'Have an account? Sign in' : 'New here? Create an account'}
                  </button>
                )}
                {mode==='password' && !signup && (
                  <button className="auth-link" style={{marginTop:8, color:'var(--muted)'}} onClick={sendReset}>Forgot password?</button>
                )}
              </div>
            )}
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

/* =============================================================
   SAVED PLANS — "what if?" without losing what you had
   -------------------------------------------------------------
   A signed-in user keeps up to five named versions of the same
   forecast and flicks between them. The name is a LABEL and only
   a label: nothing anywhere behaves differently because somebody
   called a plan "Me + wife" rather than "Pay rise".

   ⚠️ Deliberately NOT a scenario manager. No dashboard, no
   folders, no descriptions, no comparison table. The whole
   visible feature is one row — tabs on a desktop, one dropdown
   on a phone — because the moment it needs managing it stops
   being a quick "what if I got a pay rise?".

   ⚠️ "Plans", never "Scenarios", in anything a user reads. The
   app already has Conservative / Base / Optimistic scenarios and
   two words for two different things would be a mess. Internally
   they are plans too, so there is nothing to translate.

   The component talks to OptCloud directly rather than through
   App: the library belongs to the session, exactly as AuthButton
   owns the session itself. App only listens for the one event
   that says "the figures underneath you have been replaced".
   ============================================================= */
function PlanBar() {
  const Cloud = typeof window !== 'undefined' ? window.OptCloud : null;
  const read = () => ({
    on: !!(Cloud && Cloud.plansAvailable && Cloud.user),
    plans: (Cloud && Cloud.plans) || [],
    activeId: Cloud ? Cloud.activePlanId : null
  });
  const [st, setSt] = useState(read);
  const [status, setStatus] = useState(() => (Cloud && Cloud.status) || 'idle');
  const [menu, setMenu] = useState(null);          // null | 'list' | 'more'
  const [dlg, setDlg]   = useState(null);          // null | 'new' | 'rename' | 'delete' | 'full'
  const [name, setName] = useState('');
  const [dup, setDup]   = useState(true);          // new plan: duplicate (default) or blank
  const [busy, setBusy] = useState(false);
  const [err, setErr]   = useState('');
  const field = useRef(null);

  useEffect(() => {
    const onPlans  = () => setSt(read());
    const onAuth   = () => setSt(read());
    const onStatus = (e) => setStatus(e && e.detail);
    window.addEventListener('optcloud:plans', onPlans);
    window.addEventListener('optcloud:auth', onAuth);
    window.addEventListener('optcloud:status', onStatus);
    setSt(read());
    return () => {
      window.removeEventListener('optcloud:plans', onPlans);
      window.removeEventListener('optcloud:auth', onAuth);
      window.removeEventListener('optcloud:status', onStatus);
    };
  }, []);

  /* ⚠️ Keep an open menu on screen. Pinning it to either edge of its button is
     wrong at some width — see the note above `.plan-pop` in part1 — so it is
     pinned left in CSS and nudged back here once the browser has laid it out.
     useLayoutEffect, not useEffect, so the nudge lands in the same paint and
     nobody sees the menu appear half off screen and then jump. */
  const menuEl = useRef(null);
  useLayoutEffect(() => {
    const el = menuEl.current;
    if (!menu || !el) return;
    el.style.transform = '';
    const pad = 8, r = el.getBoundingClientRect(), vw = window.innerWidth;
    let dx = 0;
    if (r.right > vw - pad) dx = (vw - pad) - r.right;
    if (r.left + dx < pad)  dx = pad - r.left;       // never push it off the other side
    if (dx) el.style.transform = 'translateX(' + Math.round(dx) + 'px)';
  }, [menu, st.plans]);

  // Escape closes whatever is open, innermost first.
  useEffect(() => {
    if (!menu && !dlg) return;
    const esc = (e) => { if (e.key === 'Escape') { if (dlg) closeDlg(); else setMenu(null); } };
    document.addEventListener('keydown', esc);
    return () => document.removeEventListener('keydown', esc);
  }, [menu, dlg]);

  // ⚠️ Desktop only — see canAutofocus. On a phone this used to open the
  // keyboard and carry the whole dialog off the top of the screen.
  useEffect(() => {
    if (dlg !== 'new' && dlg !== 'rename') return;
    if (!canAutofocus()) return;
    const t = setTimeout(() => { try { field.current && field.current.select(); } catch(e){} }, 30);
    return () => clearTimeout(t);
  }, [dlg]);

  if (!st.on || !st.plans.length) return null;

  const plans  = st.plans;
  const active = plans.filter(p => p.id === st.activeId)[0] || plans[0];
  const max    = (Cloud && Cloud.maxPlans) || 5;
  const full   = plans.length >= max;

  const closeDlg = () => { setDlg(null); setErr(''); setBusy(false); };
  const openNew = (asDuplicate) => {
    setMenu(null);
    if (full) { setDlg('full'); return; }
    setDup(asDuplicate !== false);
    setName(asDuplicate === false ? '' : trimName(active.name + ' copy'));
    setErr(''); setDlg('new');
  };
  const openRename = () => { setMenu(null); setName(active.name); setErr(''); setDlg('rename'); };

  function trimName(s){ return String(s || '').slice(0, 40); }

  /* Every one of these can fail — offline, a session that expired while the tab
     sat open, the cap tripping server-side. The message goes in the dialog
     rather than anywhere near the figures: nothing the user typed is at risk,
     because the open plan is still exactly where it was. */
  const run = (p, after) => {
    setBusy(true); setErr('');
    Promise.resolve(p).then(() => { setBusy(false); if (after) after(); }, (e) => {
      setBusy(false);
      const m = String((e && (e.message || e.hint)) || '');
      setErr(/plan_limit_reached/.test(m) ? 'You’ve reached ' + max + ' saved plans. Delete one to create another.'
           : /last_plan/.test(m)          ? 'This is your only plan — rename it instead.'
           : 'That didn’t save. You may be offline; your figures are untouched.');
    });
  };

  const doSwitch = (id) => {
    setMenu(null);
    if (id === st.activeId) return;
    TRK.once('session', 'plan_switched');
    Promise.resolve(Cloud.switchPlan(id)).catch(() => {});
  };
  const doCreate = () => {
    const n = name.trim();
    if (!n) return;
    TRK.once('session', 'plan_created');
    run(Cloud.createPlan(n, dup ? null : {}), closeDlg);
  };
  const doRename = () => {
    const n = name.trim();
    if (!n) return;
    run(Cloud.renamePlan(active.id, n), closeDlg);
  };
  const doDelete = () => run(Cloud.deletePlan(active.id), closeDlg);

  const saveState = status === 'saving' ? 'Saving…'
                  : status === 'saved'  ? 'Saved'
                  : status === 'error'  ? 'Not saved' : '';

  const listItem = (p) => (
    <button key={p.id} role="menuitemradio" aria-checked={p.id === active.id}
      className={p.id === active.id ? 'on' : ''} onClick={() => doSwitch(p.id)}>
      <span className="pm-tick">{p.id === active.id ? '✓' : ''}</span>
      <span className="pm-name">{p.name}</span>
    </button>
  );

  return (
    <React.Fragment>
      <div className="plans">
        {/* Desktop: tabs. Subtle on purpose — they are navigation, and the
            three cards below them are the answer. */}
        <div className="plan-tabs" role="tablist" aria-label="Your plans">
          {plans.map(p => (
            <button key={p.id} role="tab" aria-selected={p.id === active.id}
              className={'plan-tab' + (p.id === active.id ? ' on' : '')}
              title={p.name} onClick={() => doSwitch(p.id)}>{p.name}</button>
          ))}
        </div>
        <button className="plan-add desktop-only" onClick={() => openNew(true)}
          title="New plan" aria-label="New plan">+</button>

        {/* Phone: one dropdown instead, so the whole thing costs a single line. */}
        <div className="plan-pop mobile-only">
          <button className="plan-pick" aria-haspopup="menu" aria-expanded={menu === 'list'}
            onClick={() => setMenu(m => m === 'list' ? null : 'list')}>
            <span className="pp-lab">Plan:</span>
            <span className="pp-name">{active.name}</span>
            <span className="pp-caret">▾</span>
          </button>
          {menu === 'list' && (
            <div className="plan-menu" role="menu" ref={menuEl}>
              {plans.map(listItem)}
              <div className="plan-sep"></div>
              <button role="menuitem" onClick={() => openNew(true)}>
                <span className="pm-tick"></span><span className="pm-name">+ New plan</span></button>
            </div>
          )}
        </div>

        {/* Rename / duplicate / delete, for the plan that is open. */}
        <div className="plan-pop">
          <button className="plan-more" aria-haspopup="menu" aria-expanded={menu === 'more'}
            aria-label="Actions for this plan" title="Rename, duplicate or delete this plan"
            onClick={() => setMenu(m => m === 'more' ? null : 'more')}>•••</button>
          {menu === 'more' && (
            <div className="plan-menu" role="menu" ref={menuEl}>
              <button role="menuitem" onClick={openRename}>Rename</button>
              <button role="menuitem" onClick={() => openNew(true)}>Duplicate</button>
              {plans.length > 1 && (
                <React.Fragment>
                  <div className="plan-sep"></div>
                  <button role="menuitem" className="danger"
                    onClick={() => { setMenu(null); setErr(''); setDlg('delete'); }}>Delete</button>
                </React.Fragment>
              )}
            </div>
          )}
        </div>

        {saveState && <span className={'plan-state' + (status === 'error' ? ' err' : '')}
          role="status">{saveState}</span>}

        {menu && <div className="plan-backdrop" onClick={() => setMenu(null)}></div>}
      </div>

      {dlg && inBody(
        <div className="auth-overlay" onMouseDown={e => { if (e.target === e.currentTarget) closeDlg(); }}>
          <div className="auth-modal" role="dialog" aria-modal="true" aria-label="Plans">
            <button className="auth-x" onClick={closeDlg} aria-label="Close">×</button>

            {dlg === 'full' && (
              <React.Fragment>
                <h3 className="auth-title">That’s five plans</h3>
                <p className="auth-sub">You’ve reached {max} saved plans. Delete one to create another.</p>
                <button className="btn primary" style={{width:'100%'}} onClick={closeDlg}>OK</button>
              </React.Fragment>
            )}

            {dlg === 'new' && (
              <React.Fragment>
                <h3 className="auth-title">New plan</h3>
                <p className="auth-sub">A plan is a complete version of your forecast. Switching between
                  them changes every figure on the page — and nothing else about your account.</p>
                {/* Duplicating is the default because it is what people almost
                    always want: keep these numbers, change one of them, see what
                    happens. Starting from scratch is for a genuinely different
                    person's situation. */}
                <div className="plan-start">
                  <button className={dup ? 'on' : ''} onClick={() => setDup(true)} aria-pressed={dup}>
                    <span className="ps-h">Duplicate {active.name}</span>
                    <span className="ps-p">Keep these numbers and make some changes.</span>
                  </button>
                  <button className={!dup ? 'on' : ''} onClick={() => setDup(false)} aria-pressed={!dup}>
                    <span className="ps-h">Start from scratch</span>
                    <span className="ps-p">Create a completely different plan.</span>
                  </button>
                </div>
                <label className="acc-label" htmlFor="plan-name">Name your plan</label>
                <input id="plan-name" ref={field} className="auth-input" type="text" maxLength={40}
                  placeholder="Pay rise" value={name} autoComplete="off"
                  onChange={e => setName(trimName(e.target.value))}
                  onKeyDown={e => { if (e.key === 'Enter') doCreate(); }} />
                {err && <div className="auth-msg err">{err}</div>}
                <button className="btn primary auth-go" disabled={busy || !name.trim()}
                  onClick={doCreate}>{busy ? 'Creating…' : 'Create plan'}</button>
              </React.Fragment>
            )}

            {dlg === 'rename' && (
              <React.Fragment>
                <h3 className="auth-title">Rename plan</h3>
                <p className="auth-sub">Call it whatever helps you tell it apart. The name doesn’t change
                  a single number.</p>
                <input ref={field} className="auth-input" type="text" maxLength={40}
                  value={name} autoComplete="off"
                  onChange={e => setName(trimName(e.target.value))}
                  onKeyDown={e => { if (e.key === 'Enter') doRename(); }} />
                {err && <div className="auth-msg err">{err}</div>}
                <button className="btn primary auth-go" disabled={busy || !name.trim()}
                  onClick={doRename}>{busy ? 'Saving…' : 'Save name'}</button>
              </React.Fragment>
            )}

            {dlg === 'delete' && (
              <React.Fragment>
                <h3 className="auth-title">Delete “{active.name}”?</h3>
                <p className="auth-sub">This version of your forecast goes for good. Your other plans
                  are untouched.</p>
                {err && <div className="auth-msg err">{err}</div>}
                <button className="btn primary auth-go" disabled={busy} onClick={doDelete}
                  style={{background:'var(--critical)', borderColor:'var(--critical)'}}>
                  {busy ? 'Deleting…' : 'Delete plan'}</button>
                <button className="auth-link" onClick={closeDlg}>Keep it</button>
              </React.Fragment>
            )}
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

/* ============================================================= */
/* =============================================================
   MORTGAGE OVERPAYMENT vs INVESTING — side calculator
   -------------------------------------------------------------
   Simple answer on top, serious model underneath. The module has
   to answer three things almost immediately:
     1. which option could leave me wealthier?
     2. what do I get in exchange for overpaying?  (time)
     3. how good do returns need to be before investing wins?
   Everything else is supporting evidence and progressively
   discloses underneath. It must never declare a "winner".
   ============================================================= */
function MortgageModule({ mp, setMp, plan, C, inheritedGrowth, inflation, onClose }) {
  const narrow = useIsNarrow();
  const pc = (x, dp) => (x == null ? '—' : (x * 100).toFixed(dp == null ? 1 : dp) + '%');
  /* the gap is an estimate off assumed returns — £100s of precision would be false precision */
  const round100 = (x) => Math.round(Math.abs(x) / 100) * 100;
  const sgn = (v) => (v < 0 ? '−' + gbpC(-v) : gbpC(v));
  const spanStr = (months, compact) => {
    if (months == null) return '—';
    const y = Math.floor(months / 12), m = months % 12;
    if (compact) return (y ? y + 'y ' : '') + (m ? m + 'm' : (y ? '' : '0m'));
    const p = [];
    if (y) p.push(y + ' year' + (y === 1 ? '' : 's'));
    if (m) p.push(m + ' month' + (m === 1 ? '' : 's'));
    return p.length ? p.join(' ') : '0 months';
  };
  const dateIn = (months) => {
    if (months == null) return '—';
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + months);
    return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  };
  const H = plan.horizonYears;
  const horizonLabel = H === 1 ? '1 year' : H + ' years';
  const endDate = dateIn(plan.months);
  const todayEquiv = (v) => v / Math.pow(1 + (inflation || 0), H);
  const winsInvest = plan.winner === 'invest';
  const level = plan.ready && Math.abs(plan.diff) < 100;
  const earlier = plan.termCutMonths != null && plan.termCutMonths > 0;
  const capEarly = (plan.spareAnnualTotal || 0) > (mp.overpayLimitPct || 0) * (mp.balance || 0);

  return (
    <div className="mortgage-module">
      <div className="bp-topline">
        <div>
          <h3 className="bp-title">Mortgage or invest?</h3>
          <div className="mo-strap">The same spare cash, two uses — more wealth, or a mortgage gone sooner.</div>
        </div>
        <button className="btn subtle mo-hide" onClick={onClose}>✕ Close</button>
      </div>

      {/* ---- 1) YOUR NUMBERS — fill it in, then read the answer ---- */}
      <div className="bp-sub" style={{ marginTop: 16 }}>Your numbers</div>
      <div className="bp-assump">
        <div className="bp-fld"><label>Mortgage balance</label><BpNum money value={mp.balance} step={1000} onChange={v => setMp({ balance: v })} /></div>
        <div className="bp-fld"><label>Interest rate</label><BpNum pct value={+(mp.rate * 100).toFixed(2)} step="0.1" onChange={v => setMp({ rate: (v || 0) / 100 })} /></div>
        <div className="bp-fld"><label>Years left</label><BpNum value={mp.termYears} step="1" onChange={v => setMp({ termYears: v })} />
          <div className="bp-hint">Payment {gbp(plan.payment)}/month{mp.payment > 0 ? '' : ' (calculated)'}</div></div>
        <div className="bp-fld"><label>Spare cash available</label><BpNum money value={mp.spare} step={100} onChange={v => setMp({ spare: v })} />
          <div className="bp-seg sm" style={{ marginTop: 6 }}>
            <button className={mp.spareFreq === 'monthly' ? 'on' : ''} onClick={() => setMp({ spareFreq: 'monthly' })}>a month</button>
            <button className={mp.spareFreq !== 'monthly' ? 'on' : ''} onClick={() => setMp({ spareFreq: 'annual' })}>a year</button>
          </div>
        </div>
      </div>
      <div className="bp-tgroup" style={{ marginTop: 16 }}><span className="tl">Compare over</span>
        <div className="bp-seg sm">
          {[['term', 'Full term'], ['5', '5 years'], ['10', '10 years'], ['20', '20 years'], ['custom', 'Custom']].map(function (o) {
            return <button key={o[0]} className={(mp.horizonMode || 'term') === o[0] ? 'on' : ''} onClick={() => setMp({ horizonMode: o[0] })}>{o[1]}</button>;
          })}
        </div>
      </div>
      {(mp.horizonMode === 'custom') && <div className="bp-fld" style={{ marginTop: 10, maxWidth: 200 }}><label>Years to compare over</label>
        <BpNum value={mp.horizonYears} step="1" onChange={v => setMp({ horizonYears: Math.max(1, Math.round(v)) })} /></div>}
      {/* Its own name, not open_advanced. The two planners use that one, and a
          single row labelled "Opened advanced assumptions" counting both could
          never be separated again afterwards. */}

      {!plan.ready ? (
        <div className="mo-hero"><div className="v waiting">{plan.need}</div></div>
      ) : (
      <React.Fragment>

        {/* ---- 2) THE ANSWER, then the two paths that produce it ----
             ⚠️ THE ARITHMETIC RULE FOR THESE BOXES. Each side ends at what you
             would be worth: the pot you have built, MINUS any mortgage still
             owed. The difference between those two totals is the headline, at
             every horizon — that identity is what makes the boxes trustworthy,
             and it is asserted in /root/mortgagechart.js.

             Do NOT add "interest saved" into the overpay total. It is already
             inside that path's contributions: saving the interest is what clears
             the mortgage early, and clearing early is what frees the payment up
             to invest. Adding it again counts the same benefit twice — on the
             default figures it turns a £16,147 win for investing into a £4,719
             win for overpaying, i.e. it flips the answer. It is shown as the
             line that EXPLAINS the bigger contributions, not as an addend. */}
        <div className="mo-hero">
          <div className="v">{level
            ? 'Neither option is clearly ahead'
            : (winsInvest ? 'Investing' : 'Overpaying the mortgage')
              + ' could leave you ' + gbp(round100(plan.diff)) + ' better off'}</div>
          <div className="sub">{level
            ? 'The two finish within £100 of each other over ' + horizonLabel + ', on these assumptions.'
            : 'by ' + endDate + ' · ≈ ' + gbp(round100(todayEquiv(plan.diff))) + ' in today’s money'}
            {earlier ? ' · overpaying clears the mortgage ' + spanStr(plan.termCutMonths, true)
                       + ' sooner (' + dateIn(plan.payoffMonthsOverpay) + ', not ' + dateIn(plan.payoffMonths) + ')' : ''}</div>
        </div>

        {(function () {
          const oGrowth = plan.overpay.investments - plan.overpay.contributions;
          const spareM  = (plan.spareAnnualTotal || 0) / 12;
          const clearedInWindow = plan.overpay.freedInvested > 0;
          const monthsAfter = plan.payoffMonthsOverpay != null
            ? Math.max(0, plan.months - plan.payoffMonthsOverpay) : 0;
          // ⚠️ "£881/month × the months after payoff" does NOT always equal what
          // the overpaying path paid in. Spare cash the lender won't accept is
          // invested from day one instead, and when the allowance really bites
          // that is most of it — £80,606 of a £307,564 total on one test shape.
          // Show it as its own step when it is material, or the sum won't add up.
          const preInvested = Math.max(0, plan.overpay.contributions - plan.monthlyAfterPayoff * monthsAfter);
          const capMatters  = preInvested > Math.max(250, plan.overpay.contributions * 0.02);
          return (
        <React.Fragment>
        {/* Each path as a short numbered journey. The job of these cards is to
            make the STRATEGY understandable in about five seconds, not to
            reconcile the arithmetic — the year-by-year table below does that.
            ⚠️ Interest saved is deliberately NOT on these cards. It is a real
            benefit but it is not a pot, and sitting next to "£69k invested" it
            invites exactly the addition the whole design is trying to prevent.
            It lives in the paragraph underneath and in the table, where there is
            room to say what it actually is. */}
        <div className="mo-cols mo-flows">

          {/* ---- INVEST ---- */}
          <div className="mo-flow">
            <h4><span className="cd" style={{ background: C.isa }}></span>Invest {gbp(Math.round(spareM))}/month</h4>
